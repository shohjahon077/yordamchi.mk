                            <!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YMT HUB — Homiylik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #020410;
      color: #0ff;
      font-family: 'Segoe UI', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 1; }
    }

    .card-3d-container {
      position: relative;
      z-index: 2;
      perspective: 1000px;
    }

    .donate-card {
      width: 320px;
      height: 200px;
      background: linear-gradient(135deg, #0a0f20, #050a15);
      border: 2px solid #0ff;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      color: white;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }

    .donate-card:hover {
      transform: rotateX(10deg) rotateY(10deg) scale(1.03);
      box-shadow: 0 0 40px #0ff, 0 0 60px #f0f;
    }

    .card-header {
      font-size: 1.4rem;
      font-weight: bold;
      color: #0ff;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
    }

    .card-number {
      font-family: monospace;
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #aaa;
      text-align: center;
      margin: 10px 0;
    }

    .card-footer {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
    }

    .support-btn {
      margin-top: 30px;
      padding: 12px 36px;
      background: transparent;
      color: #ff00ff;
      border: 2px solid #ff00ff;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.4s ease;
      font-family: inherit;
      letter-spacing: 2px;
    }

    .support-btn:hover {
      background: rgba(255, 0, 255, 0.2);
      box-shadow: 0 0 20px #ff00ff;
      transform: scale(1.1);
    }

    .glow {
      animation: glow 3s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px #0ff; }
      to { box-shadow: 0 0 20px #f0f, 0 0 30px #0af; }
    }
  </style>
</head>
<body>
  <!-- Yulduzlar -->
  <div class="stars" id="stars"></div>

  <!-- 3D Homiylik Karta -->
  <div class="card-3d-container">
    <div class="donate-card glow">
      <div class="card-header">YMT HUB</div>
      <div class="card-number">4916 9903 1360 2143</div>
      <div class="card-footer">Homiylik qilish — kelajakni qurish</div>
    </div>
    <div style="text-align: center; margin-top: 20px;">
      <button class="support-btn" onclick="support()">
        💫 Homiylik qilish
      </button>
    </div>
  </div>

  <script>
    // Yulduzlar
    const stars = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
      const s = document.createElement('div');
      s.classList.add('star');
      s.style.width = `${Math.random() * 2 + 1}px`;
      s.style.height = s.style.width;
      s.style.left = `${Math.random() * 100}%`;
      s.style.top = `${Math.random() * 100}%`;
      s.style.setProperty('--d', `${2 + Math.random() * 4}s`);
      s.style.opacity = Math.random() * 0.7;
      stars.appendChild(s);
    }

    // Homiylik havolasi — O'ZINGIZNI HAVOLANGIZNI QO'YING!
    function support() {
      const url = "https://pay.click.uz/donate/ymt-hub"; // ⬅️ BUNI O'ZGARTIRING!
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
