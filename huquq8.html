<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — Huquq va Madaniyat (8-sinf)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D47A1;
            --secondary: #009688;
            --accent: #FFC107;
            --light: #FFFFFF;
            --bg: #E3F2FD;
            --text: #0D47A1;
            --card: #FFFFFF;
            --shadow: 0 12px 30px rgba(13, 71, 161, 0.15);
            --border: #BBDEFB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #b3e5fc);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), #0D47A1);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.3rem;
            margin: 15px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.6;
            opacity: 0.95;
        }

        #globe-logo {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            position: relative;
        }

        #globe-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.2));
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 28px;
            color: var(--primary);
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 24px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: #E3F2FD;
            color: #0D47A1;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-message .message-bubble {
            background: #F8F9FA;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--primary);
        }

        /* === LOCATION STYLE === */
        .location {
            background: #E1F5FE;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #01579B;
        }

        /* === FACT EXAMPLE === */
        .fact {
            margin: 12px 0;
            padding: 10px;
            background: #E0F7FA;
            border-left: 3px solid var(--secondary);
            border-radius: 6px;
            font-size: 14px;
            color: #006064;
            font-style: italic;
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 16px;
            border: none;
            border-radius: 28px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(13,71,161,0.2);
        }

        .quick-button:hover {
            background: #0D47A1;
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(13,71,161,0.3);
        }

        .home-button {
            background: #616161 !important;
        }

        .home-button:hover {
            background: #424242 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #757575;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ANIMATION */
        #chatbot-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #chatbot-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="globe-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/>
                <path d="M12 3V21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M3 12H21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M7 4C8.5 6 10 9 10 12C10 15 8.5 18 7 20" stroke="white" stroke-width="1.5"/>

    </div>

            "konstitutsiya_nima": {

            "asosiy_huquqlar": {
                text: "<span class='location'>Asosiy huquqlar</span>: tirik qolish, erkinlik, fikr va so'z erkinligi, ta'lim olish, ishga kirish.",

            },
            "musiqalar": {
                text: "Milliy musiqa: dutar, tanbur, doira, nay. Asosiy janrlar: maqom, qo'shiq, shoirlik. Muhim shoir: Alisher Navoiy.",
                buttons: [{ text: "⬅️ Orqaga", key: "madaniyat", isHome: true }]
            },
            "adabiyot": {
                text: "<span class='fact'>Qiziq fakt: Alisher Navoiy — 15-asr O'zbekiston adabiyotining buyuk o'qituvchisi. «Xamsa» asari dunyo adabiyotiga kiritilgan.</span>",
                buttons: [{ text: "⬅️ Orqaga", key: "madaniyat", isHome: true }]
            },
            "bayramlar": {
                text: "O'zbekistonda qaysi milliy bayramlar nishonlanadi? Ularning ahamiyati qanday?",
                buttons: [
                    { text: "Navro'z", key: "navroz" },
                    { text: "Mustaqillik kuni", key: "mustaqillik_kuni" },
                    { text: "Ota-onaga hurmat kuni", key: "ota_ona_kuni" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "navroz": {
                text: "<span class='location'>Navro'z</span> — bahor bayrami. 21-mart. Qadimiy bayram. 7 ta taom — sumalak, non, tuz, go'sht, guruch, sabzavot, qovun.",
                buttons: [{ text: "⬅️ Orqaga", key: "bayramlar", isHome: true }]
            },
            "mustaqillik_kuni": {
                text: "<span class='location'>Mustaqillik kuni</span> — 31-avgust. 1991-yilda O'zbekiston mustaqillikka erishgan sana. Milliy bayram, paradx, konsertlar.",
                buttons: [{ text: "⬅️ Orqaga", key: "bayramlar", isHome: true }]
            },
            "ota_ona_kuni": {
                text: "<span class='location'>Ota-onaga hurmat kuni</span> — 15-iyun. Ota-onaga hurmat, ularga sovg'a, so'z, mehribonlik ko'rsatish — bu milliy qadriyat.",

            },
            "qonun_jamiyat": {
                text: "Qonun — jamiyatning tartibini saqlash vositasi. Qonunlar qanday jamiyatga ta'sir qiladi?",

                    { text: "Qonun va jamiyat", key: "qonun_jamiyat_munosabat" },
                    { text: "Fuqarolik jamiyati", key: "fuqarolik_jamiyat" },
                    { text: "Tartibga soluvchi qonunlar", key: "tartib_qonunlar" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }

            "qonun_jamiyat_munosabat": {

            "tartib_qonunlar": {
                text: "Tartibga soluvchi qonunlar: o'qish qonuni, mehnat qonuni, bolalar huquqlari qonuni, ekologik qonun, axloq qonuniyati.",

            "test_menu": {

                buttons: [
                    { text: "Konstitutsiya", key: "test_konstitutsiya" },

            }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            let processedText = next.text
                                .replace(/<span class='([^']+)'>/g, '<span class="$1">')
                                .replace(/<\/span>/g, '</span>');
                            addMessage(processedText, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Bu mavzu hozircha mavjud emas.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                setTimeout(() => {
                    chatbotContainer.classList.add('show');
                    addMessage(database.main_menu.text, 'ai');
                    showButtons('main_menu');
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
