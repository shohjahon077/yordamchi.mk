<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texnologiya AI Bot — 7-sinf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #5d4037, #795548, #8d6e63);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish ekran */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #d7ccc8;
            text-align: center;
            padding: 20px;
            animation: fadeOut 2.5s forwards 3.5s;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%23d7ccc8"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
            color: #d7ccc8;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
            color: #bcaaa4;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(13, 19, 33, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(215, 204, 200, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #d7ccc8;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(215, 204, 200, 0.3);
            text-shadow: 0 0 10px rgba(215, 204, 200, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #5d4037, #795548);
            color: white;
            align-self: flex-end;
        }

        .bot-message {
            background: linear-gradient(135deg, #6d4c41, #d7ccc8);
            color: #3e2723;
            align-self: flex-start;
        }

        .typing-indicator {
            display: none;
            color: #d7ccc8;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(215, 204, 200, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #d7ccc8 transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #d7ccc8;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(90, 60, 50, 0.4);
            color: #d7ccc8;
            border: 1px solid rgba(215, 204, 200, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(215, 204, 200, 0.2);
            border-color: #d7ccc8;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(215, 204, 200, 0.2);
        }

        /* MEHNAT KALKULYATORI */
        .tech-calculator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #d7ccc8;
            border-radius: 15px;
            padding: 10px;
            width: 240px;
            box-shadow: 0 0 15px rgba(215, 204, 200, 0.3);
            z-index: 10;
        }

        .calc-title {
            color: #d7ccc8;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calc-select {
            width: 100%;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #bcaaa4;
            border: 1px solid #d7ccc8;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .calc-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .calc-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-input-group label {
            font-size: 0.85rem;
            color: #bcaaa4;
        }

        .calc-input-group input {
            width: 100px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #795548;
            border-radius: 4px;
            text-align: right;
        }

        .calc-btn {
            width: 100%;
            padding: 8px;
            background: rgba(109, 76, 65, 0.6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: rgba(109, 76, 65, 0.8);
        }

        .calc-result {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #4fc3f7;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;
        }

        .ai-agent {
            display: none;
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .tech-calculator {
                width: 190px;
                padding: 8px;
            }
            .calc-input-group input {
                width: 75px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

    <!-- Kirish ekran -->
    <div class="splash-screen">
        <div class="ai-icon"></div>
        <div class="splash-text">Texnologiya AI Bot</div>
        <div class="splash-subtext">7-sinf "Mehnat ta'limi" fanidan 100+ savol va amaliy hisob-kalkulyator</div>
    </div>

    <!-- Asosiy interfeys -->

        <div class="header">🛠️ 7-sinf Texnologiya AI Bot</div>

        <div class="tech-calculator">
            <div class="calc-title">Mehnat Kalkulyatori</div>
            <select class="calc-select" id="tech-formula">
                <option value="fabric">Matoning narxini hisoblash</option>
                <option value="wood">Taxtaning og'irligini hisoblash</option>
                <option value="metal">Metall plastinkaning hajmi</option>
                <option value="area">Hovuz yoki xona yuzi</option>
                <option value="time">Ish vaqtini hisoblash</option>
            </select>

            <div class="calc-inputs" id="calc-inputs">
                <!-- Inputlar JavaScript orqali qo'shiladi -->
            </div>

            <button class="calc-btn" onclick="calculateTech()">Hisobla</button>
            <div class="calc-result" id="calc-result">Natija</div>
        </div>

        <div class="chat-area" id="chat-area">
            <!-- Xabarlar shu yerda chiqadi -->
        </div>

        <div class="typing-indicator" id="typing">Fikr yuritayapman...</div>

        <div class="buttons-container" id="buttons-container">
            <!-- Savollar JavaScript orqali qo'shiladi -->
        </div>
    </div>

    <script>
        // ✅ Mehnat kalkulyatori
        const formulaSelect = document.getElementById('tech-formula');
        const inputsContainer = document.getElementById('calc-inputs');
        const resultDiv = document.getElementById('calc-result');

        const inputConfigs = {
            "fabric": [
                { label: "Uzunlik (metr):", id: "length", placeholder: "2.5" },
                { label: "Narx (so'm/m²):", id: "pricePerMeter", placeholder: "15000" }
            ],
            "wood": [
                { label: "Uzunlik (sm):", id: "wLength", placeholder: "100" },
                { label: "Kenglik (sm):", id: "wWidth", placeholder: "20" },
                { label: "Qalinligi (sm):", id: "wHeight", placeholder: "5" },
                { label: "Zichlik (g/sm³):", id: "density", placeholder: "0.8" }
            ],
            "metal": [
                { label: "Uzunlik (mm):", id: "mLength", placeholder: "500" },
                { label: "Kenglik (mm):", id: "mWidth", placeholder: "300" },
                { label: "Qalinligi (mm):", id: "mThickness", placeholder: "2" }
            ],
            "area": [
                { label: "Bo'yi (m):", id: "roomL", placeholder: "5" },
                { label: "Eni (m):", id: "roomW", placeholder: "4" }
            ],
            "time": [
                { label: "Bajarilgan ishlar:", id: "tasks", placeholder: "5" },
                { label: "O'rtacha vaqt (min):", id: "avgTime", placeholder: "30" }
            ]
        };

        function updateInputs() {
            const formula = formulaSelect.value;
            inputsContainer.innerHTML = '';
            const config = inputConfigs[formula];
            
            config.forEach(input => {
                const div = document.createElement('div');
                div.className = 'calc-input-group';
                div.innerHTML = `
                    <label>${input.label}</label>
                    <input type="number" id="${input.id}" placeholder="${input.placeholder}" step="any">
                `;
                inputsContainer.appendChild(div);
            });
        }

        function calculateTech() {
            const formula = formulaSelect.value;
            try {
                let result = "";
                const parseFloatSafe = (id) => {
                    const val = document.getElementById(id)?.value;
                    const num = parseFloat(val);
                    if (isNaN(num) || num <= 0) throw new Error("Noto'g'ri qiymat");
                    return num;
                };

                if (formula === "fabric") {
                    const length = parseFloatSafe("length");
                    const price = parseFloatSafe("pricePerMeter");
                    const total = length * price;
                    result = `Umumiy narx: ${total.toLocaleString()} so'm`;
                }
                else if (formula === "wood") {
                    const l = parseFloatSafe("wLength") / 100; // metrga
                    const w = parseFloatSafe("wWidth") / 100;
                    const h = parseFloatSafe("wHeight") / 100;
                    const density = parseFloatSafe("density"); // g/sm³
                    const volume = l * w * h; // m³
                    const mass = volume * density * 1000; // kg ga aylantirish
                    result = `Hajmi: ${(volume).toFixed(3)} m³\nMassasi: ${mass.toFixed(2)} kg`;
                }
                else if (formula === "metal") {
                    const l = parseFloatSafe("mLength") / 1000;
                    const w = parseFloatSafe("mWidth") / 1000;
                    const t = parseFloatSafe("mThickness") / 1000;
                    const area = l * w;
                    const volume = area * t;
                    result = `Hajmi: ${(volume * 1000000).toFixed(2)} sm³ (${volume.toFixed(6)} m³)`;
                }
                else if (formula === "area") {
                    const l = parseFloatSafe("roomL");
                    const w = parseFloatSafe("roomW");
                    const area = l * w;
                    const perimeter = 2 * (l + w);
                    result = `Yuzi: ${area} m²\nPerimetri: ${perimeter} m`;
                }
                else if (formula === "time") {
                    const tasks = parseFloatSafe("tasks");
                    const avgTime = parseFloatSafe("avgTime");
                    const totalMin = tasks * avgTime;
                    const hours = Math.floor(totalMin / 60);
                    const minutes = totalMin % 60;
                    result = `${tasks} ta ish ≈ ${hours} soat ${minutes} daqiqa`;
                }

                resultDiv.textContent = result;
            } catch (e) {
                resultDiv.textContent = "Xatolik: " + e.message;
                setTimeout(() => { resultDiv.textContent = "Natija"; }, 2000);
            }
        }

        // Dastlabki inputlarni yuklash
        updateInputs();
        formulaSelect.addEventListener('change', updateInputs);

            "Kiyimda ekologiklik": "Ekologiklik — atrof-muhitni ifloslamaydigan, qayta ishlatiladigan materiallar.",
            "Kiyimda barqaror rivojlanish": "Barqaror rivojlanish — kelajak avlodlarga ham toza dunyo qoldirish maqsadida.",
            "Kiyimda iqtisodiy samaradorlik": "Iqtisodiy samaradorlik — kam xarajat, ko'p daromad, kam chiqindi.",
            "Kiyimda ijtimoiy mas'uliyat": "Ijtimoiy mas'uliyat — ishchilarga adolatli ish haqi, ish sharoiti, mehnat huquqlari.",
            "Kiyimda axloqiy tamoyillar": "Axloqiy tamoyillar — haqiqat, adolat, mehnat, mehnat sevgisi.",
            "Kiyimda madaniy sezgirlar": "Madaniy sezgirlar — milliy libos, an'anaviy naqshlar, tarixiy elementlar.",
            "Kiyimda global standartlar": "Global standartlar — ISO, CE, OEKO-TEX, GOTS — sifat, xavfsizlik, ekologiklik.",
            "Kiyimda milliy an'analar": "Milliy an'analar — o'zbek, qoraqalpoq, tojik, qirg'iz kiyimlari, naqshlari.",
            "Kiyimda tarixiy elementlar": "Tarixiy elementlar — sher, gul, temuriy, navoiy, amalakorlikdagi naqshlar.",
            "Kiyimda zamonaviylik": "Zamonaviylik — yangi dizayn, kombinatsiya, funktsionallik, texnologiya.",
            "Kiyimda kelajak": "Kelajak — aqlli kiyimlar, 3D pechat, ekologik materiallar, robotlar, AI.",
            "Kiyimda dizaynerlik": "Dizaynerlik — kiyim, aksesuar, moda, ranglar, naqshlar, siluetni yaratish san'ati."
        };

        // DOM
        const chatArea = document.getElementById('chat-area');
        const buttonsContainer = document.getElementById('buttons-container');
        const typingIndicator = document.getElementById('typing');

        // Boshlang'ich xabar
        setTimeout(() => {
            addMessage("Salom! Men 7-sinf Texnologiya (Mehnat ta’limi) darsligi bo'yicha AI yordamchiman. Savollarga batafsil javob beraman va mehnat hisob-kitoblarini amalga oshiraman! 🛠️", 'bot-message');
        }, 4200);

        // Tugmalar
        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        // Xabar qo'shish
        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Savolga javob berish
        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu savolga hozir javob bera olmayman.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
    </script>
