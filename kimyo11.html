<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-sinf Kimyo AI Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #1d1b3a, #2a265f, #141229);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0d22;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeOut 2.5s forwards 3.5s;
            color: #a020f0;
            text-align: center;
            padding: 20px;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%23a020f0"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .container {
            width: 95%;
            max-width: 1200px;
            height: 92vh;
            background: rgba(20, 18, 45, 0.88);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(160, 32, 240, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(5, 3, 20, 0.9);
            color: #a020f0;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(160, 32, 240, 0.3);
            text-shadow: 0 0 10px rgba(160, 32, 240, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #6a0dad, #7b1fa2);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: linear-gradient(135deg, #a020f0, #ba55d3);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: none;
            color: #a020f0;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        .buttons-container {
            background: rgba(5, 3, 20, 0.8);
            padding: 12px;
            border-top: 1px solid rgba(160, 32, 240, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #a020f0 transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #a020f0;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(30, 20, 60, 0.4);
            color: #a020f0;
            border: 1px solid rgba(160, 32, 240, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(160, 32, 240, 0.25);
            border-color: #a020f0;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(160, 32, 240, 0.2);
        }

        .ai-agent {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="18" fill="%23a020f0"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: floatSmall 4s ease-in-out infinite;
        }

        @keyframes floatSmall {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .splash-text {
                font-size: 1.6rem;
            }
        }

        .formula {
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-style: italic;
            color: #e0b0ff;
        }

        .element {
            font-family: 'Courier New', monospace;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splash">

        <div class="typing-indicator" id="typing">Fikrlayapman...</div>

        <div class="buttons-container" id="buttons-container"></div>
    </div>

    <script>

        const responses = {
            "Kimyoviy reaksiya tenglamasini qanday tenglashtirish kerak?": "Reaksiya tenglamasini tenglashtirishda reagentlar va mahsulotlarda har bir element atomlari soni teng bo'lishi kerak. Oddiy usul — koeffitsientlarni taxmin qilish, murakkabroq — oksidlanish sonlari yoki elektron balans usuli.",

            "Elektroliz nima? Uni qanday amalga oshirish mumkin?": "Elektr toki yordamida eritma yoki suyuq elektrolitda kimyoviy reaksiya olib borish. Katodda qaytarilish, anodda oksidlanish sodir bo'ladi.",

            "Ion almashinish reaksiyalari qachon sodir bo'ladi?": "Agar mahsulotlarda cho'kma, gaz yoki zaif elektrolit (suv) hosil bo'lsa.",
            "Kimyoviy muvozanat qanday o'rnatiladi?": "Teskari reaksiyalar tezligi tenglashganda muvozanat o'rnatiladi: <i>v_to'g'ri = v_teskari</i>.",
            "Le Chatelier prinsipi nima uchun kerak?": "Tashqi ta'sir (harorat, bosim, konsentratsiya) o'zgarishiga tizim qarama-qarshi yo'nalishda javob beradi.",
            "Kimyoviy reaksiya tezligini qanday ta'sir qiluvchi omillar?": "Konsentratsiya, harorat, bosim (gazlar uchun), maydon, katalizator.",
            "Katalizator nima? U qanday ishlaydi?": "Reaksiya tezligini oshiruvchi, lekin o'zgarmaydigan modda. Faol to'qnashuvlarni osonlashtiradi.",
            "Gomogen va geterogen reaksiyalar farqi?": "Gomogen — barcha moddalar bir fazada (masalan, gazlar aralashmasi). Geterogen — har xil fazalarda (suyuqlik + qattiq).",
            "Issiqlik effekti nima? Eksotermik va endotermik reaksiyalar?": "Eksotermik — issiqlik ajraladi (ΔH < 0). Endotermik — issiqlik yutiladi (ΔH > 0).",
            "Kimyoviy reaksiyaning entalpiyasi qanday hisoblanadi?": "ΔH = ΣΔH_f(mahsulotlar) - ΣΔH_f(reagentlar)",
            "Reaksiya tezligi qonuni qanday ifodalanadi?": "<span class='formula'>v = k·[A]ᵐ·[B]ⁿ</span> — reaksiya tezligi konsentratsiyaga bog'liq.",
            "Faol to'qnashuv nazariyasi nima?": "Reaksiya sodir bo'lishi uchun zarralar etarlicha energiyaga ega (aktivatsiya energiyasi) va to'g'ri yo'naltirilgan to'qnashuvga ega bo'lishi kerak.",
            "Kimyoviy muvozanat doimiysi qanday aniqlanadi?": "<span class='formula'>K = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ</span> — faqat erigan yoki gaz moddalar uchun.",

            "pH nima? Uni qanday hisoblaymiz?": "<span class='formula'>pH = -log[H⁺]</span>. 7 — neytral, <7 — kislota, >7 — ishqor.",

            "Gomologik qator nima?": "Bir xil funksional guruhga ega, lekin CH₂ guruhiga farq qiluvchi birikmalar ketma-ketligi. Masalan: metan, etan, propan...",

            "Galojen almashinish reaksiyalari nima?": "Uglevodoroddagi vodorod galogen bilan almashtiriladi. Masalan: <span class='element'>CH₄ + Cl₂ → CH₃Cl + HCl</span> (yorug'likda).",

            "Aminokislotalarning izoelektrik nuqtasi nima?": "pH qiymati bo'lib, aminokislota molekulasi zaryadsiz (kation ham, anion ham emas) bo'ladi.",

            "Atom tarkibini tushuntiring.": "Yadro (protonlar, neytronlar) va elektronlar. Proton — +1, neytron — 0, elektron — –1.",
            "Izotoplar nima? Misollar keltiring.": "Bir xil proton, har xil neytron soni. Masalan: <span class='element'>¹²C, ¹³C, ¹⁴C</span>.",
            "Elektron konfiguratsiyasini qanday yozish mumkin?": "Kvant sonlar bo'yicha: 1s, 2s, 2p, 3s, 3p, 4s, 3d... Masalan: <span class='element'>O: 1s² 2s² 2p⁴</span>.",
            "Kvant sonlar nima? Ularning mazmuni?": "n — energetik daraja, l — orbital turi (s,p,d,f), m — orbital yo'nalishi, s — elektron spin.",
            "Pauli prinsipi, Gunds qoidasi, Aufbau prinsipi nima?": "Pauli — bir orbitada 2 ta elektron bo'lishi mumkin (spin qarama-qarshi). Gunds — orbitallar birin-ketin to'ldiriladi. Aufbau — past energiyalidan boshlab to'ldiriladi.",
            "Davriy qonun kim tomonidan kashf qilingan?": "D.I. Mendeleyev (1869).",
            "Davriy jadvaldagi guruh va davrlar nima ma'noni anglatadi?": "Guruh — valent elektronlar soni. Davr — energetik darajalar soni.",
            "Metallar va metallmaslar xossalari?": "Metallar — elektron beradi, yaltiroq, o'tkazuvchan. Metallmaslar — elektron qabul qiladi.",
            "Elektr manfiyligi qanday o'zgaradi?": "Chapdan o'ngga — ortadi, yuqoridan pastga — kamayadi. F — eng yuqori.",
            "Ionlanish energiyasi qanday o'zgaradi?": "Chapdan o'ngga — ortadi, yuqoridan pastga — kamayadi.",
            "Atom radiusi qanday o'zgaradi?": "Chapdan o'ngga — kamayadi, yuqoridan pastga — ortadi.",
            "Elektron qo'shilish energiyasi nima?": "Atomga elektron qo'shilganda ajraladigan energiya. Galogennarda eng yuqori.",
            "Inert gazlar nima uchun barqaror?": "Tashqi qavatlari to'liq — elektron almashinmaydi.",
            "d-elementlar xossalari?": "O'tish metallari, ko'p valentlik, rangli birikmalar, katalizator sifatida ishlaydi.",
            "f-elementlar nima?": "Lantanoidlar va aktinoidlar. Radioaktiv (aktinoidlar).",
            "Elektron formulasi <span class='element'>1s² 2s² 2p⁶</span> bo'lgan elementni aniqlang.": "Neon (Ne), 10 ta elektron.",
            "Xromning elektron konfiguratsiyasida nima g'alati?": "<span class='element'>Cr: [Ar] 4s¹ 3d⁵</span> — yarim to'ldirilgan d-orbital barqaror.",
            "Davriy qonunning zamonaviy shakli qanday?": "Xossalari atom raqamiga (proton soniga) davriy ravishda bog'liq.",
            "Atomning magnit xossalari qanday aniqlanadi?": "Agar juftlanmagan elektron bo'lsa — paramagnit, barcha juft bo'lsa — diamagnit.",
            "Kvant mexanikasining atom tuzilishiga ta'siri?": "Elektronlarni orbitallar deb qarash — ehtimoliy elektron buluti — kvant mexanikasi asosida.",

            "Galvanik element nima?": "Kimyoviy energiyani elektr energiyasiga aylantiruvchi qurilma (masalan, Daniyel elementi).",
            "Standart elektrod potensiali nima?": "Elektrodning vodorod elektrodiga nisbatan potensiali (25°C, 1M, 1 atm).",
            "Nernst tenglamasi qanday ifodalanadi?": "<span class='formula'>E = E⁰ - (RT/nF) lnQ</span> — konsentratsiyaga bog'liq potensial.",
            "Batareyalar va akkumulyatorlar farqi?": "Batareyalar — qaytarilmas (batareya). Akkumulyatorlar — qayta zaryadlanadi.",
            "Kislota-oltingugurtli akkumulyator qanday ishlaydi?": "Plyus — PbO₂, minus — Pb, elektrolit — H₂SO₄. Zaryadlanishda PbSO₄ → Pb + PbO₂.",
            "Elektrolizda katodda nima ajraladi?": "Kationlar qaytariladi: metall yoki vodorod.",
            "Anodda qanday jarayon sodir bo'ladi?": "Anionlar oksidlanadi yoki anod eriydi.",
            "Faradey qonunlari nima?": "1) Ajralgan modda massasi tok kuchi va vaqtga proporsional. 2) Bir xil zaryad uchun ekvivalent massalar proporsional.",
            "Elektrolit eritmasidagi tok tashuvchilari kimlar?": "Ionlar (katyonlar va anionlar).",
            "Metallarni elektroliz orqali qanday qayta tiklash mumkin?": "Erıtma yoki suyuq tuzdan elektroliz qilish — katodda toza metall ajraladi.",
            "Korroziya nima? Uni qanday oldini olish mumkin?": "Metallning atrof-muhit ta'sirida vayron bo'lishi. Himoya: bo'yash, galvanika, qurbon qiluvchi metall.",
            "Himoya qiluvchi galvanik juftlik nima?": "Kamroq nobud bo'luvchi metallni himoya qilish uchun unga ko'proq nobud bo'luvchi metallni ulash (masalan, rux — temirni himoya qiladi).",
            "Elektrokimyoviy korroziya mexanizmi?": "Metall sirtida mikrogalvanik elementlar hosil bo'ladi — anodda metal eriydi.",
            "Elektrolizda ajralgan modda massasi qanday hisoblanadi?": "<span class='formula'>m = (M·I·t)/(n·F)</span>, F = 96500 C/mol.",
            "Tok kuchi va elektroliz tezligi orasidagi bog'lanish?": "Tok kuchi ortsa, elektroliz tezligi oshadi (Faradey qonuni).",

            "Erigan modda va erituvchi farqi?": "Erigan modda — kam miqdorda (tuz). Erituvchi — ko'p miqdorda (suv).",
            "Suyuqlikda moddani eritish jarayoni issiqlik beradimi yoki yutadimi?": "Bog' uzilishida — yutiladi, yangi bog' hosil bo'lganda — beriladi. Natijaviy — endo yoki ekzotermik bo'ladi.",
            "Erituvchanlik qanday omillarga bog'liq?": "Harorat, bosim (gazlar uchun), erituvchi tabiati (\"o'xshash — o'xshashni eritadi\").",

            "Molyar, normal, protsentli konsentratsiyalar qanday hisoblanadi?": "Molyar (mol/l), normal (ekvivalent/l), protsentli = (erigan modda massasi / eritma massasi) × 100%.",
            "Mol ulush nima?": "Erigan modda mollar soni / umumiy mollar soni.",
            "Kolloid eritmalarning xususiyatlari?": "Zarralar 1–100 nm, Tyndall effekti, cho'kmaydi.",
            "Termodinamikaning birinchi qonuni kimyoda qanday qo'llaniladi?": "ΔU = Q - W — ichki energiya o'zgarishi.",
            "Gibbs energiyasi nima? Reaksiya imkonini qanday aniqlaydi?": "<span class='formula'>ΔG = ΔH - TΔS</span>. Agar ΔG < 0 — reaksiya spontan.",
            "Entropiya kimyoviy jarayonlarda qanday rol o'ynaydi?": "Tartibsizlik oshsa (ΔS > 0), reaksiya imkoniyati ortadi.",
            "Kimyoviy tenglikda entalpiya va entropiya o'rtasidagi munosabat?": "ΔG = 0 bo'lganda: <span class='formula'>T = ΔH/ΔS</span> — muvozanat harorati.",
            "Gibbs tenglamasi qanday ifodalanadi?": "<span class='formula'>ΔG = ΔG⁰ + RT lnQ</span>.",
            "Kimyoviy reaksiyaning spontanligi qanday aniqlanadi?": "ΔG < 0 — spontan, ΔG > 0 — spontan emas, ΔG = 0 — muvozanat.",
            "Fazaviy muvozanat — erituvchanlik muvozanati nima?": "Erigan modda tezligi = cho'kma tezligi — to'yingan eritma."
        };

        const chatArea = document.getElementById('chat-area');
        const buttonsContainer = document.getElementById('buttons-container');
        const typingIndicator = document.getElementById('typing');

        setTimeout(() => {
            addMessage("Salom! Men 11-sinf Kimyo darsligi bo'yicha AI yordamchiman. Organik kimyo, elektroliz, atom tuzilishi, kimyoviy reaksiyalar — barchasini chuqur tushuntirishga tayyorman. Savollarni tanlang!", 'bot-message');
        }, 4200);

        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.setAttribute('data-full', q);
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.innerHTML = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu mavzu hozircha qo'llab-quvvatlanmaydi.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
    </script>
</body>
</html>
