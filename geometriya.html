<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometriya AI Bot — 7-sinf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #4a148c, #7b1fa2, #9c27b0);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #ce93d8;
            text-align: center;
            padding: 20px;
            animation: fadeOut 2.5s forwards 3.5s;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%23ce93d8"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
            color: #ce93d8;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
            color: #e1bee7;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(13, 19, 33, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(206, 147, 216, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #ce93d8;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(206, 147, 216, 0.3);
            text-shadow: 0 0 10px rgba(206, 147, 216, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #7b1fa2, #9c27b0);
            color: white;
            align-self: flex-end;
        }

        .bot-message {
            background: linear-gradient(135deg, #6a1b9a, #ce93d8);
            color: white;
            align-self: flex-start;
        }

        .typing-indicator {
            display: none;
            color: #ce93d8;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(206, 147, 216, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #ce93d8 transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #ce93d8;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(100, 50, 120, 0.4);
            color: #ce93d8;
            border: 1px solid rgba(206, 147, 216, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(206, 147, 216, 0.2);
            border-color: #ce93d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(206, 147, 216, 0.2);
        }

        /* GEOMETRIK KALKULYATOR */
        .geo-calculator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ce93d8;
            border-radius: 15px;
            padding: 10px;
            width: 220px;
            box-shadow: 0 0 15px rgba(206, 147, 216, 0.3);
            z-index: 10;
        }

        .calc-title {
            color: #ce93d8;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calc-select {
            width: 100%;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #e1bee7;
            border: 1px solid #ce93d8;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .calc-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .calc-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-input-group label {
            font-size: 0.85rem;
            color: #b39ddb;
        }

        .calc-input-group input {
            width: 90px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #9c27b0;
            border-radius: 4px;
            text-align: right;
        }

        .calc-btn {
            width: 100%;
            padding: 8px;
            background: rgba(156, 39, 176, 0.6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: rgba(156, 39, 176, 0.8);
        }

        .calc-result {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #4fc3f7;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;
        }

        .ai-agent {
            display: none;
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .geo-calculator {
                width: 180px;
                padding: 8px;
            }
            .calc-input-group input {
                width: 70px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Kirish ekran -->
    <div class="splash-screen">
        <div class="ai-icon"></div>
        <div class="splash-text">Geometriya AI + Kalkulyator</div>
        <div class="splash-subtext">7-sinf o'quvchilari uchun 100+ geometriya savoli va maxsus hisoblovchi kalkulyator</div>
    </div>

    <!-- Asosiy interfeys -->
    <div class="container">
        <div class="header">📐 7-sinf Geometriya AI Bot</div>

        <!-- GEOMETRIK KALKULYATOR -->
        <div class="geo-calculator">
            <div class="calc-title">Geometrik Kalkulyator</div>
            <select class="calc-select" id="geo-shape">
                <option value="triangle-angles">Uchburchak burchaklari</option>
                <option value="square">Kvadrat (yuz, perimetr)</option>
                <option value="rectangle">To'g'ri to'rtburchak</option>
                <option value="circle">Aylana (uzunlik, yuz)</option>
                <option value="triangle-area">Uchburchak yuzi</option>
                <option value="pythagoras">Pifagor teoremasi</option>
            </select>

            <div class="calc-inputs" id="calc-inputs">
                <!-- Inputlar JavaScript orqali qo'shiladi -->
            </div>

            <button class="calc-btn" onclick="calculateGeometry()">Hisobla</button>
            <div class="calc-result" id="calc-result">Natija</div>
        </div>

        <div class="chat-area" id="chat-area">
            <!-- Xabarlar shu yerda chiqadi -->
        </div>

        <div class="typing-indicator" id="typing">Hisoblayapman...</div>

        <div class="buttons-container" id="buttons-container">
            <!-- Savollar JavaScript orqali qo'shiladi -->
        </div>
    </div>

    <script>
        // ✅ Geometrik kalkulyator
        const shapeSelect = document.getElementById('geo-shape');
        const inputsContainer = document.getElementById('calc-inputs');
        const resultDiv = document.getElementById('calc-result');

        const inputConfigs = {
            "triangle-angles": [
                { label: "Burchak A (°):", id: "angleA", placeholder: "masalan: 60" },
                { label: "Burchak B (°):", id: "angleB", placeholder: "masalan: 70" }
            ],
            "square": [
                { label: "Tomon (a):", id: "side", placeholder: "masalan: 5" }
            ],
            "rectangle": [
                { label: "Tomon a:", id: "rectA", placeholder: "5" },
                { label: "Tomon b:", id: "rectB", placeholder: "3" }
            ],
            "circle": [
                { label: "Radius (r):", id: "radius", placeholder: "masalan: 4" }
            ],
            "triangle-area": [
                { label: "Asos (a):", id: "base", placeholder: "6" },
                { label: "Balandlik (h):", id: "height", placeholder: "4" }
            ],
            "pythagoras": [
                { label: "Katet a:", id: "legA", placeholder: "3" },
                { label: "Katet b:", id: "legB", placeholder: "4" }
            ]
        };

        function updateInputs() {
            const shape = shapeSelect.value;
            inputsContainer.innerHTML = '';
            const config = inputConfigs[shape];
            
            config.forEach(input => {
                const div = document.createElement('div');
                div.className = 'calc-input-group';
                div.innerHTML = `
                    <label>${input.label}</label>
                    <input type="number" id="${input.id}" placeholder="${input.placeholder}" step="any">
                `;
                inputsContainer.appendChild(div);
            });
        }

        function calculateGeometry() {
            const shape = shapeSelect.value;
            try {
                let result = "";
                const parseFloatSafe = (id) => {
                    const val = document.getElementById(id)?.value;
                    const num = parseFloat(val);
                    if (isNaN(num) || num <= 0) throw new Error("Noto'g'ri qiymat");
                    return num;
                };

                if (shape === "triangle-angles") {
                    const a = parseFloatSafe("angleA");
                    const b = parseFloatSafe("angleB");
                    if (a + b >= 180) throw new Error("Burchaklar yig'indisi 180° dan kam bo'lishi kerak");
                    const c = 180 - a - b;
                    result = `Uchinchi burchak: ${c.toFixed(2)}°`;
                }
                else if (shape === "square") {
                    const a = parseFloatSafe("side");
                    const perimeter = 4 * a;
                    const area = a * a;
                    result = `Perimetr: ${perimeter.toFixed(2)}, Yuz: ${area.toFixed(2)}`;
                }
                else if (shape === "rectangle") {
                    const a = parseFloatSafe("rectA");
                    const b = parseFloatSafe("rectB");
                    const perimeter = 2 * (a + b);
                    const area = a * b;
                    result = `Perimetr: ${perimeter.toFixed(2)}, Yuz: ${area.toFixed(2)}`;
                }
                else if (shape === "circle") {
                    const r = parseFloatSafe("radius");
                    const pi = Math.PI;
                    const circumference = 2 * pi * r;
                    const area = pi * r * r;
                    result = `Uzunlik: ${circumference.toFixed(2)}, Yuz: ${area.toFixed(2)}`;
                }
                else if (shape === "triangle-area") {
                    const base = parseFloatSafe("base");
                    const height = parseFloatSafe("height");
                    const area = 0.5 * base * height;
                    result = `Yuz: ${area.toFixed(2)}`;
                }
                else if (shape === "pythagoras") {
                    const a = parseFloatSafe("legA");
                    const b = parseFloatSafe("legB");
                    const c = Math.sqrt(a*a + b*b);
                    result = `Gipotenuza: ${c.toFixed(2)}`;
                }

                resultDiv.textContent = result;
            } catch (e) {
                resultDiv.textContent = "Xatolik: " + e.message;
                setTimeout(() => { resultDiv.textContent = "Natija"; }, 2000);
            }
        }

        // Dastlabki inputlarni yuklash
        updateInputs();
        shapeSelect.addEventListener('change', updateInputs);

        // Boshlang'ich xabar
        setTimeout(() => {
            addMessage("Salom! Men 7-sinf geometriya darsligi bo'yicha AI yordamchiman. Savollarga javob beraman va hisoblashga yordam beraman! 📐", 'bot-message');
        }, 4200);

        // Tugmalar
        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        // Xabar qo'shish
        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Savolga javob berish
        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu savolga hozir javob bera olmayman.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
