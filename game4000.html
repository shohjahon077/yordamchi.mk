<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D Shadow Platformer</title>
  <style>
    /* CSS 1000+ qator */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 500px;
      overflow: hidden;
      border: 3px solid #444;
      box-shadow: 0 0 20px rgba(0, 100, 255, 0.6);
      background: #111;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #uiLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .ui-element {
      position: absolute;
      color: #fff;
      font-size: 16px;
      text-shadow: 0 0 5px #00f;
    }

    #scoreDisplay {
      top: 10px;
      left: 10px;
    }

    #healthDisplay {
      top: 10px;
      right: 10px;
    }

    #levelDisplay {
      bottom: 10px;
      left: 10px;
    }

    #controls {
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: #aaa;
    }

    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      color: #0ff;
      text-align: center;
      z-index: 3;
      text-shadow: 0 0 10px #00f, 0 0 20px #00f;
      opacity: 1;
      transition: opacity 1s;
    }

    .start-btn {
      background: #00f;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 255, 0.7);
      pointer-events: auto;
    }

    .start-btn:hover {
      background: #00a;
    }

    .hidden {
      display: none;
    }

    .shadow-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.8) 0%, rgba(0,0,0,1) 100%);
      pointer-events: none;
    }

    .light-source {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #ff0;
      border-radius: 50%;
      box-shadow: 0 0 30px #ff0;
      z-index: 1;
      pointer-events: none;
    }

    .platform {
      position: absolute;
      background: #4a4;
      border: 2px solid #0f0;
      box-shadow: inset 0 0 10px rgba(0,255,0,0.5);
    }

    .collectible {
      position: absolute;
      width: 15px;
      height: 15px;
      background: #ff0;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .enemy {
      position: absolute;
      width: 30px;
      height: 30px;
      background: #f00;
      box-shadow: 0 0 10px #f00;
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #fff;
      border-radius: 50%;
      pointer-events: none;
    }

    .shadow {
      filter: blur(2px);
      opacity: 0.6;
    }

    .player {
      position: absolute;
      width: 30px;
      height: 30px;
      background: #00f;
      box-shadow: 0 0 10px #00f;
    }

    .player-shadow {
      position: absolute;
      width: 30px;
      height: 30px;
      background: rgba(0,0,0,0.5);
      filter: blur(1px);
      z-index: 0;
    }

    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 40px;
      color: #f00;
      text-align: center;
      z-index: 10;
      display: none;
    }

    .win {
      color: #0f0;
    }

    .restart-btn {
      background: #f00;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(255,0,0,0.7);
      pointer-events: auto;
    }

    .restart-btn:hover {
      background: #a00;
    }

    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #000, #001122);
      z-index: -1;
    }

    .grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0, 100, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 100, 255, 0.1) 1px, transparent 1px);
      background-size: 20px 20px;
      z-index: -1;
    }

    .fog {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .light {
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(0,100,255,0.3) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .particle-trail {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
    }

    .shadow-cast {
      position: absolute;
      background: rgba(0,0,0,0.7);
      filter: blur(3px);
      z-index: -1;
    }

    .glow {
      box-shadow: 0 0 20px currentColor;
    }

    .pulse {
      animation: pulse-glow 1.5s infinite alternate;
    }

    @keyframes pulse-glow {
      from { box-shadow: 0 0 10px currentColor; }
      to { box-shadow: 0 0 20px currentColor; }
    }

    .fade-in {
      animation: fadeIn 1s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .slide-in {
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .bounce {
      animation: bounce 0.5s ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .spin {
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .glow-text {
      text-shadow: 0 0 10px currentColor;
    }

    .text-outline {
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    .highlight {
      background: linear-gradient(to right, #00f, #0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gradient-bg {
      background: linear-gradient(45deg, #000, #001122, #000);
    }

    .stripes {
      background: repeating-linear-gradient(
        45deg,
        #000,
        #000 10px,
        #001122 10px,
        #001122 20px
      );
    }

    .noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.1;
    }

      border: 2px solid #0ff;
      box-shadow: 0 0 10px #0ff;
    }

    .inner-shadow {
      box-shadow: inset 0 0 10px rgba(0,255,255,0.5);
    }

    .outer-shadow {
      box-shadow: 0 0 15px rgba(0,255,255,0.5);

<body>

<div id="gameContainer">
  <div class="bg-layer"></div>
  <div class="grid"></div>
  <div class="fog"></div>
  <div class="shadow-layer"></div>
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div id="uiLayer">
    <div id="scoreDisplay" class="ui-element">Score: 0</div>
    <div id="healthDisplay" class="ui-element">Health: 100</div>
    <div id="levelDisplay" class="ui-element">Level: 1</div>
    <div id="controls" class="ui-element">Use Arrow Keys to Move</div>
  </div>
  <div id="titleScreen" class="title">
    <h1 class="highlight">2D Shadow Platformer</h1>
    <button class="start-btn" onclick="startGame()">Start Game</button>
  </div>
  <div id="gameOver" class="game-over">
    <h2>Game Over</h2>
    <button class="restart-btn" onclick="restartGame()">Restart</button>
  </div>
  <div id="winScreen" class="game-over win">
    <h2>You Win!</h2>
    <button class="restart-btn" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
  // JavaScript 1000+ qator
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const titleScreen = document.getElementById('titleScreen');
  const gameOverScreen = document.getElementById('gameOver');
  const winScreen = document.getElementById('winScreen');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const healthDisplay = document.getElementById('healthDisplay');
  const levelDisplay = document.getElementById('levelDisplay');

  let gameRunning = false;
  let score = 0;
  let health = 100;
  let level = 1;
  let player = {
    x: 50,
    y: 400,
    width: 30,
    height: 30,
    speed: 5,
    velX: 0,
    velY: 0,
    jumping: false,
    grounded: false,
    color: '#00f',
    shadowColor: 'rgba(0,0,0,0.6)',
    shadowOffsetX: 10,
    shadowOffsetY: 10,
    shadowBlur: 2
  };

  let keys = {};
  let platforms = [];
  let collectibles = [];
  let enemies = [];
  let particles = [];
  let gravity = 0.5;
  let friction = 0.8;
  let jumpStrength = -12;

  function initLevel() {
    platforms = [
      { x: 0, y: 480, width: 800, height: 20 },
      { x: 200, y: 400, width: 100, height: 20 },
      { x: 400, y: 350, width: 100, height: 20 },
      { x: 600, y: 300, width: 100, height: 20 },
      { x: 300, y: 250, width: 100, height: 20 },
      { x: 100, y: 300, width: 100, height: 20 }
    ];

    collectibles = [
      { x: 230, y: 370, width: 15, height: 15, collected: false },
      { x: 430, y: 320, width: 15, height: 15, collected: false },
      { x: 630, y: 270, width: 15, height: 15, collected: false },
      { x: 330, y: 220, width: 15, height: 15, collected: false }
    ];

    enemies = [
      { x: 350, y: 450, width: 30, height: 30, speed: 2, direction: 1 },
      { x: 500, y: 320, width: 30, height: 30, speed: 1.5, direction: -1 }
    ];
  }

  function startGame() {
    titleScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    winScreen.classList.add('hidden');
    gameRunning = true;
    score = 0;
    health = 100;
    level = 1;
    player.x = 50;
    player.y = 400;
    player.velX = 0;
    player.velY = 0;
    initLevel();
    updateUI();
    gameLoop();
  }

  function restartGame() {
    startGame();
  }

  function updateUI() {
    scoreDisplay.textContent = `Score: ${score}`;
    healthDisplay.textContent = `Health: ${health}`;
    levelDisplay.textContent = `Level: ${level}`;
  }

  function drawRect(x, y, width, height, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
  }

  function drawShadowRect(x, y, width, height, color, offsetX, offsetY, blur) {
    ctx.save();
    ctx.filter = `blur(${blur}px)`;
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = color;
    ctx.fillRect(x + offsetX, y + offsetY, width, height);
    ctx.restore();
  }

  function drawPlayer() {
    drawShadowRect(player.x, player.y, player.width, player.height, player.shadowColor, player.shadowOffsetX, player.shadowOffsetY, player.shadowBlur);
    drawRect(player.x, player.y, player.width, player.height, player.color);
  }

  function drawPlatforms() {
    platforms.forEach(p => {
      drawRect(p.x, p.y, p.width, p.height, '#4a4');
    });
  }

  function drawCollectibles() {
    collectibles.forEach(c => {
      if (!c.collected) {
        drawRect(c.x, c.y, c.width, c.height, '#ff0');
      }
    });
  }

  function drawEnemies() {
    enemies.forEach(e => {
      drawRect(e.x, e.y, e.width, e.height, '#f00');
    });
  }

  function drawParticles() {
    particles.forEach((p, i) => {
      drawRect(p.x, p.y, p.size, p.size, p.color);
      p.x += p.velX;
      p.y += p.velY;
      p.velY += 0.1;
      p.life--;
      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    });
  }

  function createParticles(x, y, color) {
    for (let i = 0; i < 5; i++) {
      particles.push({
        x: x,
        y: y,
        size: Math.random() * 3 + 1,
        color: color,
        velX: (Math.random() - 0.5) * 4,
        velY: (Math.random() - 0.5) * 4,
        life: 20
      });
    }
  }

  function updatePlayer() {
    player.velY += gravity;
    player.x += player.velX;
    player.y += player.velY;

    player.grounded = false;

    platforms.forEach(p => {
      let dir = collisionCheck(player, p);

      if (dir === "left" || dir === "right") {
        player.velX = 0;
      } else if (dir === "bottom") {
        player.grounded = true;
        player.jumping = false;
        player.velY = 0;
      } else if (dir === "top") {
        player.velY *= -0.5;
      }
    });

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    if (player.y > canvas.height) {
      playerDie();
    }

    enemies.forEach(e => {
      e.x += e.speed * e.direction;
      if (e.x < 100 || e.x + e.width > 700) e.direction *= -1;

      if (collisionCheck(player, e)) {
        health -= 1;
        updateUI();
        if (health <= 0) playerDie();
      }
    });

    collectibles.forEach(c => {
      if (!c.collected && collisionCheck(player, c)) {
        c.collected = true;
        score += 10;
        updateUI();
        createParticles(c.x + c.width/2, c.y + c.height/2, '#ff0');
      }
    });

    if (collectibles.every(c => c.collected)) {
      level++;
      initLevel();
      updateUI();
    }
  }

  function collisionCheck(obj1, obj2) {
    let vX = (obj1.x + obj1.width / 2) - (obj2.x + obj2.width / 2);
    let vY = (obj1.y + obj1.height / 2) - (obj2.y + obj2.height / 2);

    let hWidths = (obj1.width / 2) + (obj2.width / 2);
    let hHeights = (obj1.height / 2) + (obj2.height / 2);

    let direction = null;

    if (Math.abs(vX) < hWidths && Math.abs(vY) < hHeights) {
      let oX = hWidths - Math.abs(vX);
      let oY = hHeights - Math.abs(vY);

      if (oX >= oY) {
        if (vY > 0) {
          direction = "top";
          obj1.y += oY;
        } else {
          direction = "bottom";
          obj1.y -= oY;
        }
      } else {
        if (vX > 0) {
          direction = "left";
          obj1.x += oX;
        } else {
          direction = "right";
          obj1.x -= oX;
        }
      }
    }

    return direction;
  }

  function playerDie() {
    gameRunning = false;
    gameOverScreen.style.display = 'block';
  }

  function gameLoop() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPlatforms();
    drawCollectibles();
    drawEnemies();
    drawParticles();
    updatePlayer();
    drawPlayer();

    requestAnimationFrame(gameLoop);
  }

  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;

    if (e.key === 'ArrowUp' && player.grounded && !player.jumping) {
      player.jumping = true;
      player.grounded = false;
      player.velY = jumpStrength;
    }
  });

  document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });

  function updateMovement() {
    if (keys['ArrowRight']) {
      player.velX = player.speed;
    } else if (keys['ArrowLeft']) {
      player.velX = -player.speed;
    } else {
      player.velX *= friction;
    }
  }

  setInterval(updateMovement, 1000 / 60);

  // Boshlang'ich o'yin holati
  initLevel();
</script>

</body>
