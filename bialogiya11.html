<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11-sinf Biologiya AI Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #1a2e1a, #223b22, #0f1c0f);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0c1a0c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeOut 2.5s forwards 3.5s;
            color: #00ff99;
            text-align: center;
            padding: 20px;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%2300ff99"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .container {
            width: 95%;
            max-width: 1200px;
            height: 92vh;
            background: rgba(15, 30, 15, 0.88);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 255, 153, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(5, 15, 5, 0.9);
            color: #00ff99;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 255, 153, 0.3);
            text-shadow: 0 0 10px rgba(0, 255, 153, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #006400, #008000);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: linear-gradient(135deg, #00cc66, #00ff99);
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: none;
            color: #00ff99;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        .buttons-container {
            background: rgba(5, 15, 5, 0.8);
            padding: 12px;
            border-top: 1px solid rgba(0, 255, 153, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #00ff99 transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #00ff99;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(20, 50, 20, 0.4);
            color: #00ff99;
            border: 1px solid rgba(0, 255, 153, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(0, 255, 153, 0.25);
            border-color: #00ff99;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 255, 153, 0.2);
        }

        .ai-agent {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="18" fill="%2300ff99"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: floatSmall 4s ease-in-out infinite;
        }

        @keyframes floatSmall {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .splash-text {
                font-size: 1.6rem;
            }
        }

        .term {
            color: #66ffcc;
            font-weight: bold;
        }
    </style>
</head>

            "Simbioz turlari?": "<span class='term'>Mutualizm</span> — foyda-foyda (pichoq va bakteriyalar). <span class='term'>Kommensalizm</span> — foyda-neytral (baliq va akula). <span class='term'>Parazitizm</span> — foyda-zarar.",
            "Parazitizm nima?": "Bir organizm (parazit) boshqa organizmdan (xo'jayin) foydalanib, unga zarar yetkazadi.",
            "Ekologik muammolar va ularni hal qilish yo'llari?": "Global isish, ozon teshilishi, ifloslanish. Yo'llari: qayta ishlash, energiya tejash, barqaror rivojlanish.",
            "Ozon qatlami qanday vayron bo'lmoqda?": "Xlorftoruglevodorodlar (CFC) ozonni parchalaydi — Quyoshdan UV nurlarini to'sish qobiliyati kamayadi.",
            "Iqlim o'zgarishining asosiy sabablari?": "Karbonat angidrid (CO₂), metan (CH₄) gazlari — issiqlikni ushlab qoladi (parnik effekti).",
            "Barqaror rivojlanish nima?": "Hozirgi ehtiyojlarni qondirish kelajak avlodlarga zarar bermasdan amalga oshiriladi.",

            "Nerv tizimi qanday tuzilgan?": "Markaziy (bosh miya, spinal miya) va periferik (nervlar) qismlardan iborat.",
            "Markaziy va periferik nerv tizimi farqi?": "<span class='term'>Markaziy</span> — axboratni qayta ishlash markazi. <span class='term'>Periferik</span> — markaz bilan a'zolar orasidagi aloqa.",
            "Refleks va uning turlari?": "Avtomatik javob. <span class='term'>Shartli</span> (o'rganilgan: PAVLOV iti) va <span class='term'>shartsiz</span> (tug'ma: ko'zni qisish).",
            "Gormonlar nima? Endokrin bezlar tizimi?": "Ichki sekretsiya bezlaridan chiqadigan kimyoviy moddalar. Tizimi: gipotalamus, gipofiz, qalqonsimon, buyrak ustlari.",
            "Insulin va glukagon qanday ishlaydi?": "<span class='term'>Insulin</span> — qondagi glukozani kamaytiradi (jigar hujayralariga kirishini rag'batlantiradi). <span class='term'>Glukagon</span> — aksincha.",
            "Qon aylanish tizimi qanday ishlaydi?": "Yurak qonni pompalaydi — arteriyalar → kapillyarlar → venalar → yurak.",
            "Kichik va katta qon aylanish doiralari?": "<span class='term'>Kichik</span> — yurak → o'pka → yurak (gaz almashinuvi). <span class='term'>Katta</span> — yurak → tana → yurak (kislorod yetkazish).",
            "Nafas olish tizimi qanday tuzilgan?": "Burun → so'lak → bronx → bronxiollar → alveolalar (gaz almashinuvi).",
            "Gaz almashinuvi qanday sodir bo'ladi?": "Kislorod alveoladan qonga, karbonat angidrid — qondan alveolaga diffulyatsiya qilinadi.",
            "Mevali bez nima uchun kerak?": "Gipofizga signal beradi — jinsiy bezlarni nazorat qiladi.",
            "Bosh miya qismlari va ularning vazifalari?": "Old miya (fikrlash), o'rta miya (ko'rish-eshitish), orqa miya (nafas, yurak ishi), uzun cho'ntak (harakat muvozanati).",
            "Spinal miyaning funksiyalari?": "Reflekslarni amalga oshirish, axboratni bosh miyaga uzatish.",
            "Ko'rish organi qanday tuzilgan?": "Ko'z — tirsak, lensa, retina. Retinadagi fotoreseptorlar (kolbalar, tayoqchalar) yorug'likni nerv signliga aylantiradi.",
            "Eshtish organi qanday ishlaydi?": "Tovush to'lqini — quloq pishonigini titratadi — ichki quloqdagi soch hujayralari signal hosil qiladi.",
            "Buyraklar organizmda qanday rol o'ynaydi?": "Zaharli moddalarni chiqarish, suv-solyar muvozanatini saqlash, qon bosimini nazorat qilish.",
            "Sovunma tizimi qanday ishlaydi?": "Teri orqali issiqlikni sovutish, suv va tuz chiqarish, himoya qilish.",
            "Ichaklarda ozuqa qanday hazm qilinadi?": "Fermentlar (amilaza, tripsin, lipaza) — uglevodlar, oqsillar, yog'larni parchalaydi.",
            "Jigar qanday funksiyalarni bajaradi?": "Detoksikatsiya, oqsil sintezi, oshqozon suyuqligini ishlab chiqarish, glukozani saqlash.",
            "Immun tizimi qanday himoya qiladi?": "Oq qon hujayralari (T, B limfotsitlar) — virus, bakteriyalarga qarshi kurashadi.",
            "Viruslar organizmga qanday ta'sir qiladi?": "Hujayraga kirib, uning DNK/RNK qurilishini buzib, ko'payadi — hujayra vayron bo'ladi.",

            "Prokariot va eukariot hujayralar farqi?": "<span class='term'>Prokariot</span> — yadro, organoidlar yo'q (bakteriyalar). <span class='term'>Eukariot</span> — yadro va organoidlar bor (o'simlik, hayvon).",
            "Hujayraning asosiy qismlari?": "Membrana, sitoplazma, yadro (eukariotda), ribosomalar, mitoxondriya, ER, Golji apparati.",
            "Mitoxondriya nima uchun 'energetik stansiya' deyiladi?": "Nafas olish jarayonida ATF ishlab chiqaradi — hujayra energiyasi manbai.",
            "Ribosomalar qanday ishlaydi?": "iRNK bo'yicha aminokislotalarni biriktirib, oqsil sintez qiladi.",
            "Endoplazmatik to'r qanday funksiyaga ega?": "<span class='term'>Granulyar ER</span> — oqsil sintezi. <span class='term'>Gladkiy ER</span> — yog' sintezi, detoksikatsiya.",
            "Golji apparati nima uchun kerak?": "Moddalarni qayta ishlash, ajratish, lizosomalar yasash.",
            "Lizosomalar nima?": "Ichida fermentlar bor — chet el moddalarni parchalaydi, hujayra ichidagi narsalarni yeydi.",
            "Xloroplastlar qanday ishlaydi?": "Fotosintez — yorug'lik energiyasini kimyoviy energiyaga aylantiradi (o'simliklarda).",
            "Hujayra membranasi tuzilishi?": "Fosfolipid ikki qavati + oqsillar — selektiv o'tkazuvchanlik.",
            "Plazmoliz nima?": "Gipertonik eritmada hujayra suvini yo'qotib qurib qoladi.",
            "Fagotsitoz va pinotsitoz farqi?": "<span class='term'>Fagotsitoz</span> — qattiq zarralarni yutish. <span class='term'>Pinotsitoz</span> — suyuqlikni yutish.",
            "Hujayra bo'linishining mitoz bosqichlari?": "Profaza → metafaza → anafaza → telofaza → sitokinez.",
            "Meioz nima? Uni mitozdan farqlang.": "<span class='term'>Meioz</span> — jinsiy hujayralar hosil qilish, 2 marta bo'linadi, n = haploid. <span class='term'>Mitoz</span> — somatik hujayralar, 1 marta, 2n = diploid.",
            "Gametogenez jarayoni qanday?": "Spermatogenez (erkakda) — 4 spermatozoid. Oogenez (ayolda) — 1 tuxum hujayra + 3 polotsit.",
            "Hujayra sikli bosqichlari?": "G1 → S (DNK nusxalanadi) → G2 → M (mitoz)."
        };

        const chatArea = document.getElementById('chat-area');
        const buttonsContainer = document.getElementById('buttons-container');
        const typingIndicator = document.getElementById('typing');

        setTimeout(() => {
            addMessage("Salom! Men 11-sinf Biologiya darsliklariga asoslangan AI yordamchiman. Genetika, evolyutsiya, ekologiya, fiziologiya — barcha mavzular bo'yicha chuqur tushuntirishga tayyorman. Savollarni tanlang!", 'bot-message');
        }, 4200);

        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.setAttribute('data-full', q);
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.innerHTML = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu mavzu hozircha qo'llab-quvvatlanmaydi.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
    </script>
</body>
</html>
