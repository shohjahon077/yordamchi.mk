<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="gameTitle">Super Raqamni Topish O'yini</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ==================================== */
        /* CSS GLOBAL O'ZGARUVCHILARI (NEON) */
        /* ==================================== */

        :root {
            --color-primary: #00ffc8; /* Yorqin Akva (Neon) */
            --color-secondary: #ff007b; /* Qizil Binafsha */
            --color-bg: #1e1e3f; /* To'q Fon */
            --color-card: rgba(40, 40, 70, 0.9);
            --color-text: #e0e0e0;
            --shadow-neon: 0 0 10px var(--color-primary), 0 0 20px var(--color-primary);
            --shadow-inner: inset 0 0 5px rgba(0, 0, 0, 0.5);
            --blur: 8px;
            --success-glow: #00ff40;
            --error-glow: #ff4000;
        }

        /* YORUG' MAVZU (LIGHT THEME - Neumorphism) */
        .light-theme {
            --color-primary: #3c00b0;
            --color-secondary: #00d9e9;
            --color-bg: #f0f4f8;
            --color-card: #e0e8f0;
            --color-text: #2c3e50;
            --shadow-neon: 5px 5px 15px rgba(0, 0, 0, 0.15), -5px -5px 15px rgba(255, 255, 255, 0.7);
            --shadow-inner: inset 2px 2px 5px rgba(0, 0, 0, 0.1), inset -2px -2px 5px rgba(255, 255, 255, 0.7);
            --success-glow: #2ecc71;
            --error-glow: #e74c3c;
        }

        /* ==================================== */
        /* ASOSIY TUZILMA */
        /* ==================================== */

        body {
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-text);
            transition: all 0.5s ease;
            perspective: 2500px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 30px;
            background: var(--color-card);
            backdrop-filter: blur(var(--blur));
            border: 2px solid var(--color-primary);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), var(--shadow-neon);
            text-align: center;
            transform: rotateX(5deg) rotateY(-5deg) translateZ(100px);
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .container:hover {
            transform: rotateX(0deg) rotateY(0deg) translateZ(100px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), var(--shadow-neon);
        }

        h1 {
            color: var(--color-primary);
            font-size: 3em;
            font-weight: 700;
            text-shadow: 0 0 5px var(--color-primary);
            margin-bottom: 20px;
            transform: translateZ(20px);
        }

        /* ==================================== */
        /* STATUS VA KONTROLLAR GRIDI */
        /* ==================================== */
        .grid-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stats-grid {
            grid-column: 1 / 3;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: var(--color-card);
            padding: 10px;
            border-radius: 10px;
            flex-grow: 1;
            font-weight: 500;
            box-shadow: var(--shadow-inner);
            transform: translateZ(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #timer, #attemptsCount {
            font-weight: 700;
            color: var(--color-secondary);
            text-shadow: 0 0 5px var(--color-secondary);
        }

        /* Progress Bar (Qolgan foiz) */
        #progressBarContainer {
            grid-column: 1 / 3;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: var(--shadow-inner);
        }

        #progressBar {
            height: 100%;
            width: 100%; /* Boshlang'ich qiymat */
            background: linear-gradient(90deg, var(--color-secondary), var(--color-primary));
            transition: width 0.3s ease-out;
        }

        /* Input va Buttonlar */
        input[type="number"], button, select {
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            box-sizing: border-box;
            outline: none;
            transform: translateZ(10px);
            transition: all 0.2s ease;
        }

        input[type="number"], select {
            background: var(--color-card);
            color: var(--color-text);
            box-shadow: var(--shadow-inner);
            grid-column: 1 / 3;
        }
        
        #checkButton {
            cursor: pointer;
            color: var(--color-bg);
            font-weight: 700;
            background: var(--color-primary);
            box-shadow: var(--shadow-neon);
        }
        
        #hintButton {
            cursor: pointer;
            color: var(--color-bg);
            font-weight: 700;
            background: var(--color-secondary);
            box-shadow: 0 0 10px var(--color-secondary);
        }

        button:active {
            box-shadow: var(--shadow-inner);
            transform: translateZ(5px) translateY(3px);
        }

        /* Xabarlar (Neon effekt) */
        #message {
            grid-column: 1 / 3;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: 700;
            border-radius: 10px;
            transform: translateZ(10px);
            text-shadow: 0 0 5px;
            min-height: 20px;
        }

        .msg-hot { color: #ff0000; text-shadow: 0 0 10px #ff0000; }
        .msg-warm { color: #ffa500; text-shadow: 0 0 8px #ffa500; }
        .msg-cold { color: #00bfff; text-shadow: 0 0 8px #00bfff; }
        .msg-freeze { color: #8080ff; text-shadow: 0 0 5px #8080ff; }
        .msg-win { color: var(--success-glow); text-shadow: 0 0 15px var(--success-glow); animation: neon-win 1s infinite alternate; }
        .msg-lose { color: var(--error-glow); text-shadow: 0 0 15px var(--error-glow); animation: neon-shake 0.5s; }
        
        /* Sozlamalar */
        .settings-menu {
            grid-column: 1 / 3;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
        }

        .settings-menu select, .settings-menu button {
            width: 48%;
            margin: 0;
            padding: 10px;
            font-size: 0.9em;
        }

        #restartButton {
            grid-column: 1 / 3;
            background: linear-gradient(90deg, #ff007b, #ff00ff);
            box-shadow: 0 0 15px #ff00ff;
        }

        /* Mobil moslashuv */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                transform: none;
            }
            .grid-area {
                grid-template-columns: 1fr;
            }
            .stats-grid, input[type="number"], .settings-menu select, .settings-menu button {
                grid-column: 1 / 2;
            }
            .settings-menu button, .settings-menu select {
                width: 100%;
            }
        }

        /* Animatsiyalar */
        @keyframes neon-win {
            from { text-shadow: 0 0 5px var(--success-glow), 0 0 10px var(--success-glow); }
            to { text-shadow: 0 0 20px var(--success-glow), 0 0 30px var(--success-glow); }
        }
        @keyframes neon-shake {
            0%, 100% { transform: translateZ(10px) translateX(0); }
            20%, 60% { transform: translateZ(10px) translateX(-3px); }
            40%, 80% { transform: translateZ(10px) translateX(3px); }
        }
    </style>
</head>
<body id="body">
    <div class="container">
        <h1 id="title"></h1>
        <p id="instruction"></p>
        
        <div class="stats-grid">
            <div class="stat-box" id="attemptsBox">
                <span id="attemptsText"></span> <span id="attemptsCount"></span>
            </div>
            <div class="stat-box">
                <span id="timerText"></span> <span id="timer"></span>s
            </div>
            <div class="stat-box" id="rangeDisplay">Diapazon: 1 - 100</div>
        </div>
        
        <div id="progressBarContainer">
            <div id="progressBar"></div>
        </div>

        <div class="grid-area">
            <input type="number" id="guessInput" min="1" max="1000" autocomplete="off">
            <button id="checkButton" onclick="checkGuess()">Tekshirish</button>
            <button id="hintButton" onclick="showHint()" disabled style="display: none;"></button>
            <p id="message"></p>
            <button id="restartButton" onclick="startGame()" style="display: none;"></button>
        </div>

        <div class="settings-menu">
            <select id="levelSelect" onchange="setLevel(this.value)">
                <option value="easy">Oson (1-100, 10)</option>
                <option value="medium">O'rta (1-500, 8)</option>
                <option value="hard">Qiyin (1-1000, 7)</option>
            </select>
            <select id="languageSelect" onchange="setLanguage(this.value)">
                <option value="uzb">O'zbekcha</option>
                <option value="eng">English</option>
                <option value="rus">Русский</option>
                <option value="kor">한국어</option>
                <option value="chi">中文</option>
            </select>
            <button id="themeToggle" onclick="toggleTheme()"></button>
        </div>
    </div>

    <script>
        // ====================================
        // JAVASCRIPT O'YIN MANTIQI (SUPER MURAKKAB)
        // ====================================

        let targetNumber;
        let attempts;
        let maxAttempts;
        let minRange;
        let maxRange;
        let timeLeft;
        let timerInterval;
        let lastDifference = Infinity; 
        let currentLanguage = 'uzb';
        let currentLevel = 'easy';
        let hintUsed = false;

        // O'yin qiyinlik darajalari
        const levels = {
            easy: { min: 1, max: 100, attempts: 10, time: 90 },
            medium: { min: 1, max: 500, attempts: 8, time: 120 },
            hard: { min: 1, max: 1000, attempts: 7, time: 150 }
        };

        // Tarjimalar lug'ati
        const translations = {
            uzb: {
                title: "Super Raqamni Topish",
                instruction: (min, max, attempts, time) => `${min} dan ${max} gacha raqamni toping. ${attempts} urinish va ${time} soniya bor.`,
                placeholder: (min, max) => `Raqamni kiriting (${min}-${max})...`,
                check: "Tekshirish", restart: "Qayta Boshlash", attemptsText: "Urinish:", timerText: "Vaqt:", settingsTitle: "Sozlamalar",
                themeToggle: "Mavzu: Qorong'u", themeToggleLight: "Mavzu: Yorug'lik",
                invalidInput: (min, max) => `Iltimos, ${min} va ${max} oralig'idagi haqiqiy raqam kiriting.`,
                hintButton: "Yordam (Hint)", hintUsed: "Yordamdan foydalanildi.", hintMessage: (text) => `💡 Yordam: Raqam ${text}`,
                range: "Diapazon:",
                // Harorat xabarlari
                hot: "🔥🔥 Qaynoq! Juda yaqin!", warm: "🔥 Iliq. Yaqinlashmoqdasiz.", cold: "❄️ Sovuq. Uzoqlashdingiz.", freeze: "🥶 Muzlagan. Juda uzoqda!",
                closer: "Yaxshi! Yaqinroq keldingiz.", further: "Afsus! Uzoqlashdingiz.",
                win: "G'ALABA! 🎉 Raqam: ", lose: "Vaqt/Urinish tugadi. 😔 Raqam: ",
                hintEven: "juft raqam.", hintOdd: "toq raqam.", hintUpper: `50% dan yuqori (${Math.ceil(maxRange / 2)} dan katta).`, hintLower: `50% dan past (${Math.ceil(maxRange / 2)} dan kichik).`,
            },
            // Ingliz tili
            eng: {
                title: "Super Guessing Game", instruction: (min, max, attempts, time) => `Guess the number between ${min} and ${max}. You have ${attempts} attempts and ${time} seconds.`,
                placeholder: (min, max) => `Enter number (${min}-${max})...`, check: "Check", restart: "Restart Game", attemptsText: "Attempts:", timerText: "Time:", settingsTitle: "Settings",
                themeToggle: "Theme: Dark", themeToggleLight: "Theme: Light",
                invalidInput: (min, max) => `Please enter a valid number between ${min} and ${max}.`,
                hintButton: "Get Hint", hintUsed: "Hint already used.", hintMessage: (text) => `💡 Hint: The number is ${text}`,
                range: "Range:",
                hot: "🔥🔥 Hot! Extremely close!", warm: "🔥 Warm. Getting closer.", cold: "❄️ Cold. Getting further.", freeze: "🥶 Freezing. Very far!",
                closer: "Closer!", further: "Further away!",
                win: "VICTORY! 🎉 The number was: ", lose: "Time/Attempts up. 😔 The number was: ",
                hintEven: "even.", hintOdd: "odd.", hintUpper: `in the upper 50% (Greater than ${Math.ceil(maxRange / 2)}).`, hintLower: `in the lower 50% (Less than ${Math.ceil(maxRange / 2)}).`,
            },
            // Rus tili
            rus: {
                title: "Супер Угадай Число", instruction: (min, max, attempts, time) => `Угадайте число от ${min} до ${max}. У вас ${attempts} попыток и ${time} секунд.`,
                placeholder: (min, max) => `Введите число (${min}-${max})...`, check: "Проверить", restart: "Начать Снова", attemptsText: "Попыток:", timerText: "Время:", settingsTitle: "Настройки",
                themeToggle: "Тема: Темная", themeToggleLight: "Тема: Светлая",
                invalidInput: (min, max) => `Пожалуйста, введите число от ${min} до ${max}.`,
                hintButton: "Подсказка", hintUsed: "Подсказка уже использована.", hintMessage: (text) => `💡 Подсказка: Число ${text}`,
                range: "Диапазон:",
                hot: "🔥🔥 Горячо! Очень близко!", warm: "🔥 Тепло. Ближе.", cold: "❄️ Холодно. Дальше.", freeze: "🥶 Замерзает. Очень далеко!",
                closer: "Ближе!", further: "Дальше!",
                win: "ПОБЕДА! 🎉 Число: ", lose: "Время/Попытки вышли. 😔 Число: ",
                hintEven: "четное.", hintOdd: "нечетное.", hintUpper: `в верхней половине (Больше ${Math.ceil(maxRange / 2)}).`, hintLower: `в нижней половине (Меньше ${Math.ceil(maxRange / 2)}).`,
            },
            // Koreys tili
            kor: {
                title: "슈퍼 숫자 맞추기", instruction: (min, max, attempts, time) => `${min}에서 ${max} 사이의 숫자를 맞춰보세요. ${attempts}번의 시도와 ${time}초가 있습니다.`,
                placeholder: (min, max) => `숫자를 입력하세요 (${min}-${max})...`, check: "확인", restart: "다시 시작", attemptsText: "시도:", timerText: "시간:", settingsTitle: "설정",
                themeToggle: "테마: 어둡게", themeToggleLight: "테마: 밝게",
                invalidInput: (min, max) => `${min}와 ${max} 사이의 유효한 숫자를 입력하십시오.`,
                hintButton: "힌트 얻기", hintUsed: "힌트를 이미 사용했습니다.", hintMessage: (text) => `💡 힌트: 숫자는 ${text}`,
                range: "범위:",
                hot: "🔥🔥 뜨거움! 매우 가까움!", warm: "🔥 따뜻함. 가까워지고 있음.", cold: "❄️ 차가움. 멀어지고 있음.", freeze: "🥶 꽁꽁. 아주 멀리!",
                closer: "더 가까이!", further: "더 멀리!",
                win: "승리! 🎉 정답: ", lose: "시간/시도 초과. 😔 정답: ",
                hintEven: "짝수입니다.", hintOdd: "홀수입니다.", hintUpper: `상위 50%입니다. (${Math.ceil(maxRange / 2)}보다 큼).`, hintLower: `하위 50%입니다. (${Math.ceil(maxRange / 2)}보다 작음).`,
            },
            // Xitoy tili
            chi: {
                title: "超级猜数字游戏", instruction: (min, max, attempts, time) => `猜一个 ${min} 到 ${max} 之间的数字。您有 ${attempts} 次机会和 ${time} 秒。`,
                placeholder: (min, max) => `输入数字 (${min}-${max})...`, check: "检查", restart: "重新开始", attemptsText: "次数:", timerText: "时间:", settingsTitle: "设置",
                themeToggle: "主题: 深色", themeToggleLight: "主题: 浅色",
                invalidInput: (min, max) => `请输入一个 ${min} 到 ${max} 之间的有效数字。`,
                hintButton: "获取提示", hintUsed: "提示已使用。", hintMessage: (text) => `💡 提示: 该数字是 ${text}`,
                range: "范围:",
                hot: "🔥🔥 烫！非常接近！", warm: "🔥 温热。正在靠近。", cold: "❄️ 冷。正在远离。", freeze: "🥶 冰冷。非常远！",
                closer: "更近了！", further: "更远了！",
                win: "胜利！ 🎉 数字是: ", lose: "时间/次数用完。 😔 数字是: ",
                hintEven: "偶数。", hintOdd: "奇数。", hintUpper: `上半部分 (大于 ${Math.ceil(maxRange / 2)}).`, hintLower: `下半部分 (小于 ${Math.ceil(maxRange / 2)}).`,
            }
        };

        const elements = {
            title: document.getElementById('title'), instruction: document.getElementById('instruction'),
            guessInput: document.getElementById('guessInput'), checkButton: document.getElementById('checkButton'),
            attemptsCount: document.getElementById('attemptsCount'), attemptsText: document.getElementById('attemptsText'),
            timer: document.getElementById('timer'), timerText: document.getElementById('timerText'),
            messageDisplay: document.getElementById('message'), restartButton: document.getElementById('restartButton'),
            themeToggle: document.getElementById('themeToggle'), body: document.getElementById('body'),
            levelSelect: document.getElementById('levelSelect'), rangeDisplay: document.getElementById('rangeDisplay'),
            progressBar: document.getElementById('progressBar'), hintButton: document.getElementById('hintButton')
        };


        // ================== SOZLAMALAR FUNKSIYALARI ==================

        function setLevel(level) {
            currentLevel = level;
            const config = levels[level];
            minRange = config.min;
            maxRange = config.max;
            maxAttempts = config.attempts;
            timeLeft = config.time;
            
            // HTML atributlarni yangilash
            elements.guessInput.min = minRange;
            elements.guessInput.max = maxRange;

            // Tarjimalar lug'atidagi maxRange o'zgaruvchisini dinamik yangilash
            translations.uzb.hintUpper = `50% dan yuqori (${Math.ceil(maxRange / 2)} dan katta).`;
            translations.uzb.hintLower = `50% dan past (${Math.ceil(maxRange / 2)} dan kichik).`;
            
            startGame();
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            const t = translations[lang];

            elements.title.textContent = t.title;
            elements.checkButton.textContent = t.check;
            elements.restartButton.textContent = t.restart;
            elements.attemptsText.textContent = t.attemptsText;
            elements.timerText.textContent = t.timerText;
            elements.hintButton.textContent = t.hintButton;
            
            // Dinamik matnlarni yangilash
            elements.instruction.textContent = t.instruction(minRange, maxRange, maxAttempts, levels[currentLevel].time);
            elements.guessInput.placeholder = t.placeholder(minRange, maxRange);
            elements.rangeDisplay.textContent = `${t.range} ${minRange} - ${maxRange}`;
            
            // Mavzu tugmasi matnini yangilash
            elements.themeToggle.textContent = elements.body.classList.contains('light-theme') ? t.themeToggleLight : t.themeToggle;

            updateDisplay();
        }

        function toggleTheme() {
            elements.body.classList.toggle('light-theme');
            const t = translations[currentLanguage];
            elements.themeToggle.textContent = elements.body.classList.contains('light-theme') ? t.themeToggleLight : t.themeToggle;
        }

        // ================== O'YIN MANTIQI ==================

        function startGame() {
            // Level sozlamalarini o'rnatish
            const config = levels[currentLevel];
            minRange = config.min;
            maxRange = config.max;
            maxAttempts = config.attempts;
            timeLeft = config.time;
            
            targetNumber = Math.floor(Math.random() * (maxRange - minRange + 1)) + minRange;
            attempts = 0;
            lastDifference = Infinity; 
            hintUsed = false;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            // Element holatini tiklash
            elements.guessInput.value = '';
            elements.guessInput.disabled = false;
            elements.checkButton.style.display = 'block';
            elements.hintButton.style.display = 'block'; // Hint tugmasini ko'rsatish
            elements.hintButton.disabled = false; // Hintni qayta yoqish
            elements.restartButton.style.display = 'none';
            elements.messageDisplay.innerHTML = '';
            elements.messageDisplay.className = '';
            elements.guessInput.focus();

            setLanguage(currentLanguage); // Barcha matnlarni yangilash
            updateDisplay();
        }
        
        // Taymerni yangilash
        function updateTimer() {
            elements.timer.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame(false);
            } else {
                timeLeft--;
            }
        }

        // Displey va progress barni yangilash
        function updateDisplay() {
            const attemptsLeft = maxAttempts - attempts;
            elements.attemptsCount.textContent = `${attempts} / ${maxAttempts}`;
            
            // Progress barni yangilash (Qolgan urinishlar foizi)
            const progressPercent = (attemptsLeft / maxAttempts) * 100;
            elements.progressBar.style.width = `${progressPercent}%`;
            
            // Hint tugmasini 50% urinishdan keyin yoqish
            if (attempts >= Math.floor(maxAttempts / 2) && !hintUsed) {
                elements.hintButton.disabled = false;
            } else {
                elements.hintButton.disabled = true;
            }
        }
        
        // Yordamchi Funksiya (Hint)
        function showHint() {
            if (hintUsed || attempts < Math.floor(maxAttempts / 2)) return;

            const t = translations[currentLanguage];
            let hintText = '';
            
            // 50% dan yuqori yoki pastligini aniqlash
            if (targetNumber > maxRange / 2) {
                hintText = t.hintUpper;
            } else {
                hintText = t.hintLower;
            }

            // Juft/toqligini ham qo'shish (birinchi shart bajarilgandan keyin)
            if (targetNumber % 2 === 0) {
                hintText += ` va ${t.hintEven}`;
            } else {
                hintText += ` va ${t.hintOdd}`;
            }

            elements.messageDisplay.innerHTML = t.hintMessage(hintText);
            elements.messageDisplay.className = 'msg-cold';
            
            hintUsed = true;
            elements.hintButton.disabled = true;
            elements.hintButton.textContent = t.hintUsed;
        }

        // Haroratni hisoblash
        function getTemperatureMessage(currentGuess, t) {
            const currentDifference = Math.abs(currentGuess - targetNumber);
            const rangeScale = maxRange / 5; // Diapazonni 5 qismga bo'lish
            let message = '';
            let className = '';

            // Haroratni baholash (Murakkabroq shartlar)
            if (currentDifference === 0) {
                return { message: t.win, className: 'msg-win' }; 
            } else if (currentDifference <= rangeScale * 0.03) { // 3% ichida
                message = t.hot; className = 'msg-hot';
            } else if (currentDifference <= rangeScale * 0.1) { // 10% ichida
                message = t.warm; className = 'msg-warm';
            } else if (currentDifference <= rangeScale * 0.3) { // 30% ichida
                message = t.cold; className = 'msg-cold';
            } else {
                message = t.freeze; className = 'msg-freeze';
            }

            // Yaqinlashish/Uzoqlashishni qo'shish
            if (attempts > 1) {
                if (currentDifference < lastDifference) {
                    message += ` (${t.closer})`;
                } else if (currentDifference > lastDifference) {
                    message += ` (${t.further})`;
                }
            }
            
            lastDifference = currentDifference;
            return { message, className };
        }

        // Taxminni tekshirish
        function checkGuess() {
            if (elements.guessInput.disabled) return;

            const rawGuess = elements.guessInput.value.trim();
            const guess = parseInt(rawGuess);
            const t = translations[currentLanguage];

            if (rawGuess === '' || isNaN(guess) || guess < minRange || guess > maxRange) {
                elements.messageDisplay.textContent = t.invalidInput(minRange, maxRange);
                elements.messageDisplay.className = 'msg-lose';
                return;
            }

            attempts++;
            updateDisplay();
            
            elements.guessInput.value = '';
            elements.guessInput.focus();

            if (guess === targetNumber) {
                endGame(true);
            } else if (attempts >= maxAttempts) {
                endGame(false);
            } else {
                const temp = getTemperatureMessage(guess, t);
                elements.messageDisplay.innerHTML = temp.message;
                elements.messageDisplay.className = temp.className;
            }
        }

        // O'yinni yakunlash
        function endGame(isWin) {
            clearInterval(timerInterval);
            const t = translations[currentLanguage];

            elements.guessInput.disabled = true;
            elements.checkButton.style.display = 'none';
            elements.hintButton.style.display = 'none';
            elements.restartButton.style.display = 'block';

            if (isWin) {
                elements.messageDisplay.innerHTML = t.win + `**${targetNumber}**`;
                elements.messageDisplay.className = 'msg-win';
            } else {
                elements.messageDisplay.innerHTML = t.lose + `**${targetNumber}**`;
                elements.messageDisplay.className = 'msg-lose';
            }
        }
        
        // ENTER tugmasi bilan ishlash
        elements.guessInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !elements.guessInput.disabled) {
                checkGuess();
            }
        });

        // O'yinni yuklashda boshlash
        window.onload = () => {
            // Boshlang'ich qiyinlik darajasini yuklash
            setLevel(elements.levelSelect.value); 
            // setLevel funksiyasi ichida startGame va setLanguage chaqiriladi
        };
    </script>
</body>
</html>
