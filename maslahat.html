<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maslahatlar 3.0 — 1500+ Animatsiyali Maslahat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050315;
      --neon-blue: #00f3ff;
      --neon-purple: #b967ff;
      --neon-pink: #ff2a6d;
      --neon-green: #00ff9d;
      --neon-yellow: #ffd166;
      --neon-cyan: #00ffff;
      --text: #ffffff;
      --card-bg: rgba(8, 6, 25, 0.8);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* === YULDUZLI FON === */
    #stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* === NEON TARMOP FON === */
    #network {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.15;
    }

    /* === LOADING === */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 1s ease;
    }

    .galaxy-spinner {
      position: relative;
      width: 100px;
      height: 100px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: rotate 4s linear infinite;
    }

    .ring:nth-child(1) { width: 100%; height: 100%; border-color: var(--neon-blue); animation-duration: 6s; }
    .ring:nth-child(2) { width: 80%; height: 80%; top: 10%; left: 10%; border-color: var(--neon-purple); animation-duration: 8s; animation-direction: reverse; }
    .ring:nth-child(3) { width: 60%; height: 60%; top: 20%; left: 20%; border-color: var(--neon-pink); animation-duration: 10s; }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      margin-top: 2rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* === HEADER === */
    header {
      padding: 2rem 1.5rem 1.2rem;
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 4.4rem;
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1.2rem;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
      animation: glowTitle 4s infinite alternate;
    }

    @keyframes glowTitle {
      from { text-shadow: 0 0 10px rgba(0, 243, 255, 0.8); }
      to { text-shadow: 0 0 25px rgba(185, 103, 255, 1), 0 0 40px rgba(0, 243, 255, 0.9); }
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.7rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }

    .nav-btn, .lang-btn {
      background: var(--card-bg);
      border: 2px solid var(--neon-green);
      color: white;
      padding: 0.55rem 1.1rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
      backdrop-filter: blur(8px);
      font-size: 0.9rem;
    }

    .nav-btn:hover, .lang-btn:hover {
      background: rgba(0, 255, 157, 0.25);
      box-shadow: 0 0 20px var(--neon-green);
      transform: translateY(-4px) scale(1.04);
    }

    .lang-btn.active {
      background: var(--neon-yellow);
      color: #000;
      border-color: var(--neon-yellow);
    }

    #search {
      padding: 0.7rem 1.4rem;
      width: 90%;
      max-width: 420px;
      background: rgba(6, 4, 20, 0.85);
      border: 2px solid var(--neon-blue);
      border-radius: 50px;
      color: white;
      font-size: 1rem;
      outline: none;
      margin: 1rem auto;
      display: block;
      transition: all 0.3s;
    }

    #search:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 42, 109, 0.6);
    }

    /* === GRID === */
    #content {
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.7rem;
    }

    .advice-card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 1.8rem 1.5rem;
      border: 1px solid rgba(185, 103, 255, 0.25);
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(50px) rotateX(40deg) scale(0.9);
      transition: all 0.7s cubic-bezier(0.165, 0.84, 0.44, 1.2);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .advice-card::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-cyan));
      z-index: -1;
      border-radius: 24px;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .advice-card:hover::before {
      opacity: 1;
    }

    .advice-card.visible {
      opacity: 1;
      transform: translateY(0) rotateX(0) scale(1);
    }

    .advice-card.expanded {
      z-index: 10;
      transform: scale(1.05) !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px var(--neon-blue);
    }

    .advice-card h3 {
      color: var(--neon-yellow);
      margin-bottom: 1rem;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .advice-card p {
      line-height: 1.68;
      font-size: 1.03rem;
      opacity: 0.95;
      transition: opacity 0.3s;
    }

    .advice-card.expanded p {
      opacity: 1;
      font-weight: 500;
    }

    /* === FOOTER === */
    footer {
      text-align: center;
      padding: 2.2rem 1.5rem;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.95rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      h1 { font-size: 3rem; }
      .controls { gap: 0.4rem; }
      .nav-btn, .lang-btn { padding: 0.45rem 0.9rem; font-size: 0.8rem; }
      #content { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 2.3rem; }
      .loader-text { font-size: 1.7rem; }
      .advice-card { padding: 1.4rem 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- YULDUZLAR -->
  <div id="stars"></div>

  <!-- NEON TARMOP -->
  <svg id="network" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="gradNet" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:var(--neon-blue);stop-opacity:0.6" />
        <stop offset="100%" style="stop-color:var(--neon-purple);stop-opacity:0.3" />
      </linearGradient>
    </defs>
    <g id="network-lines"></g>
  </svg>

  <!-- LOADING -->
  <div id="loading">
    <div class="galaxy-spinner">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
    <div class="loader-text">1500+ maslahat yuklanmoqda...</div>
  </div>

  <!-- HEADER -->
  <header>
    <h1>MASLAHATLAR 3.0</h1>
    
    <div class="controls">
      <button class="lang-btn active" data-lang="uz">🇺🇿 UZ</button>
      <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
    </div>

    <div class="controls">
      <button class="nav-btn" data-cat="all">Barchasi</button>
      <button class="nav-btn" data-cat="life">Hayot</button>
      <button class="nav-btn" data-cat="career">Karyera</button>
      <button class="nav-btn" data-cat="health">Sog'liq</button>
      <button class="nav-btn" data-cat="tech">Texnologiya</button>
      <button class="nav-btn" data-cat="mind">Aql</button>
      <button class="nav-btn" data-cat="finance">Moliya</button>
      <button class="nav-btn" data-cat="edu">Ta'lim</button>
      <button class="nav-btn" data-cat="relations">Munosabatlar</button>
      <button class="nav-btn" data-cat="growth">Shaxsiy o'sish</button>
      <button class="nav-btn" data-cat="creativity">Ijodkorlik</button>
      <button class="nav-btn" data-cat="leadership">Rahbarlik</button>
      <button class="nav-btn" data-cat="time">Vaqt</button>
      <button class="nav-btn" data-cat="happiness">Baxt</button>
      <button class="nav-btn" data-cat="resilience">Chidamlilik</button>
    </div>

    <input type="text" id="search" placeholder="Maslahat qidirish..." />
  </header>

  <!-- CONTENT -->
  <div id="content"></div>

  <footer>
    © 2025 Maslahatlar 3.0 — 1500+ animatsiyali, hayotiy maslahat. Hayotingizni yorqinroq qiling.
  </footer>

  <script>
    // === YULDUZLARNI YARATISH ===
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 250; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.width = `${Math.random() * 3 + 1}px`;
      star.style.height = star.style.width;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.setProperty('--duration', `${Math.random() * 5 + 3}s`);
      star.style.animationDelay = `${Math.random() * 5}s`;
      starsContainer.appendChild(star);
    }

    // === NEON TARMOP ===
    const netLines = document.getElementById('network-lines');
    const width = 1000, height = 600;
    const nodes = [];
    const numNodes = 40;

    for (let i = 0; i < numNodes; i++) {
      nodes.push({
        x: Math.random() * width,
        y: Math.random() * height
      });
    }

    for (let i = 0; i < numNodes; i++) {
      for (let j = i + 1; j < numNodes; j++) {
        const dx = nodes[i].x - nodes[j].x;
        const dy = nodes[i].y - nodes[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 180) {
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", nodes[i].x);
          line.setAttribute("y1", nodes[i].y);
          line.setAttribute("x2", nodes[j].x);
          line.setAttribute("y2", nodes[j].y);
          line.setAttribute("stroke", "url(#gradNet)");
          line.setAttribute("stroke-width", "0.7");
          netLines.appendChild(line);
        }
      }
    }

    // === 1500 MASLAHAT GENERATORI ===
    const generate1500Advice = (lang) => {
      const categories = ['life','career','health','tech','mind','finance','edu','relations','growth','creativity','leadership','time','happiness','resilience'];
      const data = {};
      
      const verbs = lang === 'uz' 
        ? ["Bajaring", "O'rganing", "Sinxron qiling", "Tahlil qiling", "Rivojlantiring", "Qo'llang", "Baholang", "Tartibga soling", "Tadbirkorlik qiling", "Tasavvur qiling"]
        : ["Do", "Learn", "Sync", "Analyze", "Develop", "Apply", "Evaluate", "Organize", "Innovate", "Imagine"];
      
      const nouns = lang === 'uz'
        ? ["vaqt", "energiya", "ma'lumot", "tajriba", "aloqa", "bilim", "resurs", "imkoniyat", "fikr", "harakat"]
        : ["time", "energy", "data", "experience", "connection", "knowledge", "resource", "opportunity", "thought", "action"];
      
      const outcomes = lang === 'uz'
        ? ["— bu hayotingizni o'zgartiradi.", "— doim esda tuting.", "— sizga yordam beradi.", "— kelajakka investitsiya qilishdir.", "— sizni boshqalardan ajratib turadi."]
        : ["— transforms your life.", "— always remember this.", "— helps you grow.", "— is an investment in your future.", "— sets you apart."];

      categories.forEach(cat => {
        data[cat] = [];
        for (let i = 0; i < 100; i++) {
          const v = verbs[Math.floor(Math.random() * verbs.length)];
          const n = nouns[Math.floor(Math.random() * nouns.length)];
          const o = outcomes[Math.floor(Math.random() * outcomes.length)];
          data[cat].push(`${v} ${n} ${o}`);
        }
      });
      return data;
    };

    // === STATE ===
    let currentLang = 'uz';
    let currentCategory = 'all';
    let allAdvice = generate1500Advice(currentLang);
    let displayedCount = 0;
    const batchSize = 25;

    // === DOM ===
    const content = document.getElementById('content');
    const searchInput = document.getElementById('search');

    // === RENDER ===
    function renderBatch() {
      const frag = document.createDocumentFragment();
      let items = [];

      if (currentCategory === 'all') {
        Object.keys(allAdvice).forEach(cat => {
          allAdvice[cat].forEach(text => items.push({ cat, text }));
        });
      } else {
        allAdvice[currentCategory].forEach(text => items.push({ cat: currentCategory, text }));
      }

      const term = searchInput.value.toLowerCase();
      if (term) {
        items = items.filter(item => item.text.toLowerCase().includes(term));
      }

      const start = displayedCount;
      const end = Math.min(start + batchSize, items.length);
      const batch = items.slice(start, end);

      batch.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'advice-card';
        card.innerHTML = `<h3>${getCategoryName(item.cat)}</h3><p>${item.text}</p>`;
        card.style.transitionDelay = `${(start + idx) * 0.025}s`;
        
        card.addEventListener('click', () => {
          card.classList.toggle('expanded');
        });
        
        frag.appendChild(card);
      });

      content.appendChild(frag);
      displayedCount = end;

      setTimeout(() => {
        const newCards = document.querySelectorAll('.advice-card:not(.visible)');
        newCards.forEach(card => card.classList.add('visible'));
      }, 100);
    }

    function getCategoryName(cat) {
      const names = {
        uz: {
          life: "💫 Hayot",
          career: "💼 Karyera",
          health: "❤️ Sog'liq",
          tech: "🖥️ Texnologiya",
          mind: "🧠 Aql",
          finance: "💰 Moliya",
          edu: "🎓 Ta'lim",
          relations: "🤝 Munosabatlar",
          growth: "🚀 Shaxsiy o'sish",
          creativity: "🎨 Ijodkorlik",
          leadership: "👑 Rahbarlik",
          time: "⏳ Vaqt",
          happiness: "😊 Baxt",
          resilience: "🛡️ Chidamlilik"
        },
        en: {
          life: "💫 Life",
          career: "💼 Career",
          health: "❤️ Health",
          tech: "🖥️ Technology",
          mind: "🧠 Mind",
          finance: "💰 Finance",
          edu: "🎓 Education",
          relations: "🤝 Relationships",
          growth: "🚀 Personal Growth",
          creativity: "🎨 Creativity",
          leadership: "👑 Leadership",
          time: "⏳ Time",
          happiness: "😊 Happiness",
          resilience: "🛡️ Resilience"
        }
      };
      return names[currentLang][cat] || cat;
    }

    // === TIL ===
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLang = btn.dataset.lang;
        currentCategory = 'all';
        allAdvice = generate1500Advice(currentLang);
        displayedCount = 0;
        content.innerHTML = '';
        renderBatch();
      });
    });

    // === KATEGORIYA ===
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCategory = btn.dataset.cat;
        displayedCount = 0;
        content.innerHTML = '';
        renderBatch();
      });
    });

    // === QIDIRUV ===
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        displayedCount = 0;
        content.innerHTML = '';
        renderBatch();
      }, 300);
    });

    // === INFINITE SCROLL ===
    let isFetching = false;
    window.addEventListener('scroll', () => {
      if (isFetching) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1200) {
        if (displayedCount < getTotalCount()) {
          isFetching = true;
          setTimeout(() => {
            renderBatch();
            isFetching = false;
          }, 300);
        }
      }
    });

    function getTotalCount() {
      if (currentCategory === 'all') {
        return Object.values(allAdvice).reduce((sum, arr) => sum + arr.length, 0);
      }
      return allAdvice[currentCategory]?.length || 0;
    }

    // === LOADING ===
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('loading').remove();
          renderBatch();
        }, 1000);
      }, 3000);
    });
  </script>
</body>
</html>
