<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Русский язык AI Bot — 7 класс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #0f2027, #203a43, #2c5364);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish ekran (Splash Screen) */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0c1427;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #00f7ff;
            text-align: center;
            padding: 20px;
            animation: fadeOut 2.5s forwards 3.5s;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%2300f7ff"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
            color: #00f7ff;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
            color: #a0e0ff;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(10, 15, 30, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 247, 255, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #00f7ff;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 247, 255, 0.3);
            text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #0077b6, #0096c7);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: linear-gradient(135deg, #00b4d8, #00f7ff);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: none;
            color: #00f7ff;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar uchun scroll qilinadigan panel */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(0, 247, 255, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #00f7ff transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #00f7ff;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(0, 50, 80, 0.4);
            color: #00f7ff;
            border: 1px solid rgba(0, 247, 255, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(0, 180, 255, 0.3);
            border-color: #00f7ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 247, 255, 0.2);
        }

        .ai-agent {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="18" fill="%2300f7ff"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: floatSmall 4s ease-in-out infinite;
        }

        @keyframes floatSmall {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .splash-text {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

            "Что такое местоимение?": "Местоимение — это часть речи, которая указывает на предмет, признак или количество, но не называет их. Например: я, ты, он, она, это, мой, такой.",
            "Какие виды местоимений есть?": "Есть личные (я, ты), притяжательные (мой, твой), вопросительные (кто, что), относительные (кто, что), отрицательные (никто, ничто), неопределённые (некто, нечто), указательные (этот, тот), определительные (весь, каждый).",
            "Что такое числительное?": "Числительное — это часть речи, которая обозначает количество или порядок предметов. Например: один, два, пятый.",
            "Как различать количественные и порядковые числительные?": "Количественные — сколько? (один, два, пять), порядковые — какой по счёту? (первый, второй, пятый).",
            "Что такое наречие?": "Наречие — это часть речи, которая обозначает признак действия или признак признака и отвечает на вопросы как? где? когда? почему? зачем?",
            "Какие наречия бывают по значению?": "Наречия бывают: места (здесь), времени (сегодня), образа действия (быстро), причины (потому), цели (чтобы).",
            "Что такое предлог?": "Предлог — это служебная часть речи, которая выражает отношения между словами. Например: в, на, с, под, над.",
            "Какие предлоги бывают?": "Предлоги бывают производные (вследствие, вблизи) и непроизводные (в, на, с).",
            "Что такое союз?": "Союз — это служебная часть речи, которая соединяет слова, части предложения или предложения. Например: и, а, но, потому что.",
            "Какие союзы бывают?": "Союзы бывают: простые (и, а, но) и сложные (потому что, чтобы, так как). Они бывают соединительные, противительные, разделительные, причинно-следственные.",
            "Что такое частица?": "Частица — это служебная часть речи, которая служит для образования форм слов или для усиления смысла. Например: не, бы, ли, же.",
            "Какие частицы бывают?": "Частицы бывают: формообразующие (бы, ли), смысловые (же, только, даже, вовсе).",
            "Что такое междометие?": "Междометие — это часть речи, которая выражает чувства и эмоции, но не называет их. Например: ах, ох, ух, эй.",
            "Как определить падеж существительного?": "Падеж существительного определяется по вопросу и окончанию. Например: И.п. — кто? что? (стол), Р.п. — кого? чего? (стола).",
            "Какие падежи есть в русском языке?": "В русском языке 6 падежей: именительный, родительный, дательный, винительный, творительный, предложный.",
            "Что такое склонение?": "Склонение — это изменение существительных, прилагательных, местоимений по падежам и числам.",
            "Как определить склонение существительного?": "Склонение определяется по окончанию в именительном падеже единственного числа: 1-е склонение — -а, -я; 2-е — -о, -е, -ь; 3-е — -ь (с нулевым окончанием).",
            "Какие окончания у существительных 1-го склонения?": "1-е склонение: -а, -я. Например: книга — книги, книги, книге, книгу, книгой, о книге.",
            "Какие окончания у существительных 2-го склонения?": "2-е склонение: -о, -е, -ь. Например: стол — стола, столу, стол, столом, о столе.",
            "Какие окончания у существительных 3-го склонения?": "3-е склонение: -ь. Например: мать — матери, матери, мать, матерью, о матери.",
            "Какие окончания у прилагательных в именительном падеже?": "И.п. — -ый, -ий, -ой, -ая, -яя, -ое, -ее. Например: красивый, красивая, красивое.",
            "Какие окончания у прилагательных в родительном падеже?": "Р.п. — -ого, -его, -ой, -ей. Например: красивого, красивой.",
            "Какие окончания у глаголов 1-го спряжения?": "1-е спряжение: -ю/-у, -ешь, -ет, -ем, -ете, -ют. Например: работаю, работаешь, работает.",
            "Какие окончания у глаголов 2-го спряжения?": "2-е спряжение: -ю/-у, -ишь, -ит, -им, -ите, -ат. Например: читаю, читаешь, читает.",
            "Что такое безударные гласные в корне?": "Безударные гласные в корне — это гласные, которые не произносятся ясно и требуют проверки. Например: в слове 'лесной' — 'е' проверяется словом 'лес'.",
            "Как проверить безударные гласные в корне?": "Безударные гласные в корне проверяются подбором однокоренного слова, где этот гласный стоит под ударением. Например: лес — лесной, море — морской.",
            "Что такое чередующиеся гласные в корне?": "Чередующиеся гласные — это гласные, которые в разных формах слова меняются по определённому правилу. Например: пис- — пис- — пис- (писать — пишет — письмо).",
            "Какие слова имеют чередование в корне?": "Слова с чередованием: гар- — гор- (загар — загореть), клон- — клан- (клонить — кланяться), мак- — мок- (макать — мокнуть).",
            "Что такое приставка?": "Приставка — это часть слова, которая стоит перед корнем и служит для образования новых слов. Например: в- (входить), за- (записать).",
            "Что такое суффикс?": "Суффикс — это часть слова, которая стоит после корня и служит для образования новых слов или для изменения их значения. Например: -ник (ученик), -ость (красота).",
            "Какие суффиксы есть у существительных?": "Суффиксы существительных: -ник, -щик, -ость, -тель, -ин, -ан, -ар. Например: ученик, писатель, красота.",
            "Какие суффиксы есть у прилагательных?": "Суффиксы прилагательных: -ый, -ий, -ой, -н-, -ов-, -ск-, -ев-. Например: красивый, деревянный, русский.",
            "Какие суффиксы есть у глаголов?": "Суффиксы глаголов: -ыва-, -ива-, -а-, -е-, -ть, -ти. Например: учить — учиться, писать — написать.",
            "Что такое окончание?": "Окончание — это изменяемая часть слова, которая служит для связи слов в предложении и выражения грамматических значений.",
            "Что такое основа слова?": "Основа слова — это часть слова без окончания. Например: в слове 'книга' основа — 'книг-'.",
            "Как определить корень слова?": "Корень слова — это общая часть однокоренных слов. Например: в словах 'читать', 'читатель', 'перечитать' — корень 'чит-'.",
            "Что такое однокоренные слова?": "Однокоренные слова — это слова, имеющие одинаковый корень и общее лексическое значение. Например: река, речной, речка.",
            "Что такое омонимы?": "Омонимы — это слова, одинаковые по звучанию и написанию, но разные по значению. Например: 'ключ' (от замка) и 'ключ' (воды).",
            "Что такое синонимы?": "Синонимы — это слова, одинаковые или близкие по значению. Например: 'красивый' — 'прекрасный'.",
            "Что такое антонимы?": "Антонимы — это слова, противоположные по значению. Например: 'хороший' — 'плохой'.",
            "Что такое фразеологизмы?": "Фразеологизмы — это устойчивые выражения, значение которых нельзя понять по отдельным словам. Например: 'бить баклуши' — бездельничать.",
            "Что такое стили речи?": "Стили речи — это способы использования языка в зависимости от цели общения: научный, публицистический, художественный, разговорный, официально-деловой.",
            "Что такое текст?": "Текст — это связная речь, состоящая из нескольких предложений, объединённых общей темой и основной мыслью.",
            "Что такое тема текста?": "Тема текста — это то, о чём говорится в тексте. Например: тема текста — 'весна'.",
            "Что такое основная мысль текста?": "Основная мысль текста — это главное, что хочет сказать автор. Например: 'Весна — время обновления жизни'.",
            "Что такое план текста?": "План текста — это краткое изложение содержания текста по частям. Он помогает понять структуру текста.",
            "Что такое связь между предложениями?": "Связь между предложениями — это логическая и грамматическая зависимость между ними, выраженная через союзы, повторы, местоимения, однородные члены.",
            "Что такое лексическое значение слова?": "Лексическое значение слова — это то, что оно обозначает в словаре. Например: 'дом' — жилое здание.",
            "Что такое прямое и переносное значение слова?": "Прямое значение — буквальное (солнце светит), переносное — образное (солнце улыбается).",
            "Что такое многозначные слова?": "Многозначные слова — это слова, имеющие несколько значений. Например: 'ключ' — от замка, источник воды, инструмент.",

            // Практика
            "Как правильно писать 'не' с существительными?": "'Не' с существительными пишется раздельно, если есть противопоставление или зависимое слово: не друг, а враг; не друг, а враг. Без противопоставления — слитно: ненастье.",
            "Как правильно писать 'не' с прилагательными?": "'Не' с прилагательными пишется раздельно, если есть противопоставление или зависимое слово: не красивый, а уродливый. Без противопоставления — слитно: неправильный.",
            "Как правильно писать 'не' с глаголами?": "'Не' с глаголами всегда пишется раздельно: не иду, не читаю. Исключение: глаголы, употребляемые только с 'не' — невзлюбить, ненавидеть.",
            "Как правильно писать 'ни'?": "'Ни' пишется с отрицательными местоимениями и наречиями: ни один, никуда, ни за что. Это усиление отрицания.",
            "Как пишется 'ь' после шипящих?": "'Ь' пишется после шипящих в существительных женского рода (ночь, мышь), в глаголах 2-го лица (читаешь, пишешь), в наречиях (настежь, вскачь).",
            "Как пишется 'ъ' после приставок?": "'Ъ' пишется после приставок, оканчивающихся на согласный, перед буквами е, ё, ю, я: подъезд, съезд, объявление.",
            "Как пишется 'ь' в глаголах?": "'Ь' пишется в глаголах 2-го лица единственного числа: читаешь, пишешь, летишь. Также в инфинитиве: писать, читать.",
            "Как пишутся окончания глаголов 1-го спряжения?": "Окончания: -ю, -ешь, -ет, -ем, -ете, -ют. Например: работаю, работаешь, работает.",
            "Как пишутся окончания глаголов 2-го спряжения?": "Окончания: -ю, -ишь, -ит, -им, -ите, -ат. Например: читаю, читаешь, читает.",
            "Как пишется 'е' и 'и' на конце наречий?": "Наречия на -о, -е пишутся с 'е', если в прилагательном было 'е': быстро (от быстрый). Если в прилагательном было 'и', то в наречии — 'и': тихо (от тихий).",
            "Как пишутся причастия с 'н' и 'нн'?": "Одно 'н' — в кратких причастиях и в причастиях без зависимых слов: написан, прочитан. Два 'нн' — в полных причастиях с зависимыми словами: написанный мною, прочитанный сегодня.",
            "Как пишутся деепричастия с 'н' и 'нн'?": "Деепричастия всегда пишутся с одним 'н': написав, прочитав. Исключение: деепричастия от глаголов с 'нн' в прошедшем времени — тоже с одним 'н': написав, прочитав.",
            "Как пишутся сложные слова?": "Сложные слова пишутся слитно, если корни связаны по смыслу: самолёт, водопад. Через дефис — если части равноправны: русско-английский, северо-восток.",
            "Как пишутся сложные прилагательные?": "Сложные прилагательные пишутся через дефис, если они образованы от двух слов: северо-восточный, русско-английский.",
            "Как пишутся сложные числительные?": "Сложные числительные пишутся слитно: двадцать, тридцать. Через дефис — составные: двадцать один, сто пятьдесят.",
            "Как пишутся местоимения?": "Местоимения пишутся слитно: я, ты, он, она, мы, вы, они. Вопросительные и относительные: кто, что, который. Отрицательные: никто, ничто.",
            "Как пишутся предлоги?": "Предлоги пишутся раздельно: в, на, с, под, над. Исключение: слитно пишутся производные предлоги: ввиду, в течение, вследствие.",
            "Как пишутся союзы?": "Союзы пишутся раздельно: и, а, но, потому что, чтобы. Исключение: слитно пишутся союзы 'тоже', 'также', 'зато'.",
            "Как пишутся частицы?": "Частицы пишутся раздельно: не, ли, же, бы, ведь. Исключение: слитно пишутся частицы 'тоже', 'также', 'зато'.",
            "Какие слова пишутся слитно?": "Слитно пишутся: приставки, суффиксы, сложные слова, производные предлоги, частицы 'тоже', 'также', 'зато'.",
            "Какие слова пишутся раздельно?": "Раздельно пишутся: предлоги, частицы 'не', 'ни', союзы, отрицательные местоимения.",
            "Какие слова пишутся через дефис?": "Через дефис пишутся: сложные прилагательные, сложные числительные, сложные существительные, обозначающие двойное действие: северо-восток, двадцать-пять, русско-английский.",
            "Как определить подлежащее?": "Подлежащее — это главный член предложения, обозначающий предмет, о котором говорится. Отвечает на вопросы кто? что? Например: 'Книга лежит на столе.' — 'Книга' — подлежащее.",
            "Как определить сказуемое?": "Сказуемое — это главный член предложения, обозначающий действие или признак предмета. Отвечает на вопросы что делает? что есть? Например: 'Он читает.' — 'читает' — сказуемое.",
            "Как определить дополнение?": "Дополнение — это второстепенный член предложения, обозначающий предмет, на который направлено действие. Отвечает на вопросы кого? что? кому? чему? кого? что? Например: 'Я читаю книгу.' — 'книгу' — дополнение.",
            "Как определить обстоятельство?": "Обстоятельство — это второстепенный член предложения, который обозначает признак действия. Отвечает на вопросы как? где? когда? почему? зачем? Например: 'Он читает быстро.' — 'быстро' — обстоятельство.",
            "Как определить определение?": "Определение — это второстепенный член предложения, который обозначает признак предмета. Отвечает на вопросы какой? какая? какое? какие? Например: 'Красивая девушка.' — 'красивая' — определение.",
            "Какие члены предложения могут быть однородными?": "Однородными могут быть подлежащие, сказуемые, дополнения, обстоятельства, определения. Например: 'Он купил яблоки, груши и апельсины.' — однородные дополнения.",
            "Как ставятся запятые между однородными членами?": "Запятые ставятся между однородными членами, соединёнными союзами 'и', 'а', 'но', 'да' (в значении 'и'), а также без союзов. Например: 'Он пришёл, сел, начал читать.'",
            "Какие знаки препинания ставятся в сложносочинённом предложении?": "В сложносочинённом предложении запятая ставится между частями, соединёнными союзами 'и', 'а', 'но', 'да', 'или', 'либо'. Например: 'Он пришёл, и мы начали работать.'",
            "Какие знаки препинания ставятся в сложноподчинённом предложении?": "В сложноподчинённом предложении запятая ставится между главной и придаточной частью. Например: 'Я знаю, что он придёт.'",
            "Какие знаки препинания ставятся в бессоюзном предложении?": "В бессоюзном предложении ставится запятая, двоеточие или тире, в зависимости от смысла: запятая — при перечислении, двоеточие — при объяснении, тире — при противопоставлении или резком повороте.",
            "Какие знаки препинания ставятся в прямой речи?": "Прямая речь выделяется кавычками. После неё ставится запятая, точка, восклицательный или вопросительный знак, а затем тире и слова автора. Например: 'Я приду,' — сказал он.",
            "Какие знаки препинания ставятся в обращении?": "Обращение выделяется запятыми: 'Друзья, приходите!' — 'Друзья' — обращение.",
            "Какие знаки препинания ставятся в вводных словах?": "Вводные слова выделяются запятыми: 'Конечно, я приду.', 'Вероятно, он опоздает.'",
            "Какие знаки препинания ставятся в приложениях?": "Приложение, выраженное существительным, выделяется запятыми, если стоит после определяемого слова и не является именем собственным: 'Мой друг, учитель, пришёл.'",
            "Какие знаки препинания ставятся в цитатах?": "Цитаты выделяются кавычками. После них ставится запятая, точка, восклицательный или вопросительный знак, а затем тире и слова автора.",
            "Какие слова требуют запятой перед 'как'?": "Запятая ставится перед 'как', если оно вводит сравнение: 'Он бежал, как ветер.' Не ставится, если 'как' — часть составного сказуемого: 'Он работает как инженер.'",
            "Какие слова требуют запятой перед 'что'?": "Запятая ставится перед 'что', если оно вводит придаточное предложение: 'Я знаю, что он придёт.' Не ставится, если 'что' — союзное слово в вопросе: 'Я не знаю, что делать.'",
            "Какие слова требуют запятой перед 'если'?": "Запятая ставится перед 'если', если оно вводит придаточное условное: 'Если ты придёшь, я буду рад.'",
            "Какие слова требуют запятой перед 'потому что'?": "Запятая ставится перед 'потому что', если это союз, вводящий придаточное причины: 'Я пришёл, потому что был зван.'",
            "Какие слова требуют запятой перед 'чтобы'?": "Запятая ставится перед 'чтобы', если это союз, вводящий придаточное цели: 'Я пришёл, чтобы помочь.'",
            "Какие слова требуют запятой перед 'хотя'?": "Запятая ставится перед 'хотя', если это союз, вводящий придаточное уступки: 'Я пришёл, хотя был уставший.'",
