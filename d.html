    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-color: #212529;
            --shadow-light: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            padding: 10px;
            color: var(--text-color);
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: 700;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 10px;
            background-color: var(--card-background);
            border-radius: 10px;
            box-shadow: var(--shadow-light);
        }
        .controls input, .controls select, .controls button {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 16px;
            transition: all 0.3s;
        }
        .controls button {
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 700;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
        .language-selector button {
            background-color: var(--secondary-color);
        }
        .language-selector button.active {
            background-color: var(--primary-color);
        }
        .flag-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .flag-item {
            background: var(--card-background);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: var(--shadow-light);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .flag-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
        }
        .flag-item img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .flag-item span {
            display: block;
            font-weight: 700;
            color: var(--text-color);
            font-size: 16px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            overflow: auto;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background-color: var(--card-background);
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-content img {
            max-width: 100%;
            height: auto;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            margin: 15px 0;
        }
        .modal-info-item {
            margin: 8px 0;
            font-size: 16px;
        }
        .modal-info-item strong {
            color: var(--primary-color);
            min-width: 100px;
            display: inline-block;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 36px;
            font-weight: bold;
            line-height: 1;
        }
        .close:hover, .close:focus {
            color: var(--text-color);
            text-decoration: none;
            cursor: pointer;
        }
        
        /* Media Queries */
        @media (max-width: 768px) {
            .flag-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .controls {
                flex-direction: column;
            }
            .controls > * {
                width: 100%;
                box-sizing: border-box;
            }
            .modal-content {
                margin: 10% auto;
            }
        }
        @media (max-width: 480px) {
            .flag-container {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

        // Asl ma'lumotlar massivini saqlash
        allCountriesArray = countryData.countries;

        // Raqamlarni formatlash funksiyasi
        function formatNumber(num, lang) {
            if (lang === 'uz') {
                return (num / 1000000) >= 1 ? (num / 1000000).toFixed(1) + " mln" : num.toLocaleString('uz-UZ');
            } else if (lang === 'en') {
                return (num / 1000000) >= 1 ? (num / 1000000).toFixed(1) + " mln" : num.toLocaleString('en-US');
            } else if (lang === 'ru') {
                 return (num / 1000000) >= 1 ? (num / 1000000).toFixed(1) + " млн" : num.toLocaleString('ru-RU');
            }
            return num.toLocaleString();
        }

        // Tizim tilini sozlash
        function setLanguage(lang) {
            currentLanguage = lang;
            const labels = countryData.labels[lang];

            // Sarlavhani yangilash
            document.getElementById('title').textContent = countryData.titles[lang];
            document.getElementById('main-title').textContent = countryData.titles[lang];
            
            // Tugmalarni faollashtirish
            document.querySelectorAll('.language-selector button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            
            // Boshqaruv elementlarini yangilash
            document.getElementById('search-input').placeholder = labels.search_placeholder;
            
            const sortSelect = document.getElementById('sort-select');
            sortSelect.options[0].textContent = labels.sort_name_asc;
            sortSelect.options[1].textContent = labels.sort_name_desc;
            sortSelect.options[2].textContent = labels.sort_pop_desc;
            sortSelect.options[3].textContent = labels.sort_pop_asc;
            
            // Bayroqlarni qayta chizish
            renderFlags(allCountriesArray.slice()); // Yangi ro'yxatni saralash uchun nusxa olamiz
            sortFlags(); // Yangi til bo'yicha darhol saralash
        }

        // Bayroqlarni ko'rsatish
        function renderFlags(countriesToDisplay) {
            const container = document.getElementById('flag-container');
            container.innerHTML = '';
            
            countriesToDisplay.forEach(country => {
                const flagItem = document.createElement('div');
                flagItem.className = 'flag-item';
                flagItem.setAttribute('data-country-code', country.code);
                flagItem.setAttribute('onclick', `openModal('${country.code}')`);

                // 🌐 Bayroq rasmi (Bu yerda uchinchi tomon API/xizmatga ehtiyoj bor, bu namuna uchun tasavvur qilingan manba)
                // Haqiqiy loyihada 'https://flagcdn.com/w320/' kabi xizmatlardan foydalanasiz.
                const img = document.createElement('img');
                img.src = `https://flagcdn.com/w160/${country.code}.png`; 
                img.alt = `${country.uz} Bayrog'i`;
                img.onerror = function() { this.style.display='none'; }; // Agar rasm yuklanmasa yashirish
                
                const span = document.createElement('span');
                span.textContent = country[currentLanguage] || country.en; // Tarjimasi bo'lmasa inglizchasini ishlatish

                flagItem.appendChild(img);
                flagItem.appendChild(span);
                container.appendChild(flagItem);
            });
        }
        
        // Qidiruv funksiyasi
        function filterFlags() {
            const input = document.getElementById('search-input').value.toLowerCase();
            const filtered = allCountriesArray.filter(country => 
                (country[currentLanguage] && country[currentLanguage].toLowerCase().includes(input)) ||
                (country.en.toLowerCase().includes(input)) ||
                (country.uz.toLowerCase().includes(input)) ||
                (country.ru.toLowerCase().includes(input)) 
            );
            
            renderFlags(filtered);
            // Qidiruvdan so'ng saralash talab qilinishi mumkin, shuning uchun qayta saralash
            // sortFlags(filtered); // Agar faqat qidiruv natijasini saralash kerak bo'lsa
        }

        // Saralash funksiyasi
        function sortFlags() {
            const sortBy = document.getElementById('sort-select').value;
            let currentList = Array.from(document.getElementById('flag-container').children)
                .map(item => allCountriesArray.find(c => c.code === item.getAttribute('data-country-code')));
            
            currentList.sort((a, b) => {
                if (sortBy === 'name_asc') {
                    return (a[currentLanguage] || a.en).localeCompare(b[currentLanguage] || b.en, currentLanguage);
                } else if (sortBy === 'name_desc') {
                    return (b[currentLanguage] || b.en).localeCompare(a[currentLanguage] || a.en, currentLanguage);
                } else if (sortBy === 'pop_desc') {
                    return b.population - a.population;
                } else if (sortBy === 'pop_asc') {
                    return a.population - b.population;
                }
                return 0;
            });

            renderFlags(currentList);
        }

        // Modal oynasini ochish
        function openModal(countryCode) {
            const country = allCountriesArray.find(c => c.code === countryCode);
            if (!country) return;

            const modal = document.getElementById('countryModal');
            const nameEl = document.getElementById('modal-country-name');
            const imgEl = document.getElementById('modal-flag-image');
            const infoEl = document.getElementById('modal-info');
            const labels = countryData.labels[currentLanguage];
            
            // Modalni ma'lumotlar bilan to'ldirish
            nameEl.textContent = country[currentLanguage] || country.en;
            imgEl.src = `https://flagcdn.com/w640/${country.code}.png`;
            imgEl.alt = `${country.uz} Bayrog'i`;
            
            // Dinamik ma'lumotlar
            infoEl.innerHTML = `
                <p class="modal-info-item"><strong>${labels.capital}:</strong> ${country.capital}</p>
                <p class="modal-info-item"><strong>${labels.population}:</strong> ${formatNumber(country.population, currentLanguage)}</p>
                <hr style="border-top: 1px solid #eee;">
                <p class="modal-info-item"><strong>${labels.description}:</strong> ${country[`description_${currentLanguage}`] || country.description_en}</p>
            `;

            modal.style.display = 'block';
        }
        
        // Modal oynasini yopish
        function closeModal() {
            document.getElementById('countryModal').style.display = 'none';
        }

        // Sahifa yuklanganda
        document.addEventListener('DOMContentLoaded', () => {
            // Dastlabki tilni o'zbekcha qilib belgilash va hamma funksiyalarni ishga tushirish
            setLanguage('uz');
        });
