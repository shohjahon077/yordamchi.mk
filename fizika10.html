<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — Fizika (10-sinf)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1565C0; /* To‘q ko'k — fanlar va bilim */
            --secondary: #1976D2;
            --accent: #FFB300; /* Sariq — energiya va tushuntirish */
            --light: #FFFFFF;
            --bg: #E3F2FD;
            --text: #1565C0;
            --card: #FFFFFF;
            --shadow: 0 12px 30px rgba(21, 101, 192, 0.15);
            --border: #BBDEFB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), #1565C0);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.3rem;
            margin: 15px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.6;
            opacity: 0.95;
        }

        #globe-logo {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            position: relative;
        }

        #globe-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.2));
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 28px;
            color: var(--primary);
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 24px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: #E3F2FD;
            color: #1565C0;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-message .message-bubble {
            background: #F8F9FA;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--primary);
        }

        /* === FORMULA STYLE === */
        .formula {
            background: #E3F2FD;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #0D47A1;
            font-family: 'Courier New', monospace;
        }

        /* === CONCEPT STYLE === */
        .concept {
            background: #E1F5FE;
            border-left: 3px solid var(--secondary);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #006064;
        }

        /* === EXAMPLE STYLE === */
        .example {
            margin: 12px 0;
            padding: 10px;
            background: #E3F2FD;
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            font-size: 14px;
            color: #1565C0;
            font-style: italic;
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 16px;
            border: none;
            border-radius: 28px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(21,101,192,0.2);
        }

        .quick-button:hover {
            background: #1565C0;
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(21,101,192,0.3);
        }

        .home-button {
            background: #616161 !important;
        }

        .home-button:hover {
            background: #424242 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #757575;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ANIMATION */
        #chatbot-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #chatbot-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="globe-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/>
                <path d="M12 3V21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M3 12H21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M7 4C8.5 6 10 9 10 12C10 15 8.5 18 7 20" stroke="white" stroke-width="1.5"/>
                <path d="M17 4C15.5 6 14 9 14 12C14 15 15.5 18 17 20" stroke="white" stroke-width="1.5"/>
            </svg>
        </div>
        <h1>AI Ustoz — Fizika</h1>
        <p>10-sinf uchun: Mekanika, termodinamika, elektromagnitizm, optika — tabiat qonunlarini tushunish!</p>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container" class="hidden">
        <div id="header">
            <div id="ai-avatar">🔬</div>
            <h2>Fizika Yordamchisi</h2>
        </div>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="quick-buttons"></div>
            <div class="footer-note">10-sinf darsligiga mos — Mekanika, termodinamika, elektromagnitizm, optika</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const quickButtonsContainer = document.getElementById('quick-buttons');
        const introSplash = document.getElementById('intro-splash');
        const chatbotContainer = document.getElementById('chatbot-container');

        // ✅ Fizika ma'lumotlar bazasi (10-sinf darsligi asosida)
        const database = {
            "main_menu": {
                text: "Salom! Fizika — tabiat qonunlarini o'rganuvchi fan. Qaysi mavzu qiziqarli?",
                buttons: [
                    { text: "🏃‍♂️ Mekanika", key: "mekanika" },
                    { text: "🌡️ Termodinamika", key: "termodinamika" },
                    { text: "⚡ Elektr va magnitizm", key: "elektr" },
                    { text: "🌈 Optika", key: "optika" },
                    { text: "📝 Testlar", key: "test_menu" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "mekanika": {
                text: "10-sinf dasturida o'rganiladigan mekanika bo'limi:",
                buttons: [
                    { text: "Harakat qonunlari", key: "harakat" },
                    { text: "Kuch va massa", key: "kuch_massa" },
                    { text: "Impuls", key: "impuls" },
                    { text: "Energiya", key: "energiya" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "harakat": {
                text: "<span class='concept'>Harakat qonunlari:</span><br>• Nyutonning 1-qonuni: jismga kuch ta'sir qilmasa, tinch tursa tinch, harakatlansa barqaror harakat qiladi<br>• Nyutonning 2-qonuni: F = ma<br>• Nyutonning 3-qonuni: harakatlanuvchi jism boshqa jismga ta'sir qilsa, o'sha jism ham ta'sir qiladi",
                buttons: [{ text: "⬅️ Orqaga", key: "mekanika", isHome: true }]
            },
            "kuch_massa": {
                text: "<span class='concept'>Kuch va massa:</span><br>• Massa — jismning inertligini xarakterlaydi (kg)<br>• Kuch — jismga ta'sir qiluvchi fizik kattalik (N)<br>• Og'irlik kuchi: P = mg, g = 9.8 m/s²",
                buttons: [{ text: "⬅️ Orqaga", key: "mekanika", isHome: true }]
            },
            "impuls": {
                text: "<span class='formula'>Impuls:</span><br>• Impuls: p = mv (kg·m/s)<br>• Impuls saqlanish qonuni: m₁v₁ + m₂v₂ = m₁v'₁ + m₂v'₂<br>• Impuls — vektorli kattalik",
                buttons: [{ text: "⬅️ Orqaga", key: "mekanika", isHome: true }]
            },
            "energiya": {
                text: "<span class='formula'>Energiya:</span><br>• Potensial energiya: Eₚ = mgh<br>• Kinetik energiya: Eₖ = ½mv²<br>• Energiya saqlanish qonuni: Eₚ + Eₖ = const",
                buttons: [{ text: "⬅️ Orqaga", key: "mekanika", isHome: true }]
            },
            "termodinamika": {
                text: "Termodinamika — issiqlik jarayonlarini o'rganadi.",
                buttons: [
                    { text: "Issiqlik", key: "issiqlik" },
                    { text: "Ideal gaz", key: "ideal_gaz" },
                    { text: "Termodinamika qonunlari", key: "termod_qonun" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "issiqlik": {
                text: "<span class='concept'>Issiqlik:</span><br>• Q = cmΔT (issiqlik miqdori)<br>• c — solishtirma issiqlik sig'imi<br>• ΔT — harorat o'zgarishi<br>• Issiqlik uzatish: o'tkazuvchanlik, konveksiya, nurlanish",
                buttons: [{ text: "⬅️ Orqaga", key: "termodinamika", isHome: true }]
            },
            "ideal_gaz": {
                text: "<span class='formula'>Ideal gaz:</span><br>• P = nRT/V (Mendeleev-Clapeyron tenglamasi)<br>• n — molyar miqdor<br>• R — universal gaz doimiysi<br>• T — mutlaq harorat (Kelvin)",
                buttons: [{ text: "⬅️ Orqaga", key: "termodinamika", isHome: true }]
            },
            "termod_qonun": {
                text: "<span class='concept'>Termodinamika qonunlari:</span><br>• 1-qonun: ΔU = Q - A (ichki energiya o'zgarishi)<br>• 2-qonun: issiqlik avtomatik sovuq jismdan issiq jismga o'tmaydi",
                buttons: [{ text: "⬅️ Orqaga", key: "termodinamika", isHome: true }]
            },
            "elektr": {
                text: "Elektr va magnitizm — elektr zaryadlar hamda ularning ta'siri.",
                buttons: [
                    { text: "Elektr maydon", key: "elektr_maydon" },
                    { text: "Tok kuchi", key: "tok" },
                    { text: "Ohm qonuni", key: "ohm" },
                    { text: "Magnetizm", key: "magnet" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "elektr_maydon": {
                text: "<span class='formula'>Elektr maydon:</span><br>• E = F/q (maydon kuchlanishi)<br>• Kuch chiziqlari — qo'shiqdan chiqadi, manfiyga kiradi<br>• Kulyon qonuni: F = k(q₁q₂)/r²",
                buttons: [{ text: "⬅️ Orqaga", key: "elektr", isHome: true }]
            },
            "tok": {
                text: "<span class='concept'>Tok kuchi:</span><br>• I = q/t (tok kuchi)<br>• I — amperda o'lchanadi<br>• Elektr kuchlanish: U = IR (Ohm qonuni)<br>• Tok kuchini o'lchash — ampermetr bilan",
                buttons: [{ text: "⬅️ Orqaga", key: "elektr", isHome: true }]
            },
            "ohm": {
                text: "<span class='formula'>Ohm qonuni:</span><br>• I = U/R (tok kuchi)<br>• R — qarshilik (om)<br>• R = ρl/S (qarshilik hisoblash)<br>• ρ — xos qarshilik",
                buttons: [{ text: "⬅️ Orqaga", key: "elektr", isHome: true }]
            },
            "magnet": {
                text: "<span class='concept'>Magnetizm:</span><br>• Magnit maydon — tok o'tayotgan sim atrofida vujudga keladi<br>• Amper kuchi: F = BIl sinα<br>• B — magnit induksiya<br>• Elektromagnit induksiya — Faradey qonuni",
                buttons: [{ text: "⬅️ Orqaga", key: "elektr", isHome: true }]
            },
            "optika": {
                text: "Optika — yorug'likning xususiyatlarini o'rganadi.",
                buttons: [
                    { text: "Yorug'lik nur", key: "yoruglik" },
                    { text: "Akslanish", key: "akslanish" },
                    { text: "Sinning qonuni", key: "sinn" },
                    { text: "Linza", key: "linza" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "yoruglik": {
                text: "<span class='concept'>Yorug'lik nur:</span><br>• Yorug'lik tezligi: c = 3·10⁸ m/s<br>• Yorug'lik — elektromagnit to'lqin<br>• Tuzatuvchi nur — nur chizig'i",
                buttons: [{ text: "⬅️ Orqaga", key: "optika", isHome: true }]
            },
            "akslanish": {
                text: "<span class='formula'>Akslanish:</span><br>• Tushuvchi burchak = akslanuvchi burchak<br>• α = β<br>• Yassi ko'zgu: R = ∞",
                buttons: [{ text: "⬅️ Orqaga", key: "optika", isHome: true }]
            },
            "sinn": {
                text: "<span class='formula'>Sinning qonuni:</span><br>• sin α / sin β = n₂/n₁<br>• n — sindiruvchanlik ko'rsatkichi<br>• To'lqin o'tayotganda tezlik o'zgaradi",
                buttons: [{ text: "⬅️ Orqaga", key: "optika", isHome: true }]
            },
            "linza": {
                text: "<span class='formula'>Linza:</span><br>• 1/f = 1/d + 1/F<br>• f — ekranga masofa<br>• d — jismga masofa<br>• F — fokus masofasi",
                buttons: [{ text: "⬅️ Orqaga", key: "optika", isHome: true }]
            },
            "test_menu": {
                text: "Bilimingizni sinab ko'ring:",
                buttons: [
                    { text: "Mekanika testi", key: "test_mekanika" },
                    { text: "Termodinamika testi", key: "test_termo" },
                    { text: "Elektr testi", key: "test_elektr" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "test_mekanika": {
                text: "1. Nyutonning ikkinchi qonuniga binoan kuch qanday ifodalanadi?\nA) F = mv\nB) F = ma\nC) F = mg",
                buttons: [
                    { text: "A)", key: "test_mekanika_a" },
                    { text: "B)", key: "test_mekanika_b" },
                    { text: "C)", key: "test_mekanika_c" }
                ]
            },
            "test_mekanika_b": {
                text: "✅ To'g'ri! F = ma — Nyutonning ikkinchi qonuni.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_termo": {
                text: "2. Ideal gaz holat tenglamasida R nima?\nA) Universal gaz doimiysi\nB) Qarshilik\nC) Radius",
                buttons: [
                    { text: "A)", key: "test_termo_a" },
                    { text: "B)", key: "test_termo_b" },
                    { text: "C)", key: "test_termo_c" }
                ]
            },
            "test_termo_a": {
                text: "✅ Ajoyib! R — universal gaz doimiysi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_elektr": {
                text: "3. Ohm qonuniga ko'ra tok kuchi qanday ifodalanadi?\nA) I = UR\nB) I = U/R\nC) I = R/U",
                buttons: [
                    { text: "A)", key: "test_elektr_a" },
                    { text: "B)", key: "test_elektr_b" },
                    { text: "C)", key: "test_elektr_c" }
                ]
            },
            "test_elektr_b": {
                text: "✅ To'g'ri! I = U/R — Ohm qonuni.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            addMessage(next.text, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Bu mavzu hozircha mavjud emas.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                setTimeout(() => {
                    chatbotContainer.classList.add('show');
                    addMessage(database.main_menu.text, 'ai');
                    showButtons('main_menu');
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
