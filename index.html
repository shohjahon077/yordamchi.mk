
     
      <!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yordamchi Maktab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #f0f4ff);
      color: #212529;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Kirish sahifasi */
    #intro {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: linear-gradient(120deg, #4361ee, #3a0ca3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      animation: fadeIn 1s forwards;
    }

    .intro-logo {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(255,255,255,0.7);
      animation: float 3s ease-in-out infinite, scaleIn 1s ease-out;
    }

    .intro-sub {
      font-size: 1.2rem;
      opacity: 0.9;
      animation: fadeIn 1.5s 0.5s forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.02); }
    }

    /* Asosiy sahifa */
    #main-content {
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease;
    }

    #main-content.visible {
      opacity: 1;
      visibility: visible;
    }

    /* Navbar (desktop) */
    .navbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 25px 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 12px 20px;
      background: #4cc9f0;
      color: white;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: 0.5s;
    }

    .nav-btn:hover::before {
      left: 100%;
    }

    .nav-btn:hover {
      transform: translateY(-6px) rotateX(5deg) scale(1.05);
      background: #4361ee;
      box-shadow: 0 8px 16px rgba(67, 97, 238, 0.5);
    }

    /* Mobil menyu tugmasi */
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 50px;
      height: 50px;
      background: #4361ee;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }

    .menu-toggle:hover {
      transform: rotate(90deg);
    }

    /* Mobil menyu */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 80%;
      max-width: 320px;
      height: 100vh;
      background: linear-gradient(135deg, #2b2d42, #1d1d2c);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 999;
      transition: right 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      padding: 20px;
      box-shadow: -5px 0 15px rgba(0,0,0,0.3);
    }

    .mobile-menu.active {
      right: 0;
    }

    .mobile-btn {
      padding: 16px 20px;
      background: #4cc9f0;
      color: white;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.2rem;
      width: 100%;
      text-align: center;
      transition: all 0.3s ease;
      border: none;
      outline: none;
    }

    .mobile-btn:hover {
      transform: translateX(10px);
      background: #4361ee;
    }

    /* Asosiy katta tugmalar */
    .main-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 50px 20px 80px;
    }

    .big-btn {
      width: 220px;
      height: 90px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #4361ee, #3a0ca3);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(67, 97, 238, 0.5);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .big-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 20px;
      height: 200%;
      background: rgba(255,255,255,0.3);
      transform: rotate(25deg);
      transition: all 0.6s;
    }

    .big-btn:hover::after {
      left: 120%;
    }

    .big-btn:hover {
      transform: scale(1.08) rotate(2deg);
      box-shadow: 0 12px 25px rgba(58, 12, 163, 0.7);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      background: #1d1d2c;
      color: #adb5bd;
      font-size: 1rem;
      position: relative;
      z-index: 10;
    }

    /* Mobil uchun */
    @media (max-width: 768px) {
      .navbar { display: none; }
      .menu-toggle { display: flex; }
      .intro-logo { font-size: 2.8rem; }
      .big-btn { width: 180px; height: 80px; font-size: 1.1rem; }
      .main-buttons { padding: 120px 15px 70px; }
    }

    @media (max-width: 480px) {
      .intro-logo { font-size: 2.2rem; }
      .big-btn { width: 150px; height: 70px; font-size: 1rem; }
      .main-buttons { padding: 130px 10px 70px; }
    }
  </style>
</head>
<body>

  <!-- Kirish sahifasi -->
  <div id="intro">
    <div class="intro-logo">YORDAMCHI MAKTAB</div>
    <div class="intro-sub">Bilim — kelajak kaliti 🌟</div>
  </div>

  <!-- Asosiy tarkib -->
  <div id="main-content">
    <div class="menu-toggle" onclick="toggleMobileMenu()">☰</div>

    <div class="mobile-menu" id="mobileMenu">
      <button class="mobile-btn" onclick="goToSection('darsliklar')">Darsliklar</button>
      <button class="mobile-btn" onclick="goToSection('testlar')">Testlar</button>
      <button class="mobile-btn" onclick="goToSection('video')">Video Darslar</button>
      <button class="mobile-btn" onclick="goToSection('maslahat')">Maslahatlar</button>
      <button class="mobile-btn" onclick="goToSection('oqituvchilar')">O'qituvchilar</button>
      <button class="mobile-btn" onclick="goToSection('biz')">Biz Haqimizda</button>
      <button class="mobile-btn" onclick="goToSection('aloqa')">Aloqa</button>
    </div>

    <nav class="navbar">
      <div class="nav-btn" onclick="goToSection('darsliklar')">Darsliklar</div>
      <div class="nav-btn" onclick="goToSection('testlar')">Testlar</div>
      <div class="nav-btn" onclick="goToSection('video')">Video Darslar</div>
      <div class="nav-btn" onclick="goToSection('maslahat')">Maslahatlar</div>
      <div class="nav-btn" onclick="goToSection('oqituvchilar')">O'qituvchilar</div>
      <div class="nav-btn" onclick="goToSection('biz')">Biz Haqimizda</div>
      <div class="nav-btn" onclick="goToSection('aloqa')">Aloqa</div>
    </nav>

    <main class="main-buttons">
      <button class="big-btn" onclick="goToSection('darsliklar')">📚 Darsliklar</button>
      <button class="big-btn" onclick="goToSection('testlar')">📝 Testlar</button>
      <button class="big-btn" onclick="goToSection('video')">🎥 Video Darslar</button>
      <button class="big-btn" onclick="goToSection('maslahat')">💡 Maslahatlar</button>
      <button class="big-btn" onclick="goToSection('oqituvchilar')">👩‍🏫 O'qituvchilar</button>
      <button class="big-btn" onclick="goToSection('biz')">ℹ️ Biz Haqimizda</button>
      <button class="big-btn" onclick="goToSection('aloqa')">📞 Aloqa</button>
    </main>

    <footer class="footer">
      🔒 Sayt himoyalangan | © 2025 Yordamchi Maktab
    </footer>
  </div>

  <script>
    // Kirish sahifasini 3 soniyadan keyin yopish
    window.addEventListener('load', () => {
      setTimeout(() => {
        const intro = document.getElementById('intro');
        intro.style.opacity = '0';
        intro.style.pointerEvents = 'none';
        setTimeout(() => {
          intro.style.display = 'none';
          document.getElementById('main-content').classList.add('visible');
        }, 1000);
      }, 3000);
    });

    // Mobil menyu ochish/yopish
    function toggleMobileMenu() {
      const menu = document.getElementById('mobileMenu');
      menu.classList.toggle('active');
    }

    // Bo'limga o'tish (demo uchun alert + scroll)
    function goToSection(sectionName) {
      const menu = document.getElementById('mobileMenu');
      if (menu.classList.contains('active')) {
        menu.classList.remove('active');
      }

      // Haqiqiy loyihada bu yerda sahifa o'zgaradi yoki kontent yuklanadi
      alert(`✅ "${sectionName}" bo'limiga muvaffaqiyatli o'tildi!`);
    }

    // Tashqari bosishda menyu yopilishi
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('mobileMenu');
      const toggle = document.querySelector('.menu-toggle');
      if (menu.classList.contains('active') && 
          !menu.contains(e.target) && 
          e.target !== toggle) {
        menu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
