<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barcha Narsa Haqida 🌐</title>
  <style>
    :root {
      --bg: #0f0c29;
      --text: white;
      --shadow: rgba(0,0,0,0.5);
    }

    [data-theme="light"] {
      --bg: #f8f9fa;
      --text: #212529;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #e0e0e0;
    }
    [data-theme="ocean"] {
      --bg: #003b46;
    }
    [data-theme="fire"] {
      --bg: #2c003e;
    }
    [data-theme="forest"] {
      --bg: #1a2b1a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.5s ease;
    }

    .settings-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      color: white;
      cursor: pointer;
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .settings-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: rgba(20, 20, 40, 0.95);
      backdrop-filter: blur(15px);
      padding: 30px;
      color: white;
      transition: right 0.4s ease;
      z-index: 99;
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .settings-panel.open {
      right: 0;
    }

    .close-settings {
      background: none;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      float: right;
    }

    h2.settings-title {
      margin-bottom: 25px;
      font-size: 1.8rem;
    }

    .setting-group {
      margin-bottom: 30px;
    }

    .setting-group h3 {
      margin-bottom: 12px;
      font-size: 1.3rem;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 1rem;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      text-align: center;
      padding-top: 80px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 40px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 28px;
      padding: 10px;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
      perspective: 1200px;
    }

    .card {
      width: 100%;
      height: 230px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      border-radius: 20px;
      box-shadow: 0 8px 25px var(--shadow);
    }

    .card-link:hover .card {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      font-weight: 600;
    }

    .card:nth-child(5n+1) .card-front { background: linear-gradient(45deg, #ff9a9e, #fad0c4); }
    .card:nth-child(5n+2) .card-front { background: linear-gradient(45deg, #a1c4fd, #c2e9fb); }
    .card:nth-child(5n+3) .card-front { background: linear-gradient(45deg, #ffecd2, #fcb69f); }
    .card:nth-child(5n+4) .card-front { background: linear-gradient(45deg, #84fab0, #8fd3f4); }
    .card:nth-child(5n+5) .card-front { background: linear-gradient(45deg, #d4fc79, #96e6a1); }

    .card-back {
      background: linear-gradient(45deg, #2c3e50, #4a6491);
      transform: rotateY(180deg);
      font-size: 1.05rem;
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .settings-panel { width: 300px; }
      h1 { font-size: 2rem; }
      .card { height: 210px; }
    }

    @media (max-width: 480px) {
      .settings-panel { width: 280px; }
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>

    // DOM elementlari
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettings = document.getElementById('closeSettings');
    const settingsPanel = document.getElementById('settingsPanel');
    const langSelect = document.getElementById('languageSelect');
    const themeSelect = document.getElementById('themeSelect');
    const mainTitle = document.getElementById('mainTitle');
    const langLabel = document.getElementById('langLabel');
    const themeLabel = document.getElementById('themeLabel');
    const cardsGrid = document.getElementById('cardsGrid');

    let currentLang = localStorage.getItem('language') || 'uz';
    let currentTheme = localStorage.getItem('theme') || 'dark';

    // Kartochkalarni yaratish
    function renderCards() {
      cardsGrid.innerHTML = '';
      const cards = translations[currentLang].cards;
      cards.forEach(card => {
        const link = document.createElement('a');
        link.href = card.url;
        link.target = "_blank";
        link.className = "card-link";
        link.innerHTML = `
          <div class="card">
            <div class="card-front"><h2>${card.title}</h2></div>
            <div class="card-back"><p>${card.desc}</p></div>
          </div>
        `;
        cardsGrid.appendChild(link);
      });
    }

    // UI ni yangilash
    function updateUI() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang;
      document.title = t.title;
      mainTitle.textContent = t.title;
      langLabel.textContent = t.langLabel;
      themeLabel.textContent = t.themeLabel;
      renderCards();
    }

    // Mavzuni o'rnatish
    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
    }

    // Hodisalar
    settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
    closeSettings.addEventListener('click', () => settingsPanel.classList.remove('open'));

    langSelect.addEventListener('change', (e) => {
      currentLang = e.target.value;
      localStorage.setItem('language', currentLang);
      updateUI();
    });

    themeSelect.addEventListener('change', (e) => {
      setTheme(e.target.value);
    });

    // Ishga tushirish
    langSelect.value = currentLang;
    themeSelect.value = currentTheme;
    setTheme(currentTheme);
    updateUI();
  </script>
