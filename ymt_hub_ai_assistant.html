<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMT HUB AI — Shohjahon Mahkamov</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070913;
            --card-bg: rgba(18, 26, 43, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-blue: #0076ff;
            --accent-cyan: #00f2fe;
            --accent-purple: #7928ca;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 118, 255, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(121, 40, 202, 0.18) 0%, transparent 45%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .ymt-container {
            width: 100%;
            max-width: 900px;
            height: 92vh;
            max-height: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 242, 254, 0.1);
            overflow: hidden;
        }

        /* Header */
        .ymt-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
        }

        .brand-text h2 {
            font-size: 19px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .brand-text p span {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .status-tag {
            font-size: 12px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 5px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        /* Chat Log */
        .ymt-chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .ymt-chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .ymt-chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }

        .msg-row {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .msg-row.user-side {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-side .msg-avatar {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #fff;
        }

        .ai-side .msg-avatar {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
        }

        .msg-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.6;
            word-break: break-word;
        }

        .user-side .msg-bubble {
            background: linear-gradient(135deg, #0076ff, #0056b3);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .ai-side .msg-bubble {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .msg-bubble pre {
            background: rgba(0, 0, 0, 0.45);
            padding: 12px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .msg-bubble code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Form / Input Area */
        .ymt-form-container {
            padding: 18px 24px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid var(--border-color);
        }

        .ymt-form {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 6px 6px 6px 18px;
            align-items: center;
            transition: all 0.3s ease;
        }

        .ymt-form:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 18px rgba(0, 118, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .ymt-form input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
        }

        .ymt-form input::placeholder {
            color: var(--text-muted);
        }

        .submit-btn {
            width: 42px;
            height: 42px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer-credits {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* Loading Indicator */
        .loader-dots {
            display: flex;
            gap: 6px;
            padding: 8px 4px;
            align-items: center;
        }

        .loader-dots span {
            width: 7px;
            height: 7px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: pulseDots 1.4s infinite ease-in-out both;
        }

        .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loader-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulseDots {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 600px) {
            .ymt-container { height: 98vh; border-radius: 20px; }
            .msg-row { max-width: 92%; }
            .ymt-header { padding: 14px 18px; }
            .ymt-chat-box { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="ymt-container">
    <!-- Header -->
    <div class="ymt-header">
        <div class="brand-info">
            <div class="brand-icon"><i class="fa-solid fa-brain"></i></div>
            <div class="brand-text">
                <h2>YMT HUB AI</h2>
                <p>Muallif: <span>Shohjahon Mahkamov</span></p>
            </div>
        </div>
        <div class="status-tag">
            <div class="status-dot"></div> Online
        </div>
    </div>

    <!-- Chat Log -->
    <div class="ymt-chat-box" id="chatBox">
        <div class="msg-row ai-side">
            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="msg-bubble">
                Salom! Men <strong>YMT HUB AI</strong> intellektual yordamchisiman. Yaratuvchim — <strong>Shohjahon Mahkamov</strong>. Sizga qanday yordam bera olaman?
            </div>
        </div>
    </div>

    <!-- Form / Input -->
    <div class="ymt-form-container">
        <form class="ymt-form" id="aiForm" onsubmit="handleFormSubmit(event)">
            <input type="text" id="userInput" placeholder="Savolingizni yozing..." autocomplete="off">
            <button type="submit" class="submit-btn" id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
        <div class="footer-credits">
            YMT HUB AI • Yaratuvchi: Shohjahon Mahkamov
        </div>
    </div>
</div>

<script>
    // 🔑 API KALITINGIZ
    const GEMINI_API_KEY = "AQ.Ab8RN6LizocTtbaNrFJL1xc7V4HcuLMtG3rJ0iHcNvRTdcZp6A";

    // 🚀 Google AI stolidagi eng so'nggi va zaxira modellar ro'yxati
    const MODELS = ["gemini-3.6-flash", "gemini-3.8-flash", "gemini-2.0-flash"];

    const SYSTEM_PROMPT = "Isming YMT HUB AI. Yaratuvching va muallifing Shohjahon Mahkamov. Foydalanuvchi bilan do'stona, aniq va chiroyli muloqot qil.";

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function handleFormSubmit(e) {
        e.preventDefault();
        
        const messageText = userInput.value.trim();
        if (!messageText) return;

        // 1. Foydalanuvchi xabarini ko'rsatish
        addMessage("user", escapeHTML(messageText));
        userInput.value = "";
        sendBtn.disabled = true;

        // 2. Loader chiqarish
        const loaderId = showLoader();

        let responseText = null;
        let lastError = null;

        // Zaxira modellar bo'ylab birma-bir so'rov yuborib ko'rish
        for (const model of MODELS) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: "user",
                                parts: [{ text: `${SYSTEM_PROMPT}\n\nFoydalanuvchi savoli: ${messageText}` }]
                            }
                        ]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        responseText = data.candidates[0].content.parts[0].text;
                        break; // Ishlasa, siklni to'xtatadi
                    }
                } else {
                    const errData = await response.json();
                    lastError = errData.error?.message || "Model xatosi";
                }
            } catch (err) {
                lastError = err.message;
            }
        }

        removeLoader(loaderId);

        if (responseText) {
            addMessage("ai", formatMarkdown(responseText));
        } else {
            addMessage("ai", "❌ <strong>Xatolik:</strong> " + (lastError || "API'dan javob olib bo'lmadi. Keyinroq urinib ko'ring."));
        }

        sendBtn.disabled = false;
    }

    function addMessage(role, html) {
        const row = document.createElement("div");
        row.className = `msg-row ${role}-side`;

        const avatar = document.createElement("div");
        avatar.className = "msg-avatar";
        avatar.innerHTML = role === "user" ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.innerHTML = html;

        row.appendChild(avatar);
        row.appendChild(bubble);
        chatBox.appendChild(row);

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showLoader() {
        const id = "loader-" + Date.now();
        const row = document.createElement("div");
        row.className = "msg-row ai-side";
        row.id = id;

        row.innerHTML = `
            <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="msg-bubble">
                <div class="loader-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        `;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    function removeLoader(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function formatMarkdown(text) {
        return text
            .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\n/g, '<br>');
    }
</script>

</body>
</html>
