<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — Geografiya (8-sinf)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D47A1;
            --secondary: #009688;
            --accent: #FFC107;
            --light: #FFFFFF;
            --bg: #E3F2FD;
            --text: #0D47A1;
            --card: #FFFFFF;
            --shadow: 0 12px 30px rgba(13, 71, 161, 0.15);
            --border: #BBDEFB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #b3e5fc);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), #0D47A1);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.3rem;
            margin: 15px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.6;
            opacity: 0.95;
        }

        #globe-logo {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            position: relative;
        }

        #globe-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.2));
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 28px;
            color: var(--primary);
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 24px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: #E3F2FD;
            color: #0D47A1;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-message .message-bubble {
            background: #F8F9FA;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--primary);
        }

        /* === LOCATION STYLE === */
        .location {
            background: #E1F5FE;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #01579B;
        }

        /* === FACT EXAMPLE === */
        .fact {
            margin: 12px 0;
            padding: 10px;
            background: #E0F7FA;
            border-left: 3px solid var(--secondary);
            border-radius: 6px;
            font-size: 14px;
            color: #006064;
            font-style: italic;
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 16px;
            border: none;
            border-radius: 28px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(13,71,161,0.2);
        }

        .quick-button:hover {
            background: #0D47A1;
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(13,71,161,0.3);
        }

        .home-button {
            background: #616161 !important;
        }

        .home-button:hover {
            background: #424242 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #757575;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ANIMATION */
        #chatbot-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #chatbot-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="globe-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/>
                <path d="M12 3V21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M3 12H21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M7 4C8.5 6 10 9 10 12C10 15 8.5 18 7 20" stroke="white" stroke-width="1.5"/>
                <path d="M17 4C15.5 6 14 9 14 12C14 15 15.5 18 17 20" stroke="white" stroke-width="1.5"/>
            </svg>
        </div>
        <h1>AI Ustoz — Geografiya</h1>
        <p>8-sinf uchun: O'zbekiston, iqlim, relyef, aholi, foydali qazilmalar — butun dunyo bitta oynada!</p>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container" class="hidden">
        <div id="header">
            <div id="ai-avatar">🌍</div>
            <h2>Geografiya Yordamchisi</h2>
        </div>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="quick-buttons"></div>
            <div class="footer-note">8-sinf darsligiga mos — O'zbekiston geografiyasi, iqlim, aholi, ekologiya</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const quickButtonsContainer = document.getElementById('quick-buttons');
        const introSplash = document.getElementById('intro-splash');
        const chatbotContainer = document.getElementById('chatbot-container');

        // ✅ Geografiya ma'lumotlar bazasi (8-sinf darsligiga mos) — BARCHA "text:" TO'G'RILANDI!
        const database = {
            "main_menu": {
                text: "Salom! Dunyoga sayohat qilishga tayyormisiz? Qaysi mavzu qiziqarli?",
                buttons: [
                    { text: "🏔️ Relyef", key: "relyef" },
                    { text: "🌤️ Iqlim", key: "iqlim" },
                    { text: "🌊 Daryo & Ko'l", key: "daryo_kol" },
                    { text: "👥 Aholi", key: "aholi" },
                    { text: "⛏️ Foydali qazilmalar", key: "foy_qazilma" },
                    { text: "🌱 Ekologiya", key: "ekologiya" },
                    { text: "📝 Testlar", key: "test_menu" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "relyef": {
                text: "Relyef — yer yuzining shakllari. O'zbekistonda qanday?",
                buttons: [
                    { text: "Toshkent tekisligi", key: "toshkent_tekis" },
                    { text: "Pamir-Alay", key: "pamir_alay" },
                    { text: "Qizilqum sahrosi", key: "qizilqum" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "toshkent_tekis": {
                text: "<span class='location'>Toshkent tekisligi</span> — O'rta Osiyoning eng unumdor hududlaridan biri. Fergana vodiysi bilan bog'langan.",
                buttons: [{ text: "⬅️ Orqaga", key: "relyef", isHome: true }]
            },
            "pamir_alay": {
                text: "<span class='location'>Pamir-Alay</span> — baland tog'liklar. Gissar, Zarafshon, Turon — O'zbekistonning janubiy qismi.",
                buttons: [{ text: "⬅️ Orqaga", key: "relyef", isHome: true }]
            },
            "qizilqum": {
                text: "<span class='location'>Qizilqum sahrosi</span> — O'rta Osiyoning eng katta sahrosi. 290 ming km². Kum, qum, issiq.",
                buttons: [{ text: "⬅️ Orqaga", key: "relyef", isHome: true }]
            },
            "iqlim": {
                text: "O'zbekiston — quruq kontinental iqlim. Qish sovuq, yoz issiq.",
                buttons: [
                    { text: "Yozgi harorat", key: "yoz" },
                    { text: "Qishki harorat", key: "qish" },
                    { text: "Namlik", key: "namlik" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "yoz": {
                text: "Yozda harorat +35°C gacha ko'tariladi. Qizilqumda +45°C ham bo'ladi!",
                buttons: [{ text: "⬅️ Orqaga", key: "iqlim", isHome: true }]
            },
            "qish": {
                text: "Qishda harorat –5°C dan –15°C gacha pasayadi. Toshkentda orta qish — –2°C.",
                buttons: [{ text: "⬅️ Orqaga", key: "iqlim", isHome: true }]
            },
            "namlik": {
                text: "O'rtacha namlik — 40-50%. Sahrolarda 20% atrofida. Bu yerda suv muhim resurs.",
                buttons: [{ text: "⬅️ Orqaga", key: "iqlim", isHome: true }]
            },
            "daryo_kol": {
                text: "O'zbekistondagi asosiy daryolar — Amudaryo, Sirdaryo. Ko'llar — Navbahor, Sudochie.",
                buttons: [
                    { text: "Amudaryo", key: "amudaryo" },
                    { text: "Sirdaryo", key: "sirdaryo" },
                    { text: "Ko'llar", key: "kollar" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "amudaryo": {
                text: "<span class='location'>Amudaryo</span> — O'zbekistonning janubini kesib o'tadi. Tojikistondan keladi, Aral dengiziga quyilgan.",
                buttons: [{ text: "⬅️ Orqaga", key: "daryo_kol", isHome: true }]
            },
            "sirdaryo": {
                text: "<span class='location'>Sirdaryo</span> — shimoldan janubga. Farg'ona vodiysidan chiqadi, Qoraqalpog'istonga kiradi.",
                buttons: [{ text: "⬅️ Orqaga", key: "daryo_kol", isHome: true }]
            },
            "kollar": {
                text: "<span class='fact'>Qiziq fakt: Navbahor ko'li — O'zbekistondagi eng katta sun'iy suv havzasi.</span>",
                buttons: [{ text: "⬅️ Orqaga", key: "daryo_kol", isHome: true }]
            },
            "aholi": {
                text: "O'zbekistonda 36 milliondan ortiq odam yashaydi. Aholi zichligi — 80 kishi/km².",
                buttons: [
                    { text: "Shahar aholisi", key: "shahar_aholi" },
                    { text: "Qishloq aholisi", key: "qishloq_aholi" },
                    { text: "Millatlar", key: "millatlar" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "shahar_aholi": {
                text: "Aholining 50% dan ortig'i shaharlarda yashaydi. Toshkent — 2.5 million kishi.",
                buttons: [{ text: "⬅️ Orqaga", key: "aholi", isHome: true }]
            },
            "qishloq_aholi": {
                text: "Qishloq aholisi — dehqonchilik, chorvachilik bilan shug'ullanadi.",
                buttons: [{ text: "⬅️ Orqaga", key: "aholi", isHome: true }]
            },
            "millatlar": {
                text: "Asosiy millatlar: o'zbeklar (80%), ruslar, tatarlar, qirg'izlar, tojiklar.",
                buttons: [{ text: "⬅️ Orqaga", key: "aholi", isHome: true }]
            },
            "foy_qazilma": {
                text: "O'zbekistonda boy foydali qazilmalar konlari bor.",
                buttons: [
                    { text: "Mingbuloq (oltin)", key: "mingbuloq" },
                    { text: "Navoiy (mis)", key: "navoiy_mis" },
                    { text: "Neft & Gaz", key: "neft_gaz" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "mingbuloq": {
                text: "<span class='location'>Mingbuloq</span> — O'zbekistonning eng katta oltin koni. Jami fondi — 100 tonna.",
                buttons: [{ text: "⬅️ Orqaga", key: "foy_qazilma", isHome: true }]
            },
            "navoiy_mis": {
                text: "<span class='location'>Navoiy viloyati</span> — keng miqdorda mis, uran, molibden konlari bor.",
                buttons: [{ text: "⬅️ Orqaga", key: "foy_qazilma", isHome: true }]
            },
            "neft_gaz": {
                text: "Gaz — Qoraqalpog'istonda (Shurtan), neft — Farg'onada qazib olinadi.",
                buttons: [{ text: "⬅️ Orqaga", key: "foy_qazilma", isHome: true }]
            },
            "ekologiya": {
                text: "Ekologik muammolar — Aral dengizi, suv yetishmasligi, havza ifloslanishi.",
                buttons: [
                    { text: "Aral dengizi", key: "aral" },
                    { text: "Suv muammo", key: "suv_muammo" },
                    { text: "Yashil energiya", key: "yashil_energiya" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "aral": {
                text: "<span class='fact'>Qiziq fakt: Aral dengizi 1960-yillarda dunyoning 4-teng katta ko'li edi. Hozir 10% qoldi.</span>",
                buttons: [{ text: "⬅️ Orqaga", key: "ekologiya", isHome: true }]
            },
            "suv_muammo": {
                text: "Suv resurslari cheklangan. Amudaryo va Sirdaryo suvi qishloq xo'jaligida sarf bo'ladi.",
                buttons: [{ text: "⬅️ Orqaga", key: "ekologiya", isHome: true }]
            },
            "yashil_energiya": {
                text: "O'zbekiston quyosh va shamol energiyasini rivojlantiryapti. 2030-yilgacha 25% elektr energiya yashil manbadan olish reja.",
                buttons: [{ text: "⬅️ Orqaga", key: "ekologiya", isHome: true }]
            },
            "test_menu": {
                text: "Test tanlang:",
                buttons: [
                    { text: "Relyef", key: "test_relyef" },
                    { text: "Iqlim", key: "test_iqlim" },
                    { text: "Aholi", key: "test_aholi" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "test_relyef": {
                text: "1. O'zbekistonning eng katta sahrosi?\nA) Karakum   B) Qizilqum   C) Dashti-navod",
                buttons: [
                    { text: "A) Karakum", key: "test_relyef_a" },
                    { text: "B) Qizilqum", key: "test_relyef_b" },
                    { text: "C) Dashti-navod", key: "test_relyef_c" }
                ]
            },
            "test_relyef_b": {
                text: "✅ To'g'ri! Qizilqum — O'zbekistonning eng katta sahrosi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_iqlim": {
                text: "2. O'zbekistonda iqlim turi?\nA) Mo'tadil   B) Kontinental   C) Subekvatorial",
                buttons: [
                    { text: "A) Mo'tadil", key: "test_iqlim_a" },
                    { text: "B) Kontinental", key: "test_iqlim_b" },
                    { text: "C) Subekvatorial", key: "test_iqlim_c" }
                ]
            },
            "test_iqlim_b": {
                text: "✅ Ajoyib! O'zbekiston — quruq kontinental iqlimga ega.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_aholi": {
                text: "3. O'zbekistonda aholi soni?\nA) 20 million   B) 30 million   C) 36 million",
                buttons: [
                    { text: "A) 20 million", key: "test_aholi_a" },
                    { text: "B) 30 million", key: "test_aholi_b" },
                    { text: "C) 36 million", key: "test_aholi_c" }
                ]
            },
            "test_aholi_c": {
                text: "✅ To'g'ri! 2025-yilda O'zbekistonda 36 milliondan ortiq odam yashaydi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            let processedText = next.text
                                .replace(/<span class='([^']+)'>/g, '<span class="$1">')
                                .replace(/<\/span>/g, '</span>');
                            addMessage(processedText, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Bu mavzu hozircha mavjud emas.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                setTimeout(() => {
                    chatbotContainer.classList.add('show');
                    addMessage(database.main_menu.text, 'ai');
                    showButtons('main_menu');
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
