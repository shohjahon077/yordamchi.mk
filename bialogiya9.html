<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — Biologiya (9-sinf)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D47A1;
            --secondary: #009688;
            --accent: #FFC107;
            --light: #FFFFFF;
            --bg: #E3F2FD;
            --text: #0D47A1;
            --card: #FFFFFF;
            --shadow: 0 12px 30px rgba(13, 71, 161, 0.15);
            --border: #BBDEFB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #b3e5fc);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), #0D47A1);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.3rem;
            margin: 15px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.6;
            opacity: 0.95;
        }

        #globe-logo {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            position: relative;
        }

        #globe-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.2));
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 28px;
            color: var(--primary);
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 24px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: #E3F2FD;
            color: #0D47A1;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-message .message-bubble {
            background: #F8F9FA;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--primary);
        }

        /* === LOCATION STYLE === */
        .location {
            background: #E1F5FE;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #01579B;
        }

        /* === FACT EXAMPLE === */
        .fact {
            margin: 12px 0;
            padding: 10px;
            background: #E0F7FA;
            border-left: 3px solid var(--secondary);
            border-radius: 6px;
            font-size: 14px;
            color: #006064;
            font-style: italic;
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 16px;
            border: none;
            border-radius: 28px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(13,71,161,0.2);
        }

        .quick-button:hover {
            background: #0D47A1;
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(13,71,161,0.3);
        }

        .home-button {
            background: #616161 !important;
        }

        .home-button:hover {
            background: #424242 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #757575;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ANIMATION */
        #chatbot-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #chatbot-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="globe-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/>
                <path d="M12 3V21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M3 12H21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M7 4C8.5 6 10 9 10 12C10 15 8.5 18 7 20" stroke="white" stroke-width="1.5"/>
                <path d="M17 4C15.5 6 14 9 14 12C14 15 15.5 18 17 20" stroke="white" stroke-width="1.5"/>
            </svg>
        </div>
        <h1>AI Ustoz — Biologiya</h1>
        <p>9-sinf uchun: Hujayra, DNK, genetika, irsiylik, organizmlar tuzilishi, evolyutsiya — barchasi bir joyda!</p>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container" class="hidden">
        <div id="header">
            <div id="ai-avatar">🧬</div>
            <h2>Biologiya Yordamchisi</h2>
        </div>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="quick-buttons"></div>
            <div class="footer-note">9-sinf darsligiga mos — Hujayra, DNK, genetika, irsiylik, o'zgaruvchanlik, evolyutsiya, ekologiya</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const quickButtonsContainer = document.getElementById('quick-buttons');
        const introSplash = document.getElementById('intro-splash');
        const chatbotContainer = document.getElementById('chatbot-container');

        // ✅ BIOLOGIYA ma'lumotlar bazasi (9-sinf darsligiga mos) — BARCHA "text:" TO'G'RILANDI!
        const database = {
            "main_menu": {
                text: "Salom! Biologiya — hayot haqidagi fan! Qaysi mavzu qiziqarli?",
                buttons: [
                    { text: "🔬 Hujayra", key: "hujayra" },
                    { text: "🧬 DNK va RNT", key: "dnk_rnt" },
                    { text: "🧫 Genetika", key: "genetika" },
                    { text: "🧬 Irsiylik", key: "irsiylik" },
                    { text: "🔄 O'zgaruvchanlik", key: "ozgaruvchanlik" },
                    { text: "🌍 Evolyutsiya", key: "evolyutsiya" },
                    { text: "🌿 Ekologiya", key: "ekologiya" },
                    { text: "📝 Testlar", key: "test_menu" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "hujayra": {
                text: "Hujayra — tirik mavjudotning asosiy tuzilish birligi. Qanday tuzilgan?",
                buttons: [
                    { text: "Hujayra qobiq", key: "hujayra_qobiq" },
                    { text: "Sitoplazma", key: "sitoplazma" },
                    { text: "Yadro", key: "yadro" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "hujayra_qobiq": {
                text: "<span class='location'>Hujayra qobiq</span> — hujayrani himoya qiladi. O'simliklarda qattiq (ko'pchik), hayvonlarda yumshoq.",
                buttons: [{ text: "⬅️ Orqaga", key: "hujayra", isHome: true }]
            },
            "sitoplazma": {
                text: "<span class='location'>Sitoplazma</span> — suv, oqsil, yog', karbohidratli aralashma. Barcha hujayra jarayonlari shu yerda sodir bo'ladi.",
                buttons: [{ text: "⬅️ Orqaga", key: "hujayra", isHome: true }]
            },
            "yadro": {
                text: "<span class='location'>Yadro</span> — hujayraning boshqaruv markazi. DNK ham yadroni tashkil qiladi. Barcha ma'lumot yadroni o'z ichiga olgan.",
                buttons: [{ text: "⬅️ Orqaga", key: "hujayra", isHome: true }]
            },
            "dnk_rnt": {
                text: "DNK — tirik mavjudotlarning irsiy ma'lumotini saqlaydi. RNT esa ma'lumotni yadrodan ribosomaga yetkazadi.",
                buttons: [
                    { text: "DNK tuzilishi", key: "dnk_tuzilishi" },
                    { text: "RNT turlari", key: "rnt_turlari" },
                    { text: "Gen nima?", key: "gen_nima" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "dnk_tuzilishi": {
                text: "<span class='location'>DNK</span> — spiral shakldagi molekula. Asosiy qism — nukleotidlar. Ular: adenin (A), timin (T), guanin (G), tsitozin (C).",
                buttons: [{ text: "⬅️ Orqaga", key: "dnk_rnt", isHome: true }]
            },
            "rnt_turlari": {
                text: "<span class='location'>RNT turlari</span>: MRNT (xabar beruvchi), TRNT (tashlovchi), RRNT (ribosomal). Hammasi oqsil sintezida ishtirok etadi.",
                buttons: [{ text: "⬅️ Orqaga", key: "dnk_rnt", isHome: true }]
            },
            "gen_nima": {
                text: "<span class='fact'>Qiziq fakt: Bir gen — bir oqsil sintezini boshqaradi. Inson DNKida taxminan 20 000–25 000 ta gen mavjud.</span>",
                buttons: [{ text: "⬅️ Orqaga", key: "dnk_rnt", isHome: true }]
            },
            "genetika": {
                text: "Genetika — irsiylik va o'zgaruvchanlik haqidagi fan. Asoschisi — Gregor Mendel.",
                buttons: [
                    { text: "Mendel qonunlari", key: "mendel_qonunlari" },
                    { text: "Dominant va retsessiv", key: "dominant_retsessiv" },
                    { text: "Genotip va fenotip", key: "genotip_fenotip" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "mendel_qonunlari": {
                text: "<span class='location'>Mendelning 1-qonuni</span>: birinchi avlodda faqat dominant belgi namoyon bo'ladi. Masalan: yashil don × sariq don → barcha sariq.",
                buttons: [{ text: "⬅️ Orqaga", key: "genetika", isHome: true }]
            },
            "dominant_retsessiv": {
                text: "<span class='location'>Dominant</span> — namoyon bo'ladigan belgi (A). <span class='location'>Retsessiv</span> — yashirin belgi (a). Faqat aa bo'lganda namoyon bo'ladi.",
                buttons: [{ text: "⬅️ Orqaga", key: "genetika", isHome: true }]
            },
            "genotip_fenotip": {
                text: "<span class='location'>Genotip</span> — genlar to'plami (masalan: Aa). <span class='location'>Fenotip</span> — tashqi ko'rinish (masalan: sariq rang).",
                buttons: [{ text: "⬅️ Orqaga", key: "genetika", isHome: true }]
            },
            "irsiylik": {
                text: "Irsiylik — bolaga ota-onadan o'tadigan xususiyatlar. Qanday o'tadi?",
                buttons: [
                    { text: "Xromosomalar", key: "xromosomalar" },
                    { text: "Jinsiy belgilar", key: "jinsiy_belgilar" },
                    { text: "Gemofiliya", key: "gemofiliya" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "xromosomalar": {
                text: "<span class='location'>Xromosomalar</span> — DNKning zichlangan shakli. Insonda 46 ta (23 juft). 22 juft — jismoniy, 1 juft — jinsiy (XX yoki XY).",
                buttons: [{ text: "⬅️ Orqaga", key: "irsiylik", isHome: true }]
            },
            "jinsiy_belgilar": {
                text: "Ayol — XX, erkak — XY. Jins — otasining sperma hujayrasidagi xromosomaga bog'liq.",
                buttons: [{ text: "⬅️ Orqaga", key: "irsiylik", isHome: true }]
            },
            "gemofiliya": {
                text: "<span class='fact'>Qiziq fakt: Gemofiliya — jinsga bog'liq irsiy kasallik. Xromosomada retsessiv gen orqali o'tadi. Ko'pincha erkaklarda uchraydi.</span>",
                buttons: [{ text: "⬅️ Orqaga", key: "irsiylik", isHome: true }]
            },
            "ozgaruvchanlik": {
                text: "O'zgaruvchanlik — tirik mavjudotlarning o'zgarish qobiliyati. Ikkita turi bor.",
                buttons: [
                    { text: "Irsiy emas o'zgaruvchanlik", key: "irsiy_emas" },
                    { text: "Irsiy o'zgaruvchanlik", key: "irsiy_ozgaruvchanlik" },
                    { text: "Mutatsiya", key: "mutatsiya" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "irsiy_emas": {
                text: "<span class='location'>Irsiy emas o'zgaruvchanlik</span> — tashqi muhit ta'sirida (quyosh, ovqat). Irsiy ma'lumotga ta'sir qilmaydi.",
                buttons: [{ text: "⬅️ Orqaga", key: "ozgaruvchanlik", isHome: true }]
            },
            "irsiy_ozgaruvchanlik": {
                text: "<span class='location'>Irsiy o'zgaruvchanlik</span> — genlarda o'zgarish sodir bo'ladi. Masalan: mutatsiya, kombinatsiya.",
                buttons: [{ text: "⬅️ Orqaga", key: "ozgaruvchanlik", isHome: true }]
            },
            "mutatsiya": {
                text: "<span class='location'>Mutatsiya</span> — DNKda tasodifiy o'zgarish. Nurlanish, viruslar, kimyoviy moddalar sababli bo'ladi.",
                buttons: [{ text: "⬅️ Orqaga", key: "ozgaruvchanlik", isHome: true }]
            },
            "evolyutsiya": {
                text: "Evolyutsiya — tirik mavjudotlarning vaqt o'tishi bilan o'zgarib borishi. Asoschisi — Charles Darwin.",
                buttons: [
                    { text: "Tabiiy tanlanish", key: "tabiiy_tanlanish" },
                    { text: "Tur tushunchasi", key: "tur_tushunchasi" },
                    { text: "Homo sapiens", key: "homo_sapiens" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "tabiiy_tanlanish": {
                text: "<span class='location'>Tabiiy tanlanish</span> — atrof-muhitga mos keladiganlar yashab qoladi. Darwinning asosiy g'oyasi.",
                buttons: [{ text: "⬅️ Orqaga", key: "evolyutsiya", isHome: true }]
            },
            "tur_tushunchasi": {
                text: "<span class='location'>Tur</span> — bir-biri bilan urug'lanadigan, o'xshash xususiyatlarga ega bo'lgan organizmlar guruhidir.",
                buttons: [{ text: "⬅️ Orqaga", key: "evolyutsiya", isHome: true }]
            },
            "homo_sapiens": {
                text: "<span class='fact'>Qiziq fakt: Homo sapiens — aqlli inson. 200 000 yil oldin Afrikada paydo bo'lgan. Bugungi insonning to'g'ridan-to'g'ri ajdudi.</span>",
                buttons: [{ text: "⬅️ Orqaga", key: "evolyutsiya", isHome: true }]
            },
            "ekologiya": {
                text: "Ekologiya — organizmlar bilan atrof-muhit o'rtasidagi munosabatlarni o'rganadi.",
                buttons: [
                    { text: "Ekotizim", key: "ekotizim" },
                    { text: "Oziqlanish zanjiri", key: "oziqlanish_zanjiri" },
                    { text: "Biodiversitet", key: "biodiversitet" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "ekotizim": {
                text: "<span class='location'>Ekotizim</span> — tirik (o'simlik, hayvon) va notirik (havo, suv, tuproq) komponentlarning o'zaro bog'lanishi.",
                buttons: [{ text: "⬅️ Orqaga", key: "ekologiya", isHome: true }]
            },
            "oziqlanish_zanjiri": {
                text: "Oziqlanish zanjiri: o'simlik → o'txo'r hayvon → go'shtxo'r → parchalanuvchi mikroorganizmlar.",
                buttons: [{ text: "⬅️ Orqaga", key: "ekologiya", isHome: true }]
            },
            "biodiversitet": {
                text: "<span class='location'>Biodiversitet</span> — tirik mavjudotlarning xilma-xilligi. O'zbekistonda — 18 000 o'simlik, 3 000 hayvon turi mavjud.",
                buttons: [{ text: "⬅️ Orqaga", key: "ekologiya", isHome: true }]
            },
            "test_menu": {
                text: "Test tanlang:",
                buttons: [
                    { text: "Hujayra", key: "test_hujayra" },
                    { text: "Genetika", key: "test_genetika" },
                    { text: "Evolyutsiya", key: "test_evolyutsiya" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "test_hujayra": {
                text: "1. Hujayraning boshqaruv markazi nima?\nA) Sitoplazma   B) Mitoxondriya   C) Yadro",
                buttons: [
                    { text: "A) Sitoplazma", key: "test_hujayra_a" },
                    { text: "B) Mitoxondriya", key: "test_hujayra_b" },
                    { text: "C) Yadro", key: "test_hujayra_c" }
                ]
            },
            "test_hujayra_c": {
                text: "✅ To'g'ri! Yadro — hujayraning boshqaruv markazi, unda DNK saqlanadi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_genetika": {
                text: "2. Mendelning 1-qonuni nima haqida?\nA) Faqat dominant belgi namoyon bo'ladi   B) Retsessiv belgi doim namoyon bo'ladi   C) Ota-ona belgilari aralashadi",
                buttons: [
                    { text: "A) Faqat dominant belgi namoyon bo'ladi", key: "test_genetika_a" },
                    { text: "B) Retsessiv belgi doim namoyon bo'ladi", key: "test_genetika_b" },
                    { text: "C) Ota-ona belgilari aralashadi", key: "test_genetika_c" }
                ]
            },
            "test_genetika_a": {
                text: "✅ Ajoyib! Mendelning 1-qonuni: birinchi avlodda faqat dominant belgi namoyon bo'ladi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_evolyutsiya": {
                text: "3. Homo sapiens qayerda paydo bo'lgan?\nA) Yevropa   B) Afrika   C) Osiyo",
                buttons: [
                    { text: "A) Yevropa", key: "test_evolyutsiya_a" },
                    { text: "B) Afrika", key: "test_evolyutsiya_b" },
                    { text: "C) Osiyo", key: "test_evolyutsiya_c" }
                ]
            },
            "test_evolyutsiya_b": {
                text: "✅ To'g'ri! Homo sapiens — 200 000 yil oldin Afrikada paydo bo'lgan. Barcha insonlarning ajdudi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            let processedText = next.text
                                .replace(/<span class='([^']+)'>/g, '<span class="$1">')
                                .replace(/<\/span>/g, '</span>');
                            addMessage(processedText, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Bu mavzu hozircha mavjud emas.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                setTimeout(() => {
                    chatbotContainer.classList.add('show');
                    addMessage(database.main_menu.text, 'ai');
                    showButtons('main_menu');
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
