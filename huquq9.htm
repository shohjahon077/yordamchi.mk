<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — Huquq (9-sinf)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1A237E; /* Ko'k — huquq va adolat uchun */
            --secondary: #303F9F;
            --accent: #FFD54F; /* Sarg'ish — adolat va ochiqlik */
            --light: #FFFFFF;
            --bg: #E8EAF6;
            --text: #1A237E;
            --card: #FFFFFF;
            --shadow: 0 12px 30px rgba(26, 35, 126, 0.15);
            --border: #D1C4E9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8eaf6, #d1c4e9);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), #1A237E);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.3rem;
            margin: 15px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.6;
            opacity: 0.95;
        }

        #globe-logo {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            position: relative;
        }

        #globe-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.2));
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 28px;
            color: var(--primary);
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 24px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: #E8EAF6;
            color: #1A237E;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-message .message-bubble {
            background: #F8F9FA;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--primary);
        }

        /* === HUQUQ STYLE === */
        .huquq {
            background: #E8EAF6;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #303F9F;
        }

        /* === EXAMPLE STYLE === */
        .example {
            margin: 12px 0;
            padding: 10px;
            background: #EDE7F6;
            border-left: 3px solid var(--secondary);
            border-radius: 6px;
            font-size: 14px;
            color: #1A237E;
            font-style: italic;
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 16px;
            border: none;
            border-radius: 28px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(26,35,126,0.2);
        }

        .quick-button:hover {
            background: #1A237E;
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(26,35,126,0.3);
        }

        .home-button {
            background: #616161 !important;
        }

        .home-button:hover {
            background: #424242 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #757575;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ANIMATION */
        #chatbot-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #chatbot-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="globe-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/>
                <path d="M12 3V21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M3 12H21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M7 4C8.5 6 10 9 10 12C10 15 8.5 18 7 20" stroke="white" stroke-width="1.5"/>
                <path d="M17 4C15.5 6 14 9 14 12C14 15 15.5 18 17 20" stroke="white" stroke-width="1.5"/>
            </svg>
        </div>
        <h1>AI Ustoz — Huquq</h1>
        <p>9-sinf uchun: Konstitutsiya, inson huquqlari, fuqarolik, jinoyat — huquq dunyosiga xush kelibsiz!</p>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container" class="hidden">
        <div id="header">
            <div id="ai-avatar">⚖️</div>
            <h2>Huquq Yordamchisi</h2>
        </div>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="quick-buttons"></div>
            <div class="footer-note">9-sinf darsligiga mos — Konstitutsiya, inson huquqlari, fuqarolik, jinoyat, mehnat huquqi</div>
        </div>
    </div>

    <script>

        // ✅ Huquq faniga oid ma'lumotlar bazasi (9-sinf darsligi asosida)

            "main_menu": {

                    { text: "💼 Mehnat huquqi", key: "mehnat" },

                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "konstitutsiya": {

                    { text: "Hukumat tuzilishi", key: "hukumat" },
                    { text: "Huquqni amalga oshirish", key: "amalga_oshirish" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "tamoyillar": {
                text: "<span class='huquq'>Konstitutsiya tamoyillari:</span><br>• Demokratiya — xalq hokimiyati<br>• Huquqning ustunligi — barcha hukumat qonunlari Konstitutsiyaga mos bo'lishi kerak<br>• Inson huquqlari — himoyalangan<br>• Ajratilgan hukumat — qonunchilik, ijro, sud",
                buttons: [{ text: "⬅️ Orqaga", key: "konstitutsiya", isHome: true }]
            },
            "hukumat": {
                text: "<span class='huquq'>Hukumat tuzilishi:</span><br>• Oliy Majlis — qonun chiqaradi (Senat + Kengash)<br>• Prezident — boshqaruv boshlig'i<br>• Hukumat — ijro hokimiyati<br>• Sudlar — adolatni ta'minlaydi",
                buttons: [{ text: "⬅️ Orqaga", key: "konstitutsiya", isHome: true }]
            },
            "amalga_oshirish": {
                text: "<span class='example'>Huquqni amalga oshirish:</span><br>• O‘zbekistonda — Konstitutsiya sudlar tomonidan himoya qilinadi<br>• Fuqarolar — qonunga amal qilish, huquqlarini himoya qilish<br>• O‘z huquqlarini bilish — eng muhim qadam",
                buttons: [{ text: "⬅️ Orqaga", key: "konstitutsiya", isHome: true }]
            },
            "inson_huquq": {
                text: "Inson huquqlari — har bir kishining tabiiy huquqlari. Ularni qo‘llab-quvvatlaydigan hujjatlar:",
                buttons: [
                    { text: "BMT hujjatlari", key: "bmt" },
                    { text: "O‘zbekistonda huquqlar", key: "oz_huquq" },
                    { text: "Bolalar huquqlari", key: "bolalar" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "bmt": {
                text: "<span class='huquq'>BMT hujjatlari:</span><br>• Umumiy inson huquqlari deklaratsiyasi (1948)<br>• Shaxsiy va siyosiy huquqlar bo‘yicha xalqaro paktda (1966)<br>• Iqtisodiy, ijtimoiy va madaniy huquqlar bo‘yicha paktda",
                buttons: [{ text: "⬅️ Orqaga", key: "inson_huquq", isHome: true }]
            },
            "oz_huquq": {
                text: "<span class='example'>O‘zbekistonda inson huquqlari:</span><br>• Hayotga haq — 15-bob<br>• O‘z fikrini aytish — 27-bob<br>• Ta’limga haq — 43-bob<br>• Mehnatga haq — 44-bob<br>• O‘zining qo‘shimcha huquqlari — Konstitutsiyada keltirilgan",
                buttons: [{ text: "⬅️ Orqaga", key: "inson_huquq", isHome: true }]
            },
            "bolalar": {
                text: "<span class='huquq'>Bolalar huquqlari:</span><br>• Hayotga haq<br>• Ta’limga haq<br>• O‘z fikrini aytish huquqi<br>• Himoyalanganlik — ota-onaga qarshi zoravonlik taqiqlangan<br>• O‘zbekistonda — Bolalar huquqlari to‘g‘risida qonun (2019)",
                buttons: [{ text: "⬅️ Orqaga", key: "inson_huquq", isHome: true }]
            },
            "fuqarolik": {
                text: "Fuqarolik huquqlari — shaxsning jamoat hayotidagi huquqlari.",
                buttons: [
                    { text: "Shaxsiy huquqlar", key: "shaxsiy" },
                    { text: "Ijtimoiy huquqlar", key: "ijtimoiy" },
                    { text: "Moliyaviy huquqlar", key: "moliyaviy" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "shaxsiy": {
                text: "<span class='huquq'>Shaxsiy huquqlar:</span><br>• Hayotga va sog‘liqqa haq<br>• O‘z fikrini aytish va o‘z fikrini bilish<br>• Xususiy hayotga kirishmaslik huquqi<br>• Vatanga qarashli bo‘lish huquqi",
                buttons: [{ text: "⬅️ Orqaga", key: "fuqarolik", isHome: true }]
            },
            "ijtimoiy": {
                text: "<span class='huquq'>Ijtimoiy huquqlar:</span><br>• Ta’limga haq (barcha bolalar — 11 yil ta’lim)<br>• Sog‘liqni saqlash — bepul tibbiy yordam<br>• Ijtimoiy himoya — keksa, nogironlar uchun",
                buttons: [{ text: "⬅️ Orqaga", key: "fuqarolik", isHome: true }]
            },
            "moliyaviy": {
                text: "<span class='huquq'>Moliyaviy huquqlar:</span><br>• Mulkga haq — o‘z mulkini sotish, berish, meros qilish<br>• Ijara va shartnoma tuzish huquqi<br>• Bank hisoblariga haq<br>• O‘z daromadini olish va sarflash",
                buttons: [{ text: "⬅️ Orqaga", key: "fuqarolik", isHome: true }]
            },
            "jinoyat": {
                text: "Jinoyat huquqi — jinoyatlar va ularga qarshi jazolar to‘g‘risidagi qonun.",
                buttons: [
                    { text: "Jinoyat turlari", key: "jinoyat_turlari" },
                    { text: "Jazolar turlari", key: "jazolar" },
                    { text: "Kichik yoshli jinoyatchilar", key: "kichik_yosh" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "jinoyat_turlari": {
                text: "<span class='huquq'>Asosiy jinoyat turlari:</span><br>• O‘limga olib keluvchi jinoyatlar<br>• O‘g‘rilik, o‘g‘rilik, qo‘lga kiritish<br>• Zoravonlik, jismoniy zarar<br>• O‘ziga qarshi jinoyatlar — qo‘lga kiritish, tuzoq",
                buttons: [{ text: "⬅️ Orqaga", key: "jinoyat", isHome: true }]
            },
            "jazolar": {
                text: "<span class='huquq'>Jazolar turlari:</span><br>• Hovli qamoq (1-10 yil)<br>• Qamoqxonaga yuborish (10+ yil)<br>• O‘lim jazosi — taqiqlangan (2008-yildan)<br>• Jarima — pul jazosi",
                buttons: [{ text: "⬅️ Orqaga", key: "jinoyat", isHome: true }]
            },
            "kichik_yosh": {
                text: "<span class='example'>Kichik yoshli jinoyatchilar (14-18 yosh):</span><br>• Javobgarlik 14 yoshdan boshlanadi<br>• O‘zgarishga yaxshi qarash — qamoq emas, o‘qish, mehnat, psixologik yordam<br>• O‘zbekistonda — O‘zgarish markazlari mavjud",
                buttons: [{ text: "⬅️ Orqaga", key: "jinoyat", isHome: true }]
            },
            "mehnat": {
                text: "Mehnat huquqi — ishlovchi kishining huquqlari.",
                buttons: [
                    { text: "Ishga kirish", key: "ishga_kirish" },
                    { text: "Ish shartlari", key: "ish_shartlari" },
                    { text: "Mehnat shartnomasi", key: "shartnoma" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "ishga_kirish": {
                text: "<span class='huquq'>Ishga kirish:</span><br>• 16 yoshdan ishga kirish mumkin (o‘qishni tugatgach)<br>• 15 yoshdan — yarim vaqt ish, o‘qish bilan birga<br>• 14 yoshdan — o‘quv ishi (mehnat ta’limi)",
                buttons: [{ text: "⬅️ Orqaga", key: "mehnat", isHome: true }]
            },
            "ish_shartlari": {
                text: "<span class='huquq'>Ish shartlari:</span><br>• 40 soatlik ish haftasi<br>• 28 kunlik mehnat qo‘shimcha dam olishi<br>• O‘zgarishga qarshi himoya — tashkilot o‘zgartirish, qo‘shimcha ish<br>• O‘zgarishga qarshi himoya — tashkilot o‘zgartirish, qo‘shimcha ish",
                buttons: [{ text: "⬅️ Orqaga", key: "mehnat", isHome: true }]
            },
            "shartnoma": {
                text: "<span class='example'>Mehnat shartnomasi:</span><br>• Har bir ishga kirganda — shartnoma tuziladi<br>• Shartnoma — qo‘l bilan imzolanadi<br>• Shartnomada: ish joyi, maosh, ish vaqti, dam olish, xavfsizlik<br>• Agar shartnoma bo‘lmasa — ish huquqini himoya qilish qiyin",
                buttons: [{ text: "⬅️ Orqaga", key: "mehnat", isHome: true }]
            },
            "test_menu": {
                text: "Bilimingizni sinab ko'ring:",
                buttons: [
                    { text: "Konstitutsiya testi", key: "test_konstitutsiya" },
                    { text: "Inson huquqlari", key: "test_inson" },
                    { text: "Mehnat huquqi", key: "test_mehnat" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "test_konstitutsiya": {
                text: "1. O‘zbekiston Konstitutsiyasi qachon qabul qilingan?\nA) 1990-yil\nB) 1992-yil\nC) 1995-yil",
                buttons: [
                    { text: "A)", key: "test_konstitutsiya_a" },
                    { text: "B)", key: "test_konstitutsiya_b" },
                    { text: "C)", key: "test_konstitutsiya_c" }

            },

                text: "✅ To'g'ri! O‘zbekiston Konstitutsiyasi 1992-yil 8-dekabrda qabul qilingan.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_inson": {

                buttons: [
                    { text: "A)", key: "test_inson_a" },
                    { text: "B)", key: "test_inson_b" },
                    { text: "C)", key: "test_inson_c" }
                ]
            },
            "test_inson_b": {
                text: "✅ Ajoyib! Inson huquqlari — qonunlar va sudlar tomonidan himoya qilinadi.",

            },
            "test_mehnat": {
                text: "3. 15 yoshli o‘quvchi qanday ishga kirishi mumkin?\nA) Butun kun ishlaydi\nB) Yarim kun ishlaydi, o‘qish bilan birga\nC) Ishga kirish taqiqlangan",
                buttons: [
                    { text: "A)", key: "test_mehnat_a" },
                    { text: "B)", key: "test_mehnat_b" },
                    { text: "C)", key: "test_mehnat_c" }
                ]
            },
            "test_mehnat_b": {
                text: "✅ To'g'ri! 15 yoshli o‘quvchi — yarim kun ishlaydi, o‘qish bilan birga.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            addMessage(next.text, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Bu mavzu hozircha mavjud emas.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                setTimeout(() => {
                    chatbotContainer.classList.add('show');
                    addMessage(database.main_menu.text, 'ai');
                    showButtons('main_menu');
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
