<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Shaxsiyat Tahlili</title>
    <style>
        /* ==================== 1. GLOBAL O'ZGARUVCHILAR VA RANG PALITRASI ==================== */
        :root {
            /* Yorqin (Light) rejim */
            --bg-color: #f0f4f8;
            --container-bg: #ffffff;
            --text-color: #212529;
            --primary-color: #007bff; /* Moviy (Primary) */
            --primary-dark: #0056b3;
            --secondary-color: #17a2b8; /* Turkuaz (Accent) */
            --shadow-light: 0 8px 25px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* Qorong'i (Dark) rejim ranglari */
        body.dark-theme {
            --bg-color: #1a1a2e;
            --container-bg: #2c2c44;
            --text-color: #e0e0f0;
            --primary-color: #ff5722; 
            --primary-dark: #e64a19;
            --secondary-color: #64ffda;
            --shadow-light: 0 8px 25px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        /* ==================== 2. ASOSIY VAZIYAT VA TIPOGRAFIYA ==================== */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.4s, color 0.4s;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-light);
            max-width: 750px;
            width: 100%;
            transition: background-color 0.4s, box-shadow 0.4s;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 700;
            transition: color 0.4s;
        }

        /* ==================== 3. SOZLAMALAR VA YOSH TANLASH QISMI ==================== */
        #settingsAndAge {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 30px;
            padding: 30px;
            border-radius: 15px;
            background-color: color-mix(in srgb, var(--primary-color) 5%, var(--container-bg));
            border: 2px dashed var(--primary-color);
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-basis: 30%; /* Uch element qatorga joylashishi uchun */
        }
        .setting-item label {
             font-weight: 600;
             margin-bottom: 8px;
             color: var(--primary-dark);
        }

        select, input[type="number"] {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--primary-color);
            font-size: 1em;
            background-color: var(--container-bg);
            color: var(--text-color);
            transition: border-color 0.3s;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        /* Start Button */
        #startQuizButton {
            padding: 15px 30px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: 600;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.2s;
        }
        #startQuizButton:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* ==================== 4. SAVOLLAR STILI ==================== */
        #quizForm {
            display: none;
        }
        .quiz-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: color-mix(in srgb, var(--secondary-color) 5%, var(--container-bg));
            border-radius: 12px;
            border-left: 5px solid var(--secondary-color);
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease-out; 
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        p.question {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: var(--text-color);
        }
        
        label {
            display: block;
            margin: 10px 0;
            padding: 15px;
            background-color: var(--container-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid color-mix(in srgb, var(--text-color) 10%, var(--container-bg));
        }
        label:hover {
            background-color: color-mix(in srgb, var(--primary-color) 10%, var(--container-bg));
            border-color: var(--primary-color);
            transform: scale(1.01);
            box-shadow: var(--shadow-hover);
        }

        input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.3);
            accent-color: var(--primary-color);
        }

        /* Submit Button */
        button[type="submit"] {
            display: block;
            width: 100%;
            padding: 20px;
            background-color: #28a745; /* Yashil rang */
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.4em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 40px;
            transition: background-color 0.3s, transform 0.2s;
        }
        button[type="submit"]:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        button:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }

        /* ==================== 5. ANIMATSIYA VA NATIJA STILI ==================== */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: color-mix(in srgb, var(--container-bg) 95%, transparent);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: opacity 0.5s ease;
        }
        .spinner {
            border: 10px solid color-mix(in srgb, var(--primary-color) 20%, transparent); 
            border-top: 10px solid var(--primary-color);
            border-radius: 50%; width: 80px; height: 80px;
            animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            margin-bottom: 30px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading p { font-size: 1.7em; font-weight: bold; color: var(--primary-dark); }

        #result {
            padding: 30px;
            background-color: color-mix(in srgb, var(--primary-color) 10%, var(--bg-color));
            border: 2px solid var(--primary-color);
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.8s ease-out;
            margin-top: 30px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #result h2 { color: var(--primary-dark); font-size: 2em; margin-top: 0; }
        #result h3 { color: var(--secondary-color); margin-top: 25px; font-size: 1.5em; }
        
        /* ==================== 6. MOBILGA MOSLASHUV (MEDIA QUERIES) ==================== */
        @media (max-width: 600px) {
            .container { padding: 20px; margin: 10px; }
            h1 { font-size: 2em; }
            .setting-group { flex-direction: column; }
            .setting-item { width: 100%; flex-basis: auto; } /* Mobil uchun barchasi bitta ustunda */
            select, input[type="number"] { width: 100%; min-width: auto; }
            #startQuizButton, button[type="submit"] { font-size: 1.1em; padding: 15px; }
            p.question { font-size: 1em; }
            label { font-size: 0.9em; padding: 10px; }
            .spinner { width: 60px; height: 60px; }
            #loading p { font-size: 1.4em; }
        }
    </style>
</head>

                { q: "3. If sharp disagreement arises in a team, what is your management approach?", a: { A: "Coolly examining the arguments of each side and proposing an objective solution.", B: "Prioritizing the restoration of relationships and ensuring everyone feels heard.", C: "Resolving the situation quickly and decisively executing an action plan." } },
                { q: "4. What do you focus on most when creating strategic plans for the future?", a: { A: "Measurable goals, a list of precise risks, and contingency plans.", B: "Personal satisfaction, the impact on team morale, and long-term relationships.", C: "Opportunities that lead to quick, major victories and outperforming the competition." } },
                { q: "5. How do you handle personal criticism?", a: { A: "I look for the logical basis of the criticism and accept it if it's fact-based.", B: "I try to understand the emotional state of the person behind the criticism.", C: "I ignore it if it's not directly related to the result I'm trying to achieve." } },
                { q: "6. What should constitute your company's core 'value'?", a: { A: "High efficiency and an optimal operational system.", B: "A high level of trust and respect between customers and employees.", C: "Achieving a dominant market position and rapid growth." } },
                { q: "7. What method of motivation do you use in difficult circumstances?", a: { A: "Reminding the team of the clear benefits and rewards from achieving the goals.", B: "Strengthening bonds within the team and providing emotional support.", C: "I personally lead by example and push them directly into action." } },
                { q: "8. What is your preferred tool when working with digital data?", a: { A: "Spreadsheets (Excel/Sheets) with extensive analysis capabilities.", B: "Visual tools that facilitate collaboration and communication.", C: "A dashboard showing the single most important KPI needed for a quick decision." } },
            ]
        }
    };


    // --- 3. FUNKSIYALAR ---

    // Sozlamalar va matnlarni yangilash
    function updateContent() {
        const lang = currentLanguage;
        const t = TRANSLATIONS[lang];

        document.getElementById('pageTitle').textContent = t.title;
        document.getElementById('mainTitle').textContent = t.title;
        document.getElementById('labelLang').textContent = t.labelLang;
        document.getElementById('labelTheme').textContent = t.labelTheme;
        document.getElementById('labelAge').textContent = t.labelAge;
        document.getElementById('themeLight').textContent = t.themeLight;
        document.getElementById('themeDark').textContent = t.themeDark;
        startButton.textContent = t.start;
        submitButton.textContent = t.submit;
        document.getElementById('loadingText').textContent = t.loading;
        document.getElementById('loadingSubText').textContent = t.loadingSub;
        
        // Agar test ko'rsatilgan bo'lsa, savollarni ham qayta render qilish
        if (quizForm.style.display === 'block') {
             renderQuestions();
        }
    }

    // Savollarni HTMLga generatsiya qilish
    function renderQuestions() {
        quizContainer.innerHTML = '';
        if (currentQuestions.length === 0) return;

        currentQuestions.forEach((qObj, index) => {
            const qNum = index + 1;
            let html = `
                <div class="quiz-section">
                    <p class="question">${qNum}. ${qObj.q}</p>`;

            for (const key in qObj.a) {
                html += `
                    <label>
                        <input type="radio" name="q${qNum}" value="${key}" required> ${key}) ${qObj.a[key]}
                    </label>`;
            }
            html += `</div>`;
            quizContainer.innerHTML += html;
        });
    }

    // Natijalarni ko'rsatish
    function displayResult(resultType) {
        const t = TRANSLATIONS[currentLanguage];
        let styleName, description, recommendations;

        if (resultType === 'A') {
            styleName = t.A_name; description = t.A_desc; recommendations = t.A_rec;
        } else if (resultType === 'B') {
            styleName = t.B_name; description = t.B_desc; recommendations = t.B_rec;
        } else if (resultType === 'C') {
            styleName = t.C_name; description = t.C_desc; recommendations = t.C_rec;
        } else {
            styleName = t.TIE_name; description = t.TIE_desc; recommendations = t.TIE_rec;
        }

        document.getElementById('resultTitle').textContent = t.resultTitle;
        document.getElementById('recommendationsHeader').textContent = t.recommendationsHeader;
        document.getElementById('styleName').textContent = styleName;
        document.getElementById('styleDescription').textContent = description;
        document.getElementById('recommendations').textContent = recommendations;

        loadingScreen.style.opacity = '0';
        setTimeout(() => { 
            loadingScreen.style.display = 'none';
            resultDiv.style.display = 'block';
            submitButton.disabled = false;
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }, 500);
    }


    // --- 4. TINGLOVCHILAR (EVENT LISTENERS) ---

    // Tilni o'zgartirish
    langSelect.addEventListener('change', function() {
        currentLanguage = this.value;
        updateContent();
    });

    // Mavzuni o'zgartirish
    themeSelect.addEventListener('change', function() {
        document.body.classList.toggle('dark-theme', this.value === 'dark');
    });

    // Testni boshlash
    startButton.addEventListener('click', function() {
        const age = parseInt(ageInput.value);
        const lang = currentLanguage;

        if (isNaN(age) || age < 7 || age > 100) {
            alert(TRANSLATIONS[lang].alertAge);
            return;
        }

        if (age < 18) {
            currentQuestions = QUESTIONS_DATA[lang].under18;
        } else {
            currentQuestions = QUESTIONS_DATA[lang].over18;
        }

        renderQuestions();

        document.getElementById('settingsAndAge').style.display = 'none';
        quizForm.style.display = 'block';
        quizForm.scrollIntoView({ behavior: 'smooth' });
    });

    // Formani yuborish (Tahlil qilish) - XATO TO'G'IRLANGAN
    quizForm.addEventListener('submit', function(event) {
        event.preventDefault();

        const form = event.target;
        const totalQuestions = currentQuestions.length;
        
        let allAnswered = true;
        const counts = { A: 0, B: 0, C: 0 };

        for (let i = 1; i <= totalQuestions; i++) {
            const qName = `q${i}`;
            const checkedElement = form.querySelector(`input[name="${qName}"]:checked`);
            
            if (checkedElement) {
                counts[checkedElement.value]++;
            } else {
                allAnswered = false;
                break; 
            }
        }

        if (!allAnswered) {
            alert(TRANSLATIONS[currentLanguage].alertAnswer);
            return;
        }

        // Animatsiyani boshlash
        submitButton.disabled = true;
        resultDiv.style.display = 'none';
        loadingScreen.style.display = 'flex';
        setTimeout(() => { loadingScreen.style.opacity = '1'; }, 10);

        // Natijalarni hisoblash
        setTimeout(() => {
            let resultType = '';
            let maxCount = 0;
            let tied = false;

            for (const type in counts) {
                if (counts[type] > maxCount) {
                    maxCount = counts[type];
                    resultType = type;
                    tied = false;
                } else if (counts[type] === maxCount) {
                    tied = true;
                }
            }
            if (tied && maxCount > 0) {
                resultType = 'TIE';
            }

            displayResult(resultType);
        }, 3000); 
    });

    // Sayt yuklanganda kontentni o'zbek tiliga moslash
    updateContent();
</script>
