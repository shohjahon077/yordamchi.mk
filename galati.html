<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G'alati yordam</title>
    <style>
        /* Umumiy Sayt Uslubi (O'zgarishsiz) */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #0d0d1e;
            color: #ffffff;
            font-family: 'Consolas', monospace;
            padding-bottom: 50px;
        }

        h1 {
            color: #ff00ff;
            text-align: center;
            margin: 30px 0;
            font-size: 2.5em;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.9);
        }

        .devices-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 30px;
        }

        .device {
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff00ff;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s;
            width: 350px; 
            box-sizing: border-box;
        }
        
        /* SOAT, KALKULYATOR USLUBI (O'zgarishsiz) */
        .world-clock-tower { width: 320px; height: 980px; perspective: 1200px; margin: 20px auto; transform-style: preserve-3d; animation: globalWobble 15s infinite alternate ease-in-out; }
        @keyframes globalWobble { 0% { transform: rotateX(5deg) rotateY(-5deg) scale(1); } 100% { transform: rotateX(6deg) rotateY(-4deg) scale(1.005); } } 
        .tower-stack { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
        .time-layer { position: absolute; width: 100%; height: 50px; line-height: 50px; border: 3px solid #00ffff; background-color: rgba(0, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; box-sizing: border-box; top: 0; transition: all 0.5s ease-out; }
        .city-name { color: #ff00ff; font-weight: bold; font-size: 1.1em; margin-right: 15px; text-shadow: 0 0 8px rgba(255, 0, 255, 0.9); }
        .time-value { color: #00ff00; font-size: 1.6em; letter-spacing: 3px; text-shadow: 0 0 10px rgba(0, 255, 0, 0.8); }
        
        .calculator { perspective: 1000px; transform: rotateX(15deg) rotateY(-15deg); animation: none; }
        .calc-body { padding: 15px; border-radius: 10px; background-color: #1a0033; box-shadow: 0 0 30px rgba(255, 0, 255, 0.8); transform-style: preserve-3d; transform: translateZ(0); }
        .display { position: relative; top: auto; left: auto; width: auto; transform: translateZ(5px); background-color: #000000; color: #00ffff; font-size: 2.5em; text-align: right; padding: 15px; margin-bottom: 20px; border: 3px solid #00ffff; height: 60px; overflow: hidden; border-radius: 5px; text-shadow: 0 0 15px #00ffff; animation: displayGlitch 0.2s infinite; }
        @keyframes displayGlitch { 0% { text-shadow: 0 0 10px #00ff00; } 50% { text-shadow: 0 0 15px #ff00ff; } 100% { text-shadow: 0 0 10px #00ff00; } }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0; }
        .btn { background-color: #ff00ff; color: #fff; padding: 18px; font-size: 1.4em; border: none; cursor: pointer; border-radius: 5px; transition: background-color 0.2s, transform 0.1s; transform-style: preserve-3d; box-shadow: 0 0 10px rgba(255, 0, 255, 0.7); }
        .btn:active { transform: translateZ(5px) scale(0.95); box-shadow: none; }
        .operator { background-color: #00ffff; color: #000; font-weight: bold; }

        /* -------------------------------------- */
        /* 3D KITOB USLUBI (Eng ustun qopqoqni ta'minlaymiz) */
        /* -------------------------------------- */
        .book-device {
            width: 380px;
            height: 500px;
            perspective: 1500px; 
            transform-style: preserve-3d;
            transform: rotateX(15deg) rotateY(0deg) translateZ(0); 
            animation: bookBaseWobble 12s infinite alternate ease-in-out;
            border: 3px solid #00ff00; 
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 0;
        }

        .book-container {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }
        
        .book-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e; 
            border: 1px solid #00ff00;
            padding: 25px;
            box-sizing: border-box;
            backface-visibility: hidden; 
            transform-origin: left center; 
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            text-align: left;
            overflow-y: auto; 
            transition: transform 0.8s, z-index 0.01s, opacity 0.8s; /* Opacity qo'shildi */
        }
        
        /* Faqat qopqoqni eng ustda ko'rsatamiz */
        #cover-page {
            z-index: 1000; 
            background-color: #330033; 
            border: 5px double #ff00ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            text-shadow: 0 0 10px #ff00ff;
        }
        
        /* Boshqa uslublar (O'zgarishsiz) */
        .page-content { color: #00ffff; }
        .page-number { position: sticky; bottom: 0px; right: 10px; color: #ff00ff; font-size: 1.2em; background-color: #1a1a2e; padding: 5px 0; display: block; text-align: right; }
        .fact-title { color: #ff00ff; font-size: 1.4em; margin-bottom: 10px; text-shadow: 0 0 8px #ff00ff; border-bottom: 1px dashed #00ffff; padding-bottom: 5px; }
        .fact-text { font-size: 1em; line-height: 1.6; margin-bottom: 15px; }

    </style>
</head>
<body>

    <header>
        <h1>[G'alati yordam]</h1>
    </header>

    <div class="devices-container">
        
        <div class="device book-device">
            <h2>📖 3D Faktlar Kitobi</h2>
            <div class="book-container" id="bookContainer">
                
                <div class="book-page" id="cover-page">
                    <span style="font-size: 2em; color: #00ff00;">// MA'LUMOTLAR OLIB KELINDI //</span>
                    <br><br>
                    <span style="font-size: 1.5em;">[ KIBER ENSIKLOPEDIYA: 100+ FAKTLAR ]</span>
                </div>
                
                </div>
            <div class="book-controls">
                <button onclick="prevPage()">← Oldingi</button>
                <button onclick="nextPage()">Keyingi →</button>
            </div>
        </div>

        <div class="device" style="height: 1080px;">
            <h2>G'alati Dunyo Soati: Yumshoq Titroq</h2>
            <div class="world-clock-tower">
                <div class="tower-stack" id="towerStack">
                </div>
            </div>
            <p style="color: #00ffff; margin-top: 10px;">Vaqtni o'qish qulaylashdi.</p>
        </div>

        <div class="device" style="width: 350px;">
            <h2>G'alati 3D Kalkulyator</h2>
            <div class="calculator">
                <div class="calc-body">
                    <div class="display" id="calcDisplay">0</div>
                    <div class="buttons">
                        <button class="btn operator" onclick="clearDisplay()">AC</button>
                        <button class="btn operator" onclick="appendToDisplay('/')">/</button>
                        <button class="btn operator" onclick="appendToDisplay('*')">x</button>
                        <button class="btn operator" onclick="calculateResult()">=</button>
                        
                        <button class="btn" onclick="appendToDisplay('7')">7</button>
                        <button class="btn" onclick="appendToDisplay('8')">8</button>
                        <button class="btn" onclick="appendToDisplay('9')">9</button>
                        <button class="btn operator" onclick="appendToDisplay('-')">-</button>
                        
                        <button class="btn" onclick="appendToDisplay('4')">4</button>
                        <button class="btn" onclick="appendToDisplay('5')">5</button>
                        <button class="btn" onclick="appendToDisplay('6')">6</button>
                        <button class="btn operator" onclick="appendToDisplay('+')">+</button>
                        
                        <button class="btn" onclick="appendToDisplay('1')">1</button>
                        <button class="btn" onclick="appendToDisplay('2')">2</button>
                        <button class="btn" onclick="appendToDisplay('3')">3</button>
                        <button class="btn operator" onclick="deleteLast()">DEL</button>
                        
                        <button class="btn" style="grid-column: span 2;" onclick="appendToDisplay('0')">0</button>
                        <button class="btn" onclick="appendToDisplay('.')">.</button>
                        <button class="btn operator" onclick="appendToDisplay('%')">%</button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <script>
        /* ======================== */
        /* SOAT MANTIG'I (O'zgarishsiz) */
        /* ======================== */
        const cities = [
            { name: "Toshkent (UZ)", tz: "Asia/Tashkent" },
            { name: "Nyu-York (US)", tz: "America/New_York" },
            { name: "London (UK)", tz: "Europe/London" },
            { name: "Tokio (JP)", tz: "Asia/Tokyo" },
            { name: "Sidney (AU)", tz: "Australia/Sydney" },
            { name: "Dubay (AE)", tz: "Asia/Dubai" },
            { name: "Parij (FR)", tz: "Europe/Paris" },
            { name: "Moskva (RU)", tz: "Europe/Moscow" },
            { title: "Pekin (CN)", tz: "Asia/Shanghai" },
            { name: "Rio (BR)", tz: "America/Sao_Paulo" },
            { name: "Berlin (DE)", tz: "Europe/Berlin" },
            { name: "Mexiko (MX)", tz: "America/Mexico_City" },
            { name: "Qohira (EG)", tz: "Africa/Cairo" },
            { name: "Istanbul (TR)", tz: "Europe/Istanbul" },
            { name: "Vashington (US)", tz: "America/Detroit" },
            { name: "Seul (KR)", tz: "Asia/Seoul" },
            { name: "Jakarta (ID)", tz: "Asia/Jakarta" },
            { name: "Rim (IT)", tz: "Europe/Rome" }
        ];

        const towerStack = document.getElementById('towerStack');
        cities.forEach((city, index) => {
            const layer = document.createElement('div');
            layer.className = 'time-layer';
            layer.id = `layer-${index}`;
            layer.style.setProperty('--y-offset', `${index * 55}px`); 
            layer.innerHTML = `<span class="city-name">${city.name}</span><span class="time-value" id="time-${index}">--:--:--</span>`;
            towerStack.appendChild(layer);
        });

        function updateWorldClocks() {
            const now = new Date();
            const timeInSeconds = now.getTime() / 1000;
            cities.forEach((city, index) => {
                const timeElement = document.getElementById(`time-${index}`);
                const layerElement = document.getElementById(`layer-${index}`);
                const timeOptions = { timeZone: city.tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
                try { timeElement.textContent = now.toLocaleTimeString('en-US', timeOptions); } catch (e) { timeElement.textContent = 'TZ Xato'; }

                const rotation = Math.sin(timeInSeconds * (0.3 + index * 0.02)) * 3; 
                const zShift = Math.cos(timeInSeconds * (0.5 + index * 0.04)) * 2; 
                layerElement.style.transform = `translateY(${index * 55}px) rotateY(${rotation}deg) translateZ(${zShift}px)`;
                
                if (Math.random() < 0.1) { 
                    layerElement.style.borderColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    layerElement.style.boxShadow = `0 0 10px hsl(${Math.random() * 360}, 100%, 50%)`;
                } else {
                    layerElement.style.borderColor = `#00ffff`;
                    layerElement.style.boxShadow = `none`;
                }
            });
        }
        setInterval(updateWorldClocks, 100); 
        updateWorldClocks(); 

        /* ======================== */
        /* KALKULYATOR MANTIG'I (O'zgarishsiz) */
        /* ======================== */
        let currentInput = '0';
        const displayElement = document.getElementById('calcDisplay');
        function updateDisplay() { displayElement.textContent = currentInput; }
        function appendToDisplay(value) {
            if (currentInput === '0' && value !== '.') { currentInput = value; } else { currentInput += value; }
            updateDisplay();
        }
        function clearDisplay() { currentInput = '0'; updateDisplay(); }
        function deleteLast() {
            currentInput = currentInput.slice(0, -1);
            if (currentInput === '') { currentInput = '0'; }
            updateDisplay();
        }
        function calculateResult() {
            try {
                let result = eval(currentInput.replace('x', '*').replace('%', '/100*'));
                currentInput = String(result);
                if (currentInput === 'undefined' || currentInput === 'NaN') { currentInput = 'Xato'; }
            } catch (error) { currentInput = 'Xato'; }
            updateDisplay();
        }

        /* ======================== */
        /* 3D KITOB MANTIG'I (MA'LUMOT ALMASHINI TUZATILDI) */
        /* ======================== */
        const bookContainer = document.getElementById('bookContainer');
        let currentPage = 0; // 0 - Qopqoq

            { title: "Fakt #2: Kvant Kompyuterlar", text: "Oddiy kompyuterlar bitlardan foydalansa, kvant kompyuterlar kubitlardan foydalanadi, bu ularni ba'zi masalalarni bir lahzada yechishga qodir qiladi." },
            { title: "Fakt #3: Tana Kodingi", text: "Inson DNKsi ma'lumotlarni saqlash uchun samarali tizimdir; bir gramm DNK 215 million gigabaytgacha ma'lumotni saqlashi mumkin." },
            { title: "Fakt #4: Robotlar Huquqi", text: "Ba'zi davlatlarda sun'iy intellektga (AI) 'elektron shaxs' maqomini berish taklif qilingan, bu ularga huquq va majburiyatlarni yuklaydi." },
            { title: "Fakt #5: Tungi Shovqin", text: "Internetdagi eng faol va tezkor 'jurnal' bu botlar va AI tizimlari o'rtasidagi ma'lumot almashinuvidir. Insoniyat bu trafikning atigi kichik bir qismidir." },

            { title: "Fakt #18: Oltin Balig'i Xotirasi", text: "Oltin baliqlar faqat uch soniyalik xotiraga ega degan afsona noto'g'ri. Ular oylarga cho'zilgan xotiraga ega bo'lishlari mumkin." },

        // Sahifalarni dinamik yaratish
        function createPages() {
            const oldPages = bookContainer.querySelectorAll('.book-page:not(#cover-page)');
            oldPages.forEach(page => page.remove());

            factData.forEach((fact, index) => {
                const page = document.createElement('div');
                page.className = 'book-page';
                page.id = `page-${index + 1}`;
                page.innerHTML = `
                    <div class="page-content">
                        <div class="fact-title">${fact.title}</div>
                        <div class="fact-text">${fact.text}</div>
                    </div>
                    <span class="page-number">Sahifa: ${index + 1} / ${factData.length}</span>
                `;
                // Sahifa z-index ni o'rnatamiz
                page.style.zIndex = factData.length - index; 
                bookContainer.appendChild(page);
            });
        }
        
        // Sahifani aylantirish va MA'LUMOTNI ALMASHTIRISH funksiyasi
        function updateBookDisplay() {
            const totalFacts = factData.length;
            
            const coverPage = document.getElementById('cover-page');
            
            // Qopqoqni aylantirish
            if (currentPage === 0) {
                coverPage.style.transform = `rotateY(0deg)`;
            } else {
                coverPage.style.transform = `rotateY(-180deg)`;
            }

            // Fakt sahifalarini yangilash
            factData.forEach((fact, index) => {
                const pageElement = document.getElementById(`page-${index + 1}`);
                const pageNum = index + 1;

                if (pageNum <= currentPage) {
                    // O'qilgan sahifalar: 180° aylanib orqada qoladi (chap tomon)
                    pageElement.style.transform = `rotateY(-180deg) translateZ(1px)`; // Oldinroqda turishi uchun translateZ(1px)
                    pageElement.style.opacity = 1; 
                    pageElement.style.pointerEvents = 'none'; // O'qilgan sahifani tanlashni o'chiramiz
                    pageElement.style.zIndex = totalFacts - pageNum + 50; // Orqada, lekin oldinda turgan sahifadan pastroq

                } else {
                    // O'qilmagan sahifalar: 0° burchakda turadi (o'ng tomon)
                    pageElement.style.transform = `rotateY(0deg) translateZ(1px)`; 
                    
                    if (pageNum === currentPage + 1) {
                         // Hozirgi ko'rsatilayotgan sahifa
                        pageElement.style.opacity = 1;
                        pageElement.style.pointerEvents = 'auto';
                        pageElement.style.zIndex = totalFacts + 100; // Eng ustki varaq

                    } else {
                        // Keyingi sahifalar (ko'rinmas bo'lishi kerak, shunda ma'lumot almashgani bilinadi)
                        pageElement.style.opacity = 0; 
                        pageElement.style.pointerEvents = 'none';
                        pageElement.style.zIndex = totalFacts + 99; // Eng ustki varaqning ostida turadi
                    }
                }
            });
        }

        window.nextPage = function() {
            const totalFacts = factData.length;
            if (currentPage < totalFacts) {
                currentPage++;
                updateBookDisplay();
                const currentFactPage = document.getElementById(`page-${currentPage}`);
                if (currentFactPage) { currentFactPage.scrollTop = 0; }
            }
        };

        window.prevPage = function() {
            if (currentPage > 0) {
                currentPage--;
                updateBookDisplay();
            }
        };

        // Boshlash
        createPages();
        updateBookDisplay();

        window.onload = function() {
            updateBookDisplay();
        };
        
        /* SOAT VA KALKULYATOR MANTIG'I (avvalgilar) */
        // ... (Yuqoridagi kodning soat va kalkulyator qismi bu yerda joylashgan)
        // (Vaqtni yangilash kabi funksiyalar to'liq kodda mavjud)
        
    </script>
