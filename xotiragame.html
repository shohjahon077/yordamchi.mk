<!DOCTYPE html>
<html lang="uz" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 Xotira Sinovi | Juftlikni Top</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0f0c29;
      --surface: #1a172d;
      --card-front: #24243e;
      --card-back: #8a2be2;
      --text: #f0f0f0;
      --accent: #ff9a9e;
      --success: #4ade80;
      --warning: #fbbf24;
      --glass: rgba(30, 25, 60, 0.6);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg: #f9fafb;
      --surface: #ffffff;
      --card-front: #f3f4f6;
      --card-back: #8a2be2;
      --text: #1f2937;
      --glass: rgba(255, 255, 255, 0.8);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    [data-theme="neon"] {
      --bg: #0c0c1a;
      --surface: #14142a;
      --card-front: #0f0f23;
      --card-back: #00f3ff;
      --text: #ffffff;
      --accent: #ff00e6;
      --glass: rgba(10, 10, 30, 0.7);
    }

    [data-theme="nature"] {
      --bg: #1a2b1f;
      --surface: #2a3d2f;
      --card-front: #3a4d3f;
      --card-back: #4ade80;
      --text: #e0f0e0;
    }

    [data-theme="cyber"] {
      --bg: #000;
      --surface: #0a0a14;
      --card-front: #0f0f1a;
      --card-back: #00f3ff;
      --text: #00ffaa;
      --accent: #ff2a6d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg), #24243e);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .lang-switcher {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .lang-btn {
      width: 36px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.3);
      background: none;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lang-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #000;
    }

    h1 {
      font-size: 2.6rem;
      margin: 60px 0 10px;
      text-align: center;
      background: linear-gradient(90deg, var(--accent), #a1c4fd, var(--success));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .subtitle {
      text-align: center;
      opacity: 0.85;
      margin-bottom: 25px;
      max-width: 700px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: var(--surface);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      perspective: 1200px;
      margin-bottom: 30px;
    }

    .card {
      height: 0;
      padding-bottom: 100%;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      transition: transform 0.5s;
    }

    .card-inner {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card.matched .card-inner {
      transform: rotateY(180deg);
      opacity: 0.9;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font-size: 2.2rem;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    .card-front {
      background: var(--card-front);
      color: var(--text);
    }

    .card-back {
      background: var(--card-back);
      color: white;
      transform: rotateY(180deg);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transform: scale(0.9);
      animation: modalIn 0.4s forwards;
      backdrop-filter: blur(10px);
    }

    @keyframes modalIn {
      to { transform: scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close {
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text);
    }

    .setting-group {
      margin: 20px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--glass);
      background: var(--glass);
      color: var(--text);
      font-size: 1rem;
    }

    .modal-footer {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .modal-footer .btn {
      flex: 1;
    }

    .result-screen {
      text-align: center;
      padding: 20px;
    }

    .result-title {
      font-size: 2rem;
      margin-bottom: 20px;
      color: var(--success);
    }

    .stars {
      font-size: 2.5rem;
      margin: 15px 0;
      color: #fbbf24;
    }

    @media (max-width: 768px) {
      .board { grid-template-columns: repeat(3, 1fr); }
      h1 { font-size: 2rem; margin-top: 50px; }
    }

    @media (max-width: 480px) {
      .board { grid-template-columns: repeat(2, 1fr); }
      .stats { flex-direction: column; gap: 12px; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <!-- Language Switcher -->
  <div class="lang-switcher">
    <button class="lang-btn active" data-lang="uz">🇺🇿</button>
    <button class="lang-btn" data-lang="en">🇬🇧</button>
    <button class="lang-btn" data-lang="ru">🇷🇺</button>
    <button class="lang-btn" data-lang="ko">🇰🇷</button>
    <button class="lang-btn" data-lang="zh">🇨🇳</button>
  </div>

  <div class="container">
    <h1 id="title">🧠 Xotira Sinovi</h1>
    <p class="subtitle" id="subtitle">Vizual xotira va diqqatni jamlash. Kartalardagi juftliklarni topishga urinib ko'ring.</p>

    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="time">00:00</div>
        <div class="stat-label" id="timeLabel">⏱ Vaqt</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="moves">0</div>
        <div class="stat-label" id="movesLabel">👣 Urinishlar</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="pairs">0/6</div>
        <div class="stat-label" id="pairsLabel">✅ Juftliklar</div>
      </div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">
        <i class="fas fa-play"></i> <span id="startBtnText">▶️ Boshlash</span>
      </button>
      <button class="btn btn-outline" id="resetBtn" disabled>
        <i class="fas fa-redo"></i> <span id="resetBtnText">🔄 Qayta</span>
      </button>
      <button class="btn btn-outline" id="settingsBtn">
        <i class="fas fa-cog"></i> <span id="settingsBtnText">⚙️ Sozlamalar</span>
      </button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="settingsTitle">⚙️ Sozlamalar</h2>
        <span class="close" id="closeModal">&times;</span>
      </div>

      <div class="setting-group">
        <label id="langLabel">Til</label>
        <select id="langSelect">
          <option value="uz">O'zbekcha</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="ko">한국어</option>
          <option value="zh">中文</option>
        </select>
      </div>

      <div class="setting-group">
        <label id="themeLabel">Mavzu</label>
        <select id="themeSelect">
          <option value="dark">Qorong'u (standart)</option>
          <option value="light">Yorug'</option>
          <option value="neon">Neon</option>
          <option value="nature">Tabiat</option>
          <option value="cyber">Kiberpunk</option>
        </select>
      </div>

      <div class="setting-group">
        <label id="difficultyLabel">Qiyinchilik</label>
        <select id="difficultySelect">
          <option value="4">Oson (8 karta)</option>
          <option value="6" selected>O‘rta (12 karta)</option>
          <option value="8">Qiyin (16 karta)</option>
          <option value="10">Mukammal (20 karta)</option>
        </select>
      </div>

      <div class="setting-group">
        <label id="deckLabel">Kartalar To'plami</label>
        <select id="deckSelect">
          <option value="animals">🐾 Hayvonlar</option>
          <option value="fruits" selected>🍎 Mevalar</option>
          <option value="emoji">😊 Emoji</option>
          <option value="colors">🎨 Ranglar</option>
          <option value="space">🚀 Kosmos</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" id="saveSettings">
          <i class="fas fa-save"></i> Saqlash
        </button>
        <button class="btn btn-primary" id="closeSettings">
          <i class="fas fa-check"></i> Yopish
        </button>
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div class="modal" id="resultModal">
    <div class="modal-content">
      <div class="result-screen">
        <h2 class="result-title" id="resultTitle">🎉 Ajoyib!</h2>
        <div class="stars" id="stars">⭐⭐⭐</div>
        <p id="resultMessage">Siz 6 juftlikni 24 urinishda 1:45 daqiqada topdingiz!</p>
        <button class="btn btn-primary" id="playAgainBtn" style="margin-top: 20px;">
          <i class="fas fa-play"></i> Yana o'ynash
        </button>
      </div>
    </div>
  </div>

  <script>
    // ===== TRANSLATIONS =====
    const translations = {

      },

        subtitle: "시각적 기억력과 집중력을 테스트하세요. 모든 짝을 찾아보세요.",
        timeLabel: "⏱ 시간",

        startBtnText: "▶️ 시작",
        resetBtnText: "🔄 재시작",

        resultMessage: (pairs, moves, timeStr) => `총 ${pairs}쌍을 ${moves}번 시도해 ${timeStr} 만에 완료했습니다!`
      },
      zh: {
        title: "🧠 记忆力挑战",
        subtitle: "测试您的视觉记忆和专注力。尝试找出所有配对。",
        timeLabel: "⏱ 时间",
        movesLabel: "👣 步数",
        pairsLabel: "✅ 配对",

        settingsBtnText: "⚙️ 设置",

        themeLabel: "主题",
        difficultyLabel: "难度",
        deckLabel: "卡牌组",
        playAgainBtnText: "🔄 再玩一次",

    // ===== CARD DECKS =====
    const decks = {
      animals: ["🐶", "🐱", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯", "🦁", "🐮"],
      fruits: ["🍎", "🍌", "🍇", "🍓", "🍒", "🍑", "🍍", "🥝", "🍉", "🍋"],

    };

    // ===== STATE =====
    const state = {
      lang: 'uz',
      theme: 'dark',
      difficulty: 6, // juftliklar soni
      deck: 'fruits',
      gameActive: false,
      board: [],
      flippedCards: [],
      matchedCount: 0,
      moves: 0,
      startTime: null,
      timerId: null,
      time: 0
    };

    // DOM Elements (to'g'ri id lar bilan)
    const els = {
      board: document.getElementById('board'),
      time: document.getElementById('time'),

      resetBtn: document.getElementById('resetBtn'),
      settingsBtn: document.getElementById('settingsBtn'),
      settingsModal: document.getElementById('settingsModal'),
      resultModal: document.getElementById('resultModal'),
      langBtns: document.querySelectorAll('.lang-btn'),
      
      // Text elements (span ichidagi id lar)
      title: document.getElementById('title'),
      subtitle: document.getElementById('subtitle'),
      timeLabel: document.getElementById('timeLabel'),
      movesLabel: document.getElementById('movesLabel'),
      pairsLabel: document.getElementById('pairsLabel'),

      resetBtnText: document.getElementById('resetBtnText'),

      saveSettings: document.getElementById('saveSettings')

    // ===== HELPERS =====
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateStats() {
      els.time.textContent = formatTime(state.time);
      els.moves.textContent = state.moves;
      els.pairs.textContent = `${state.matchedCount}/${state.difficulty}`;
    }

    function updateUI() {
      const t = translations[state.lang];
      
      // Asosiy sarlavhalar
      els.title.textContent = t.title;
      els.subtitle.textContent = t.subtitle;
      els.timeLabel.textContent = t.timeLabel;
      els.movesLabel.textContent = t.movesLabel;
      els.pairsLabel.textContent = t.pairsLabel;
      
      // Tugmalar
      els.startBtnText.textContent = t.startBtnText;
      els.resetBtnText.textContent = t.resetBtnText;
      els.settingsBtnText.textContent = t.settingsBtnText;
      els.playAgainBtn.innerHTML = `<i class="fas fa-play"></i> ${t.playAgainBtnText}`;
      
      // Sozlamalar modal
      els.settingsTitle.textContent = t.settingsTitle;
      els.langLabel.textContent = t.langLabel;
      els.themeLabel.textContent = t.themeLabel;
      els.difficultyLabel.textContent = t.difficultyLabel;
      els.deckLabel.textContent = t.deckLabel;
      
      // Natija
      els.resultTitle.textContent = t.resultTitle;

      // Sozlamalar selectlarni tayinlash
      els.langSelect.value = state.lang;
      els.themeSelect.value = state.theme;
      els.difficultySelect.value = state.difficulty;
      els.deckSelect.value = state.deck;
    }

    function setTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
    }

    // ===== GAME LOGIC =====
    function shuffle(array) {
      return [...array]
        .map(value => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(({ value }) => value);
    }

    function initBoard() {
      els.board.innerHTML = '';
      state.flippedCards = [];
      state.matchedCount = 0;
      state.moves = 0;
      state.time = 0;
      updateStats();

      const symbols = decks[state.deck];
      if (symbols.length < state.difficulty) {
        console.warn(`Deck '${state.deck}' has only ${symbols.length} symbols, but difficulty=${state.difficulty}. Using all available.`);
      }
      const selectedSymbols = symbols.slice(0, state.difficulty);
      const cards = [...selectedSymbols, ...selectedSymbols];
      const shuffled = shuffle(cards);

      state.board = shuffled.map((symbol, i) => ({
        id: i,
        symbol,
        flipped: false,
        matched: false
      }));

      renderBoard();
    }

    function renderBoard() {
      const cols = Math.min(5, Math.ceil(Math.sqrt(state.board.length)));
      els.board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      
      els.board.innerHTML = state.board.map(card => `
        <div class="card" data-id="${card.id}">
          <div class="card-inner">
            <div class="card-face card-front">?</div>
            <div class="card-face card-back">${card.symbol}</div>
          </div>
        </div>
      `).join('');

      // Har bir kartaga click event qo'shish
      document.querySelectorAll('.card').forEach(cardEl => {
        cardEl.addEventListener('click', () => handleCardClick(cardEl));
      });
    }

    function handleCardClick(cardEl) {
      if (!state.gameActive || state.flippedCards.length >= 2) return;

      const id = parseInt(cardEl.dataset.id);
      const card = state.board.find(c => c.id === id);

      if (card.flipped || card.matched) return;

      // Flip the card
      card.flipped = true;
      cardEl.classList.add('flipped');
      state.flippedCards.push(card);

      if (state.flippedCards.length === 2) {
        state.moves++;
        updateStats();

        const [c1, c2] = state.flippedCards;
        if (c1.symbol === c2.symbol) {
          // Match
          c1.matched = true;
          c2.matched = true;
          state.matchedCount++;
          state.flippedCards = [];

          if (state.matchedCount === state.difficulty) {
            endGame();
          }
        } else {
          // Mismatch — flip back
          setTimeout(() => {
            c1.flipped = false;
            c2.flipped = false;
            document.querySelectorAll(`.card[data-id="${c1.id}"], .card[data-id="${c2.id}"]`)
              .forEach(el => el.classList.remove('flipped'));
            state.flippedCards = [];
          }, 800);
        }
      }
    }

    function startTimer() {
      state.startTime = Date.now() - state.time * 1000; // Resume support
      clearInterval(state.timerId);
      state.timerId = setInterval(() => {
        state.time = Math.floor((Date.now() - state.startTime) / 1000);
        els.time.textContent = formatTime(state.time);
      }, 1000);
    }

    function startGame() {
      state.gameActive = true;
      initBoard();
      startTimer();
      els.startBtn.disabled = true;
      els.resetBtn.disabled = false;
    }

    function resetGame() {
      clearInterval(state.timerId);
      state.gameActive = false;
      els.startBtn.disabled = false;
      els.resetBtn.disabled = true;
      initBoard();
    }

    function endGame() {
      clearInterval(state.timerId);
      state.gameActive = false;
      els.startBtn.disabled = false;
      els.resetBtn.disabled = true;

      // Yulduzlar hisobi
      const minMoves = state.difficulty;
      let stars = "⭐";
      if (state.moves <= minMoves * 1.2) stars = "⭐⭐⭐";
      else if (state.moves <= minMoves * 2) stars = "⭐⭐";

      const t = translations[state.lang];
      els.stars.textContent = stars;
      const timeStr = formatTime(state.time);
      els.resultMessage.textContent = t.resultMessage(state.difficulty, state.moves, timeStr);

      // Sarlavha yangilash
      if (stars === "⭐⭐⭐") els.resultTitle.textContent = t.perfect;
      else if (stars === "⭐⭐") els.resultTitle.textContent = t.great;
      else if (stars === "⭐") els.resultTitle.textContent = t.good;
      else els.resultTitle.textContent = t.tryAgain;

      els.resultModal.style.display = 'flex';
    }

    // ===== EVENT LISTENERS =====
    els.startBtn.addEventListener('click', startGame);
    els.resetBtn.addEventListener('click', resetGame);
    els.settingsBtn.addEventListener('click', () => {
      els.settingsModal.style.display = 'flex';
    });

    els.closeModal.addEventListener('click', () => els.settingsModal.style.display = 'none');
    els.closeSettings.addEventListener('click', () => els.settingsModal.style.display = 'none');

    els.saveSettings.addEventListener('click', () => {
      // Sozlamalarni saqlash
      state.lang = els.langSelect.value;
      state.theme = els.themeSelect.value;
      state.difficulty = parseInt(els.difficultySelect.value);
      state.deck = els.deckSelect.value;

      // Til tugmalarini yangilash
      els.langBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === state.lang);
      });

      setTheme();
      updateUI();
      els.settingsModal.style.display = 'none';
    });

    els.playAgainBtn.addEventListener('click', () => {
      els.resultModal.style.display = 'none';
      startGame();
    });

    // Til almashtirish
    els.langBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        state.lang = btn.dataset.lang;
        els.langBtns.forEach(b => b.classList.toggle('active', b === btn));
        updateUI();
      });
    });

    // Modalni tashqari bosishda yopish
    window.addEventListener('click', (e) => {
      if (e.target === els.settingsModal) els.settingsModal.style.display = 'none';
      if (e.target === els.resultModal) els.resultModal.style.display = 'none';
    });

    // Dastlabki holat
    setTheme();
    updateUI();
    initBoard();
  </script>
</body>
</html>
