<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geografiya AI Bot — 7-sinf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #01579b, #0277bd, #039be5);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish ekran */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #81d4fa;
            text-align: center;
            padding: 20px;
            animation: fadeOut 2.5s forwards 3.5s;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%2381d4fa"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
            color: #81d4fa;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
            color: #b3e5fc;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(13, 19, 33, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(129, 212, 250, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #81d4fa;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(129, 212, 250, 0.3);
            text-shadow: 0 0 10px rgba(129, 212, 250, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #0277bd, #039be5);
            color: white;
            align-self: flex-end;
        }

        .bot-message {
            background: linear-gradient(135deg, #01579b, #81d4fa);
            color: white;
            align-self: flex-start;
        }

        .typing-indicator {
            display: none;
            color: #81d4fa;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(129, 212, 250, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #81d4fa transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #81d4fa;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(0, 100, 130, 0.4);
            color: #81d4fa;
            border: 1px solid rgba(129, 212, 250, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(129, 212, 250, 0.2);
            border-color: #81d4fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(129, 212, 250, 0.2);
        }

        /* GEOGRAFIK KALKULYATOR */
        .geo-calculator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #81d4fa;
            border-radius: 15px;
            padding: 10px;
            width: 240px;
            box-shadow: 0 0 15px rgba(129, 212, 250, 0.3);
            z-index: 10;
        }

        .calc-title {
            color: #81d4fa;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calc-select {
            width: 100%;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #b3e5fc;
            border: 1px solid #81d4fa;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .calc-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .calc-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-input-group label {
            font-size: 0.85rem;
            color: #b3e5fc;
        }

        .calc-input-group input {
            width: 100px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #039be5;
            border-radius: 4px;
            text-align: right;
        }

        .calc-btn {
            width: 100%;
            padding: 8px;
            background: rgba(3, 155, 229, 0.6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: rgba(3, 155, 229, 0.8);
        }

        .calc-result {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #4fc3f7;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;
        }

        .ai-agent {
            display: none;
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .geo-calculator {
                width: 190px;
                padding: 8px;
            }
            .calc-input-group input {
                width: 75px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Kirish ekran -->
    <div class="splash-screen">
        <div class="ai-icon"></div>
        <div class="splash-text">Geografiya AI + Kalkulyator</div>
        <div class="splash-subtext">7-sinf o'quvchilari uchun 100+ geografiya savoli va ilmiy hisoblovchi kalkulyator</div>
    </div>

    <!-- Asosiy interfeys -->
    <div class="container">
        <div class="header">🌍 7-sinf Geografiya AI Bot</div>

        <!-- GEOGRAFIK KALKULYATOR -->
        <div class="geo-calculator">
            <div class="calc-title">Geografik Kalkulyator</div>
            <select class="calc-select" id="geo-formula">
                <option value="distance">Masofani hisoblash (xarita)</option>
                <option value="height">Balandlikni aniqlash</option>
                <option value="temp">Harorat o'zgarishi</option>
                <option value="scale">Masshtabni topish</option>
                <option value="area">Hudud yuzini hisoblash</option>
            </select>

            <div class="calc-inputs" id="calc-inputs">
                <!-- Inputlar JavaScript orqali qo'shiladi -->
            </div>

            <button class="calc-btn" onclick="calculateGeography()">Hisobla</button>
            <div class="calc-result" id="calc-result">Natija</div>
        </div>

        <div class="chat-area" id="chat-area">
            <!-- Xabarlar shu yerda chiqadi -->
        </div>

        <div class="typing-indicator" id="typing">Fikr yuritayapman...</div>

        <div class="buttons-container" id="buttons-container">
            <!-- Savollar JavaScript orqali qo'shiladi -->
        </div>
    </div>

    <script>
        // ✅ Geografik kalkulyator
        const formulaSelect = document.getElementById('geo-formula');
        const inputsContainer = document.getElementById('calc-inputs');
        const resultDiv = document.getElementById('calc-result');

        const inputConfigs = {
            "distance": [
                { label: "Xarita masofasi (sm):", id: "mapDist", placeholder: "5" },
                { label: "Masshtab:", id: "scale", placeholder: "1:100000" }
            ],
            "height": [
                { label: "Barometr ko'rsatgichi (past, mm):", id: "lowerPress", placeholder: "750" },
                { label: "Yuqori joydagi bosim (mm):", id: "upperPress", placeholder: "700" }
            ],
            "temp": [
                { label: "Past balandlikdagi harorat (°C):", id: "tempLow", placeholder: "20" },
                { label: "Balandlik farqi (m):", id: "heightDiff", placeholder: "1000" }
            ],
            "scale": [
                { label: "Haqiqiy masofa (km):", id: "realDist", placeholder: "50" },
                { label: "Xaritadagi masofa (cm):", id: "mapDistS", placeholder: "10" }
            ],
            "area": [
                { label: "Xaritadagi maydon (sm²):", id: "mapArea", placeholder: "4" },
                { label: "Masshtab:", id: "scaleArea", placeholder: "1:50000" }
            ]
        };

        function updateInputs() {
            const formula = formulaSelect.value;
            inputsContainer.innerHTML = '';
            const config = inputConfigs[formula];
            
            config.forEach(input => {
                const div = document.createElement('div');
                div.className = 'calc-input-group';
                div.innerHTML = `
                    <label>${input.label}</label>
                    <input type="number" id="${input.id}" placeholder="${input.placeholder}" step="any">
                `;
                inputsContainer.appendChild(div);
            });
        }

        function calculateGeography() {
            const formula = formulaSelect.value;
            try {
                let result = "";
                const parseFloatSafe = (id) => {
                    const val = document.getElementById(id)?.value;
                    const num = parseFloat(val);
                    if (isNaN(num)) throw new Error("Noto'g'ri qiymat");
                    return num;
                };

                if (formula === "distance") {
                    const mapDist = parseFloatSafe("mapDist");
                    const scaleStr = document.getElementById("scale").value;
                    const match = scaleStr.match(/1:(\d+)/);
                    if (!match) throw new Error("Masshtab noto'g'ri formatda");
                    const scale = parseInt(match[1]);
                    const realDist = (mapDist / 100000) * scale;
                    result = `Haqiqiy masofa: ${realDist.toFixed(2)} km`;
                }
                else if (formula === "height") {
                    const lowerPress = parseFloatSafe("lowerPress");
                    const upperPress = parseFloatSafe("upperPress");
                    const height = (lowerPress - upperPress) * 10;
                    result = `Taxminiy balandlik: ${height} metr`;
                }
                else if (formula === "temp") {
                    const tempLow = parseFloatSafe("tempLow");
                    const heightDiff = parseFloatSafe("heightDiff");
                    const tempChange = (heightDiff / 100) * 0.6;
                    const tempHigh = tempLow - tempChange;
                    result = `Yuqoridagi harorat: ${tempHigh.toFixed(1)} °C`;
                }
                else if (formula === "scale") {
                    const realDist = parseFloatSafe("realDist") * 100000; // sm ga aylantirish
                    const mapDist = parseFloatSafe("mapDistS");
                    const scale = Math.round(realDist / mapDist);
                    result = `Masshtab: 1:${scale}`;
                }
                else if (formula === "area") {
                    const mapArea = parseFloatSafe("mapArea");
                    const scaleStr = document.getElementById("scaleArea").value;
                    const match = scaleStr.match(/1:(\d+)/);
                    if (!match) throw new Error("Masshtab noto'g'ri formatda");
                    const scale = parseInt(match[1]);
                    const realArea = mapArea * (scale * scale) / 100000000;
                    result = `Haqiqiy hudud yuzi: ${realArea.toFixed(2)} km²`;
                }

                resultDiv.textContent = result;
            } catch (e) {
                resultDiv.textContent = "Xatolik: " + e.message;
                setTimeout(() => { resultDiv.textContent = "Natija"; }, 2000);
            }
        }

        // Dastlabki inputlarni yuklash
        updateInputs();
        formulaSelect.addEventListener('change', updateInputs);

        // ✅ 100+ geografiya savollari (7-sinf darsligi asosida)
        const questions = [

            "Parallel nima?", "Ekvator nima?", "Shimoliy qutb nima?", "Janubiy qutb nima?",
            "Geografik kenglik nima?", "Geografik uzunlik nima?", "Koordinatalar tizimi nima?",

            "Tuman nima?", "Shamol nima?", "Havzalar nima?", "Daryo havzasi nima?",
            "Okeanlar nomlari", "Dunyo okeani nima?", "Materiklar nomlari", "Osiyo materigi",
            "Afrika materigi", "Amerika materigi", "Antarktida materigi", "Avstraliya materigi",
            "Yevropa materigi", "Yer sharining qatlamlari", "Yadro nima?", "Mantiya nima?",
            "Zem terasining qatlamlari", "Granit qavat nima?", "Siyematik qavat nima?", "Yer po'stining qalinligi",
            "Vulkan nima?", "Lava nima?", "Mag'ma nima?", "Zilzila nima?",
            "Epitsentr nima?", "Geyzer nima?", "Tog'lar nima?", "Tektonik plitalar nima?",
            "Plitalarning harakati", "O'tkir tog'lar nima?", "Doimiy muzlar nima?", "Glatsier nima?",
            "Cho'llar nima?", "O'rmonlar nima?", "Tundra nima?", "Tayga nima?",
            "Step nima?", "Savanna nima?", "Butazor nima?", "Botqoq nima?",
            "Orol nima?", "Poluostrov nima?", "Bo'ron nima?", "Tsunami nima?",
            "Okean oqimlari nima?", "Issiq oqimlar nima?", "Sovuq oqimlar nima?", "Mexanik eruvchanlik",
            "Kimyoviy eruvchanlik", "Biologik eruvchanlik", "Erozion nima?", "Akumulyatsiya nima?",

            "Tarixiy usul", "Solishtirma usul", "Geografik obyekt nima?", "Geografik hodisa nima?",
            "Geografik jarayon nima?", "Global o'zgarishlar", "Iqlim o'zgarishi", "Ozon qatlamining ingraysi",
            "Global isish", "Ekologik muammolar", "Tabiatni muhofaza qilish", "O'rmonlarni saqlash",
            "Suv resurslarini muhofaza qilish", "Tuproq eroziyasini oldini olish", "Shaharlarda ifloslanish",
            "Hududiy bo'linish", "Davlatlar soni", "Aholi zichligi nima?", "Aholi punktlari",
            "Shahar nima?", "Qishloq nima?", "Metropolia nima?", "Megapolis nima?",
            "Xalqaro hamkorlik", "BMT nima?", "Xalqaro geografik ittifoq", "Geografiyada texnologiyalar",
            "Sun'iy yo'ldoshlar nima?", "GPS nima?", "Geografik axborot tizimi (GIS)", "Xarita loyihasi"
        ];

        // ✅ Javoblar — 7-sinf geografiya darsligi asosida
        const responses = {
            "Geografiya nima?": "Geografiya — Yer sharini, uning tabiiy va inson yaratgan sharoitlarini, aholi, davlatlar, tabiiy resurslar haqida o'rganuvchi fan. So'z yunoncha 'ge' (yer) va 'graphien' (tasvirlash) so'zlaridan olingan.",
            "Nima uchun geografiyani o'rganamiz?": "Geografiyani o'rganish orqali dunyoning qayerda, qanday, nima uchun shunday joylashganligini tushunamiz. Bu sayohat, savdo, transport, iqlim o'zgarishlari, tabiatni muhofaza qilishda yordam beradi.",
            "Geografiyaning turlari": "Geografiya ikki katta bo'limga bo'linadi: 1) Tabiiy geografiya — Yerning tabiiy sharoitlarini o'rganadi; 2) Iqtisodiy va ijtimoiy geografiya — odamlar, ularning faoliyati, aholi, davlatlar, iqtisodiyotni o'rganadi.",
            "Tabiiy geografiya nima?": "Tabiiy geografiya — Yer sharining tabiiy qismi, ya'ni atmosfera, gidrosfera, litosfera, biosfera, iqlim, landshaftlar, okeanlar, daryolar, tog'lar, o'rmonlar kabi tabiiy hodisalarni o'rganuvchi bo'lim.",
            "Iqtisodiy geografiya nima?": "Iqtisodiy geografiya — inson faoliyatining geografik jihatini, ya'ni aholi, shaharlar, sanoat, qishloq xo'jaligi, transport, savdo, resurslar taqsimlanishini o'rganadi.",

            "Globus nima?": "Globus — Yer shari, sayyoralar yoki osmon jismlarining aniqroq, hajmli modeli. Globusda masofa, yo'nalish, quruqlik va suv hajmlari haqiqiyroq aks etadi.",
            "Meridian nima?": "Meridian — Shimoliy qutbdan Janubiy qutbgacha cho'zilgan shartli bo'ylam chiziqlar. Hammasi Ekvatorni kesib o'tadi. Greenwich meridiani 0° deb qabul qilingan.",
            "Parallel nima?": "Parallel — Ekvatorga parallel ravishda cho'zilgan shartli kenglik chiziqlari. Ular doira shaklida bo'ladi va qutblarga yaqinlashganda qisqaradi.",

            "Geografiyada texnologiyalar": "Geografiyada GPS, sun'iy yo'ldoshlar, GIS, dronlar, elektron xaritalar keng qo'llaniladi.",

            "GPS nima?": "GPS (Global Positioning System) — Yer yuzidagi istalgan nuqtaning aniq koordinatasini belgilash tizimi.",
            "Geografik axborot tizimi (GIS)": "GIS — geografik ma'lumotlarni saqlash, tahlil qilish, chizish, boshqarish uchun dasturiy vosita.",
            "Xarita loyihasi": "Xarita loyihasi — globusdagi Yer yuzini tekis xarita sifatida aks ettirish usuli. Mercator, Gauss-Kryuger kabi turlari bor."
        };

        // DOM elementlar
        const chatArea = document.getElementById('chat-area');
        const buttonsContainer = document.getElementById('buttons-container');
        const typingIndicator = document.getElementById('typing');

        // Boshlang'ich xabar
        setTimeout(() => {
            addMessage("Salom! Men 7-sinf geografiya darsligi bo'yicha AI yordamchiman. Savollarga batafsil javob beraman va geografik hisob-kitoblarni amalga oshiraman! 🌍", 'bot-message');
        }, 4200);

        // Tugmalar
        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        // Xabar qo'shish
        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Savolga javob berish
        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu savolga hozir javob bera olmayman.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
    </script>
