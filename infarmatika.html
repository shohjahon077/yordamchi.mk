<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika AI Bot — 7-sinf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #00695c, #00897b, #26a69a);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish ekran */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #a7ffeb;
            text-align: center;
            padding: 20px;
            animation: fadeOut 2.5s forwards 3.5s;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%23a7ffeb"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
            color: #a7ffeb;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
            color: #b2dfdb;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(13, 19, 33, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(167, 255, 235, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #a7ffeb;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(167, 255, 235, 0.3);
            text-shadow: 0 0 10px rgba(167, 255, 235, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #00897b, #26a69a);
            color: white;
            align-self: flex-end;
        }

        .bot-message {
            background: linear-gradient(135deg, #00695c, #a7ffeb);
            color: #004d40;
            align-self: flex-start;
        }

        .typing-indicator {
            display: none;
            color: #a7ffeb;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(167, 255, 235, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #a7ffeb transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #a7ffeb;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(0, 120, 120, 0.4);
            color: #a7ffeb;
            border: 1px solid rgba(167, 255, 235, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(167, 255, 235, 0.2);
            border-color: #a7ffeb;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(167, 255, 235, 0.2);
        }

        /* RAQAMLI KALKULYATOR */
        .it-calculator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #a7ffeb;
            border-radius: 15px;
            padding: 10px;
            width: 240px;
            box-shadow: 0 0 15px rgba(167, 255, 235, 0.3);
            z-index: 10;
        }

        .calc-title {
            color: #a7ffeb;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calc-select {
            width: 100%;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #b2dfdb;
            border: 1px solid #a7ffeb;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .calc-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .calc-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-input-group label {
            font-size: 0.85rem;
            color: #b2dfdb;
        }

        .calc-input-group input {
            width: 100px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #26a69a;
            border-radius: 4px;
            text-align: right;
        }

        .calc-btn {
            width: 100%;
            padding: 8px;
            background: rgba(38, 166, 154, 0.6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: rgba(38, 166, 154, 0.8);
        }

        .calc-result {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #4fc3f7;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;
        }

        .ai-agent {
            display: none;
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .it-calculator {
                width: 190px;
                padding: 8px;
            }
            .calc-input-group input {
                width: 75px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Kirish ekran -->
    <div class="splash-screen">
        <div class="ai-icon"></div>
        <div class="splash-text">Informatika AI Bot</div>
        <div class="splash-subtext">7-sinf o'quvchilari uchun 100+ informatika savoli va raqamli hisoblovchi kalkulyator</div>
    </div>

    <!-- Asosiy interfeys -->
    <div class="container">
        <div class="header">💻 7-sinf Informatika AI Bot</div>

        <!-- RAQAMLI KALKULYATOR -->
        <div class="it-calculator">
            <div class="calc-title">Raqamli Kalkulyator</div>
            <select class="calc-select" id="it-formula">
                <option value="binary">10-likdan 2-likka</option>
                <option value="decimal">2-likdan 10-likka</option>
                <option value="memory">Xotira hajmini hisoblash</option>
                <option value="file">Fayl hajmini hisoblash</option>
                <option value="speed">Ma'lumot tezligini hisoblash</option>
            </select>

            <div class="calc-inputs" id="calc-inputs">
                <!-- Inputlar JavaScript orqali qo'shiladi -->
            </div>

            <button class="calc-btn" onclick="calculateIT()">Hisobla</button>
            <div class="calc-result" id="calc-result">Natija</div>
        </div>

        <div class="chat-area" id="chat-area">
            <!-- Xabarlar shu yerda chiqadi -->
        </div>

        <div class="typing-indicator" id="typing">Hisoblayapman...</div>

        <div class="buttons-container" id="buttons-container">
            <!-- Savollar JavaScript orqali qo'shiladi -->
        </div>
    </div>

    <script>
        // ✅ Raqamli kalkulyator
        const formulaSelect = document.getElementById('it-formula');
        const inputsContainer = document.getElementById('calc-inputs');
        const resultDiv = document.getElementById('calc-result');

        const inputConfigs = {
            "binary": [
                { label: "10-lik son:", id: "dec", placeholder: "10" }
            ],
            "decimal": [
                { label: "2-lik son:", id: "bin", placeholder: "1010" }
            ],
            "memory": [
                { label: "Bir xotira hajmi (MB):", id: "size", placeholder: "512" },
                { label: "Soni:", id: "count", placeholder: "4" }
            ],
            "file": [
                { label: "Matn uzunligi (belgi):", id: "chars", placeholder: "1000" }
            ],
            "speed": [
                { label: "Ma'lumot hajmi (MB):", id: "dataSize", placeholder: "100" },
                { label: "Vaqt (sekund):", id: "time", placeholder: "10" }
            ]
        };

        function updateInputs() {
            const formula = formulaSelect.value;
            inputsContainer.innerHTML = '';
            const config = inputConfigs[formula];
            
            config.forEach(input => {
                const div = document.createElement('div');
                div.className = 'calc-input-group';
                div.innerHTML = `
                    <label>${input.label}</label>
                    <input type="number" id="${input.id}" placeholder="${input.placeholder}" step="any">
                `;
                inputsContainer.appendChild(div);
            });
        }

        function calculateIT() {
            const formula = formulaSelect.value;
            try {
                let result = "";
                const parseIntSafe = (id) => {
                    const val = document.getElementById(id)?.value;
                    const num = parseInt(val);
                    if (isNaN(num) || num < 0) throw new Error("Noto'g'ri qiymat");
                    return num;
                };
                const parseFloatSafe = (id) => {
                    const val = document.getElementById(id)?.value;
                    const num = parseFloat(val);
                    if (isNaN(num) || num < 0) throw new Error("Noto'g'ri qiymat");
                    return num;
                };

                if (formula === "binary") {
                    const dec = parseIntSafe("dec");
                    const bin = dec.toString(2);
                    result = `${dec} (10-lik) = ${bin} (2-lik)`;
                }
                else if (formula === "decimal") {
                    const binStr = document.getElementById("bin").value;
                    if (!/^[01]+$/.test(binStr)) throw new Error("Faqat 0 va 1 bo'lishi kerak");
                    const dec = parseInt(binStr, 2);
                    result = `${binStr} (2-lik) = ${dec} (10-lik)`;
                }
                else if (formula === "memory") {
                    const size = parseFloatSafe("size");
                    const count = parseIntSafe("count");
                    const total = size * count;
                    result = `Jami xotira: ${total} MB`;
                }
                else if (formula === "file") {
                    const chars = parseIntSafe("chars");
                    const bytes = chars; // 1 belgi ≈ 1 bayt (ASCII)
                    const kb = (bytes / 1024).toFixed(2);
                    result = `Fayl hajmi: ${bytes} bayt ≈ ${kb} KB`;
                }
                else if (formula === "speed") {
                    const data = parseFloatSafe("dataSize");
                    const time = parseFloatSafe("time");
                    if (time === 0) throw new Error("Vaqt 0 bo'lishi mumkin emas");
                    const speed = data / time;
                    result = `Tezlik: ${speed.toFixed(2)} MB/s`;
                }

                resultDiv.textContent = result;
            } catch (e) {
                resultDiv.textContent = "Xatolik: " + e.message;
                setTimeout(() => { resultDiv.textContent = "Natija"; }, 2000);
            }
        }

        // Dastlabki inputlarni yuklash
        updateInputs();
        formulaSelect.addEventListener('change', updateInputs);

        // DOM
        const chatArea = document.getElementById('chat-area');
        const buttonsContainer = document.getElementById('buttons-container');
        const typingIndicator = document.getElementById('typing');

        // Boshlang'ich xabar
        setTimeout(() => {
            addMessage("Salom! Men 7-sinf informatika darsligi bo'yicha AI yordamchiman. Savollarga javob beraman va raqamli hisob-kitoblarni amalga oshiraman! 💻", 'bot-message');
        }, 4200);

        // Tugmalar
        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        // Xabar qo'shish
        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Savolga javob berish
        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu savolga hozir javob bera olmayman.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
