<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — Geografiya (9-sinf)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D47A1;
            --secondary: #009688;
            --accent: #FFC107;
            --light: #FFFFFF;
            --bg: #E3F2FD;
            --text: #0D47A1;
            --card: #FFFFFF;
            --shadow: 0 12px 30px rgba(13, 71, 161, 0.15);
            --border: #BBDEFB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #b3e5fc);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), #0D47A1);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.3rem;
            margin: 15px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.6;
            opacity: 0.95;
        }

        #globe-logo {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            position: relative;
        }

        #globe-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.2));
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 28px;
            color: var(--primary);
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 24px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: #E3F2FD;
            color: #0D47A1;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-message .message-bubble {
            background: #F8F9FA;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--primary);
        }

        /* === LOCATION STYLE === */
        .country {
            background: #E1F5FE;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #01579B;
        }

        /* === FACT EXAMPLE === */
        .fact {
            margin: 12px 0;
            padding: 10px;
            background: #E0F7FA;
            border-left: 3px solid var(--secondary);
            border-radius: 6px;
            font-size: 14px;
            color: #006064;
            font-style: italic;
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 16px;
            border: none;
            border-radius: 28px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(13,71,161,0.2);
        }

        .quick-button:hover {
            background: #0D47A1;
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(13,71,161,0.3);
        }

        .home-button {
            background: #616161 !important;
        }

        .home-button:hover {
            background: #424242 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #757575;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ANIMATION */
        #chatbot-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #chatbot-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="globe-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/>
                <path d="M12 3V21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M3 12H21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M7 4C8.5 6 10 9 10 12C10 15 8.5 18 7 20" stroke="white" stroke-width="1.5"/>
                <path d="M17 4C15.5 6 14 9 14 12C14 15 15.5 18 17 20" stroke="white" stroke-width="1.5"/>
            </svg>
        </div>
        <h1>AI Ustoz — Geografiya</h1>
        <p>9-sinf uchun: Dunyo mamlakatlari, iqtisodiyot, aholi, global muammolar — butun dunyo sizning qo'lingizda!</p>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container" class="hidden">
        <div id="header">
            <div id="ai-avatar">🌍</div>
            <h2>Jahon Geografiyasi Yordamchisi</h2>
        </div>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="quick-buttons"></div>
            <div class="footer-note">9-sinf darsligiga mos — Jahon iqtisodiy geografiyasi, mamlakatlar, resurslar, global muammolar</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const quickButtonsContainer = document.getElementById('quick-buttons');
        const introSplash = document.getElementById('intro-splash');
        const chatbotContainer = document.getElementById('chatbot-container');

        // ✅ Geografiya ma'lumotlar bazasi (9-sinf darsligiga mos)
        const database = {
            "main_menu": {
                text: "Salom! Dunyoning iqtisodiy va siyosiy xaritasini tushunishga tayyormisiz? Qaysi mavzu qiziqarli?",
                buttons: [
                    { text: "🌐 Jahon aholisi", key: "aholi" },
                    { text: "🏭 Iqtisodiy geografiya", key: "iqtisod" },
                    { text: "🌏 Mamlakatlar", key: "mamlakatlar" },
                    { text: "🌍 Global muammolar", key: "global_muammo" },
                    { text: "💎 Tabiiy resurslar", key: "resurslar" },
                    { text: "📝 Testlar", key: "test_menu" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "aholi": {
                text: "Dunyo aholisi — 8 milliarddan ortiq. Asosiy tushunchalar:",
                buttons: [
                    { text: "Aholi zichligi", key: "zichlik" },
                    { text: "Urbanizatsiya", key: "urban" },
                    { text: "Migratsiya", key: "migratsiya" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "zichlik": {
                text: "<span class='fact'>Dunyo aholi zichligi:</span><br>• O'rtacha: 60 kishi/km²<br>• Eng zich: Monako — 26,000 kishi/km²<br>• Eng kam: Mongoliya — 2 kishi/km²<br>• O'zbekiston — 80 kishi/km²",
                buttons: [{ text: "⬅️ Orqaga", key: "aholi", isHome: true }]
            },
            "urban": {
                text: "<span class='fact'>Urbanizatsiya — aholining shaharlarga ko'chishi.</span><br>Dunyoda aholining 57% shaharlarda yashaydi.<br>• AQSH: 83%<br>• Hindiston: 35%<br>• O'zbekiston: 50% dan ortiq",
                buttons: [{ text: "⬅️ Orqaga", key: "aholi", isHome: true }]
            },
            "migratsiya": {
                text: "<span class='fact'>Migratsiya turlari:</span><br>• Iqtisodiy (ish qidirish)<br>• Siyosiy (qochqinlar)<br>• Mintaqaviy (ichki migratsiya)<br><br>Yaponiya — immigratsiyani cheklovchi mamlakat.",
                buttons: [{ text: "⬅️ Orqaga", key: "aholi", isHome: true }]
            },
            "iqtisod": {
                text: "Iqtisodiy geografiya — mamlakatlarning rivojlanish darajasini o'rganadi.",
                buttons: [
                    { text: "Rivojlangan mamlakatlar", key: "rivojlangan" },
                    { text: "Rivojlanayotgan mamlakatlar", key: "rivojlanayotgan" },

                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "rivojlangan": {
                text: "<span class='country'>Rivojlangan mamlakatlar:</span><br>• AQSH, Yaponiya, Germaniya<br>• Yuqori YaIM, axborot texnologiyalari<br>• Aholi — yuqori ta'lim darajasi<br>• Urbanizatsiya — 80% dan ortiq",
                buttons: [{ text: "⬅️ Orqaga", key: "iqtisod", isHome: true }]
            },
            "rivojlanayotgan": {
                text: "<span class='country'>Rivojlanayotgan mamlakatlar:</span><br>• Hindiston, Braziliya, O'zbekiston<br>• Qishloq xo'jaligi hali katta ulushga ega<br>• Sanoat rivojlanayotgan<br>• Aholi ko'p — yosh aholi",
                buttons: [{ text: "⬅️ Orqaga", key: "iqtisod", isHome: true }]
            },
            "tarmoqlar": {
                text: "<span class='fact'>Asosiy iqtisodiy tarmoqlar:</span><br>1. Qishloq xo'jaligi<br>2. Sanoat (metall, kimyo, energetika)<br>3. Xizmat ko'rsatish (bank, turizm, IT)<br>• Rivojlangan mamlakatlarda — 3-tarmoq hukmron.",
                buttons: [{ text: "⬅️ Orqaga", key: "iqtisod", isHome: true }]
            },
            "mamlakatlar": {
                text: "Dunyoning asosiy mintaqalari:",
                buttons: [
                    { text: "Yevropa", key: "yevropa" },
                    { text: "Osiyo", key: "osiyo" },
                    { text: "Amerika", key: "amerika" },
                    { text: "Afrika", key: "afrika" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "yevropa": {
                text: "<span class='country'>Yevropa:</span><br>• Germaniya — avtomobil sanoati<br>• Fransiya — qishloq xo'jaligi, turizm<br>• Rossiya — neft, gaz, keng maydon<br>• Yevropa Ittifoqi — 27 mamlakat",
                buttons: [{ text: "⬅️ Orqaga", key: "mamlakatlar", isHome: true }]
            },
            "osiyo": {
                text: "<span class='country'>Osiyo:</span><br>• Xitoy — ishlab chiqarish fabrikasi<br>• Hindiston — IT, dasturlash<br>• Yaponiya — yuqori texnologiyalar<br>• O'zbekiston — paxta, oltin, gaz",
                buttons: [{ text: "⬅️ Orqaga", key: "mamlakatlar", isHome: true }]
            },
            "amerika": {
                text: "<span class='country'>Amerika:</span><br>• AQSH — dunyoning eng katta iqtisodiyoti<br>• Braziliya — kofe, temir rudasi<br>• Kanada — suv, neft, yog'och<br>• Meksika — neft, avtomobil",
                buttons: [{ text: "⬅️ Orqaga", key: "mamlakatlar", isHome: true }]
            },
            "afrika": {
                text: "<span class='country'>Afrika:</span><br>• Janubiy Afrika — oltin, almaz<br>• Nigeriya — neft<br>• Efiopiya — kofe, qishloq xo'jaligi<br>• Afrika — eng tez o'sayotgan aholi",
                buttons: [{ text: "⬅️ Orqaga", key: "mamlakatlar", isHome: true }]
            },
            "global_muammo": {
                text: "Jahon miqyosidagi muammolar — barcha mamlakatlar uchun xavfli.",
                buttons: [
                    { text: "Iqlim o'zgarishi", key: "iqlim_ozgarish" },
                    { text: "Aral dengizi", key: "aral_dengiz" },
                    { text: "Ozon teshigi", key: "ozon" },
                    { text: "Suv tanqisligi", key: "suv_tanqis" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "iqlim_ozgarish": {
                text: "<span class='fact'>Iqlim o'zgarishi:</span><br>• Harorat ko'tarilmoqda — 1880-yildan beri +1.2°C<br>• Muzliklar eriyapti — G'renlandiya, Antarktida<br>• Ekstremal ob-havo — qurashuv, sel, bo'ron",
                buttons: [{ text: "⬅️ Orqaga", key: "global_muammo", isHome: true }]
            },
            "aral_dengiz": {
                text: "<span class='fact'>Aral dengizi — jahon ekologik fojiasi:</span><br>• 1960-yilda — 4-sonli ko'l<br>• Hozir — 90% suvi quridi<br>• Sabab: Amudaryo, Sirdaryoni sug'orishda ishlatish<br>• Natija: Chang bo'ronlari, kasalliklar",
                buttons: [{ text: "⬅️ Orqaga", key: "global_muammo", isHome: true }]
            },
            "ozon": {
                text: "<span class='fact'>Ozon teshigi — Antarktidada:</span><br>• Sabab: Freon gazlari (muzlatkich, sprey)<br>• Natija: Ultrabinafsha nurlar ko'paydi → teri saratoni<br>• Yechim: Monreal protokoli (1987) — freonni taqiqlash",
                buttons: [{ text: "⬅️ Orqaga", key: "global_muammo", isHome: true }]
            },
            "suv_tanqis": {
                text: "<span class='fact'>Suv tanqisligi:</span><br>• Dunyoning 2.2 milliard kishi — toza suvga ega emas<br>• O'rta Osiyo — eng xavfli mintaqa<br>• Yechim: quyosh distilyatori, suvni qayta ishlash",
                buttons: [{ text: "⬅️ Orqaga", key: "global_muammo", isHome: true }]
            },
            "resurslar": {
                text: "Dunyoning tabiiy resurslari — iqtisodiy kuch asosi.",
                buttons: [
                    { text: "Neft va gaz", key: "neft_gaz" },
                    { text: "Foydali qazilmalar", key: "qazilmalar" },
                    { text: "Suv va yer", key: "suv_yer" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "neft_gaz": {
                text: "<span class='country'>Neft va gaz:</span><br>• Saudiy Arabistoni — neft<br>• Rossiya — gaz<br>• O'zbekiston — Shurtan, Olot gaz konlari<br>• O'zbekistonda ham neft — Farg'ona vodiysi",
                buttons: [{ text: "⬅️ Orqaga", key: "resurslar", isHome: true }]
            },
            "qazilmalar": {
                text: "<span class='country'>Foydali qazilmalar:</span><br>• Janubiy Afrika — oltin, almaz<br>• Xitoy — mis, temir<br>• O'zbekiston — oltin (Mingbuloq), mis (Almalyk)<br>• Braziliya — temir rudasi",
                buttons: [{ text: "⬅️ Orqaga", key: "resurslar", isHome: true }]
            },
            "suv_yer": {
                text: "<span class='fact'>Suv va yer — eng muhim resurs:</span><br>• Amazon — dunyoning yashil o'pqa qon tomiri<br>• Nil — Afrikaga hayot beruvchi daryo<br>• O'rta Osiyo — sug'orish orqali paxta yetishtiriladi",
                buttons: [{ text: "⬅️ Orqaga", key: "resurslar", isHome: true }]
            },
            "test_menu": {
                text: "Bilimingizni sinab ko'ring:",
                buttons: [
                    { text: "Jahon aholisi", key: "test_aholi" },
                    { text: "Mamlakatlar", key: "test_mamlakat" },
                    { text: "Global muammolar", key: "test_global" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "test_aholi": {
                text: "1. Dunyo aholisi qancha?\nA) 6 milliard\nB) 7 milliard\nC) 8 milliarddan ortiq",
                buttons: [
                    { text: "A)", key: "test_aholi_a" },
                    { text: "B)", key: "test_aholi_b" },
                    { text: "C)", key: "test_aholi_c" }
                ]
            },
            "test_aholi_c": {
                text: "✅ To'g'ri! 2025-yilda dunyo aholisi 8.1 milliardga yaqin.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_mamlakat": {
                text: "2. Qaysi mamlakat neft va gazga boy?\nA) Yaponiya\nB) Saudiy Arabistoni\nC) Shveytsariya",
                buttons: [
                    { text: "A)", key: "test_mamlakat_a" },
                    { text: "B)", key: "test_mamlakat_b" },
                    { text: "C)", key: "test_mamlakat_c" }
                ]
            },
            "test_mamlakat_b": {
                text: "✅ Ajoyib! Saudiy Arabistoni — dunyoning eng katta neft eksportchisi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            },
            "test_global": {
                text: "3. Aral dengizining qurishiga sabab nima?\nA) Iqlim o'zgarishi\nB) Sug'orish uchun daryo suvini ishlatish\nC) Zilzila",
                buttons: [
                    { text: "A)", key: "test_global_a" },
                    { text: "B)", key: "test_global_b" },
                    { text: "C)", key: "test_global_c" }
                ]
            },
            "test_global_b": {
                text: "✅ To'g'ri! Amudaryo va Sirdaryo suvi sug'orishga sarflangan tufay quridi.",
                buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }]
            }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            addMessage(next.text, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Bu mavzu hozircha mavjud emas.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                setTimeout(() => {
                    chatbotContainer.classList.add('show');
                    addMessage(database.main_menu.text, 'ai');
                    showButtons('main_menu');
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
