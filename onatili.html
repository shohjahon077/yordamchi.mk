<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ona Tili & Adabiyot AI Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #0f2027, #203a43, #2c5364);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish sahifasi */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0c1427;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeOut 2.5s forwards 3.5s;
            color: #00f7ff;
            text-align: center;
            padding: 20px;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%2300f7ff"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(10, 15, 30, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 247, 255, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #00f7ff;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 247, 255, 0.3);
            text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #0077b6, #0096c7);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: linear-gradient(135deg, #00b4d8, #00f7ff);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: none;
            color: #00f7ff;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar uchun scroll qilinadigan panel */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(0, 247, 255, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #00f7ff transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #00f7ff;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(0, 50, 80, 0.4);
            color: #00f7ff;
            border: 1px solid rgba(0, 247, 255, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(0, 180, 255, 0.3);
            border-color: #00f7ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 247, 255, 0.2);
        }

        .ai-agent {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="18" fill="%2300f7ff"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: floatSmall 4s ease-in-out infinite;
        }

        @keyframes floatSmall {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @media (max-width: 768px) {
            .btn {
                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .splash-text {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

        // DOM elementlar
        const chatArea = document.getElementById('chat-area');
        const buttonsContainer = document.getElementById('buttons-container');
        const typingIndicator = document.getElementById('typing');

        // Boshlang'ich xabar
        setTimeout(() => {
            addMessage("Salom! Men 7-sinf Ona tili va Adabiyot darsliklari bo'yicha AI yordamchiman. Quyidagi tugmalardan birini bosing!", 'bot-message');
        }, 4200);

        // Tugmalarni yaratish
        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.setAttribute('data-full', q);
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        // Xabar qo'shish
        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Savolga javob berish
        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu savolga hozir javob berolmayman.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
    </script>
