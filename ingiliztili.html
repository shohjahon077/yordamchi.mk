        * {

            padding: 0;
            box-sizing: border-box;

        body {

            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish ekran */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #e3f2fd;
            text-align: center;
            padding: 20px;
            animation: fadeOut 2.5s forwards 3.5s;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%23e3f2fd"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
            color: #e3f2fd;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
            color: #b3e5fc;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(13, 19, 33, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(227, 242, 253, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #e3f2fd;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(227, 242, 253, 0.3);
            text-shadow: 0 0 10px rgba(227, 242, 253, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #1e88e5, #42a5f5);
            color: white;
            align-self: flex-end;
        }

        .bot-message {
            background: linear-gradient(135deg, #1565c0, #e3f2fd);
            color: #0d47a1;
            align-self: flex-start;
        }

        .typing-indicator {
            display: none;
            color: #e3f2fd;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(227, 242, 253, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #e3f2fd transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #e3f2fd;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(0, 100, 180, 0.4);
            color: #e3f2fd;
            border: 1px solid rgba(227, 242, 253, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(227, 242, 253, 0.2);
            border-color: #e3f2fd;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(227, 242, 253, 0.2);
        }

        /* GRAMMATICS CALCULATOR */
        .grammar-calculator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #e3f2fd;
            border-radius: 15px;
            padding: 10px;
            width: 240px;
            box-shadow: 0 0 15px rgba(227, 242, 253, 0.3);
            z-index: 10;

        .calc-title {
            color: #e3f2fd;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calc-select {
            width: 100%;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #b3e5fc;
            border: 1px solid #e3f2fd;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .calc-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .calc-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-input-group label {
            font-size: 0.85rem;
            color: #b3e5fc;
        }

        .calc-input-group input {
            width: 100px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #42a5f5;
            border-radius: 4px;
            text-align: right;
        }

        .calc-btn {
            width: 100%;
            padding: 8px;
            background: rgba(33, 150, 243, 0.6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: rgba(33, 150, 243, 0.8);
        }

            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #4fc3f7;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;
        }

        .ai-agent {

            <select class="calc-select" id="grammar-formula">
                <option value="verb-form">Verb Forms (Base, Past, Past Participle)</option>
                <option value="plural">Noun Plural Forms</option>
                <option value="adjective">Adjective Comparison</option>
                <option value="tense">Tense Formation</option>
                <option value="pronoun">Pronoun Usage</option>
            </select>

            <div class="calc-inputs" id="calc-inputs">
                <!-- Inputlar JavaScript orqali qo'shiladi -->
            </div>

            <button class="calc-btn" onclick="calculateGrammar()">Calculate</button>
            <div class="calc-result" id="calc-result">Result</div>
        </div>

    <script>
        // ✅ Grammatika kalkulyatori
        const formulaSelect = document.getElementById('grammar-formula');
        const inputsContainer = document.getElementById('calc-inputs');
        const resultDiv = document.getElementById('calc-result');

        const inputConfigs = {
            "verb-form": [
                { label: "Base verb:", id: "baseVerb", placeholder: "go" }
            ],
            "plural": [
                { label: "Singular noun:", id: "singularNoun", placeholder: "cat" }
            ],
            "adjective": [
                { label: "Adjective:", id: "adj", placeholder: "beautiful" },
                { label: "Noun:", id: "noun", placeholder: "girl" }
            ],
            "tense": [
                { label: "Subject:", id: "subject", placeholder: "I" },
                { label: "Verb:", id: "verb", placeholder: "eat" },
                { label: "Time:", id: "time", placeholder: "now" }
            ],
            "pronoun": [
                { label: "Subject:", id: "sub", placeholder: "She" },
                { label: "Object:", id: "obj", placeholder: "me" }
            ]
        };

        function updateInputs() {
            const formula = formulaSelect.value;
            inputsContainer.innerHTML = '';
            const config = inputConfigs[formula];
            
            config.forEach(input => {
                const div = document.createElement('div');
                div.className = 'calc-input-group';
                div.innerHTML = `
                    <label>${input.label}</label>
                    <input type="text" id="${input.id}" placeholder="${input.placeholder}" style="text-transform: lowercase;">
                `;
                inputsContainer.appendChild(div);
            });
        }

        function calculateGrammar() {
            const formula = formulaSelect.value;
            try {
                let result = "";
                const getValue = (id) => document.getElementById(id)?.value.trim().toLowerCase();

                if (formula === "verb-form") {
                    const base = getValue("baseVerb");
                    let past = "", pastParticiple = "";
                    if (base === "go") { past = "went"; pastParticiple = "gone"; }
                    else if (base === "eat") { past = "ate"; pastParticiple = "eaten"; }
                    else if (base === "write") { past = "wrote"; pastParticiple = "written"; }
                    else if (base === "see") { past = "saw"; pastParticiple = "seen"; }
                    else if (base === "do") { past = "did"; pastParticiple = "done"; }
                    else if (base === "be") { past = "was/were"; pastParticiple = "been"; }
                    else if (base.endsWith("e")) { past = base + "d"; pastParticiple = base + "d"; }
                    else if (base.endsWith("y") && !["a","e","i","o","u"].includes(base.slice(-2,-1))) { 
                        past = base.slice(0,-1) + "ied"; pastParticiple = base.slice(0,-1) + "ied"; 
                    }
                    else { past = base + "ed"; pastParticiple = base + "ed"; }
                    result = `Base: ${base} | Past: ${past} | Past Participle: ${pastParticiple}`;
                }
                else if (formula === "plural") {
                    const noun = getValue("singularNoun");
                    let plural = "";
                    if (noun.endsWith("s") || noun.endsWith("sh") || noun.endsWith("ch") || noun.endsWith("x") || noun.endsWith("z")) {
                        plural = noun + "es";
                    } else if (noun.endsWith("y") && !["a","e","i","o","u"].includes(noun.slice(-2,-1))) {
                        plural = noun.slice(0,-1) + "ies";
                    } else if (noun === "child") { plural = "children"; }
                    else if (noun === "man") { plural = "men"; }
                    else if (noun === "woman") { plural = "women"; }
                    else if (noun === "tooth") { plural = "teeth"; }
                    else if (noun === "foot") { plural = "feet"; }
                    else if (noun === "mouse") { plural = "mice"; }
                    else { plural = noun + "s"; }
                    result = `Singular: ${noun} → Plural: ${plural}`;
                }
                else if (formula === "adjective") {
                    const adj = getValue("adj");
                    const noun = getValue("noun");
                    let comp = "", superl = "";
                    if (adj.length <= 2) { 
                        comp = adj + "er"; superl = adj + "est"; 
                    } else if (adj.endsWith("e")) { 
                        comp = adj + "r"; superl = adj + "st"; 
                    } else if (adj.endsWith("y") && !["a","e","i","o","u"].includes(adj.slice(-2,-1))) { 
                        comp = adj.slice(0,-1) + "ier"; superl = adj.slice(0,-1) + "iest"; 
                    } else { 
                        comp = "more " + adj; superl = "most " + adj; 
                    }
                    result = `${noun} is ${comp} than another. ${noun} is the ${superl}.`;
                }
                else if (formula === "tense") {
                    const subj = getValue("subject");
                    const verb = getValue("verb");
                    const time = getValue("time");
                    let form = "";
                    if (time === "now") { 
                        if (subj === "i" || subj === "we" || subj === "you" || subj === "they") form = subj + " " + verb + "s"; 
                        else form = subj + " " + verb + "s"; 
                    } else if (time === "yesterday") { 
                        if (verb === "go") form = subj + " went"; 
                        else if (verb === "eat") form = subj + " ate"; 
                        else form = subj + " " + verb + "ed"; 
                    } else if (time === "tomorrow") { 
                        form = subj + " will " + verb; 
                    } else { form = "I " + verb; }
                    result = `Sentence: ${form}`;
                }
                else if (formula === "pronoun") {
                    const sub = getValue("sub");
                    const obj = getValue("obj");
                    let correct = "";
                    if (sub === "i") { correct = "I am"; }
                    else if (sub === "you") { correct = "You are"; }
                    else if (sub === "he") { correct = "He is"; }
                    else if (sub === "she") { correct = "She is"; }
                    else if (sub === "it") { correct = "It is"; }
                    else if (sub === "we") { correct = "We are"; }
                    else if (sub === "they") { correct = "They are"; }
                    result = `${sub} → Subject Pronoun: ${sub} | Object Pronoun: ${obj} | Correct: ${correct}`;
                }

                resultDiv.textContent = result;
            } catch (e) {
                resultDiv.textContent = "Error: " + e.message;
                setTimeout(() => { resultDiv.textContent = "Result"; }, 2000);
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Savolga javob berish
        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Sorry, I don't know this question.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
    </script>

</body>
</html>
