        * {

            padding: 0;
            box-sizing: border-box;

        }

        body {

            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Kirish ekran */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #80deea;
            text-align: center;
            padding: 20px;
            animation: fadeOut 2.5s forwards 3.5s;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%2380deea"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
            color: #80deea;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
            color: #b2ebf2;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Asosiy sahifa */
        .container {
            width: 95%;
            max-width: 1000px;
            height: 92vh;
            background: rgba(13, 19, 33, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(128, 222, 234, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #80deea;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(128, 222, 234, 0.3);
            text-shadow: 0 0 10px rgba(128, 222, 234, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #00838f, #039be5);
            color: white;
            align-self: flex-end;
        }

        .bot-message {
            background: linear-gradient(135deg, #01579b, #81d4fa);
            color: white;
            align-self: flex-start;
        }

        .typing-indicator {
            display: none;
            color: #80deea;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        /* Tugmalar */
        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(128, 222, 234, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #80deea transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #80deea;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(0, 100, 120, 0.4);
            color: #80deea;
            border: 1px solid rgba(128, 222, 234, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(128, 222, 234, 0.2);
            border-color: #80deea;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(128, 222, 234, 0.2);
        }

        /* JISMONIY TARBIYA KALKULYATORI */
        .fitness-calculator {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #80deea;
            border-radius: 15px;
            padding: 10px;
            width: 240px;
            box-shadow: 0 0 15px rgba(128, 222, 234, 0.3);
            z-index: 10;
        }

        .calc-title {
            color: #80deea;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calc-select {
            width: 100%;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #b3e5fc;
            border: 1px solid #80deea;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .calc-inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .calc-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calc-input-group label {
            font-size: 0.85rem;
            color: #b3e5fc;
        }

        .calc-input-group input {
            width: 100px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #039be5;
            border-radius: 4px;
            text-align: right;
        }

        .calc-btn {
            width: 100%;
            padding: 8px;
            background: rgba(3, 155, 229, 0.6);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: rgba(3, 155, 229, 0.8);
        }

        .calc-result {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #4fc3f7;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 24px;

                <option value="speed">Tezlik (m/s)</option>
                <option value="steps">Qadam sonidan masofa</option>
            </select>

            <div class="calc-inputs" id="calc-inputs">
                <!-- Inputlar JavaScript orqali qo'shiladi -->
            </div>

            <button class="calc-btn" onclick="calculateFitness()">Hisobla</button>
            <div class="calc-result" id="calc-result">Natija</div>
        </div>

            <!-- Xabarlar shu yerda chiqadi -->
        </div>

    <script>
        // ✅ Fitness kalkulyatori
        const formulaSelect = document.getElementById('fitness-formula');
        const inputsContainer = document.getElementById('calc-inputs');
        const resultDiv = document.getElementById('calc-result');

        const inputConfigs = {
            "bmi": [
                { label: "Og'irlik (kg):", id: "weight", placeholder: "50" },
                { label: "Bo'y (sm):", id: "height", placeholder: "160" }
            ],
            "heart-rate": [
                { label: "Yosh:", id: "age", placeholder: "13" }
            ],
            "calories": [
                { label: "Vazn (kg):", id: "calWeight", placeholder: "50" },
                { label: "Masofa (km):", id: "distance", placeholder: "3" },
                { label: "Vaqt (min):", id: "time", placeholder: "30" }
            ],
            "speed": [
                { label: "Masofa (m):", id: "dist", placeholder: "100" },
                { label: "Vaqt (s):", id: "sec", placeholder: "15" }
            ],
            "steps": [
                { label: "Qadam soni:", id: "steps", placeholder: "10000" },
                { label: "Bir qadam uzunligi (m):", id: "stepLength", placeholder: "0.6" }
            ]
        };

        function updateInputs() {
            const formula = formulaSelect.value;
            inputsContainer.innerHTML = '';
            const config = inputConfigs[formula];
            
            config.forEach(input => {
                const div = document.createElement('div');
                div.className = 'calc-input-group';
                div.innerHTML = `
                    <label>${input.label}</label>
                    <input type="number" id="${input.id}" placeholder="${input.placeholder}" step="any">
                `;
                inputsContainer.appendChild(div);
            });
        }

        function calculateFitness() {
            const formula = formulaSelect.value;
            try {
                let result = "";
                const parseFloatSafe = (id) => {
                    const val = document.getElementById(id)?.value;
                    const num = parseFloat(val);
                    if (isNaN(num) || num <= 0) throw new Error("Noto'g'ri qiymat");
                    return num;
                };
                const parseIntSafe = (id) => {
                    const val = document.getElementById(id)?.value;
                    const num = parseInt(val);
                    if (isNaN(num) || num <= 0) throw new Error("Noto'g'ri qiymat");
                    return num;
                };

                if (formula === "bmi") {
                    const weight = parseFloatSafe("weight");
                    const height = parseFloatSafe("height") / 100;
                    const bmi = weight / (height * height);
                    let status = "";
                    if (bmi < 16) status = "Kuchli ozish";
                    else if (bmi < 18.5) status = "Ozish";
                    else if (bmi < 25) status = "Normal";
                    else if (bmi < 30) status = "Semizlik I-daraja";
                    else status = "Semizlik II-daraja";
                    result = `BMI: ${bmi.toFixed(2)} → ${status}`;
                }
                else if (formula === "heart-rate") {
                    const age = parseIntSafe("age");
                    const maxHR = 220 - age;
                    const targetLow = Math.round(maxHR * 0.6);
                    const targetHigh = Math.round(maxHR * 0.8);
                    result = `Puls me'yori: ${targetLow}-${targetHigh} bpm`;
                }
                else if (formula === "calories") {
                    const w = parseFloatSafe("calWeight");
                    const d = parseFloatSafe("distance");
                    const t = parseFloatSafe("time");
                    const calories = w * d * 1.036;
                    const speed = (d * 1000) / (t * 60);
                    result = `Taxminan kaloriya: ${calories.toFixed(0)} kcal\nTezlik: ${speed.toFixed(2)} m/s`;
                }
                else if (formula === "speed") {
                    const dist = parseFloatSafe("dist");
                    const sec = parseFloatSafe("sec");
                    if (sec === 0) throw new Error("Vaqt 0 bo'lishi mumkin emas");
                    const speed = dist / sec;
                    result = `${dist}/${sec} = ${speed.toFixed(2)} m/s`;
                }
                else if (formula === "steps") {
                    const steps = parseIntSafe("steps");
                    const len = parseFloatSafe("stepLength");
                    const distance = steps * len / 1000;
                    result = `${steps} qadam ≈ ${(steps * len).toFixed(2)} metr\n${distance.toFixed(2)} km`;
                }

                resultDiv.textContent = result;
            } catch (e) {
                resultDiv.textContent = "Xatolik: " + e.message;
                setTimeout(() => { resultDiv.textContent = "Natija"; }, 2000);
            }
        }

        // Dastlabki inputlarni yuklash
        updateInputs();
        formulaSelect.addEventListener('change', updateInputs);

        const chatArea = document.getElementById('chat-area');
        const buttonsContainer = document.getElementById('buttons-container');
        const typingIndicator = document.getElementById('typing');

        // Boshlang'ich xabar
        setTimeout(() => {
            addMessage("Salom! Men 7-sinf Jismoniy tarbiya darsligi bo'yicha AI yordamchiman. Savollaringiz bo'lsa, tugmalardan birini bosing! 💪", 'bot-message');
        }, 4200);

        // Tugmalar
        questions.forEach(q => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        // Xabar qo'shish
        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Savolga javob berish
        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Kechirasiz, bu savolga hozir javob bera olmayman.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
        }
