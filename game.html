<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* ==================== ROOT & THEME ==================== */
    :root {
      --bg: #090c14;
      --card: #131a27;
      --text: #e0f8ff;
      --primary: #00f3ff;
      --accent: #ff2a8f;
      --success: #39ff14;
      --glow-primary: 0 0 15px rgba(0, 243, 255, 0.7);
      --glow-accent: 0 0 15px rgba(255, 42, 143, 0.6);
      --transition: all 0.45s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .light-theme {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1a1a1a;
      --primary: #0077ff;
      --accent: #ff4d94;
      --success: #28a745;
      --glow-primary: none;
      --glow-accent: none;
    }

    /* ==================== COSMIC STARS (PURE CSS) ==================== */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 200%; height: 200%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.15), transparent 2%),
        radial-gradient(circle at 90% 80%, rgba(255, 42, 143, 0.15), transparent 2%),
        radial-gradient(circle at 50% 30%, rgba(57, 255, 20, 0.1), transparent 1.5%);
      animation: drift 120s linear infinite;
      z-index: -3;
      pointer-events: none;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-25%, -25%); }
    }

    /* ==================== GLOBAL ==================== */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: var(--transition);
      padding-top: 90px;
    }

    /* ==================== SCROLLBAR ==================== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(19, 26, 39, 0.3); }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, var(--primary), var(--accent));
      border-radius: 10px;
    }

    /* ==================== HEADER ==================== */
    .header {
      position: fixed; top: 0; width: 100%; padding: 18px 28px;
      background: rgba(19, 26, 39, 0.92);
      backdrop-filter: blur(12px);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 2000;
      border-bottom: 1px solid var(--primary);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 2rem; font-weight: 900;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: var(--glow-primary);
    }

    .controls { display: flex; gap: 14px; align-items: center; }

    select, button {
      padding: 11px 18px; border-radius: 10px;
      border: 1px solid var(--primary);
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem; cursor: pointer;
      transition: var(--transition); outline: none;
    }

    select:focus, button:hover {
      border-color: var(--accent);
      box-shadow: var(--glow-accent);
    }

    .voice-btn {
      background: var(--success); color: var(--bg);
      display: flex; align-items: center; gap: 6px;
    }

    /* ==================== HERO ==================== */
    .hero {
      text-align: center; padding: 0 20px; margin-bottom: 50px;
    }

    .greeting {
      font-size: 1.4rem; margin-bottom: 12px;
      opacity: 0.9;
    }

    .hero h1 {
      font-size: 4rem; margin: 10px 0 20px;
      background: linear-gradient(90deg, var(--primary), #ffffff, var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      animation: pulseText 3s infinite alternate;
    }

    @keyframes pulseText {
      0% { text-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
      100% { text-shadow: 0 0 35px rgba(255, 42, 143, 0.6); }
    }

    /* ==================== SEARCH & FILTER ==================== */
    .search-filter {
      max-width: 900px; margin: 0 auto 40px;
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    }

    .search-box {
      flex: 1; min-width: 200px;
      padding: 14px 20px; border-radius: 50px;
      border: 1px solid var(--primary);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .filter-btn {
      padding: 12px 22px; border-radius: 50px;
      background: transparent;
      border: 1px solid var(--primary);
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary); color: var(--bg);
    }

    /* ==================== GAME GRID ==================== */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 36px;
      padding: 0 20px;
    }

    .game-card {
      text-decoration: none; color: inherit; display: block;
      background: var(--card);
      border-radius: 20px;
      padding: 32px 24px;
      transition: var(--transition);
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .game-card::before {
      content: "";
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(120deg, transparent, rgba(0, 243, 255, 0.08), transparent);
      transform: translateX(-100%);
      transition: transform 0.8s ease;
      z-index: -1;
    }

    .game-card:hover::before { transform: translateX(100%); }

    .game-card:hover {
      transform: translateY(-12px) rotateX(3deg) scale(1.03);
      border-color: var(--primary);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .icon {
      font-size: 3.2rem; margin-bottom: 20px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .game-card h2 {
      font-size: 1.65rem; margin-bottom: 14px;
      color: var(--primary);
    }

    .game-card p {
      opacity: 0.85; line-height: 1.6; margin-bottom: 24px;
      font-size: 0.98rem;
    }

    .play-btn {
      display: inline-block; padding: 12px 32px;
      background: var(--accent);
      color: var(--bg); font-weight: 700;
      border-radius: 12px; text-decoration: none;
      transition: var(--transition);
      box-shadow: var(--glow-accent);
    }

    .game-card:hover .play-btn {
      background: #ff0066;
      transform: scale(1.12);
      box-shadow: 0 0 20px rgba(255, 42, 143, 0.8);
    }

    .last-played::after {
      content: "📌 So'ngi";
      position: absolute; top: 16px; right: 16px;
      background: var(--success); color: var(--bg);
      padding: 4px 10px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 600;
    }

    /* ==================== FOOTER ==================== */
    .footer {
      text-align: center; padding: 36px 20px;
      margin-top: 80px;
      background: rgba(19, 26, 39, 0.7);
      border-top: 1px solid var(--primary);
      font-size: 0.95rem;
      opacity: 0.85;
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 768px) {
      .hero h1 { font-size: 2.8rem; }
      .search-filter { flex-direction: column; align-items: center; }
      .search-box, .filter-btn { width: 100%; max-width: 350px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

    // ==================== O'YINLAR MALUMOTI ====================
    const GAMES = [

      { id: "g2", title: { uz: "Shaxs Identifikatsiyasi", ru: "Идентификация Личности", en: "Identity Identification", zh: "身份识别", ko: "정체성 식별" }, desc: { uz: "Mantiqiy test orqali o'zingizni tahlil qiling.", ru: "Проанализируйте себя с помощью логики.", en: "Analyze yourself through logic.", zh: "通过逻辑分析自己。", ko: "논리를 통해 자신을 분석하세요." }, link: "ident.html", type: "logic", icon: "🔍" },

    // ==================== STATE ====================
    let currentLang = localStorage.getItem('ymtLang') || 'uz';
    let lastPlayed = localStorage.getItem('ymtLastPlayed') || '';
    const stats = JSON.parse(localStorage.getItem('ymtGameStats') || '{}');

    // ==================== DOM ====================
    const langSelect = document.getElementById('languageSelect');
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const greetingEl = document.getElementById('greeting');
    const gameGrid = document.getElementById('gameGrid');

    const filterBtns = document.querySelectorAll('.filter-btn');

    // ==================== FUNKSIYALAR ====================
    function getGreeting() {
      const hour = new Date().getHours();
      const t = TRANSLATIONS[currentLang];
      let base = '';
      if (hour >= 5 && hour < 12) base = t.greetingMorning;
      else if (hour >= 12 && hour < 17) base = t.greetingDay;
      else if (hour >= 17 && hour < 22) base = t.greetingEvening;
      else base = t.greetingNight;

      const name = localStorage.getItem('ymtUserName') || t.guest;
      return base + name;
    }

    function renderGames(filter = 'all', query = '') {
      gameGrid.innerHTML = '';
      const t = TRANSLATIONS[currentLang];

      const filtered = GAMES.filter(game => {
        const matchesType = filter === 'all' || game.type === filter;
        const matchesQuery = game.title[currentLang].toLowerCase().includes(query.toLowerCase());
        return matchesType && matchesQuery;
      });

      filtered.forEach(game => {
        const isLast = game.id === lastPlayed;
        const count = stats[game.id] || 0;
        const card = document.createElement('a');
        card.href = game.link;
        card.className = `game-card ${isLast ? 'last-played' : ''}`;
        card.dataset.id = game.id;
        card.innerHTML = `
          <div class="icon">${game.icon}</div>
          <h2>${game.title[currentLang]}</h2>
          <p>${game.desc[currentLang]} ${count > 0 ? ` (O'ynaldi: ${count})` : ''}</p>
          <span class="play-btn">${t.play}</span>
        `;
        card.addEventListener('click', () => {
          localStorage.setItem('ymtLastPlayed', game.id);
          stats[game.id] = (stats[game.id] || 0) + 1;
          localStorage.setItem('ymtGameStats', JSON.stringify(stats));
        });
        gameGrid.appendChild(card);
      });
    }

      document.title = t.pageTitle;
      greetingEl.textContent = getGreeting();

      document.getElementById('subWelcome').textContent = t.subWelcome;
      document.getElementById('footerText').textContent = t.footer;
      searchInput.placeholder = t.searchPlaceholder;

      filterBtns.forEach(btn => {
        const key = btn.dataset.filter;
        if (t[key]) btn.textContent = t[key];
      });

      renderGames('all', searchInput.value);
      updateThemeBtn();
    }

      const isLight = document.body.classList.contains('light-theme');
      const t = TRANSLATIONS[currentLang];
      themeIcon.textContent = isLight ? `🌙 ${t.themeDark}` : `☀️ ${t.themeLight}`;
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      localStorage.setItem('ymtTheme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
      updateThemeBtn();

    let recognition;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = currentLang === 'zh' ? 'zh-CN' : (currentLang === 'ko' ? 'ko-KR' : 'en-US');
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.toLowerCase();
        voiceStatus.value = "✅";
        if (transcript.includes('game') || transcript.includes('o\'yin') || transcript.includes('игра') || transcript.includes('游戏') || transcript.includes('게임')) {
          const cards = document.querySelectorAll('.game-card');
          if (cards.length > 0) cards[0].click();
        }
      };

      recognition.onerror = () => { voiceStatus.value = "❌"; };
      recognition.onend = () => { voiceStatus.value = "🎤"; };
    }

    voiceToggle.addEventListener('click', () => {
      if (recognition) {
        voiceStatus.value = "👂";
        recognition.start();
      } else {
        alert("Sizning brauzeringiz ovozli kirishni qo'llab-quvvalmaydi.");
      }
    });

    // ==================== EVENTLAR ====================
    langSelect.addEventListener('change', (e) => {
      localStorage.setItem('ymtLang', e.target.value);
      applyLang(e.target.value);
      if (recognition) recognition.lang = currentLang === 'zh' ? 'zh-CN' : (currentLang === 'ko' ? 'ko-KR' : 'en-US');
    });

    themeToggle.addEventListener('click', toggleTheme);

    searchInput.addEventListener('input', (e) => {
      renderGames(document.querySelector('.filter-btn.active').dataset.filter, e.target.value);
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGames(btn.dataset.filter, searchInput.value);
      });
    });

    // ==================== YUKLASH ====================
    window.addEventListener('DOMContentLoaded', () => {
      // Foydalanuvchi nomi so'rash
      if (!localStorage.getItem('ymtUserName')) {
        const name = prompt("Ismingizni kiriting (ixtiyoriy):") || TRANSLATIONS[currentLang].guest.replace('!', '');
        localStorage.setItem('ymtUserName', name.trim() || "Mehmon");
      }

      langSelect.value = currentLang;
      applyLang(currentLang);

      const savedTheme = localStorage.getItem('ymtTheme');
      if (savedTheme === 'light') document.body.classList.add('light-theme');
      updateThemeBtn();

      renderGames('all');
    });
  </script>
</body>
</html>
