<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — Русский язык (10-класс)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0D47A1;
            --secondary: #009688;
            --accent: #FFC107;
            --light: #FFFFFF;
            --bg: #E3F2FD;
            --text: #0D47A1;
            --card: #FFFFFF;
            --shadow: 0 12px 30px rgba(13, 71, 161, 0.15);
            --border: #BBDEFB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #b3e5fc);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), #0D47A1);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.3rem;
            margin: 15px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.6;
            opacity: 0.95;
        }

        #globe-logo {
            width: 140px;
            height: 140px;
            margin: 20px auto;
            position: relative;
        }

        #globe-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.2));
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 28px;
            color: var(--primary);
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.7;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 16px 22px;
            border-radius: 24px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: #E3F2FD;
            color: #0D47A1;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .ai-message .message-bubble {
            background: #F8F9FA;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--primary);
        }

        /* === LOCATION STYLE === */
        .location {
            background: #E1F5FE;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            color: #01579B;
        }

        /* === FACT EXAMPLE === */
        .fact {
            margin: 12px 0;
            padding: 10px;
            background: #E0F7FA;
            border-left: 3px solid var(--secondary);
            border-radius: 6px;
            font-size: 14px;
            color: #006064;
            font-style: italic;
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 16px;
            border: none;
            border-radius: 28px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(13,71,161,0.2);
        }

        .quick-button:hover {
            background: #0D47A1;
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(13,71,161,0.3);
        }

        .home-button {
            background: #616161 !important;
        }

        .home-button:hover {
            background: #424242 !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #757575;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* ANIMATION */
        #chatbot-container {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #chatbot-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="globe-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none"/>
                <path d="M12 3V21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M3 12H21" stroke="white" stroke-width="1.5" stroke-dasharray="2 2"/>
                <path d="M7 4C8.5 6 10 9 10 12C10 15 8.5 18 7 20" stroke="white" stroke-width="1.5"/>
                <path d="M17 4C15.5 6 14 9 14 12C14 15 15.5 18 17 20" stroke="white" stroke-width="1.5"/>
            </svg>
        </div>
        <h1>AI Ustoz — Русский язык</h1>
        <p>10-класс: Синтаксис, пунктуация, лексика, стилистика, словообразование, тексты — всё в одном месте!</p>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container" class="hidden">
        <div id="header">
            <div id="ai-avatar">📚</div>
            <h2>Помощник по русскому языку</h2>
        </div>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="quick-buttons"></div>
            <div class="footer-note">Соответствует учебнику 10 класса — Синтаксис, пунктуация, лексика, стилистика, словообразование</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const quickButtonsContainer = document.getElementById('quick-buttons');
        const introSplash = document.getElementById('intro-splash');
        const chatbotContainer = document.getElementById('chatbot-container');

        // ✅ РУССКИЙ ЯЗЫК ma'lumotlar bazasi (10-класс дарслигига мос)
        const database = {
            "main_menu": {
                text: "Привет! Давайте улучшим ваши знания русского языка. Какую тему вы хотите изучить сегодня?",

                    { text: "🔗 Синтаксис", key: "sintaksis" },
                    { text: " punctuation Пунктуация", key: "punctuation" },

                    { text: "🎨 Лексика и стилистика", key: "leksika_stilistika" },
                    { text: "📖 Типы текстов", key: "tipy_tekstov" },
                    { text: "✍️ Сочинения", key: "sochineniya" },

                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "sintaksis": {
                text: "Синтаксис — это раздел языка, который изучает строение предложений. Что вас интересует?",
                buttons: [
                    { text: "Простое предложение", key: "prostoe_predlozhenie" },
                    { text: "Сложное предложение", key: "slozhnoe_predlozhenie" },
                    { text: "Односоставные предложения", key: "odnosostavnye" },
                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "prostoe_predlozhenie": {
                text: "<span class='location'>Простое предложение</span> — содержит одну грамматическую основу (подлежащее + сказуемое). Пример: <em>Девочка читает книгу.</em>",
                buttons: [{ text: "⬅️ Назад", key: "sintaksis", isHome: true }]
            },
            "slozhnoe_predlozhenie": {
                text: "<span class='location'>Сложное предложение</span> — состоит из двух или более простых предложений, связанных союзами или бессоюзно. Пример: <em>Он пришёл, и мы начали урок.</em>",
                buttons: [{ text: "⬅️ Назад", key: "sintaksis", isHome: true }]
            },
            "odnosostavnye": {
                text: "<span class='location'>Односоставные предложения</span> — имеют только одно главное член (подлежащее или сказуемое). Примеры: <em>Светает.</em> (безличное), <em>Хочу спать.</em> (определённо-личное).",
                buttons: [{ text: "⬅️ Назад", key: "sintaksis", isHome: true }]
            },
            "punctuation": {
                text: "Пунктуация — это система знаков препинания. Какой знак вас интересует?",
                buttons: [
                    { text: "Запятая", key: "zapjataya" },
                    { text: "Точка с запятой", key: "tochka_s_zapjatoy" },
                    { text: "Двоеточие", key: "dvoyetochie" },
                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "zapjataya": {
                text: "<span class='location'>Запятая</span> — разделяет части сложного предложения, однородные члены, обособленные конструкции. Пример: <em>Она, уставшая, легла спать.</em>",
                buttons: [{ text: "⬅️ Назад", key: "punctuation", isHome: true }]
            },
            "tochka_s_zapjatoy": {
                text: "<span class='location'>Точка с запятой</span> — используется между частями сложносочинённого предложения, если они содержат запятые. Пример: <em>Он пришёл поздно; все уже спали.</em>",
                buttons: [{ text: "⬅️ Назад", key: "punctuation", isHome: true }]
            },
            "dvoyetochie": {
                text: "<span class='location'>Двоеточие</span> — ставится перед пояснительными членами, перечислениями, цитатами. Пример: <em>Он сказал одно: «Приди завтра».</em>",
                buttons: [{ text: "⬅️ Назад", key: "punctuation", isHome: true }]
            },
            "slovoobrazovanie": {
                text: "Словообразование — это образование новых слов с помощью морфем (приставок, суффиксов, окончаний). Какой способ вас интересует?",
                buttons: [
                    { text: "Приставочный способ", key: "pristavochny" },
                    { text: "Суффиксальный способ", key: "suffiksalny" },
                    { text: "Сложносокращённые слова", key: "slozhnosokrashchennye" },
                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "pristavochny": {
                text: "<span class='location'>Приставочный способ</span> — образование слов с помощью приставок. Пример: <em>писать → переписать, неписанный</em>",
                buttons: [{ text: "⬅️ Назад", key: "slovoobrazovanie", isHome: true }]

            "suffiksalny": {
                text: "<span class='location'>Суффиксальный способ</span> — образование слов с помощью суффиксов. Пример: <em>учить → ученик, учитель, учёба</em>",
                buttons: [{ text: "⬅️ Назад", key: "slovoobrazovanie", isHome: true }]
            },
            "slozhnosokrashchennye": {
                text: "<span class='location'>Сложносокращённые слова</span> — образуются из двух или более корней с помощью сокращения. Пример: <em>вуз (высшее учебное заведение), автошкола (автомобильная школа)</em>",
                buttons: [{ text: "⬅️ Назад", key: "slovoobrazovanie", isHome: true }]
            },
            "leksika_stilistika": {
                text: "Лексика — это словарный запас. Стилистика — это умение подбирать слова в зависимости от ситуации. Что вас интересует?",
                buttons: [
                    { text: "Синонимы и антонимы", key: "sinonimy" },
                    { text: "Стили речи", key: "stili_rechi" },
                    { text: "Фразеологизмы", key: "frazeologizmy" },
                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "sinonimy": {
                text: "<span class='location'>Синонимы и антонимы</span> — синонимы — слова с одинаковым значением («радостный» — «весёлый»). Антонимы — с противоположным значением («хороший» — «плохой»).",
                buttons: [{ text: "⬅️ Назад", key: "leksika_stilistika", isHome: true }]
            },
            "stili_rechi": {
                text: "<span class='location'>Стили речи</span>: <br>1) Научный — точность, логика<br>2) Официально-деловой — формальность<br>3) Публицистический — эмоции, аргументы<br>4) Художественный — образность<br>5) Разговорный — простота",
                buttons: [{ text: "⬅️ Назад", key: "leksika_stilistika", isHome: true }]
            },
            "frazeologizmy": {
                text: "<span class='fact'>Интересный факт: Фразеологизм — устойчивое выражение, значение которого нельзя понять по словам. Например: «бить баклуши» — бездельничать. Его нельзя заменить синонимами!</span>",
                buttons: [{ text: "⬅️ Назад", key: "leksika_stilistika", isHome: true }]
            },
            "tipy_tekstov": {
                text: "Типы текстов — это способы передачи информации. Какой тип вы хотите изучить?",
                buttons: [
                    { text: "Повествование", key: "povestvovanie" },
                    { text: "Рассуждение", key: "rassuzhdenie" },
                    { text: "Описание", key: "opisanie" },
                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "povestvovanie": {
                text: "<span class='location'>Повествование</span> — передаёт последовательность событий. Вопросы: «Что произошло?», «Как?», «Когда?». Пример: рассказ, история.",
                buttons: [{ text: "⬅️ Назад", key: "tipy_tekstov", isHome: true }]
            },
            "rassuzhdenie": {
                text: "<span class='location'>Рассуждение</span> — доказывает или опровергает мысль. Использует аргументы, примеры, выводы. Пример: эссе, статья.",
                buttons: [{ text: "⬅️ Назад", key: "tipy_tekstov", isHome: true }]
            },
            "opisanie": {
                text: "<span class='location'>Описание</span> — передаёт характеристики предмета, места, человека. Использует прилагательные, метафоры. Пример: описание природы, портрет.",
                buttons: [{ text: "⬅️ Назад", key: "tipy_tekstov", isHome: true }]
            },
            "sochineniya": {
                text: "Сочинения — это письменные работы. Какой тип сочинения вас интересует?",
                buttons: [
                    { text: "Реферат", key: "referat" },
                    { text: "Эссе", key: "esse" },
                    { text: "Изложение", key: "izlozhenie" },
                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "referat": {
                text: "<span class='location'>Реферат</span> — краткое изложение научного текста. Структура: титульный лист → оглавление → введение → основная часть → заключение → список литературы.",
                buttons: [{ text: "⬅️ Назад", key: "sochineniya", isHome: true }]
            },
            "esse": {
                text: "<span class='location'>Эссе</span> — свободное высказывание на тему. Главное — личное мнение, аргументы, образность. Объём: 150–300 слов.",
                buttons: [{ text: "⬅️ Назад", key: "sochineniya", isHome: true }]
            },
            "izlozhenie": {
                text: "<span class='location'>Изложение</span> — пересказ текста с сохранением структуры, содержания и последовательности. Не добавляйте свои мысли!",
                buttons: [{ text: "⬅️ Назад", key: "sochineniya", isHome: true }]
            },
            "test_menu": {
                text: "Выберите тест:",
                buttons: [
                    { text: "Синтаксис", key: "test_sintaksis" },
                    { text: "Пунктуация", key: "test_punctuation" },
                    { text: "Словообразование", key: "test_slovoobrazovanie" },
                    { text: "🏠 Главное меню", key: "main_menu", isHome: true }
                ]
            },
            "test_sintaksis": {
                text: "1. Какое предложение является простым?\nA) Он пришёл, и мы начали урок.\nB) Девочка читает книгу.\nC) Когда он пришёл, все встали.",
                buttons: [
                    { text: "A) Он пришёл, и мы начали урок.", key: "test_sintaksis_a" },
                    { text: "B) Девочка читает книгу.", key: "test_sintaksis_b" },
                    { text: "C) Когда он пришёл, все встали.", key: "test_sintaksis_c" }
                ]
            },
            "test_sintaksis_b": {
                text: "✅ Верно! «Девочка читает книгу» — простое предложение, так как имеет одну грамматическую основу: «девочка — читает».",

                buttons: [
                    { text: "A) После «устала»", key: "test_punctuation_a" },

            },
            "test_punctuation_a": {
                text: "✅ Правильно! Это сложносочинённое предложение: «Она устала, и легла спать». Запятая разделяет две грамматические основы.",

                buttons: [
                    { text: "A) Ученик", key: "test_slovoobrazovanie_a" },
                    { text: "B) Переписать", key: "test_slovoobrazovanie_b" },
                    { text: "C) Автобус", key: "test_slovoobrazovanie_c" }
                ]
            },
            "test_slovoobrazovanie_b": {
                text: "✅ Отлично! Слово «переписать» образовано с помощью приставки «пере-» от глагола «писать».",
                buttons: [{ text: "🏠 Главное меню", key: "main_menu", isHome: true }]
            }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            let processedText = next.text
                                .replace(/<span class='([^']+)'>/g, '<span class="$1">')
                                .replace(/<\/span>/g, '</span>');
                            addMessage(processedText, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Эта тема пока не доступна.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                setTimeout(() => {
                    chatbotContainer.classList.add('show');
                    addMessage(database.main_menu.text, 'ai');
                    showButtons('main_menu');
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
