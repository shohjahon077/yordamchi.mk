<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Lamp Login | @code_wars_official</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* Theme Spectrums */

:root,
[data-color="amber"] {
  --lamp-accent: #ffab3d;
  --lamp-glow: #ffe194;
  --lamp-secondary: #d48b28;
  --beam-color: rgba(255, 185, 75, 0.22);
  --beam-start: rgba(255, 220, 130, 0.45);
  --beam-mid: rgba(255, 195, 90, 0.22);
  --beam-far: rgba(255, 175, 60, 0.08);
  --lamp-focus-glow: rgba(255, 171, 61, 0.18);

  --bg-dark: #0c0e12;
  --bg-illuminated: #161920;
  --card-bg: rgba(18, 22, 28, 0.72);
  --card-border: rgba(255, 255, 255, 0.09);
  --input-bg: rgba(255, 255, 255, 0.04);
  --input-border: rgba(255, 255, 255, 0.1);
  --text-primary: #f0f3f8;
  --text-muted: #8b95a5;
  --text-dim: #545c6b;
}

[data-color="cyan"] {
  --lamp-accent: #00f0ff;
  --lamp-glow: #a6f9ff;
  --lamp-secondary: #009eb0;
  --beam-color: rgba(0, 240, 255, 0.2);
  --beam-start: rgba(160, 245, 255, 0.45);
  --beam-mid: rgba(0, 220, 255, 0.22);
  --beam-far: rgba(0, 180, 220, 0.08);
  --lamp-focus-glow: rgba(0, 240, 255, 0.18);
}

[data-color="rose"] {
  --lamp-accent: #ff3385;
  --lamp-glow: #ffa3c7;
  --lamp-secondary: #ba1656;
  --beam-color: rgba(255, 51, 133, 0.2);
  --beam-start: rgba(255, 160, 205, 0.45);
  --beam-mid: rgba(255, 70, 150, 0.22);
  --beam-far: rgba(255, 30, 110, 0.08);
  --lamp-focus-glow: rgba(255, 51, 133, 0.18);
}

[data-color="mint"] {
  --lamp-accent: #00e676;
  --lamp-glow: #b9f6ca;
  --lamp-secondary: #00964b;
  --beam-color: rgba(0, 230, 118, 0.2);
  --beam-start: rgba(180, 255, 215, 0.45);
  --beam-mid: rgba(0, 225, 115, 0.22);
  --beam-far: rgba(0, 170, 85, 0.08);
  --lamp-focus-glow: rgba(0, 230, 118, 0.18);
}

[data-color="moonlight"] {
  --lamp-accent: #d8e5ff;
  --lamp-glow: #ffffff;
  --lamp-secondary: #7b9cd4;
  --beam-color: rgba(200, 220, 255, 0.22);
  --beam-start: rgba(255, 255, 255, 0.45);
  --beam-mid: rgba(210, 230, 255, 0.22);
  --beam-far: rgba(170, 200, 245, 0.08);
  --lamp-focus-glow: rgba(216, 229, 255, 0.2);
}

/* Global Reset */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-primary);
  overflow-x: hidden;
  position: relative;
  transition: background-color 0.8s ease;
  user-select: none;
}

body[data-on="true"] {
  background-color: var(--bg-illuminated);
}

/* Ambient Radial Glow on Room Wall */
.ambient-glow {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 38% 38%, var(--beam-color), transparent 65%);
  opacity: 0;
  pointer-events: none;
  z-index: 1;
  transition: opacity 0.8s ease, background 0.5s ease;
}

body[data-on="true"] 
.ambient-glow {
  opacity: 0.85;
}

#dustCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
}

.quick-controls {
  position: fixed;
  top: 24px;
  right: 28px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Minimal Color Palette */
.color-palette {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 6px 12px;
  border-radius: 30px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.color-dot-btn {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--dot-color);
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  outline: none;
}

.color-dot-btn:hover {
  transform: scale(1.22);
  box-shadow: 0 0 10px var(--dot-color);
}

.color-dot-btn.active {
  transform: scale(1.2);
  border-color: #fff;
  box-shadow: 0 0 12px var(--dot-color);
}

.sound-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}

.sound-toggle:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  transform: scale(1.05);
}

.sound-icon {
  width: 18px;
  height: 18px;
}

.hidden {
  display: none 
  !important;
}

.scene-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
  z-index: 10;
  max-width: 1160px;
  margin: 0 auto;
  gap: 2rem;
}

/* Lamp Stage */
.lamp-stage {
  flex: 1 1 420px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.lamp-wrapper {
  position: relative;
  width: 400px;
  height: 520px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.lamp-svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6));
  transition: filter 500ms ease, transform 500ms cubic-bezier(.2, .7, .2, 1);
  transform-origin: 54% 44%;
}

.lamp-wrapper:hover .lamp-svg {
  filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.55));
}

.lamp-shade-body {
  transition: filter 500ms ease;
}

body[data-on="true"] .lamp-shade-body {
  filter: drop-shadow(0 0 12px var(--lamp-accent));
}

.shade-enamel-highlight,
.reflector-detail {
  pointer-events: none;
}

.reflector-detail {
  opacity: .7;
  transition: opacity 400ms ease;
}

body[data-on="true"] .reflector-detail {
  opacity: .95;
}

/* Volumetric Light Beam (Inside SVG) */
.svg-light-beam {
  opacity: 0;
  visibility: hidden;
  mix-blend-mode: screen;
  pointer-events: none;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

body[data-on="true"] .svg-light-beam {
  opacity: 1;
  visibility: visible;
}

body[data-on="true"] .svg-light-beam {
  animation: beam-bloom 1.4s ease-out both;
}

@keyframes beam-bloom {
  from {
    opacity: .15;
  }

  to {
    opacity: 1;
  }
}

/* Shade Reflector States */
.shade-reflector-off {
  opacity: 1;
}

.shade-reflector-on {
  opacity: 0;
  transition: opacity 0.35s ease;
}

body[data-on="true"] .shade-reflector-on {
  opacity: 1;
}

/* Bulb Glow */
.bulb-glow-core {
  opacity: 0;
  transition: opacity 0.3s ease;
}

body[data-on="true"] .bulb-glow-core {
  opacity: 0.95;
  animation: bulb-flicker-in 650ms ease-out both;
}

@keyframes bulb-flicker-in {
  0% {
    opacity: 0;
  }

  22% {
    opacity: .55;
  }

  34% {
    opacity: .28;
  }

  48% {
    opacity: .9;
  }

  62% {
    opacity: .72;
  }

  100% {
    opacity: .95;
  }
}

.bulb-filament {
  stroke: #555;
  transition: stroke 0.3s ease, filter 0.3s ease;
}

@media (prefers-reduced-motion: reduce) {

  .lamp-svg,
  .lamp-shade-body,
  .reflector-detail,
  .svg-light-beam,
  .bulb-glow-core,
  .bead-aura,
  .cord-tooltip {
    animation: none !important;
    transition-duration: .01ms !important;
  }
}

body[data-on="true"] .bulb-filament {
  stroke: #fff;
  filter: drop-shadow(0 0 6px var(--lamp-accent));
}

/* Elastic String & Bead Handle */
.elastic-cord-path {
  transition: stroke 0.3s ease;
}

body[data-on="true"] .elastic-cord-path {
  stroke: var(--lamp-glow);
  filter: drop-shadow(0 0 4px var(--lamp-accent));
}

.cord-bead-group {
  cursor: grab;
  touch-action: none;
}

.cord-bead-group:active {
  cursor: grabbing;
}

.bead-aura {
  transition: opacity 0.3s ease;
}

body[data-on="true"] .bead-aura {
  opacity: 0.35;
  animation: pulseAura 2.2s infinite ease-in-out;
}

@keyframes pulseAura {

  0%,
  100% {
    transform: scale(1);
    opacity: 0.25;
  }

  50% {
    transform: scale(1.3);
    opacity: 0.5;
  }
}

/* Pull Tooltip */
.cord-tooltip {
  position: absolute;
  top: 360px;
  left: 175px;
  background: rgba(16, 19, 25, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.76rem;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.02em;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  animation: floatTooltip 2.2s infinite ease-in-out;
  transition: opacity 0.4s ease, transform 0.4s ease;
  white-space: nowrap;
}

body[data-on="true"] .cord-tooltip {
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
}

.tooltip-arrow {
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 10px;
  height: 10px;
  background: rgba(16, 19, 25, 0.88);
  border-left: 1px solid rgba(255, 255, 255, 0.14);
  border-top: 1px solid rgba(255, 255, 255, 0.14);
}

@keyframes floatTooltip {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-5px);
  }
}

/* Form Stage */
.form-stage {
  flex: 1 1 420px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  min-height: 520px;
}

/* Login Card */
.login-card {
  display: none;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  width: 100%;
  max-width: 410px;
  background: var(--card-bg);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--card-border);
  border-radius: 30px;
  padding: 2.5rem 2.2rem;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
  position: relative;
  overflow: hidden;
  transform: translateY(24px) scale(0.96);
  z-index: 10;
}

body[data-on="true"] .login-card {
  display: block;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0) scale(1);
  box-shadow:
    -20px 0 60px -15px var(--beam-color),
    0 30px 65px rgba(0, 0, 0, 0.55),
    inset 0 1px 2px rgba(255, 255, 255, 0.2);
}

/* OFF State Priority */
body[data-on="false"] .login-card {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

body[data-on="false"] .svg-light-beam {
  opacity: 0 !important;
  visibility: hidden !important;
}

body[data-on="false"] .ambient-glow {
  opacity: 0 !important;
  visibility: hidden !important;
}

body[data-on="false"] .shade-reflector-on {
  opacity: 0 !important;
}

body[data-on="false"] .bulb-glow-core {
  opacity: 0 !important;
}

body[data-on="false"] .bulb-filament {
  stroke: #555 !important;
  filter: none !important;
}

/* Card Header */
.card-header {
  margin-bottom: 1.6rem;
}

.card-title {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #fff;
  margin-bottom: 0.35rem;
}

.card-subtitle {
  font-size: 0.88rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* Tabs: Sign In / Sign Up */
.auth-tabs {
  position: relative;
  display: flex;
  background: rgba(0, 0, 0, 0.28);
  padding: 4px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 1.6rem;
}

.auth-tab {
  flex: 1;
  background: transparent;
  border: none;
  padding: 9px 0;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  z-index: 2;
  transition: color 0.3s ease;
  text-align: center;
}

.auth-tab.active {
  color: #fff;
}

.tab-slider {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: calc(50% - 4px);
  background: rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.auth-tabs[data-active="register"] .tab-slider {
  transform: translateX(100%);
}

/* Form Groups */
.form-group {
  margin-bottom: 1.25rem;
}

.form-group label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 0.45rem;
}

.label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.45rem;
}

.label-row label {
  margin-bottom: 0;
}

.forgot-link {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--lamp-accent);
  text-decoration: none;
  transition: opacity 0.2s ease;
}

.forgot-link:hover {
  text-decoration: underline;
  opacity: 0.85;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 15px;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.input-wrapper:hover {
  border-color: rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06);
}

.input-wrapper:focus-within {
  border-color: var(--lamp-accent);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 0 3px var(--lamp-focus-glow);
}

.field-icon {
  position: absolute;
  left: 15px;
  width: 18px;
  height: 18px;
  color: var(--text-dim);
  pointer-events: none;
  transition: color 0.3s ease;
}

.input-wrapper:focus-within .field-icon {
  color: var(--lamp-accent);
}

.input-wrapper input {
  width: 100%;
  padding: 13px 42px 13px 44px;
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 0.92rem;
  font-family: inherit;
  font-weight: 500;
}

.input-wrapper input::placeholder {
  color: var(--text-dim);
  font-weight: 400;
}

.eye-toggle {
  position: absolute;
  right: 14px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s ease;
}

.eye-toggle:hover {
  color: #fff;
}

.eye-icon {
  width: 18px;
  height: 18px;
}

/* Options */
.options-row {
  margin-bottom: 1.4rem;
}

.custom-checkbox {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
}

.custom-checkbox input {
  display: none;
}

.checkbox-box {
  width: 18px;
  height: 18px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
}

.checkbox-box svg {
  width: 12px;
  height: 12px;
  color: #121417;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.custom-checkbox input:checked+.checkbox-box {
  background: var(--lamp-accent);
  border-color: var(--lamp-accent);
}

.custom-checkbox input:checked+.checkbox-box svg {
  opacity: 1;
  transform: scale(1);
}

.checkbox-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-weight: 500;
}

/* Submit Button */
.submit-btn {
  position: relative;
  width: 100%;
  padding: 14px;
  border-radius: 15px;
  border: none;
  background: linear-gradient(135deg, var(--lamp-accent) 0%, var(--lamp-secondary) 100%);
  color: #0b0d10;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px -5px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 171, 61, 0.25);
}

.submit-btn:active {
  transform: translateY(0);
}

.btn-glow-layer {
  position: absolute;
  top: 0;
  left: -100%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
  transform: skewX(-20deg);
  transition: left 0.75s ease;
}

.submit-btn:hover .btn-glow-layer {
  left: 150%;
}

.btn-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-arrow {
  width: 18px;
  height: 18px;
  transition: transform 0.3s ease;
}

.submit-btn:hover .btn-arrow {
  transform: translateX(4px);
}

.btn-spinner {
  width: 20px;
  height: 20px;
  border: 2.5px solid rgba(0, 0, 0, 0.25);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.btn-success-icon {
  width: 22px;
  height: 22px;
  color: #000;
}

/* Divider & Socials */
.auth-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 1.5rem 0 1.1rem 0;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.08);
}

.divider-text {
  font-size: 0.74rem;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.social-row {
  display: flex;
  gap: 10px;
}

.social-btn {
  flex: 1;
  height: 42px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s ease;
  color: #fff;
}

.social-btn svg {
  width: 19px;
  height: 19px;
}

.social-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-2px);
}

/* Success Overlay */
.success-overlay {
  position: absolute;
  inset: 0;
  background: rgba(14, 18, 24, 0.95);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 30px;
  padding: 2.5rem;
  z-index: 30;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.95);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

.success-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.success-ring {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(46, 213, 115, 0.15);
  color: #2ed573;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.1rem;
  border: 1px solid rgba(46, 213, 115, 0.3);
  box-shadow: 0 0 20px rgba(46, 213, 115, 0.2);
}

.success-ring svg {
  width: 30px;
  height: 30px;
}

.success-box h3 {
  font-size: 1.3rem;
  font-weight: 700;

  // Elastic String Geometry
  const ANCHOR_X = 245;

  let twangAmp = 0;
  let twangStartTime = 0;

  function renderElasticString(curX, curY) {
    let twangOffset = 0;
    if (twangAmp > 0.05) {
      const elapsed = performance.now() - twangStartTime;
      twangOffset = Math.sin(elapsed * 0.05) * twangAmp;
    }

    const midX = (ANCHOR_X + curX) / 2 + twangOffset;
    const midY = (ANCHOR_Y + curY) / 2;

    // Dynamic rubber cord thinning as it stretches
    const stretchRatio = Math.max(1, (curY - ANCHOR_Y) / (REST_Y - ANCHOR_Y));
    const strokeWidth = Math.max(1.6, 2.6 / Math.sqrt(stretchRatio));

    elasticCord.setAttribute("d", `M ${ANCHOR_X} ${ANCHOR_Y} Q ${midX} ${midY} ${curX} ${curY}`);
    elasticCord.setAttribute("stroke-width", strokeWidth.toFixed(2));
  }

  // Web Audio Synthesizer
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function playElasticPluckSound(pullDist, turningOn) {
    if (!isSoundEnabled) return;
    try {
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // Pluck tone
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = "triangle";

      const startFreq = 480 + Math.min(260, pullDist * 3);
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);

      oscGain.gain.setValueAtTime(0.4, now);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

      osc.connect(oscGain);
      oscGain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);

      // Switch snap
      if (pullDist >= TRIGGER_PULL) {
        const snap = audioCtx.createOscillator();
        const snapGain = audioCtx.createGain();
        snap.type = "sine";
        snap.frequency.setValueAtTime(turningOn ? 1800 : 1500, now + 0.02);
        snap.frequency.exponentialRampToValueAtTime(320, now + 0.06);

        snapGain.gain.setValueAtTime(0.35, now + 0.02);
        snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

        snap.connect(snapGain);
        snapGain.connect(audioCtx.destination);
        snap.start(now + 0.02);
        snap.stop(now + 0.07);

        // Power hum
        if (turningOn) {
          const hum = audioCtx.createOscillator();
          const humGain = audioCtx.createGain();
          hum.type = "sine";
          hum.frequency.setValueAtTime(120, now + 0.05);
          humGain.gain.setValueAtTime(0.001, now);
          humGain.gain.linearRampToValueAtTime(0.06, now + 0.08);
          humGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          hum.connect(humGain);
          humGain.connect(audioCtx.destination);
          hum.start(now + 0.05);
          hum.stop(now + 0.38);
        }
      }
    } catch (e) {
      console.warn("AudioContext error:", e);
    }
  }

  // Sound Toggle
  soundToggle.addEventListener("click", () => {
    isSoundEnabled = !isSoundEnabled;
    soundOnIcon.classList.toggle("hidden", !isSoundEnabled);
    soundOffIcon.classList.toggle("hidden", isSoundEnabled);
    if (isSoundEnabled) initAudio();
  });

  function playColorSwitchSound() {
    if (!isSoundEnabled) return;
    try {
      initAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.05);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    } catch (e) { }
  }

  // Color Palette Switcher
  const colorDots = document.querySelectorAll(".color-dot-btn");
  let currentColor = "amber";

  colorDots.forEach((btn) => {
    btn.addEventListener("click", () => {
      const selectedColor = btn.getAttribute("data-color");
      if (selectedColor === currentColor) return;

      colorDots.forEach((d) => d.classList.remove("active"));
      btn.classList.add("active");

      currentColor = selectedColor;
      body.setAttribute("data-color", currentColor);
      activeParticleTheme = particleThemes[currentColor] || particleThemes.amber;

      playColorSwitchSound();

      if (isOn) {
        gsap.fromTo(".svg-light-beam, .ambient-glow",
          { opacity: 0.65 },
          {
            opacity: 1,
            duration: 0.45,
            ease: "power1.out",
            onComplete: () => {
              gsap.set([".svg-light-beam", ".ambient-glow"], { clearProps: "opacity,visibility" });
            }
          }
        );
      }
    });
  });

  // Elastic Cord Draggable Interaction
  Draggable.create(cordBead, {
    type: "x,y",
    bounds: {
      minY: REST_Y,
      maxY: REST_Y + MAX_STRETCH,
      minX: REST_X - 45,
      maxX: REST_X + 45,
    },
    cursor: "grab",
    activeCursor: "grabbing",
    onPress() {
      initAudio();
      twangAmp = 0;
    },
    onDrag() {
      renderElasticString(this.x, this.y);

      // Shade tilts slightly under tension
      const pullDist = this.y - REST_Y;
      const shadeTilt = (pullDist / MAX_STRETCH) * 1.8;
      gsap.set(shadeAssembly, {
        rotation: shadeTilt,
        transformOrigin: "215px 175px"
      });
    },
    onRelease() {
      handleElasticRelease(this.x, this.y);
    }
  });

  function handleElasticRelease(curX, curY) {
    const pullDist = curY - REST_Y;
    const isTriggered = pullDist >= TRIGGER_PULL;

    if (isTriggered) {
      toggleLamp();
    }

    playElasticPluckSound(pullDist, isOn);

    // Bead rebound snap
    gsap.to(cordBead, {
      x: REST_X,
      y: REST_Y,
      duration: 1.15,
      ease: "elastic.out(2.2, 0.16)",
      onUpdate: () => {
        const bx = gsap.getProperty(cordBead, "x");
        const by = gsap.getProperty(cordBead, "y");
        renderElasticString(bx, by);
      }
    });

    // String twang vibration
    twangAmp = (curX - REST_X) * 0.4 + (pullDist * 0.3);
    twangStartTime = performance.now();
    gsap.to({ val: twangAmp }, {
      val: 0,
      duration: 0.9,
      ease: "power2.out",
      onUpdate: function () {
        twangAmp = this.targets()[0].val;
      }
    });

    // Shade bounce back
    gsap.to(shadeAssembly, {
      rotation: 0,
      duration: 0.7,
      ease: "back.out(2.2)",
      transformOrigin: "215px 175px"
    });
  }

  // Pull cord click trigger
  cordHit.addEventListener("click", () => {
    if (isSimulatingPull) return;
    performSimulatedPull();
  });

  function performSimulatedPull() {
    isSimulatingPull = true;
    initAudio();

    gsap.to(cordBead, {
      y: REST_Y + 50,
      duration: 0.22,
      ease: "power2.in",
      onUpdate: () => {
        const by = gsap.getProperty(cordBead, "y");
        renderElasticString(REST_X, by);
      },
      onComplete: () => {
        handleElasticRelease(REST_X, REST_Y + 50);
        setTimeout(() => {
          isSimulatingPull = false;
        }, 500);
      }
    });

    gsap.to(shadeAssembly, {
      rotation: 1.8,
      duration: 0.22,
      ease: "power2.in",
      transformOrigin: "230px 188px"
    });
  }

  // Lamp State Controller
  function toggleLamp() {
    setLampState(!isOn);
  }

  function setLampState(targetState) {
    isOn = targetState;
    body.setAttribute("data-on", isOn ? "true" : "false");

    gsap.killTweensOf([
      ".bulb-glow-core",
      ".bulb-filament",
      ".svg-light-beam",
      ".ambient-glow",
      ".shade-reflector-on",
      loginCard,
      "#loginCard *"
    ]);

    gsap.set([".svg-light-beam", ".ambient-glow", ".shade-reflector-on"], { clearProps: "opacity,visibility" });

    const filament = document.querySelector(".bulb-filament");
    const bulbGlow = document.querySelector(".bulb-glow-core");

    if (isOn) {
      // Lamp ON
      gsap.timeline()
        .to(filament, { stroke: "#fff", duration: 0.05 })
        .to(bulbGlow, { opacity: 0.95, duration: 0.1, ease: "power2.out" });

      gsap.fromTo(loginCard,
        { y: 24, scale: 0.96, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" }
      );

      gsap.fromTo(
        ".card-header, .auth-tabs, .form-group, .options-row, .submit-btn, .auth-divider, .social-row",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, stagger: 0.04, ease: "power2.out", delay: 0.08 }
      );
    } else {
      // Lamp OFF
      gsap.set(bulbGlow, { opacity: 0, clearProps: "opacity" });
      gsap.set(filament, { stroke: "#555", filter: "none", clearProps: "all" });

      gsap.to(loginCard, {
        y: 16,
        opacity: 0,
        scale: 0.96,
        duration: 0.22,
        ease: "power2.in",
        onComplete: () => {
          gsap.set(loginCard, { clearProps: "all" });
        }
      });

      gsap.set(loginCard, { rotateX: 0, rotateY: 0 });
    }
  }

  // Canvas Dust Particles
  const canvas = document.getElementById("dustCanvas");
  const ctx = canvas.getContext("2d");
  let width, height;
  let particles = [];
  const PARTICLE_COUNT = 60;

  const particleThemes = {
    amber: { fill: "255, 205, 120", glow: "255, 185, 80" },
    cyan: { fill: "140, 245, 255", glow: "0, 240, 255" },
    rose: { fill: "255, 160, 200", glow: "255, 51, 133" },
    mint: { fill: "160, 255, 200", glow: "0, 230, 118" },
    moonlight: { fill: "220, 235, 255", glow: "200, 220, 255" }
  };
  let activeParticleTheme = particleThemes.amber;

  function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.radius = Math.random() * 2 + 0.6;
      this.vx = (Math.random() - 0.4) * 0.35;
      this.vy = -Math.random() * 0.4 - 0.15;
      this.alpha = Math.random() * 0.6 + 0.2;
      this.pulseSpeed = Math.random() * 0.03 + 0.01;
      this.pulse = Math.random() * Math.PI;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.pulse += this.pulseSpeed;
      if (this.y < 0) this.y = height;
      if (this.x < 0) this.x = width;
      if (this.x > width) this.x = 0;
    }
    draw() {
      const currentAlpha = (Math.sin(this.pulse) * 0.3 + 0.7) * this.alpha;
      const factor = isOn ? 1 : 0.08;
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${activeParticleTheme.fill}, ${currentAlpha * factor})`;
      if (isOn) {
        ctx.shadowBlur = 7;
        ctx.shadowColor = `rgba(${activeParticleTheme.glow}, 0.5)`;
      }
      ctx.fill();
      ctx.restore();
    }
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }

  function renderParticles() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }
    requestAnimationFrame(renderParticles);
  }
  renderParticles();

  // Form Tabs & Controls
  tabSignIn.addEventListener("click", () => switchTab("signin"));
  tabRegister.addEventListener("click", () => switchTab("register"));

  function switchTab(tab) {
    if (activeTab === tab) return;
    activeTab = tab;
    authTabs.setAttribute("data-active", tab);

    tabSignIn.classList.toggle("active", tab === "signin");
    tabRegister.classList.toggle("active", tab === "register");

    if (tab === "signin") {
      cardTitle.textContent = "Welcome";
      cardSubtitle.textContent = "Sign in to continue to your account";
      btnText.textContent = "Sign In";
    } else {
      cardTitle.textContent = "Sign Up";
      cardSubtitle.textContent = "Create an account to get started";
      btnText.textContent = "Create Account";
    }

    gsap.fromTo(".card-title, .card-subtitle",
      { opacity: 0.6, y: -4 },
      { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }
    );
  }

  // Password Visibility Toggle
  eyeToggle.addEventListener("click", () => {
    const isPassword = passField.getAttribute("type") === "password";
    passField.setAttribute("type", isPassword ? "text" : "password");
    eyeShow.classList.toggle("hidden", isPassword);
    eyeHide.classList.toggle("hidden", !isPassword);
  });

  // Submit Button
  submitBtn.addEventListener("click", (e) => {
    e.preventDefault();
    if (!isOn) {
      performSimulatedPull();
      return;
    }

    btnText.classList.add("hidden");
    btnArrow.classList.add("hidden");
    btnSpinner.classList.remove("hidden");
    submitBtn.style.pointerEvents = "none";

    setTimeout(() => {
      btnSpinner.classList.add("hidden");
      btnSuccess.classList.remove("hidden");

      setTimeout(() => {
        successOverlay.classList.remove("hidden");
        btnText.classList.remove("hidden");
        btnArrow.classList.remove("hidden");
        btnSuccess.classList.add("hidden");
        submitBtn.style.pointerEvents = "auto";
      }, 600);
    }, 1100);
  });

  // Reset Demo Modal
  resetDemoBtn.addEventListener("click", () => {
    successOverlay.classList.add("hidden");
    document.getElementById("userField").value = "";
    document.getElementById("passField").value = "";
  });

  // 3D Tilt on Mouse Move
  const card = document.getElementById("loginCard");
  const formStage = document.querySelector(".form-stage");

  formStage.addEventListener("mousemove", (e) => {
    if (!isOn) return;
    const rect = formStage.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;

    gsap.to(card, {
      rotateX: -(y / rect.height) * 9,
      rotateY: (x / rect.width) * 9,
      duration: 0.5,
      ease: "power1.out",
      transformPerspective: 900
    });
  });

  formStage.addEventListener("mouseleave", () => {
    gsap.to(card, {
      rotateX: 0,
      rotateY: 0,
      duration: 0.7,
      ease: "power2.out"
    });
  });

  // Render initial string
  renderElasticString(REST_X, REST_Y);
});

  </script>
</body>

</html>
