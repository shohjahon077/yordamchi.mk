<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fizika Fanidan Test Sinovi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --physics-color: #ffc107; /* Sariq/Oltin rangni Fizika uchun ishlatamiz */
            --background-light: #f4f7f6;
            --background-card: #ffffff;
            --text-dark: #333;
            --text-light: #fff;
            --border-radius: 10px;
            --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-light);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--background-card);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-subtle);
            max-width: 850px;
            width: 100%;
        }
        h1 {
            color: #d89600; /* Fizika uchun ozgina to'qroq sariq */
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
        }
        h3 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #555;
        }

        /* --- Tugmalar uchun umumiy uslub --- */
        button, .setting-btn {
            background-color: var(--primary-color);
            color: var(--text-light);
            border: none;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        button:hover, .setting-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* --- Sinf tanlash va Sozlamalar paneli --- */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }
        .class-selection button {
            background-color: var(--physics-color); /* Sinf tugmasi uchun Sariq */
            color: var(--text-dark); /* Sariq fonda qora matn yaxshi ko'rinadi */
            min-width: 80px;
        }
        .class-selection button:hover {
            background-color: #ffae00;
        }
        #settings-btn {
            background-color: #6c757d;
            color: var(--text-light);
        }
        #settings-btn:hover {
            background-color: #5a6268;
        }
        #intro-screen {
            text-align: center;
        }

        /* --- Test Savollari Uslubi --- */
        .question-box {
            background-color: #f7f9fc;
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            border-left: 5px solid var(--physics-color); /* Sariq chiziq */
            transition: box-shadow 0.3s;
        }
        .question-box:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .question-box p {
            font-weight: 600;
            font-size: 1.1em;
            color: var(--text-dark);
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            background-color: var(--background-card);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ced4da;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .options label:hover {
            background-color: #fffbe6; /* Sariq hover */
            border-color: var(--physics-color);
        }

        /* --- Natijalar va Tugma --- */
        #results {
            margin-top: 30px;
            padding: 25px;
            background-color: #fff3cd; /* Natija foni Sariq tusda */
            border: 1px solid #ffeeba;
            color: #856404;
            border-radius: var(--border-radius);
            font-size: 1.2em;
            text-align: center;
            display: none;
        }
        #results button {
            background-color: var(--primary-color);
            color: var(--text-light);
        }

        /* --- Natija Ranglari --- */
        .correct-answer {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724;
        }
        .wrong-answer {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24;
        }

        /* --- Sozlamalar Modali (oldingi uslub) --- */
        #settings-modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            padding-top: 60px;
        }
        .modal-content {
            background-color: var(--background-card);
            margin: 5% auto;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-subtle);
            width: 80%;
            max-width: 500px;
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover {
            color: var(--text-dark);
        }
        .setting-group {
            margin-bottom: 20px;
        }
        .setting-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .setting-group input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="welcome-title">Fizika Testlariga Xush Kelibsiz!</h1>
    
    <div class="header-controls">
        <div class="class-selection">
            <button onclick="startTest(7)">7-sinf</button>
            <button onclick="startTest(8)">8-sinf</button>
            <button onclick="startTest(9)">9-sinf</button>
            <button onclick="startTest(10)">10-sinf</button>
            <button onclick="startTest(11)">11-sinf</button>
        </div>
        <button id="settings-btn" onclick="openSettings()">⚙️ Sozlamalar</button>
    </div>

    <div id="intro-screen" style="text-align: center;">
        <h3>Boshlash uchun sinfni tanlang.</h3>
        <p>Savollar sonini sozlash uchun "Sozlamalar" tugmasini bosing.</p>
    </div>

    <div id="quiz-container" style="display:none;">
        </div>

    <button id="submit-btn" style="display:none;">Natijani tekshirish</button>

    <div id="results"></div>
</div>

<div id="settings-modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeSettings()">&times;</span>
        <h2>⚙️ Test Sozlamalari</h2>
        <div class="setting-group">
            <label for="question-limit">Har bir testdagi savollar soni:</label>
            <input type="number" id="question-limit" value="10" min="5" max="30">
            <small style="color: #6c757d;">(Eng kam 5, eng ko'p 30 ta savol)</small>
        </div>
        <button class="setting-btn" onclick="saveSettings()">Saqlash va Yopish</button>
    </div>
</div>

    let questions = [];
    let currentClass = 0;
    let questionLimit = 10; 

    const introScreen = document.getElementById('intro-screen');
    const quizContainer = document.getElementById('quiz-container');
    const submitBtn = document.getElementById('submit-btn');
    const resultsDiv = document.getElementById('results');
    const settingsModal = document.getElementById('settings-modal');
    const questionLimitInput = document.getElementById('question-limit');


    // --- 2. Sozlamalar Funksiyalari ---

    function openSettings() {
        questionLimitInput.value = questionLimit; 
        settingsModal.style.display = 'block';
    }

    function closeSettings() {
        settingsModal.style.display = 'none';
    }

    function saveSettings() {
        let newLimit = parseInt(questionLimitInput.value);
        if (newLimit >= 5 && newLimit <= 30) {
            questionLimit = newLimit;
            alert(`Sozlamalar saqlandi! Har bir testda ${questionLimit} ta savol bo'ladi.`);
            closeSettings();
        } else {
            alert("Iltimos, savollar sonini 5 dan 30 gacha bo'lgan oraliqda kiriting.");
        }
    }

    // --- 3. Testni Boshlash va Savollarni ko'rsatish ---

    function getRandomQuestions(allQuestions, limit) {
        const shuffled = allQuestions.sort(() => 0.5 - Math.random());
        return shuffled.slice(0, limit); 
    }

    function startTest(sinf) {
        currentClass = sinf;
        
        // Fizika bazasidan foydalanish
        const allQuestions = physicsTestDatabase[sinf];

        if (!allQuestions || allQuestions.length === 0) {
            alert(sinf + "-sinf uchun test savollari hali kiritilmagan. Iltimos, boshqa sinfni tanlang.");
            return;
        }

        const limit = Math.min(questionLimit, allQuestions.length);
        questions = getRandomQuestions(allQuestions, limit);

        introScreen.style.display = 'none';
        quizContainer.style.display = 'block';
        submitBtn.style.display = 'block';
        resultsDiv.style.display = 'none';
        
        document.getElementById('welcome-title').innerText = `${sinf}-sinf Fizika testi (${limit} ta savol)`;

        renderQuestions();
    }

    function renderQuestions() {
        quizContainer.innerHTML = '';
        questions.forEach((qItem, index) => {
            const questionBox = document.createElement('div');
            questionBox.className = 'question-box';
            questionBox.id = 'q-' + qItem.id;
            
            const qText = document.createElement('p');
            qText.innerHTML = `${index + 1}. ${qItem.q}`;
            questionBox.appendChild(qText);
            
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            
            const shuffledOptions = qItem.options.sort(() => 0.5 - Math.random());

            shuffledOptions.forEach((option) => {
                const label = document.createElement('label');
                const input = document.createElement('input');
                
                input.type = 'radio';
                input.name = `question_${qItem.id}`;
                input.value = option;
                
                // Matematik formulalar uchun HTML/CSS formatlash qo'shish
                let formattedOption = option;
                // Formulalarni to'g'ri ko'rinishga keltirish (misol: S = a * t^2 / 2)
                formattedOption = formattedOption.replace(/\^(\d+)/g, '<sup>$1</sup>');
                formattedOption = formattedOption.replace(/\(yoki (.+)\)/g, '<small style="color:#6c757d;">($1)</small>');

                label.appendChild(input);
                label.innerHTML += formattedOption; // HTML kodi qo'shiladi
                optionsDiv.appendChild(label);
            });
            
            questionBox.appendChild(optionsDiv);
            quizContainer.appendChild(questionBox);
        });
    }

    submitBtn.onclick = checkResults;

    function checkResults() {
        let score = 0;
        const totalQuestions = questions.length;
        
        document.querySelectorAll('.options label').forEach(label => {
            label.style.pointerEvents = 'none'; 
        });

        questions.forEach((qItem) => {
            const selectedOption = document.querySelector(`input[name="question_${qItem.id}"]:checked`);
            const questionBox = document.getElementById('q-' + qItem.id);

            // Javoblarni taqqoslashda faqat matn qismini olish (HTML taglarisiz)
            const correctAnswerLabel = Array.from(questionBox.querySelectorAll('label')).find(label => 
                label.textContent.trim().replace(/\s\s+/g, ' ') === qItem.answer.replace(/\s\s+/g, ' ')
            );
            
            if (correctAnswerLabel) {
                correctAnswerLabel.classList.add('correct-answer');
            }

            if (selectedOption) {
                // Javobni faqat matn bilan taqqoslash
                if (selectedOption.value.trim().replace(/\s\s+/g, ' ') === qItem.answer.trim().replace(/\s\s+/g, ' ')) {
                    score++;
                } else {
                    selectedOption.parentNode.classList.add('wrong-answer');
                }
            }
        });

        resultsDiv.innerHTML = `
            <h2>A'lo! Test yakunlandi.</h2>
            <p>Siz ${totalQuestions} ta savoldan **${score}** tasiga to'g'ri javob berdingiz.</p>
            <p>Foiz hisobida: **${((score / totalQuestions) * 100).toFixed(1)}%**</p>
            <button onclick="resetTest()">Qayta boshlash</button>
        `;
        resultsDiv.style.display = 'block';
        submitBtn.style.display = 'none';
        
        resultsDiv.scrollIntoView({ behavior: 'smooth' });
    }

    function resetTest() {
        introScreen.style.display = 'block';
        quizContainer.style.display = 'none';
        submitBtn.style.display = 'none';
        resultsDiv.style.display = 'none';
        quizContainer.innerHTML = '';
        
        document.getElementById('welcome-title').innerText = `Fizika Testlariga Xush Kelibsiz!`;
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
