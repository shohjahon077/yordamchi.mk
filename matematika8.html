<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Ustoz — 8-sinf Matematika</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1E88E5;
            --secondary: #0D47A1;
            --accent: #4CAF50;
            --light: #FFFFFF;
            --bg: #F0F8FF;
            --text: #212121;
            --card: #FFFFFF;
            --shadow: 0 10px 30px rgba(30, 136, 229, 0.2);
            --border: #B3E5FC;
            --danger: #FF6B6B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .hidden { display: none !important; }

        /* === INTRO SPLASH === */
        #intro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 2000;
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        #intro-splash h1 {
            font-size: 2.1rem;
            margin: 20px 0 10px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        #intro-splash p {
            font-size: 1.1rem;
            max-width: 85%;
            line-height: 1.5;
            opacity: 0.95;
        }

        #math-logo {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        #math-logo svg {
            width: 80px;
            height: 80px;
            fill: var(--primary);
        }

        /* === CHATBOT CONTAINER === */
        #chatbot-container {
            width: 100%;
            max-width: 500px;
            height: 95vh;
            background: var(--card);
            border-radius: 28px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        /* === HEADER === */
        #header {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            background: var(--primary);
            color: white;
            position: relative;
        }

        #ai-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 26px;
        }

        #header h2 {
            font-weight: 600;
            font-size: 1.4rem;
        }

        /* === CHAT WINDOW === */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.6;
            font-size: 15px;
        }

        .message {
            margin-bottom: 18px;
            max-width: 85%;
        }

        .user-message {
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
        }

        .message-bubble {
            padding: 14px 20px;
            border-radius: 20px;
            display: inline-block;
            position: relative;
        }

        .user-message .message-bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message .message-bubble {
            background: #E3F2FD;
            color: var(--text);
            border-bottom-left-radius: 4px;
            border-left: 3px solid var(--primary);
        }

        /* === INPUT AREA === */
        #input-area {
            padding: 16px;
            background: var(--light);
            border-top: 2px solid var(--border);
        }

        #quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-button {
            padding: 12px 14px;
            border: none;
            border-radius: 24px;
            background: var(--primary);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            flex: 1;
            min-width: 100px;
            max-width: 49%;
            text-align: center;
            box-shadow: 0 3px 8px rgba(30,136,229,0.2);
        }

        .quick-button:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(13,71,161,0.3);
        }

        .home-button {
            background: var(--danger) !important;
        }

        .home-button:hover {
            background: #d32f2f !important;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #616161;
            margin-top: 12px;
            padding: 4px;
        }

        /* SCROLLBAR */
        #chat-window::-webkit-scrollbar {
            width: 6px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        @media (max-width: 500px) {
            #chatbot-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            .quick-button {
                min-width: 90px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- INTRO SPLASH -->
    <div id="intro-splash">
        <div id="math-logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H9v-2h2v2zm0-4H9v-2h2v2zm0-4H9V7h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V7h2v2z"/>
            </svg>
        </div>
        <h1>AI Ustoz — Matematika</h1>
        <p>8-sinf uchun maxsus yaratilgan interaktiv matematika yordamchisi</p>
    </div>

    <!-- CHATBOT -->
    <div id="chatbot-container" class="hidden">
        <div id="header">
            <div id="ai-avatar">🧠</div>
            <h2>Matematika Yordamchisi</h2>
        </div>
        <div id="chat-window"></div>
        <div id="input-area">
            <div id="quick-buttons"></div>
            <div class="footer-note">8-sinf darsliklariga mos — algebra, geometriya, O'QTM tayyorgarligi</div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const quickButtonsContainer = document.getElementById('quick-buttons');
        const introSplash = document.getElementById('intro-splash');
        const chatbotContainer = document.getElementById('chatbot-container');

        // ✅ Sodda ma'lumotlar bazasi (8-sinfga mos)
        const database = {
            "main_menu": {
                text: "Salom! Matematikaning qaysi mavzusida yordam kerak?",
                buttons: [
                    { text: "🔢 Butun sonlar", key: "butun_sonlar" },
                    { text: "➗ Ratsional sonlar", key: "ratsional_sonlar" },
                    { text: "√ Kvadrat ildiz", key: "kvadrat_ildizlar" },
                    { text: "⚖️ Tenglamalar", key: "tenglama" },
                    { text: "📈 Funksiyalar", key: "funksiya" },
                    { text: "📐 Geometriya", key: "geometriya" },
                    { text: "📝 Testlar", key: "test_menu" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "butun_sonlar": {
                text: "Butun sonlar — (..., -3, -2, -1, 0, 1, 2, 3, ...). Qo'shish, ayirish, modul va qarama-qarshi sonlar haqida.",
                buttons: [
                    { text: "Modul nima?", key: "modul" },
                    { text: "Amallar qoidalari", key: "qoidalar" },
                    { text: "Mashqlar", key: "mashq_butun" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "modul": {
                text: "Modul — sonning noldan masofasi. |–7| = 7, |5| = 5. Har doim musbat!",
                buttons: [{ text: "⬅️ Orqaga", key: "butun_sonlar", isHome: true }]
            },
            "qoidalar": {
                text: "–8 + 5 = –3 (kattasi manfiy). –4 × –6 = 24 (ikkita manfiy — musbat)!",
                buttons: [{ text: "⬅️ Orqaga", key: "butun_sonlar", isHome: true }]
            },
            "mashq_butun": {
                text: "1) –12 + 18 = ? 2) (–7) × 3 = ?\nJavoblar: 6, –21",
                buttons: [{ text: "⬅️ Orqaga", key: "butun_sonlar", isHome: true }]
            },
            "ratsional_sonlar": {
                text: "Kasr shaklidagi sonlar: 3/4, –2/5. Qo'shish uchun umumiy maxraj kerak!",
                buttons: [
                    { text: "Qo'shish", key: "rats_qosh" },
                    { text: "Ko'paytirish", key: "rats_kop" },
                    { text: "Mashqlar", key: "mashq_rat" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "rats_qosh": {
                text: "1/2 + 1/3 = 3/6 + 2/6 = 5/6. Maxrajni 6 qildik!",
                buttons: [{ text: "⬅️ Orqaga", key: "ratsional_sonlar", isHome: true }]
            },
            "mashq_rat": {
                text: "1) 2/5 + 3/10 = ? 2) 4/7 × 21/8 = ?\nJavoblar: 7/10, 3/2",
                buttons: [{ text: "⬅️ Orqaga", key: "ratsional_sonlar", isHome: true }]
            },
            "kvadrat_ildizlar": {
                text: "√25 = 5, lekin √–25 — mavjud emas! Ildizdan chiqarish — kvadratga teskari.",
                buttons: [
                    { text: "Soddalashtirish", key: "soddalash" },
                    { text: "Mashqlar", key: "mashq_ildiz" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "soddalash": {
                text: "√50 = √(25×2) = 5√2. Kvadrat ko‘paytuvchini ildizdan tashlab yubor!",
                buttons: [{ text: "⬅️ Orqaga", key: "kvadrat_ildizlar", isHome: true }]
            },
            "tenglama": {
                text: "Chiziqli tenglama: 2x + 3 = 11 → 2x = 8 → x = 4.",
                buttons: [
                    { text: "Yechish usullari", key: "tenglama_yech" },
                    { text: "Mashqlar", key: "mashq_teng" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "tenglama_yech": {
                text: "Agar –3x = 9 bo‘lsa, x = –3. Ikki tomonni –3 ga bo‘ldik!",
                buttons: [{ text: "⬅️ Orqaga", key: "tenglama", isHome: true }]
            },
            "funksiya": {
                text: "y = 2x + 1 — chiziqli funksiya. Har bir x ga bitta y mos keladi.",
                buttons: [
                    { text: "Grafik chizish", key: "grafik" },
                    { text: "Mashqlar", key: "mashq_funk" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "grafik": {
                text: "x = 0 → y = 1; x = 1 → y = 3. Nuqtalarni koordinata tekisligida ulang!",
                buttons: [{ text: "⬅️ Orqaga", key: "funksiya", isHome: true }]
            },
            "geometriya": {
                text: "Pifagor teoremasi: a² + b² = c². To‘g‘ri burchakli uchburchakda ishlaydi.",
                buttons: [
                    { text: "Yuz hisoblash", key: "yuz" },
                    { text: "Pifagor", key: "pifagor" },
                    { text: "Mashqlar", key: "mashq_geom" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "pifagor": {
                text: "Katetlar 3 va 4 bo‘lsa, gipotenuza = √(9+16) = √25 = 5.",
                buttons: [{ text: "⬅️ Orqaga", key: "geometriya", isHome: true }]
            },
            "test_menu": {
                text: "Test tanlang:",
                buttons: [
                    { text: "Butun sonlar", key: "test1" },
                    { text: "Kasrlar", key: "test2" },
                    { text: "Tenglamalar", key: "test3" },
                    { text: "🏠 Bosh menyu", key: "main_menu", isHome: true }
                ]
            },
            "test1": { text: "–5 + 12 = ?\nA) –17  B) 7  C) –7", buttons: [{ text: "B) 7", key: "test1_ok" }] },
            "test1_ok": { text: "✅ To‘g‘ri! –5 + 12 = 7", buttons: [{ text: "🏠 Bosh menyu", key: "main_menu", isHome: true }] }
        };

        // Funksiyalar
        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showButtons(key) {
            const menu = database[key] || database.main_menu;
            quickButtonsContainer.innerHTML = '';
            menu.buttons.forEach(btn => {
                const btnEl = document.createElement('button');
                btnEl.className = `quick-button ${btn.isHome ? 'home-button' : ''}`;
                btnEl.textContent = btn.text;
                btnEl.onclick = () => {
                    addMessage(btn.text, 'user');
                    setTimeout(() => {
                        const next = database[btn.key];
                        if (next) {
                            addMessage(next.text, 'ai');
                            showButtons(btn.key);
                        } else {
                            addMessage("Mavjud emas. Bosh menyu qayting.", 'ai');
                            showButtons('main_menu');
                        }
                    }, 400);
                };
                quickButtonsContainer.appendChild(btnEl);
            });
        }

        // Boshlash
        window.addEventListener('load', () => {
            setTimeout(() => {
                introSplash.style.display = 'none';
                chatbotContainer.classList.remove('hidden');
                addMessage(database.main_menu.text, 'ai');
                showButtons('main_menu');
            }, 3000);
        });
    </script>
</body>
</html>
