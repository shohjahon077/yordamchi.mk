        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0c1427;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeOut 2.5s forwards 3.5s;
            color: #00f7ff;
            text-align: center;
            padding: 20px;
        }

        .ai-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            background: url('image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="40" r="22" fill="%2300f7ff"/><circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/><path d="M40 50 Q50 55 60 50" stroke="white" stroke-width="2" fill="none"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .splash-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            opacity: 0;
            animation: type 3s steps(40, end) forwards 0.5s;
        }

        .splash-subtext {
            font-size: 1.1rem;
            opacity: 0;
            animation: fadeIn 1s forwards 2.5s;
            max-width: 600px;
        }

        @keyframes type {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .container {
            width: 95%;
            max-width: 1200px;
            height: 92vh;
            background: rgba(10, 15, 30, 0.85);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 247, 255, 0.4);
            overflow: hidden;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 4s;
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: rgba(0, 10, 20, 0.9);
            color: #00f7ff;
            padding: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(0, 247, 255, 0.3);
            text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
        }

        .chat-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            margin: 10px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            padding: 13px 18px;
            border-radius: 18px;
            max-width: 82%;
            word-wrap: break-word;
            animation: messagePop 0.4s ease-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes messagePop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .user-message {
            background: linear-gradient(135deg, #0077b6, #0096c7);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: linear-gradient(135deg, #00b4d8, #00f7ff);
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: none;
            color: #00f7ff;
            font-style: italic;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        .buttons-container {
            background: rgba(0, 10, 20, 0.75);
            padding: 12px;
            border-top: 1px solid rgba(0, 247, 255, 0.3);
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #00f7ff transparent;
        }

        .buttons-container::-webkit-scrollbar {
            width: 6px;
        }

        .buttons-container::-webkit-scrollbar-thumb {
            background: #00f7ff;
            border-radius: 10px;
        }

        .btn {
            flex: 1 1 calc(50% - 8px);
            min-width: 140px;
            padding: 10px 12px;
            background: rgba(0, 50, 80, 0.4);
            color: #00f7ff;
            border: 1px solid rgba(0, 247, 255, 0.4);
            border-radius: 14px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            white-space: normal;
            line-height: 1.3;
        }

        .btn:hover {
            background: rgba(0, 180, 255, 0.3);
            border-color: #00f7ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 247, 255, 0.2);
        }

            position: absolute;
            top: 15px;
            right: 15px;
            width: 50px;
            height: 50px;

                flex: 1 1 100%;
                font-size: 0.78rem;
                padding: 9px;
            }
            .splash-text {
                font-size: 1.6rem;
            }
        }
    </style>

            "Прошедшее время глагола: согласование с подлежащим.": "Прошедшее время глагола изменяется по родам и числам: он писал, она писала, оно писало, они писали. При согласовании с подлежащим важно учитывать род и число.",
            "Повелительное наклонение: формы и употребление.": "Повелительное наклонение выражает просьбу, приказ: читай! читайте! Употребляется в 2-м лице. Формы: для 1-го лица множ. числа — не употребляются (используется «давайте» + инфинитив).",
            "Условное наклонение: как образуется и когда используется?": "Образуется от прошедшего времени + бы: я бы читал, ты бы писал. Используется для выражения гипотетических, нереальных ситуаций: «Я бы пошёл, если бы было время».",
            "Причастия: действительные и страдательные, полные и краткие.": "Действительные: читающий, пишущий. Страдательные: прочитанный, написанный. Полные: изменяются по родам, числам, падежам. Краткие: только по роду и числу: прочитан, прочитана.",
            "Как определить вид причастия и его зависимые слова?": "Действительное причастие — от переходного глагола несовершенного вида: читающий (кто? что?). Зависимые слова — это дополнения: читающий книгу. Страдательное — от переходного глагола совершенного вида: прочитанная книга.",
            "Деепричастия: совершенного и несовершенного вида.": "Деепричастие несовершенного вида: читая, пишущи. Совершенного: прочитав, написав. Образуются от глаголов: несовершенный — -я, совершенный — -в, -вши. Выражают дополнительное действие.",
            "Как отличить деепричастие от причастия?": "Деепричастие — обозначает действие, сопутствующее основному, не изменяется: читая, писав. Причастие — признак предмета, изменяется: читающий (кто?), написанная (какая?).",
            "Наречия: семантические группы и способы образования.": "Семантические группы: обстоятельства времени (вчера), места (там), причины (поэтому), образа действия (быстро), степени (очень). Образуются от прилагательных (быстрый → быстро), от существительных (дома), с помощью суффиксов (-о, -е, -ски).",
            "Сравнительная и превосходная степени наречий.": "Сравнительная: быстрее, тише. Превосходная: быстрее всех, тише всех. Образуются с помощью -ее, -ей, -ше, -ей, а также с «самый» (самый быстро — ошибка! правильно: наиболее быстро).",
            "Предлоги: производные и непроизводные, значение и употребление.": "Непроизводные: в, на, с, к, за, под. Производные: благодаря, вследствие, ввиду. Предлоги связывают слова в предложении и выражают отношения (место, направление, причина, время).",
            "Союзы: сочинительные и подчинительные, функции.": "Сочинительные: и, но, или, да — связывают равноправные части. Подчинительные: потому что, чтобы, если, когда — связывают главное и придаточное. Союзы не изменяются и не являются членами предложения.",
            "Частицы: значение, виды, употребление в речи.": "Частицы усиливают, отрицают, уточняют, придают эмоциональность: не, ли, бы, же, же, только, ведь. Не изменяются. Употребляются для выражения отрицания (не знаю), вопроса (ты пришёл ли?), уточнения (только ты это понял).",
            "Междометия: функции и особенности употребления.": "Междометия выражают эмоции, чувства, звуки: ах!, ой!, эй!, ура! Не являются членами предложения. В предложении выделяются запятой. Не склоняются и не изменяются.",
            "Синтаксис: простое и сложное предложение.": "Простое — одно грамматическое основа: Я читаю. Сложное — две и более основ: Я читаю, а он пишет. Сложное делится на сложносочинённое, сложноподчинённое и бессоюзное.",
            "Простое предложение: грамматическая основа и второстепенные члены.": "Грамматическая основа — подлежащее и сказуемое. Второстепенные члены: определение, дополнение, обстоятельство. Они уточняют, раскрывают смысл основы.",
            "Односоставные и двусоставные предложения: признаки и различия.": "Двусоставные: есть подлежащее и сказуемое (Девушка читает). Односоставные: только один главный член — подлежащее (Мне холодно) или сказуемое (Ночь. Светает).",
            "Определение подлежащего и сказуемого в предложении.": "Подлежащее — кто? что? делает или является. Сказуемое — что делает? что происходит? Сказуемое может быть глагольным (читает) или именным (является студентом).",
            "Второстепенные члены предложения: дополнение, обстоятельство, определение.": "Дополнение — косвенный объект (читаю книгу). Обстоятельство — обстоятельства действия (читаю в библиотеке). Определение — признак предмета (красивая книга).",
            "Согласование и управление: как они работают в предложении?": "Согласование — зависимое слово изменяется по роду, числу, падежу (красивая книга). Управление — зависимое слово стоит в определённом падеже (читать книгу — вин. п.).",
            "Сложное предложение: виды и структура.": "Сложное предложение состоит из двух и более грамматических основ. Виды: сложносочинённое (союзы и, но), сложноподчинённое (придаточные), бессоюзное (запятая или тире).",
            "Сложносочиненное предложение: союзы и знаки препинания.": "Союзы: и, да, но, или, а, зато, поэтому. Запятая ставится между частями, если они равноправны. Если союз составной (не только… но и), запятая ставится перед второй частью.",
            "Сложноподчиненное предложение: придаточные и главная часть.": "Главное предложение — независимое. Придаточное — зависит от главного, отвечает на вопрос от него. Союзы и союзные слова: который, когда, потому что, чтобы.",
            "Бессоюзное сложное предложение: как определить границы?": "Границы определяются по смыслу и интонации. Запятая ставится между частями, если они связаны по смыслу: Утро. Светает. Или: Я пришёл, он ушёл.",
            "Придаточные определительные: как их выделить?": "Отвечают на вопросы: какой? чей? который? Связаны с существительным в главном предложении. Союзные слова: который, чей, какой, где, когда. Выделяются запятой.",
            "Придаточные изъяснительные: структура и знаки препинания.": "Отвечают на вопросы: что? как? почему? Связаны с глаголами, существительными, прилагательными. Союзы: что, чтобы, как, чтобы, ли. Запятая ставится перед союзом.",
            "Придаточные обстоятельственные: времени, причины, условия, цели.": "Времени: когда пришёл. Причины: потому что устал. Условия: если придёшь. Цели: чтобы помочь. Все выделяются запятой. Союзы и союзные слова: когда, потому что, если, чтобы.",
            "Придаточные сравнительные и уступительные.": "Сравнительные: как будто, словно, точно. Уступительные: хотя, несмотря на то что, пусть. Выделяются запятой. Отвечают на вопросы: как? как будто? хотя и?",
            "Сложные предложения с разными видами связи.": "Пример: Я пришёл, потому что был вызван, и мне было интересно. Здесь соединены сочинительная (и) и подчинительная (потому что) связи. Запятые ставятся по правилам каждого типа.",
            "Параллельная и последовательная связь в сложных предложениях.": "Параллельная — придаточные относятся к одному главному (Я знаю, что он пришёл, и что он ушёл). Последовательная — придаточные связаны друг с другом (Я знаю, что он пришёл, когда я ушёл).",
            "Синтаксическая функция деепричастного оборота.": "Оборот: «читая книгу, он улыбался». Выражает дополнительное действие, сопутствующее основному. Указывает на обстоятельство образа действия, времени, причины. Выделяется запятыми.",
            "Синтаксическая функция причастного оборота.": "Оборот: «книга, написанная в 19 веке». Выражает определение. Указывает на признак предмета, выраженный причастием. Выделяется запятыми.",
            "Как определить границы обособленных членов предложения?": "Обособленные члены — это определения, обстоятельства, приложения, дополнения, выраженные причастными, деепричастными оборотами, приложениями. Выделяются запятыми по правилам пунктуации.",
            "Обособленные определения: причастные и прилагательные обороты.": "Причастный оборот: «дом, построенный в 1980 году». Прилагательный оборот: «мой друг, хороший человек». Оба выделяются запятыми, если стоят после определяемого слова.",
            "Обособленные обстоятельства: деепричастные обороты.": "Деепричастный оборот: «сидя на стуле, он читал». Выражает обстоятельство образа действия. Выделяется запятыми. Не может быть без глагола-сказуемого.",
            "Обособленные приложения: как их выделять?": "Приложение — второстепенный член, уточняющий имя существительное: «Москва, столица России». Выделяется запятыми, если стоит после существительного. Если перед ним — без запятой: «Столица России Москва».",
            "Знаки препинания в сложных предложениях: запятая, тире, двоеточие.": "Запятая — между частями сложносочинённого и сложноподчинённого. Тире — в бессоюзном сложном при пояснении, следствии, противопоставлении. Двоеточие — в бессоюзном при пояснении, перечислении.",
            "Запятая при однородных членах: правила и исключения.": "Запятая ставится между однородными членами: «Я купил хлеб, молоко, яйца». Не ставится: если однородные члены соединены союзом «и» в парах (хлеб и молоко и яйца), если они образуют устойчивое сочетание.",
            "Запятая между частями сложного предложения: как ставить?": "Запятая ставится между главным и придаточным, если придаточное следует после главного. Если придаточное в середине — запятые с обеих сторон. В сложносочинённом — между частями.",
            "Запятая при вводных словах и конструкциях.": "Вводные слова: «к сожалению», «по-моему», «вообще». Выделяются запятыми, так как не являются членами предложения. Они выражают отношение говорящего к высказыванию.",
            "Запятая перед союзами «и», «а», «но» в сложносочиненных предложениях.": "Запятая ставится перед союзами, если части предложения равноправны. Не ставится, если есть общее второстепенное член: «Я пришёл и ушёл» — без запятой.",
            "Тире между подлежащим и сказуемым: случаи употребления.": "Тире ставится, если подлежащее и сказуемое выражены существительными в именительном падеже: «Он — мой брат». Также в безличных предложениях: «На улице — холодно».",
            "Двоеточие и тире в бессоюзных сложных предложениях.": "Двоеточие — если вторая часть поясняет, раскрывает содержание первой: «Я знаю одно: он прав». Тире — если вторая часть следует как следствие, противопоставление, внезапность: «Он пришёл — все замолчали».",
            "Знаки препинания при прямой речи: правила оформления.": "Прямая речь — слова говорящего. Запятая ставится перед прямой речью, если она после слов автора: «Он сказал: „Приходи завтра“». Если прямая речь перед словами автора — тире: „Приходи завтра“, — сказал он.",
            "Пунктуация в диалогах и цитатах.": "В диалогах каждая реплика начинается с тире. Цитаты выделяются кавычками. Если цитата — часть предложения, то запятая ставится перед кавычками: «Как сказал Ленин: „Вся сила — в единстве“».",
            "Фонетика: звуки русского языка, их классификация.": "Русский язык имеет 42 звука: 6 гласных, 36 согласных. Гласные: ударные и безударные. Согласные: твёрдые/мягкие, звонкие/глухие, парные/непарные. Звонкие: б, в, г, д, ж, з. Глухие: п, ф, к, т, ш, с.",
            "Гласные и согласные звуки: характеристика и транскрипция.": "Гласные — звонкие, образуют слог. Согласные — могут быть звонкими или глухими, твёрдыми или мягкими. Транскрипция записывается в квадратных скобках: [п’ир’и́м] — «пирим».",
            "Понятие о слоге и ударении в русском языке.": "Слог — минимальная фонетическая единица, состоящая из гласного или гласного с согласными. Ударение — выделение одного слога в слове. В русском языке оно подвижное и лексическое.",
            "Изменение произношения звуков в речи: позиционные изменения.": "Звуки изменяются в зависимости от соседних: «сделать» — [з’д’эл’ать], «встреча» — [в’стр’ич’а]. Это фонетические процессы: озвончение, оглушение, смягчение, редукция.",
            "Орфоэпические нормы: правильное произношение слов.": "Орфоэпия — нормы правильного произношения. Например: «звонит» — [звон’ит], а не [звани́т]; «договор» — [дагавор], а не [дагавар]. Нормы фиксируются в орфоэпических словарях.",
            "Лексикология: лексическое значение слова.": "Лексическое значение — это содержание слова, его смысл в языке. Может быть прямым (стол — мебель) и переносным (стол — собрание). Лексическое значение фиксируется в словарях.",
            "Синонимы, антонимы, омонимы, паронимы: различия и примеры.": "Синонимы — близкие по значению (храбрый — смелый). Антонимы — противоположные (хороший — плохой). Омонимы — одинаковые по звучанию, разные по значению (ключ — от замка, ключ — источник). Паронимы — схожие по звучанию, разные по значению (опытный — опытный).",
            "Фразеологизмы: значение, происхождение, употребление.": "Фразеологизм — устойчивое сочетание, не переводимое буквально: «бить баклуши», «семь пятниц на неделе». Происходят из мифов, истории, быта. Употребляются в речи как единое целое.",
            "Как определить фразеологизм в тексте?": "Фразеологизм не поддаётся лексическому анализу: его нельзя заменить синонимами без потери смысла. Он устойчив, неизменяем, имеет переносное значение. Проверяется заменой: «бить баклуши» ≠ «бить деревяшки».",
            "Стили речи: разговорный, научный, публицистический, официально-деловой, художественный.": "Разговорный — простые слова, эмоции. Научный — термины, абстрактные понятия. Публицистический — аргументация, эмоции, призывы. Официально-деловой — шаблоны, канцеляризмы. Художественный — образность, тропы, эмоции.",
            "Стилистические приемы: метафора, эпитет, сравнение, олицетворение.": "Метафора — скрытое сравнение: «время — река». Эпитет — яркое определение: «золотая осень». Сравнение — с союзом «как»: «как лев». Олицетворение — наделение неодушевлённого живыми качествами: «ветер шепчет».",
            "Лексическая сочетаемость: как правильно подбирать слова?": "Лексическая сочетаемость — сочетание слов, которое устойчиво в языке: «высокий рост», а не «большой рост». Нарушение — стилистическая ошибка. Проверяется по словарям сочетаемости.",
            "Семантические поля: понятие и примеры.": "Семантическое поле — группа слов, объединённых общей темой: «цвета» (красный, синий), «семья» (мать, отец, сын). Каждое поле имеет центральное и периферийные слова.",
            "Стилистическая окраска слов: нейтральные, книжные, просторечные, простонародные.": "Нейтральные — употребляются во всех стилях (читать). Книжные — научный стиль (анализировать). Просторечные — разговорный (заглянуть). Простонародные — диалектные (пахнуть — пахать).",
            "Понятие о стилистической ошибке и ее предотвращение.": "Стилистическая ошибка — несоответствие слова стилю: «Я пришёл на лекцию и поел суп» — в научном стиле. Предотвращается: выбором слов по стилю, проверкой по словарям стилистической окраски.",
            "Речевая норма: орфоэпическая, лексическая, грамматическая, пунктуационная.": "Норма — стандарт употребления языка. Орфоэпическая — произношение. Лексическая — употребление слов. Грамматическая — построение предложений. Пунктуационная — знаки препинания. Нарушение — ошибка.",
            "Речевые ошибки: как их избежать?": "Избегать можно: изучением норм, чтением художественной литературы, использованием словарей, самоконтролем, проверкой текста. Частые ошибки: лексические, грамматические, пунктуационные, стилистические.",
            "Синтаксическая норма: строение предложений.": "Синтаксическая норма — правильное построение предложений: отсутствие нарушений в согласовании, управлении, порядке слов. Например: «Я люблю читать книги» — норма; «Я люблю читать книгу» — тоже норма, но «Я люблю книгу читать» — стилистически неверно.",
            "Лексическая норма: употребление слов в речи.": "Лексическая норма — употребление слов в соответствии с их значением и стилистической окраской. Например: «семья» — нейтральное, «родня» — просторечное. Не следует использовать просторечия в официальной речи.",
            "Орфографическая норма: правила написания слов.": "Правила написания: безударные гласные, парные согласные, разделительные знаки, написание частиц, приставок, суффиксов. Основаны на морфемном и фонетическом принципах. Проверяются по орфографическим словарям.",
            "Пунктуационная норма: правила постановки знаков препинания.": "Правила: запятая при однородных членах, при вводных словах, в сложных предложениях, при прямой речи. Основаны на синтаксической структуре. Нарушение — нарушает смысл и логику высказывания.",
            "Речевая этика: как говорить вежливо и корректно?": "Использовать вежливые формы: «пожалуйста», «будьте добры», «не могли бы вы». Избегать грубых слов, сокращений, жаргонизмов в официальной речи. Применять формулировки, учитывающие собеседника.",
            "Синтаксические фигуры: анафора, эпифора, параллелизм.": "Анафора — повтор в начале: «Я пришёл. Я увидел. Я понял». Эпифора — в конце: «Я пришёл. Ты пришёл. Он пришёл». Параллелизм — сходная структура: «Он читает, она пишет, мы говорим».",
            "Риторические приемы: риторический вопрос, восклицание, обращение.": "Риторический вопрос — не требует ответа: «Неужели ты не понимаешь?». Восклицание — выражение эмоции: «Как прекрасно!». Обращение — выделение адресата: «Друзья, внимание!».",
            "Стилистические приемы в художественной речи.": "Эпитет, метафора, сравнение, олицетворение, гипербола, литота, антитеза, аллитерация, ассонанс, парцелляция, инверсия, повтор, оксюморон. Они создают образность, эмоциональность, выразительность.",
            "Текст как единица речи: признаки текста.": "Признаки: связность, целостность, тема, идея, композиция, логичность, речевая норма, стилистическая единство. Текст — не просто набор предложений, а организованная система высказываний.",
            "Композиция текста: введение, основная часть, заключение.": "Введение — представление темы. Основная часть — развитие, аргументация. Заключение — вывод, обобщение, итог. Композиция обеспечивает логичность и убедительность текста.",
            "Средства связи предложений в тексте: лексические и грамматические.": "Лексические: повтор, синонимы, антонимы, однокоренные слова. Грамматические: союзы, местоимения, союзные слова, временные формы глаголов, наречия.",
            "Тема и идея текста: как их определить?": "Тема — о чём текст (любовь, война). Идея — что автор хочет донести (любовь сильнее войны). Определяется по содержанию, повторяющимся мотивам, авторской позиции.",
            "Ключевые слова и лексическая повторяемость.": "Ключевые слова — слова, несущие основную смысловую нагрузку. Повторение усиливает смысл, создаёт ритм. Не допускается бессмысленное повторение — это стилистическая ошибка.",
            "Стилистика текста: соответствие стилю и жанру.": "Стилистика — соответствие языковых средств стилю и жанру. В научном тексте — термины, в художественном — тропы. Нарушение — снижает эффективность текста.",
            "Аргументация в тексте: как строить логичный аргумент?": "Тезис — утверждение. Аргумент — доказательство. Пример — иллюстрация. Вывод — обобщение. Структура: «Я считаю, что... потому что... например... следовательно...».",
            "Понятие о типах речи: повествование, описание, рассуждение.": "Повествование — рассказ о событиях. Описание — характеристика предмета, явления. Рассуждение — аргументация, доказательство, анализ. Типы речи определяют структуру текста.",
            "Повествование: структура и особенности.": "Структура: завязка — развитие — кульминация — развязка. Особенности: последовательность событий, глаголы прошедшего времени, повествовательные местоимения.",
            "Описание: виды и приемы.": "Виды: портрет, пейзаж, интерьер, характеристика. Приёмы: эпитеты, метафоры, сравнения, детализация, перечисление, художественные детали.",
            "Рассуждение: структура, тезис, аргументы, вывод.": "Тезис — основное утверждение. Аргументы — доказательства. Примеры — иллюстрации. Вывод — логическое следствие. Структура: тезис → аргументы → вывод.",
            "Как пересказать текст с сохранением смысла?": "Выделить главную мысль, удалить второстепенное, переформулировать предложения, сохранить логику, не менять стиль. Не добавлять личное мнение.",
            "Как сократить текст, сохранив основную мысль?": "Удалить повторы, упростить конструкции, заменить описания на суть, убрать эпитеты, оставить только ключевые предложения, сохранить структуру.",
            "Как переформулировать предложение, не меняя смысла?": "Использовать синонимы, изменить порядок слов, заменить активный залог на пассивный, изменить структуру (например, причастный оборот → придаточное).",
            "Анализ художественного текста: какие аспекты важны?": "Тема, идея, композиция, стилистика, тропы, лексика, синтаксис, ритм, образы, авторская позиция, жанр, исторический контекст. Важно не только описать, но и интерпретировать.",
            "Лексический анализ текста: подбор синонимов, антонимов.": "Подобрать синонимы — для выявления стилистической окраски. Антонимы — для выявления контрастов, антитез. Это помогает понять авторскую позицию и эмоциональную окраску.",
            "Синтаксический анализ текста: виды предложений.": "Определить типы предложений: простые, сложные, односоставные, двусоставные, с союзами, без союзов. Это позволяет понять структуру, ритм, логику текста.",
            "Стилистический анализ текста: тропы и фигуры.": "Выявить метафоры, эпитеты, сравнения, олицетворения, гиперболы, литоты, антитезы, аллитерации. Это показывает, как автор создаёт образ, передаёт эмоции, усиливает смысл.",
            "Связность и целостность текста: как их оценить?": "Связность — логическая связь между предложениями. Целостность — единство темы, идеи, стиля. Оценивается по наличию средств связи, отсутствию логических скачков, единству лексики.",
            "Как определить стиль текста?": "По лексике (термины — научный, тропы — художественный), по грамматике (сложные конструкции — научный, простые — разговорный), по функции (информация — публицистический, призыв — публицистический).",
            "Понятие о жанре: эссе, рецензия, отзыв, доклад.": "Эссе — свободное рассуждение на тему. Рецензия — критический анализ произведения. Отзыв — личное впечатление. Доклад — структурированное сообщение с аргументами.",
            "Эссе: структура, стиль, особенности написания.": "Структура: введение — основная часть — заключение. Стиль: личный, свободный, эмоциональный. Особенности: аргументация, личная позиция, образность, оригинальность.",
            "Рецензия: как написать критический отзыв на произведение?": "Описание произведения — анализ содержания — оценка стиля — аргументация — вывод. Нельзя просто пересказывать. Нужно оценивать: сильные и слабые стороны, соответствие жанру, актуальность.",
            "Отзыв: структура и стиль.": "Структура: впечатление — впечатляющие моменты — личная оценка — рекомендация. Стиль: личный, эмоциональный, неформальный. Не требует глубокого анализа, но должен быть искренним.",
            "Доклад: организация и оформление.": "Название — введение — основная часть (подпункты) — заключение — список источников. Стиль: официальный, логичный, структурированный. Используются термины, аргументы, ссылки.",
            "Как писать научную статью на русском языке?": "Тема — аннотация — ключевые слова — введение — методы — результаты — обсуждение — заключение — библиография. Стиль: нейтральный, точный, логичный. Нет эмоций, тропов, разговорных слов.",
            "Грамматический разбор предложения: полный и синтаксический.": "Полный — морфологический разбор всех слов + синтаксический разбор предложения. Синтаксический — определение членов, структуры, типа предложения.",
            "Морфологический разбор слова: как его провести?": "1. Часть речи. 2. Постоянные признаки (род, вид, переходность и т.д.). 3. Непостоянные признаки (число, падеж, время и т.д.). 4. Синтаксическая роль в предложении.",
            "Синтаксический разбор предложения: структура и члены.": "1. Определить тип предложения (простое/сложное). 2. Найти грамматическую основу. 3. Определить второстепенные члены. 4. Определить виды предложений (двусоставное, односоставное и т.д.).",
            "Синтаксический разбор сложного предложения: виды придаточных.": "1. Определить количество грамматических основ. 2. Найти главное и придаточные. 3. Определить тип придаточного (определительное, изъяснительное и т.д.). 4. Указать союз или союзное слово. 5. Определить границы.",
            "Пунктуационный разбор: почему поставлена запятая?": "1. Определить, какие части соединены. 2. Проверить правило: однородные члены? вводное слово? сложное предложение? 3. Обосновать по нормам. 4. Указать, какая функция выполняется (разделение, выделение, связь).",
            "Как определить тип предложения по цели высказывания?": "Повествовательное — утверждение (Я читаю). Вопросительное — вопрос (Ты читаешь?). Побудительное — приказ (Читай!). Восклицательное — эмоция (Как хорошо!).",
            "Как определить тип предложения по эмоциональной окраске?": "Восклицательное — восклицательный знак, эмоциональные слова, интонация. Утвердительное — нейтральная интонация. Вопросительное — вопросительный знак. Основа — знак препинания и интонация.",
            "Как определить тип предложения по составу?": "Двусоставное — есть подлежащее и сказуемое. Односоставное — только один главный член. Неопределённо-личное — сказуемое без подлежащего (нельзя говорить).",
            "Как определить тип предложения по наличию второстепенных членов?": "Распространённое — есть второстепенные члены (Я читаю интересную книгу). Нераспространённое — только основа (Я читаю).",
            "Как определить тип предложения по наличию грамматической основы?": "Если есть подлежащее и сказуемое — двусоставное. Если только сказуемое — односоставное. Если нет ни того, ни другого — не является предложением.",
            "Как определить тип предложения по наличию вводных слов?": "Если есть вводные слова — это не меняет тип предложения, но влияет на пунктуацию. Вводные слова не являются членами предложения, а выражают отношение говорящего.",
            "Как определить тип предложения по наличию обособленных членов?": "Обособленные члены — это не определяют тип предложения. Они могут быть в любом типе. Важно: выделены ли они запятыми, и какова их функция (определение, обстоятельство).",
            "Как определить тип предложения по наличию прямой речи?": "Прямая речь — это не тип предложения, а способ оформления. Она может быть в любом типе. Важно: наличие кавычек, слов автора, тире, запятой.",
            "Как определить тип предложения по наличию однородных членов?": "Наличие однородных членов не определяет тип предложения. Это признак распространённости. Может быть в простом и сложном предложении.",
            "Как определить тип предложения по наличию повторяющихся конструкций?": "Повторы — стилистический приём (анафора, эпифора). Они не определяют тип предложения, а усиливают выразительность. Могут быть в любом типе.",
            "Как определить тип предложения по наличию стилистических фигур?": "Стилистические фигуры — приёмы выразительности. Они не определяют тип предложения. Могут быть в любом типе. Важно: как они влияют на смысл, а не на структуру.",
            "Как определить тип предложения по наличию фразеологизмов?": "Фразеологизмы — лексические единицы. Они не определяют тип предложения. Могут быть в любом типе. Важно: их устойчивость и переносное значение.",
            "Как определить тип предложения по наличию иноязычных слов?": "Иноязычные слова — лексический признак. Не влияют на тип предложения. Могут быть в любом типе. Важно: правильность употребления и нормативность.",
            "Как определить тип предложения по наличию архаизмов и неологизмов?": "Архаизмы — устаревшие слова. Неологизмы — новые. Не влияют на тип предложения. Важно: их уместность в стиле. Архаизмы — в художественной речи, неологизмы — в публицистике.",
            "Как определить тип предложения по наличию диалектизмов?": "Диалектизмы — слова из диалектов. Не определяют тип предложения. Важно: их уместность. В научной речи — недопустимы, в разговорной — допустимы.",
            "Как определить тип предложения по наличию просторечий?": "Просторечия — неформальные слова. Не определяют тип предложения. Важно: стилистическая уместность. В художественной речи — допустимы, в научной — нет.",
            "Как определить тип предложения по наличию канцеляризмов?": "Канцеляризмы — шаблонные слова (в целях, в связи с). Не определяют тип предложения. Важно: их уместность в официально-деловом стиле. В художественной речи — стилистическая ошибка.",
            "Как определить тип предложения по наличию жаргонизмов?": "Жаргонизмы — слова из профессиональных групп. Не определяют тип предложения. Важно: уместность. В научной речи — недопустимы, в разговорной — допустимы.",
            "Как определить тип предложения по наличию речевых клише?": "Клише — шаблонные выражения («всё в порядке», «в конечном итоге»). Не определяют тип предложения. Важно: их уместность. В научной речи — допустимы, в художественной — снижают выразительность.",
            "Как определить тип предложения по наличию риторических вопросов?": "Риторический вопрос — это не тип предложения, а стилистический приём. Он может быть в любом типе. Важно: не требует ответа, выражает утверждение.",
            "Как определить тип предложения по наличию эпитетов?": "Эпитет — стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: его функция — усиление образности.",
            "Как определить тип предложения по наличию метафор?": "Метафора — стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: её роль в создании образа.",
            "Как определить тип предложения по наличию олицетворений?": "Олицетворение — стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: передача человеческих качеств неодушевлённым объектам.",
            "Как определить тип предложения по наличию сравнений?": "Сравнение — стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: использование союзов «как», «словно», «будто».",
            "Как определить тип предложения по наличию гиперболы?": "Гипербола — преувеличение. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: её функция — эмоциональное усиление.",
            "Как определить тип предложения по наличию литоты?": "Литота — преуменьшение. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: усиление через уменьшение («не плохой» = хороший).",
            "Как определить тип предложения по наличию антитезы?": "Антитеза — противопоставление. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: контраст смыслов («не любовь — ненависть»).",
            "Как определить тип предложения по наличию анадиплозиса?": "Анадиплозис — повтор последнего слова в начале следующего. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: усиление логической связи.",
            "Как определить тип предложения по наличию анафоры?": "Анафора — повтор в начале. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: ритм, эмоциональное усиление.",
            "Как определить тип предложения по наличию эпифоры?": "Эпифора — повтор в конце. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: акцент на завершении.",
            "Как определить тип предложения по наличию параллелизма?": "Параллелизм — сходная структура. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: ритм, логичность, выразительность.",
            "Как определить тип предложения по наличию оксюморона?": "Оксюморон — сочетание противоположностей. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: парадокс, эмоциональный эффект.",
            "Как определить тип предложения по наличию аллитерации?": "Аллитерация — повтор согласных. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: звуковая выразительность, ритм.",
            "Как определить тип предложения по наличию ассонанса?": "Ассонанс — повтор гласных. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: музыкальность, эмоциональность.",
            "Как определить тип предложения по наличию эллипсиса?": "Эллипсис — пропуск члена предложения. Не определяет тип предложения. Может быть в любом типе. Важно: сохранение смысла при пропуске. Часто в разговорной речи.",
            "Как определить тип предложения по наличию инверсии?": "Инверсия — изменение порядка слов. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: акцент, выразительность.",
            "Как определить тип предложения по наличию повтора?": "Повтор — стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: усиление, ритм, эмоциональность.",
            "Как определить тип предложения по наличию эпитета?": "Эпитет — стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: яркость, выразительность, образность.",
            "Как определить тип предложения по наличию метонимии?": "Метонимия — замена одного слова другим по смежности. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: «корона» вместо «король».",
            "Как определить тип предложения по наличию синекдохи?": "Синекдоха — замена целого частью или части целым. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: «все сели за стол» — «все» = люди.",
            "Как определить тип предложения по наличию перифраза?": "Перифраз — замена слова описательной фразой. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: «человек с белой бородой» вместо «дедушка».",
            "Как определить тип предложения по наличию градации?": "Градация — постепенное усиление. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: «люблю, обожаю, восхищаюсь».",
            "Как определить тип предложения по наличию парцелляции?": "Парцелляция — деление предложения на части. Стилистический приём. Не определяет тип предложения. Может быть в любом типе. Важно: усиление эмоций, ритм, драматизм.",
            "Как определить тип предложения по наличию риторического обращения?": "Риторическое обращение — обращение к адресату. Не определяет тип предложения. Может быть в любом типе. Важно: выделение запятой, эмоциональная окраска.",
            "Как определить тип предложения по наличию риторического восклицания?": "Риторическое восклицание — выражение эмоции. Не определяет тип предложения. Может быть в любом типе. Важно: восклицательный знак, интонация.",
            "Как определить тип предложения по наличию риторического вопроса?": "Риторический вопрос — выражение утверждения. Не определяет тип предложения. Может быть в любом типе. Важно: вопросительный знак, отсутствие ожидания ответа.",
            "Как определить тип предложения по наличию прямой речи?": "Прямая речь — не тип предложения, а способ оформления. Может быть в любом типе. Важно: кавычки, слова автора, тире, запятая.",
            "Как определить тип предложения по наличию косвенной речи?": "Косвенная речь — не тип предложения. Это передача чужой речи от третьего лица. Может быть в любом типе. Важно: изменение местоимений, времен, интонации.",
            "Как определить тип предложения по наличию вводных конструкций?": "Вводные конструкции — не определяют тип предложения. Они выражают отношение говорящего. Выделяются запятыми. Могут быть в любом типе.",
            "Как определить тип предложения по наличию обособленных оборотов?": "Обособленные обороты — не определяют тип предложения. Они уточняют. Выделяются запятыми. Могут быть в любом типе.",
            "Как определить тип предложения по наличию приложений?": "Приложения — не определяют тип предложения. Они уточняют существительное. Выделяются запятыми. Могут быть в любом типе.",
            "Как определить тип предложения по наличию дополнений?": "Дополнения — не определяют тип предложения. Они являются второстепенными членами. Могут быть в любом типе.",
            "Как определить тип предложения по наличию обстоятельств?": "Обстоятельства — не определяют тип предложения. Они уточняют сказуемое. Могут быть в любом типе.",
            "Как определить тип предложения по наличию определений?": "Определения — не определяют тип предложения. Они уточняют существительное. Могут быть в любом типе.",
            "Как определить тип предложения по наличию однородных членов?": "Однородные члены — не определяют тип предложения. Они расширяют структуру. Могут быть в любом типе.",
            "Как определить тип предложения по наличию неполных предложений?": "Неполные предложения — это предложения с пропущенным членом. Тип определяется по наличию грамматической основы. Если есть основа — это простое предложение.",
            "Как определить тип предложения по наличию безличных предложений?": "Безличные предложения — односоставные. Главный член — сказуемое. Подлежащего нет. Пример: «Мне холодно». Тип — односоставное безличное.",
            "Как определить тип предложения по наличию неопределенно-личных предложений?": "Неопределённо-личные — односоставные. Сказуемое в 3-м лице мн. ч. или в форме прошедшего времени. Подлежащего нет. Пример: «Сказали, что он ушёл». Тип — односоставное неопределённо-личное.",
            "Как определить тип предложения по наличию обобщенно-личных предложений?": "Обобщённо-личные — односоставные. Сказуемое в 2-м лице ед. ч. или 1-м лице мн. ч. Пример: «Ты не должен сдаваться». Тип — односоставное обобщённо-личное.",
            "Как определить тип предложения по наличию назывных предложений?": "Назывные — односоставные. Главный член — существительное в именительном падеже. Пример: «Ночь». Тип — односоставное назывное.",
            "Как определить тип предложения по наличию двусоставных предложений?": "Двусоставные — имеют подлежащее и сказуемое. Пример: «Она читает». Тип — двусоставное. Это самый распространённый тип.",
            "Как определить тип предложения по наличию односоставных предложений?": "Односоставные — имеют только один главный член: подлежащее или сказуемое. Пример: «Мне холодно». Тип — односоставное. Подразделяются на безличные, неопределённо-личные, обобщённо-личные, назывные.",
            "Как определить тип предложения по наличию распространённых предложений?": "Распространённые — имеют второстепенные члены. Пример: «Она читает интересную книгу». Тип — распространённое. Может быть и двусоставным, и односоставным.",
            "Как определить тип предложения по наличию нераспространённых предложений?": "Нераспространённые — только грамматическая основа. Пример: «Она читает». Тип — нераспространённое. Может быть и двусоставным, и односоставным.",
            "Как определить тип предложения по наличию простых предложений?": "Простые — одна грамматическая основа. Пример: «Она читает». Тип — простое. Может быть двусоставным или односоставным.",
            "Как определить тип предложения по наличию сложных предложений?": "Сложные — две и более грамматических основ. Пример: «Она читает, а он пишет». Тип — сложное. Может быть сложносочинённым, сложноподчинённым или бессоюзным.",
            "Как определить тип предложения по наличию сложноподчинённых предложений?": "Сложноподчинённые — одна главная и одна или более придаточных. Пример: «Я знаю, что он ушёл». Тип — сложноподчинённое. Придаточное зависит от главного.",
            "Как определить тип предложения по наличию сложносочинённых предложений?": "Сложносочинённые — две и более равноправные части, связанные сочинительными союзами. Пример: «Она пришла, и он ушёл». Тип — сложносочинённое. Части равны по значению.",
            "Как определить тип предложения по наличию бессоюзных сложных предложений?": "Бессоюзные — две и более грамматические основы, связанные без союзов, только интонацией и знаками препинания. Пример: «Наступила ночь. Стало холодно». Тип — бессоюзное сложное.",
            "Как определить тип предложения по наличию сложных предложений с разными видами связи?": "Сложные предложения могут сочетать сочинительную и подчинительную связь. Пример: «Я пришёл, потому что был вызван, и мне было интересно». Тип — сложное с разными видами связи.",
            "Как определить тип предложения по наличию сложных предложений с параллельной связью?": "Параллельная связь — несколько придаточных относятся к одному главному. Пример: «Я знаю, что он ушёл, и что он не вернётся». Тип — сложноподчинённое с параллельным подчинением.",
            "Как определить тип предложения по наличию сложных предложений с последовательной связью?": "Последовательная связь — придаточные связаны друг с другом. Пример: «Я узнал, что он пришёл, когда я ушёл». Тип — сложноподчинённое с последовательным подчинением.",
            "Как определить тип предложения по наличию сложных предложений с однородным подчинением?": "Однородное подчинение — несколько придаточных одного типа относятся к одному главному. Пример: «Я не знал, что он ушёл и что он не вернётся». Тип — сложноподчинённое с однородным подчинением.",
            "Как определить тип предложения по наличию сложных предложений с неоднородным подчинением?": "Неоднородное подчинение — придаточные разного типа. Пример: «Я не знал, что он ушёл, потому что он не сказал». Тип — сложноподчинённое с неоднородным подчинением.",
            "Как определить тип предложения по наличию сложных предложений с разным видом связи?": "Сложные предложения могут сочетать сочинительную и подчинительную связь. Пример: «Я пришёл, потому что был вызван, и мне было интересно». Тип — сложное с разными видами связи.",
            "Как определить тип предложения по наличию сложных предложений с разными типами придаточных?": "Пример: «Я знаю, что он ушёл, потому что он был занят, и когда я пришёл, он уже ушёл». Тип — сложноподчинённое с разными типами придаточных (изъяснительное, причины, времени).",
            "Как определить тип предложения по наличию сложных предложений с разными типами союзов?": "Пример: «Я пришёл, потому что был вызван, и мне было интересно». Тип — сложное с подчинительным и сочинительным союзами. Союзы: «потому что» — подчинительный, «и» — сочинительный.",
            "Как определить тип предложения по наличию сложных предложений с разными типами союзных слов?": "Пример: «Я не знаю, кто пришёл, когда он пришёл, и почему он не сказал». Тип — сложноподчинённое с союзными словами: «кто», «когда», «почему».",
            "Как определить тип предложения по наличию сложных предложений с разными типами вводных слов?": "Пример: «К сожалению, я не пришёл, потому что был болен, и, как мне кажется, ты не понял». Тип — сложное с вводными словами: «к сожалению», «как мне кажется».",
            "Как определить тип предложения по наличию сложных предложений с разными типами обособленных членов?": "Пример: «Я, уставший после работы, пришёл домой, и, как мне казалось, никто не ждал меня». Тип — сложное с обособленными оборотами: «уставший после работы», «как мне казалось».",
            "Как определить тип предложения по наличию сложных предложений с разными типами прямой речи?": "Пример: «Он сказал: „Я приду завтра“, и добавил: „Но не забудь позвонить“». Тип — сложное с прямой речью. Две реплики, две структуры.",
            "Как определить тип предложения по наличию сложных предложений с разными типами цитат?": "Пример: «Как сказал Ленин: „Вся сила — в единстве“ — мы должны действовать вместе». Тип — сложное с цитатой. Цитата — вводная конструкция.",
            "Как определить тип предложения по наличию сложных предложений с разными типами фразеологизмов?": "Пример: «Он, как говорится, «взял себя в руки» и начал работать». Тип — сложное с фразеологизмом. Фразеологизм — лексическая единица, не влияет на тип предложения.",
            "Как определить тип предложения по наличию сложных предложений с разными типами стилистических фигур?": "Пример: «Я, как ветер, пронёсся мимо, и, словно вспышка, исчез». Тип — сложное с метафорой и сравнением. Стилистические фигуры — не определяют тип предложения.",
            "Как определить тип предложения по наличию сложных предложений с разными типами речевых ошибок?": "Речевые ошибки — нарушение норм. Не определяют тип предложения. Пример: «Он пришёл, и он ушёл» — стилистическая ошибка (повтор). Тип предложения — сложносочинённое, но с ошибкой.",
            "Как определить тип предложения по наличию сложных предложений с разными типами стилистических норм?": "Стилистические нормы — правила уместности. Не определяют тип предложения. Пример: «Он ушёл, и я остался» — норма. «Он ушёл, и я остался, как в тумане» — стилистически неверно в научном стиле.",
            "Как определить тип предложения по наличию сложных предложений с разными типами лексических норм?": "Лексические нормы — уместность слов. Не определяют тип предложения. Пример: «Он ушёл, и я остался» — норма. «Он ушёл, и я остался, как котёнок» — стилистически неверно в официальной речи.",
            "Как определить тип предложения по наличию сложных предложений с разными типами грамматических норм?": "Грамматические нормы — строение предложения. Не определяют тип предложения. Пример: «Он ушёл, и я остался» — норма. «Он ушёл, и я» — нарушение (неполное предложение).",
            "Как определить тип предложения по наличию сложных предложений с разными типами пунктуационных норм?": "Пунктуационные нормы — правила знаков. Не определяют тип предложения. Пример: «Он ушёл, и я остался» — норма. «Он ушёл и я остался» — ошибка (пропущена запятая).",
            "Как определить тип предложения по наличию сложных предложений с разными типами орфоэпических норм?": "Орфоэпические нормы — произношение. Не определяют тип предложения. Пример: «Он ушёл, и я остался» — норма. «Он ушёл, и я остáлся» — ошибка (неправильное ударение).",
            "Как определить тип предложения по наличию сложных предложений с разными типами речевых норм?": "Речевые нормы — все аспекты: лексика, грамматика, пунктуация, орфоэпия. Не определяют тип предложения. Они оценивают правильность речи, но не её структуру.",
            "Как определить тип предложения по наличию сложных предложений с разными типами речевых приемов?": "Речевые приёмы — средства выразительности. Не определяют тип предложения. Пример: «Он ушёл, и я остался, как в пустыне» — с метафорой. Тип — сложносочинённое.",
            "Как определить тип предложения по наличию сложных предложений с разными типами стилистических приемов?": "Стилистические приёмы — тропы и фигуры. Не определяют тип предложения. Пример: «Он ушёл, и я остался, как пепел» — с метафорой. Тип — сложносочинённое.",
            "Как определить тип предложения по наличию сложных предложений с разными типами лексических приемов?": "Лексические приёмы — подбор слов, повторы, синонимы. Не определяют тип предложения. Пример: «Он ушёл, и я остался, один, одинокий» — с повтором. Тип — сложносочинённое.",
            "Как определить тип предложения по наличию сложных предложений с разными типами грамматических приемов?": "Грамматические приёмы — изменение форм, порядка слов. Не определяют тип предложения. Пример: «Он ушёл, и я остался» — норма. «Он ушёл, и остался я» — инверсия. Тип — сложносочинённое.",
            "Как определить тип предложения по наличию сложных предложений с разными типами пунктуационных приемов?": "Пунктуационные приёмы — использование знаков для выразительности. Не определяют тип предложения. Пример: «Он ушёл — и я остался» — тире вместо запятой. Тип — сложносочинённое.",
            "Как определить тип предложения по наличию сложных предложений с разными типами орфоэпических приемов?": "Орфоэпические приёмы — интонация, ударение. Не определяют тип предложения. Пример: «Он ушёл, и я остался» — с паузой. Тип — сложносочинённое.",

            btn.className = 'btn';
            btn.textContent = q.length > 40 ? q.substring(0, 38) + '...' : q;
            btn.setAttribute('data-full', q);
            btn.addEventListener('click', () => handleQuestion(q));
            buttonsContainer.appendChild(btn);
        });

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.classList.add('message', className);
            div.innerHTML = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function handleQuestion(question) {
            addMessage(question, 'user-message');
            typingIndicator.style.display = 'block';

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                const response = responses[question] || "Извините, я пока не могу ответить на этот вопрос.";
                setTimeout(() => {
                    addMessage(response, 'bot-message');
                }, 700);
            }, 1400);
